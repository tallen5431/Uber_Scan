<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Uber Scan — Camera</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="scan.css">
</head>
<body class="scanning">

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="frame" hidden></canvas>

  <!-- Align this box over the offer card on the other phone. Drag it, or a
       corner of it, once ▣ Box has been pressed. -->
  <div id="reticle"><div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div></div>

  <div id="adjustNote" hidden></div>

  <section id="verdict" class="verdict empty">
    <div class="verdict-label" id="verdictLabel">POINT AT THE OFFER</div>
    <div class="rate"><span class="rate-value" id="perHour">--</span><span class="rate-unit">/hr</span><span class="rate-raw" id="rawRate" hidden></span></div>
    <div class="submetrics">
      <div class="sub"><span id="vPay">--</span><small>pay</small></div>
      <div class="sub"><span id="vMin">--</span><small>minutes</small></div>
      <div class="sub"><span id="vMile">--</span><small>miles</small></div>
    </div>
    <div id="warn" class="notice" hidden></div>
  </section>

  <div id="statusline">starting camera…</div>

  <nav class="scanbar">
    <button id="btnFreeze" type="button">⏸ Hold</button>
    <label class="filebtn">📷 Photo<input type="file" id="photo" accept="image/*"></label>
    <button id="btnBox" type="button">▣ Box</button>
    <button id="btnSettings" type="button">⚙︎</button>
    <a class="linkbtn" href="journal.html">▤ Offers</a>
    <a class="linkbtn" href="index.html">⌨ Type</a>
  </nav>
</div>

<div class="sheet" id="settingsSheet" hidden>
  <div class="sheet-inner">
    <header><h2>Targets</h2><button class="close" data-close="settingsSheet" type="button">Done</button></header>
    <label class="row"><span>Target $/hour</span><input type="number" inputmode="decimal" id="setTarget" step="1" min="0"></label>
    <label class="row"><span>Near-miss band<small>% below target still amber</small></span><input type="number" inputmode="numeric" id="setBand" step="1" min="0" max="50"></label>
    <label class="row"><span>Cost per mile<small>Gas + wear</small></span><input type="number" inputmode="decimal" id="setCost" step="0.01" min="0"></label>
    <label class="row"><span>Pickup padding (min)</span><input type="number" inputmode="numeric" id="setPad" step="1" min="0"></label>
    <label class="row"><span>Seconds per item<small>Shop &amp; Deliver: time the card never counts</small></span><input type="number" inputmode="numeric" id="setItemSecs" step="10" min="0"></label>
    <label class="row"><span>Scan whole frame<small>Off = read only inside the box</small></span><input type="checkbox" id="setFullFrame"></label>
    <div class="row"><span>Reading box<small>Press ▣ Box, then drag it onto the card</small></span><button type="button" id="setResetBox">Reset</button></div>
    <p class="note" id="engineNote">Reading happens entirely on this device.</p>
  </div>
</div>

<script src="offer-parser.js"></script>
<script src="vendor/tesseract.min.js"></script>
<script src="scan.js"></script>
</body>
</html>
