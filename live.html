  // WORST case is meant rather than a typical one.
  //
  // The two constants live in two files. test_scan_pi.py reads this one out of
  // this page and asserts the relationship, rather than keeping a copy of it.
  var READ_STALE_MS = 16000;

  // An age off the wire, made safe to subtract from this page's clock.
  //
  // A missing one means "no idea", and the honest answer to that is the oldest
  // thing this page can represent rather than the freshest: a verdict of
  // unknown age is exactly the one not to vouch for. A negative one is a clock
  // that disagrees with itself, and clamping it is what stops an age from
  // reading as the future and never going stale at all.
  function age(ms) {
    if (typeof ms !== 'number' || !isFinite(ms) || ms < 0) return READ_STALE_MS + 1;
    return ms;
  }
  var socketUp = false;
  var scannerState = null;
  // The camera is out of room: the phone is brighter than it can take at any
  // setting that does not make the screen ripple. Not a fault in the rig, and
  // the one thing that fixes it is a slider on the phone in the driver's hand —
  // so it belongs on this screen and nowhere else.
  var tooBright = false;
  // The same complaint from the other end, and the one nothing used to report:
  // gain on its ceiling, already on the longest exposure, and the screen still
  // under target. The picture goes dark and the reads go with it.
  var tooDim = false;
  // The journal has stopped taking writes, in the scanner's own words, or null.
  //
  // The only failure on this page that costs something which cannot be got
  // back. A washed-out card can be re-read and a box drawn wrong can be
  // drawn again; an offer nobody wrote down is simply gone, and so is every
  // one after it for as long as it lasts. A read-only SD card is the classic
  // Pi failure and it is completely silent from up here — the rig goes on
  // reading, pricing, speaking the verdict and painting a green ACCEPT, and
  // the only sign was a line in a log on a headless box.
  //
  // The driver's own tick already reports its failures, because that write
  // goes through a request that can answer 500. The offers do not: they are
  // written from inside the scan loop with nobody to answer, which is why this
  // rides the heartbeat.
  var notSaving = null;

  // What the camera cannot see, in the scanner's word — 'stalled' or 'dark' —
  // or null while it can.
  //
  // The one state on this page that means the rig is not working at all, and
  // the one it had no channel for. The owner's rig read once in 9.4 days: the
  // heartbeat came every four seconds, the connection line said "scanner
  // reading" throughout, and a full shift of offers went past a box that was
  // dark, or a camera handing over one picture for ever — the log cannot say
  // which. So it is not a note on the connection line, which is muted on
  // purpose and for things that can wait for the next stop. It takes the
  // verdict's place — see render() — because a stalled camera frozen on an
  // offer card goes on re-reading that card, and the verdict it paints looks
  // as live as any other while it is about a card long gone.
  var blind = null;

  // What the verdict's place says while that lasts: the word where the verdict
  // goes, the line under it saying what to do. Short, because on the 3.5" hat
  // the line shares a narrow column with the phone's picture, and red, in this
  // page's own style. rpi/test_dashboard.py holds both whole inside the card
  // at 800x480, 1024x600 and 480x320, with the bar where it was.
  //
  // `dark` says what the rig knows and no more. It is nothing in the box the
  // gain counts as a lit screen, and a phone in the mount turned down low
  // reads exactly like an empty mount — this repo has lit screens on record
  // at 4 and 6, and the owner's box read 1-2 in the reads either side of the
  // blind week. It was NOTHING IN VIEW, "put the phone in the mount", which
  // told a driver whose phone was in the mount and lit that it was not, and
  // never offered the remedy that would have worked. Then it was TOO DARK TO
  // SEE, "no lit screen the rig can see", which is still more than is known:
  // a lit dark-mode screen reading 15 to 19 is under the bar, and the motion
  // gate notices a card arriving on it — 6.27 at 15 and 7.90 at 19 against
  // the 6.0 it needs, on all eight draws of the sensor noise at each — where
  // a light-mode one reading 18 scores 2.23 and is missed on all eight. The
  // box's reading cannot tell the two apart, so what is known is that the rig
  // cannot be SURE of seeing an offer arrive. The word says that, and the
  // line asks for both remedies. See the note under STALL_SAY in
  // rpi/scan_pi.py, which has the rest of the measurements.
  //
  // `stalled` says how often the rig restarts it, and "stays" as well as
  // "keeps coming back": a stall within ten minutes of the last restart over
  // one is sat out with the word left on the glass, not restarted
  // (STALL_AGAIN in scan_pi.py). "The rig restarts it" said otherwise for
  // those ten minutes.
  var BLIND_LABEL = { stalled: 'CAMERA STALLED', dark: 'TOO DARK TO BE SURE' };
  var BLIND_NOTE = {
    stalled: 'The camera is sending the same picture over and over. The rig '
           + 'restarts it at most once in ten minutes; if this stays or keeps '
           + 'coming back, reseat its cable.',
    dark: 'The rig may miss an offer arriving in a box this dark — check the '
        + 'phone is in the mount with its screen on, and turn its brightness up.'
  };

  // The GPS, as the scanner has settled it, and the Pi's own report on itself.
  // Off the heartbeat like the five above, for the same reason: every reading
  // goes on arriving perfect while either is wrong. A phone whose GPS app has
  // timed out costs every offer row from then on its position, and on the
  // owner's week 0 of 1,166 rows carried one with nothing anywhere saying
  // whether that was a choice or a fault. A throttling Pi reads slower and
  // said so nowhere. See healthNote() for what reaches the glass.
  var gpsNow = null;
  // ...and when the beat that carried it arrived, on THIS page's clock. The
  // beat's `gps.fix` is the newest position with gps.py's judgement on it;
  // the "you are here" dot ages it from here, so a beat that stops coming
  // does not leave "2 s old" on the glass. See MV.hereDot.
  var gpsAt = 0;
  var cpuNow = null;
  var throttledNow = null;

  // A card is under the reader right now. The gap this fills is the one the
  // driver actually notices: a read is about 1.8 seconds on a Pi 4 and this
  // panel spent every one of them saying WAITING FOR AN OFFER over a row of
  // dashes, which is what it says when the phone is blank. The card was there
  // and the rig had already started on it.
  var readingAt = 0;

  // ...and how long that claim is good for. A read that has not come back in
  // this long did not take a while, it failed: the loop reports a broken read
  // to its log rather than as a reading, so nothing would ever clear this.
  // Comfortably longer than a slow read on a loaded Pi and far short of the
  // staleness test above, so a stuck reader shows as stale rather than as
  // permanently busy.
  var READING_MS = 8000;

  // Said in terms of what to do, not what happened. "Clipping at the gain
  // floor" is true and useless; the driver is holding the thing that fixes it.
  var TOO_BRIGHT = 'Phone screen too bright for the camera — turn its '
                 + 'brightness down a notch.';
  var TOO_DIM = 'Phone screen too dim for the camera — turn its brightness up '
              + 'a notch, or move the mount out of the shade.';

  // Where the job goes, as the card wrote it.
  //
  // One line, ellipsised. An address can be sixty characters and this panel is
  // read at arm's length in a moving car: a second line of small grey text
  // costs the headline room it needs more. Two places are joined with an arrow,
  // the same way the offers page writes them, so the two screens read alike —
  // and since both now ask MV.ends for them, that is one rule rather than a
  // resemblance two files have to keep up by hand.
  function showPlaces(list) {
    var where = (list || []).filter(function (p) { return !!p; });
    el.places.textContent = where.join(' \u2192 ');
    el.places.hidden = !where.length;
  }

  // Both jobs at once, when there is already one in the car.
  //
  // A range and not a figure. The low end is the two sharing no road at all and
  // the high end is the new one riding along inside the old; where between them
  // the truth sits is a fact about two maps, and this rig has no map. It says
  // what it knows \u2014 what the pair pays over a time bounded at both ends \u2014 and
  // leaves the geography to the driver, who is looking at the phone anyway.
  //
  // NO VERDICT COLOUR. This row used to take the verdict's three states from
  // `s.state`, green only when the whole range cleared the target, and that
  // was a verdict on the wrong thing. `worst` is the pair's money over the
  // pair's time, which is the time-weighted mean of the held job's rate and
  // the offer's — so money already being earned on the job in the car carried
  // the colour, and a cheap card drawn in against a rich hold came out green.
  // Replayed over the real week on the driver's own 31 marks: 267 pair lines,
  // 71 of them green, and 45 of those 71 were offers whose own net rate was
  // under the $25 line — 30 drawn under a PASS headline and 15 under CLOSE
  // CALL. A green "take both" beneath a red PASS is a confidently wrong
  // answer on the one screen read at a glance.
  //
  // Deleted, not redefined. The fix every proposal reached for — green only
  // where the offer's OWN rate clears target — is the headline restated:
  // `withStack` hands stack() the same billed minutes, cost and target rate()
  // used, so the offer's own marginal rate IS the headline's perHour. Over the
  // same 267 lines "own rate clears target" and the headline's ACCEPT
  // disagree 0 times. The accept decision is the headline's; this row says
  // what only it can — how much clock the pair adds, and where the two jobs
  // end. `s.state` stays on the payload, because server.js writes it into
  // the journal's pair rows and the offers page buckets on it.
  // Whole dollars with the sign in front of the dollar, not inside it.
  //
  // The same rule rateText() applies a hundred lines up, and the reason is the
  // same: "$-16" reads as a dash at a glance from the driving seat. This row
  // was the one money formatter on the page that did not follow it, and the
  // range made it worse — "+ $-16\u2013-31/hr" puts an en dash between two minus
  // signs, which is not a range, it is a smear.
  //
  // Whole dollars rather than rateText()'s one decimal because this row is the
  // half of the line that gives way when the panel runs out of width, and it is
  // a RANGE: the spread between the two ends is the information, and a tenth of
  // a dollar inside a fifteen-dollar spread is noise bought at the price of the
  // clause after it.
  function dollars(n) {
    return (n < 0 ? '-$' : '$') + Math.abs(Math.round(n));
  }

  function showStack(s) {
    if (!s) { el.stack.hidden = true; el.stack.className = 'stackline'; return; }
    // Ordered by value, not by which field they came from. `worst` divides the
    // pair's money by the LONGER time and `best` by the shorter, so on money
    // above zero worst is the smaller — and below zero that reverses, because
    // dividing a negative by a smaller number makes it more negative. A losing
    // pair therefore printed its range backwards, low end first and larger.
    var lo = Math.min(s.worst, s.best), hi = Math.max(s.worst, s.best);
    // The base colour, whatever the state. See NO VERDICT COLOUR above.
    el.stack.className = 'stackline';
    // Built from parts rather than one string, because the parts have different
    // priorities when the row runs out of room. See .stackline in styles.css:
    // this is the half that gives way, and it can because the same figures are
    // on the panel above it.
    while (el.stack.firstChild) el.stack.removeChild(el.stack.firstChild);
    var sum = document.createElement('span');
    sum.className = 'sum';
    // The number first, because the ellipsis eats from the other end.
    //
    // This read "+ the one you have: $26\u201335/hr over 23\u201335 min", putting twenty
    // characters of framing in front of the one figure the row exists for \u2014 and
    // this is the half of the line designed to give way. Measured on the 3.5"
    // hat it showed "+ the one you have: $26": a truncated range that reads as
    // a point estimate, which is a worse thing to show than no range. The words
    // that were lost are the ones the row's own existence already says \u2014 this
    // line only appears when there is an order in the car.
    // "to" rather than an en dash, because the dash cannot survive a minus
    // sign beside it and this is exactly the row where that happens: a pair
    // that loses money is the one a driver most needs to read correctly.
    sum.textContent = '+ '
      + (Math.round(lo) === Math.round(hi)
         ? dollars(lo) : dollars(lo) + ' to ' + dollars(hi))
      + '/hr with the one you have, over '
      + (s.minMinutes === s.maxMinutes
         ? Math.round(s.minMinutes)
         : Math.round(s.minMinutes) + '\u2013' + Math.round(s.maxMinutes))
      + ' min'
      // The one claim that does not depend on the geography: better than just
      // finishing what you have, even sharing nothing. Worth saying out loud
      // because it is the only part of this a driver can act on without
      // checking the map.
      //
      // Kept INSIDE the ellipsised half, which is where it started. Pulling it
      // out into a `flex: none` element of its own was tried and measured
      // worse in the way that matters: the clause then always wins and the
      // range gives way instead, so the 800x480 panel showed "+ the one you
      // have: $26–35/h" and the 3.5" hat showed "+". The number is what this
      // row exists for; a clause that survives by eating it is a bad trade.
      + (s.sure ? ' \u00b7 beats finishing alone' : '')
      // ...and whether that range is the pair or only a ceiling on it. One of
      // the two cards printed no distance the rig could charge, so the money
      // above is gross and the target it is being held to is net.
      //
      // The note above the verdict says the same thing when the OFFER is the
      // uncosted one. It says nothing when the order already in the car is,
      // and then this line was a range with no reason on the screen to read
      // it as a ceiling.
      + (s.uncosted ? ' \u00b7 a ceiling, no distance to charge' : '')
      // Where the two jobs END, which is the half the arithmetic above cannot
      // reach: the range assumes either nothing is shared or the new job rides
      // along inside the old one, and geography decides which. Said in the
      // card's own words rather than a distance, because a town and a compass
      // quadrant are all these cards print. Nothing is said when they did not
      // print enough - about half the time - because a guess here costs an
      // hour and a late delivery. See Advice.sameArea.
      //
      // 'same-zip' is the strongest of these and only reachable once the
      // destination has been scanned off the screen after the accept - an
      // offer card prints no ZIP. It is worth its own words because "same
      // town" is nearly meaningless where this driver works: 44% of their
      // placed dropoffs are in Atlanta, which is 135 square miles, and a metro
      // ZIP is a few.
      ;
    el.stack.appendChild(sum);
    // ...and the half that does not give way. Its own element, so the ellipsis
    // above can never reach it: these words are the only place this claim is
    // made, and losing them leaves the driver a range with nothing to say
    // that its optimistic end has been ruled out.
    //
    // ...including when it has nothing to say, which is the case that had no
    // shape at all. `null` — about half of real pairs — appended no chip and
    // changed nothing else on the row, so "I looked at where these two jobs
    // end and found nothing to warn you about" and "I have no idea where they
    // end" drew the identical line, and an unchipped row reads at a glance as
    // a pair that was checked and came back clean — which is precisely the
    // wrong "these end near each other" this rig prices at an hour of driving
    // and a rating.
    //
    // Measured over the corpus's own address fixtures, sameArea refuses on 127
    // of 300 pairs. 37 of those had BOTH ends parse and were still refused —
    // those rows draw a route link and no chip today, which is a row that
    // looks fully answered. The other 90 are the merchant-only cards ("Papa
    // John's Store 3317") that 106 of 604 real cards print instead of an
    // address.
    //
    // `?` because that is already this panel's glyph for the rig declining to
    // answer, and in the doubt colour, which is deliberately none of the three
    // verdict colours for the same reason .verdict.doubt is not: this is not a
    // worse "near" or a softer "elsewhere", it is a refusal.
    var ends = s.ends === 'elsewhere' ? 'ENDS ELSEWHERE'
             : s.ends === 'same-zip' ? 'same ZIP'
             : s.ends === 'same-side' ? 'same side of town'
             : s.ends === 'same-town' ? 'same town' : 'ENDS ?';
    var chip = document.createElement('span');
    chip.className = 'ends' + (s.ends ? '' : ' unknown');
    chip.textContent = ends;
    chip.title = s.ends ? '' :
      'Neither card printed enough for the rig to say whether these two jobs '
      + 'end near each other. It is not saying they do.';
    el.stack.appendChild(chip);
    if (s.ends === 'elsewhere') el.stack.className += ' elsewhere';
    // ...and the same question handed to a map, which answers it in driving
    // minutes with live traffic where the line above can only answer it in the
    // card's own words. Appended as a real link rather than folded into the
    // text, because it is the one thing on this panel a driver is meant to
    // press — and only when both ends were named, which is about half the time.
    //
    // Opened in another tab so the driving screen is still there behind it. It
    // is also the panel's browser, not the phone's: the phone keeps showing the
    // offer and the rig does not lose the card while the map is up.
    if (s.route) {
      var a = document.createElement('a');
      a.className = 'maplink';
      a.href = s.route;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = '\u2933 route';
      a.title = 'Open the drive from where the order you have ends to where '
              + 'this one ends, with current traffic.';
      el.stack.appendChild(a);
    }
    el.stack.hidden = false;
  }

  // The last offer the scanner wrote to the journal, and whether the driver has
  // said they took it.
  //
  // Not the offer on screen: those are the same thing only in the moment before
  // a decision, and the decision is made on the phone, after which the card
  // goes away. This is what the button marks and what it is named after.
  var onRecord = null;
  var tookState = false;
  var tookBusy = false;
  // Whether the last press failed to reach the journal. It used to show
  // nothing: the label flickered to "…" and came straight back to "Took
  // $10.00?", and the driver either assumed it registered or pressed again.
  // Drop on the same bar already says "Drop · failed"; this says "not
  // saved", and says it until the next press.
  var tookFailed = false;

  function showTook() {
    if (!onRecord || !onRecord.id) {
      el.took.hidden = true;
      return;
    }
    el.took.hidden = false;
    // Past tense, and the amount. "Took $8.04" is a note about a decision
    // already made; anything in the imperative could be read, on a screen
    // bolted to a dashboard next to a verdict, as doing something to the offer
    // — and the one thing this rig must never do is press Accept.
    var what = (typeof onRecord.pay === 'number')
      ? '$' + onRecord.pay.toFixed(2) : 'the last one';
    // The order in the car, back on the phone under its own id or a new one
    // (heldCard, see heldOwnCard in server.js): shown as the order already
    // taken, not as an offer to tick, and the press does nothing — the driver
    // has said this once.
    if (heldAgain()) {
      el.took.textContent = '\u2713 Took ' + what + ' \u00b7 in car';
      el.took.title = 'The order you already took, on the phone again. Nothing to record.';
      el.took.classList.remove('failed');
      el.took.classList.add('on');
      el.took.setAttribute('aria-pressed', 'true');
      return;
    }
    // No "undo" in the label: at this width it overflowed the button by 20px
    // and the word was clipped off, which is worse than not offering it — an
    // affordance nobody can see is not an affordance. It is a toggle, styled
    // when set, exactly as the same control on the offers page behaves.
    el.took.textContent = tookBusy ? '…'
      : tookFailed ? 'Took ' + what + ' · not saved'
      : (tookState ? '\u2713 Took ' + what : 'Took ' + what + '?');
    el.took.title = tookFailed
      ? 'The journal could not be written. Press again to retry.'
      : tookState
      ? 'Recorded as taken. Press again if that was wrong.'
      : 'Record that you accepted this offer. It does not touch your phone.';
    el.took.classList.toggle('failed', tookFailed);
    el.took.classList.toggle('on', tookState);
    el.took.setAttribute('aria-pressed', tookState ? 'true' : 'false');
  }

  // Whether the card on record is the held order's own card come back.
  function heldAgain() {
    return !!(holdingNow && onRecord && onRecord.heldCard);
  }

  el.took.addEventListener('click', function () {
    if (!onRecord || !onRecord.id || tookBusy || heldAgain()) return;
    var want = !tookState;
    tookBusy = true;
    showTook();
    ask('/api/offers/mark', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // By id, never by pay-and-minutes. Marking by the figures is a *rule*
      // that catches every offer paying that to the cent, and two genuinely
      // different cards doing exactly that inside one window is a case this
      // project has already met — see rpi/test_repeats.py.
      //
      // And the offer itself. The server keeps the offer on record in
      // memory, so after a restart mid-shift it has none — while this page
      // still shows "Took $10.00?" for it. Sent along, the server can put
      // the order in the car from what this page knows.
      //
      // Pressed again it takes the tick back with `null`, not `false`: "that
      // was wrong", pressed at the wheel, is not "I passed on it", which is
      // an answer of its own now (Passed, on the offers page) and one the
      // advice reads as a fact. `via` names this screen — see MARK_VIA in
      // server.js.
      body: JSON.stringify({ id: onRecord.id, accepted: want ? true : null,
                             via: 'panel', offer: onRecord })
    }).then(function (r) {
      if (!r.ok) { tookFailed = true; return null; }
      tookFailed = false;
      tookState = want;
      return r.json().catch(function () { return null; });
    }).then(function (body) {
      // The order in the car, learned HERE and not from the next reading.
      //
      // This is the moment the destination is on the phone: the driver has
      // just accepted, the card is gone from the mount, and they pressed the
      // button that says so. But `holdingNow` was only ever set from a reading
      // — and there is no reading, because there is no card. So Drop and
      // ⌖ Dropoff stayed hidden until the NEXT offer arrived, by which point
      // the phone is showing that offer and pressing ⌖ Dropoff photographs the
      // wrong screen. The one feature that exists for the 18% of cards naming
      // no address could not be reached on the path it was built for.
      //
      // Believing the server rather than the press, like Drop below: the mark
      // may have been refused, or the hold may already have expired on the
      // server's own clock, and a button for an order that is not there is
      // worse than no button.
      // A Took that put another order down (server.js writes its drop row
      // `by: 'replaced'`). Said on the status row like the GPS drop.
      if (body && body.replaced) {
        replacedSaidUntil = Date.now() + (body.replaced.saidForMs || 60000);
      }
      if (body && typeof body.holding === 'boolean') {
        if (holdingNow && !body.holding) forgetDest();
        holdingNow = body.holding;
        // ...and where it ends, which the reply now says (heldForPanel in
        // server.js). It said only whether an order was held, and this was
        // cleared to wait for the next reading — so from ✓ Took until then
        // Map view drew the taken card's dropoff as that CARD's, and the
        // next card's offer line took it off the glass with the card it
        // belonged to: the driver's "it did not hold those pins". A server
        // older than the field leaves it as it was, waiting for a reading;
        // never a stale end from the last order, which would tint the
        // button for a job that is finished.
        var held = body.holding ? body.held : null;
        heldEnds = held ? (held.dropoff || null) : undefined;
        heldCard = held ? (held.card || null) : null;
        showDrop();
        showDest();
        if (viewMode === 'map') showMap();
      }
    }).catch(function () {
      /* The record is the point; a failed write must not look like a success. */
      tookFailed = true;
    }).then(function () {
      tookBusy = false;
      showTook();
      // The tick on the status row is about to be wrong by one. It is one of
      // two things on this screen that ask again off the timer — the other is
      // the rig saying it has written an offer, see SHIFT_SOON_MS — and
      // leaving it until the next slow poll would mean pressing "took it" and
      // watching the number beside it not move. This comment used to say
      // marking was the only thing that changes the row, which was never
      // true: every card the rig saves is one more offer on it.
      loadShift();
    });
  });

  // --- the order in the car ------------------------------------------------
  //
  // Held by the server, not here. Several panels may be open — the dashboard,
  // a phone, a laptop indoors — and an order tracked per page would have each
  // of them measuring the next offer against a different job, or against none.
  //
  // The button only appears while there is one to put down. A control for a
  // state you are not in is a control that teaches people to ignore the bar,
  // and this bar is the one a driver reaches for without looking.
  var holdingNow = false;
  // ...and whether the rig knows where it ENDS, which is a different question
  // and the one that decides whether the dropoff button is worth pressing.
  //
  // An offer card names where a delivery ends on only some cards — 106 of this
  // driver's 604 print a merchant and no address — so the order in the car
  // often has no end the geography check can use, and half of all pairs get no
  // verdict on where they finish. The button that fixes that is in the bar
  // already, and it looked identical whether pressing it would change the
  // answer or not.
  //
  // `undefined` while nothing is held; a string or null once something is.
  var heldEnds;
  // ...and the card that order came from, as the server kept it: where the car
  // was when it came up and how far it said the job ran. Map view checks the
  // held end against these (MV.againstCard). Set beside `heldEnds` from the
  // same message, and read only while `heldEnds` names an end, so a stale one
  // can never be measured with.
  var heldCard = null;
  // ...and the server's name for that order, which a door-level pin of its end
  // is posted under (pinHeldEnd), so a pin can never land on the next order.
  var heldId = null;
  // The GPS drop's two words on the status row (healthNote): the car is at the
  // held order's door now, per the last beat; and when the server put the
  // order down because the car left it, until when to say so.
  var atDropoff = false;
  var gpsDropSaidUntil = 0;
  // ...and until when to say a Took put the previous order down.
  var replacedSaidUntil = 0;
  var dropBusy = false;
  var dropFailed = false;
  // What the failed press was about, so the failure can be forgotten when the
  // car is carrying something else. A refused Drop leaves the order where it
  // was, so "the hold went away" is not the signal — the order that failed to
  // go down is still there, and the next thing to happen is a DIFFERENT order
  // being picked up. The card has no id for a hold, so the figures it does
  // print stand in for one.
  var dropFailedFor = null;
  // The order in the car as last described, so a failure can be tied to it.
  var heldSig = null;

  /* The Trip Planner's stops as Map view's source for the held order's
   * pickups — { of, stops }, `of` the order they were read for (heldOwner).
   *
   * Not `plannerSaid`, and on purpose a longer life. plannerSaid is the
   * answer to a press, and goes when a different offer goes on the record
   * (forgetDest): kept to that, the restaurant's pin would leave the map at
   * the next card — the one moment Map view is opened to weigh a card
   * against the order in the car. This is where that order is collected
   * from, which a new card does not change: kept until the order goes, or
   * until a newer planner read while it is held replaces it (the rig reads
   * the planner unpressed while an order is marked taken, and a list read
   * after the pickup no longer carries it). A reload has only what the
   * server kept, which is plannerSaid's life (forgetPlanner in server.js). */
  var heldPlan = null;

  function heldOwner() { return holdingNow ? (heldId || heldSig) : null; }

  function holdSignature(holding) {
    return holding ? String(holding.pay) + '/' + String(holding.minutes) : null;
  }

  function showDrop() {
    el.drop.hidden = !holdingNow;
    el.drop.textContent = dropBusy ? '…' : dropFailed ? 'Drop · failed' : 'Drop';
    el.drop.classList.toggle('failed', dropFailed);
    el.drop.title = 'Put the order down, so the next offer is judged on its own '
                  + 'again. It does not touch your phone.';
  }

  /* Map view pinned the held order's end at DOOR level: tell the server, which
     puts the order down once the car has stopped at that door and then left it
     (gpsArrival in server.js). Only a door — the place names a house number
     and the NucBox's answer carries it — and the server asks both again. A
     street or a town is never sent. Fire and forget: a refused or lost post
     costs only the GPS drop, and the timer and Drop still end the order. */
  function pinHeldEnd(want, q, got) {
    var plan = MV.searchPlan(q);
    if (!want.heldId || !got.at || !plan || plan.kind !== 'street' || !plan.door
        || !MV.hasDoor(got.at, plan.house)) return;
    ask('/api/held-end', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ holdId: want.heldId, dropoff: q, lat: got.at.lat,
                             lon: got.at.lon, name: got.at.name, doorLevel: true }) })
      .catch(function () {});
  }

  /* ...and where one of its pickups is, found inside the held card's disc as
     its end is: the server does not arm a door within 150 m of one (the
     restaurant guard, pickupNearEnd in server.js). Fire and forget, too. */
  function pinHeldPickup(want, got) {
    if (!want.heldId || !got.at) return;
    ask('/api/held-pickup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ holdId: want.heldId, lat: got.at.lat, lon: got.at.lon }) })
      .catch(function () {});
  }

  // The order is down: Drop's reply, or the server's word that the GPS put it
  // down (msg.gpsDrop). One function, so the two cannot forget different things.
  function orderDown() {
    holdingNow = false; forgetDest(); heldEnds = undefined; heldSig = null;
    heldId = null; atDropoff = false; heldPlan = null;
    showStack(null); showDest(); showTook();
  }

  el.drop.addEventListener('click', function () {
    if (dropBusy) return;
    dropBusy = true;
    showDrop();
    ask('/api/delivered', { method: 'POST' }).then(function (r) {
      // Believe the server, not the press. If the write failed the order is
      // still in the car and the next offer must still be measured against it.
      dropFailed = !r.ok;
      dropFailedFor = r.ok ? null : heldSig;
      if (r.ok) orderDown();
    }).catch(function () {
      /* Left as it was: an order the server still holds is the truth. */
      dropFailed = true;
      dropFailedFor = heldSig;
    }).then(function () {
      dropBusy = false;
      showDrop();
    });
  });

  // --- reading the destination off the screen after the accept -------------
  //
  // The one thing the offer card cannot tell you. Uber prints "Customer
  // dropoff" and no address on 106 of this driver's 604 cards — 18% of
  // everything the rig sees — so the order in the car has no destination and
  // the stack line has nothing to compare the next offer against. The address
  // is on the screen that comes AFTER the accept, and this is the driver
  // saying "that is what you are looking at now".
  //
  // The press only opens a window; the scanner keeps reading for a few seconds
  // (see DROPOFF_WINDOW) because the driver still has to get the destination
  // up, and a phone in a mount showing a navigation screen is exactly what the
  // motion gate scores as nothing happening.
  var destBusy = false;
  var destSaid = '';
  // Whether the last press came back with nothing. Cleared by the next press
  // and by an address arriving, the same way `tookFailed` is — a failure that
  // outlived the thing that failed would be worse than not saying it.
  var destFailed = false;
  // ...and the Trip Planner the same press read, when it was one: the stops,
  // in the order the phone listed them, and the scanner's reason for filing
  // none of them as the order's end — {stops, unfiled} — or null. See
  // showStops and unfiledNow.
  var plannerSaid = null;

  /* What a press read is forgotten, all of it, in one place.
   *
   * `destSaid` was cleared at seven places in this file — a new press, a hold
   * that ended four different ways, a new offer on the record, a reload with
   * nothing held — and the planner's stops are the same answer to the same
   * press, so they have to go at exactly those seven moments and no others.
   * Seven more assignments beside the seven would be two lifetimes for one
   * answer the first time somebody added an eighth to one list and not the
   * other: stops still on the glass for an order already put down, which is a
   * route for a trip that is over. rpi/test_dashboard.py holds every one of
   * them to this function. server.js drops the stops it keeps on the order in
   * the car at the same moments (forgetPlanner), so a reload does not bring
   * back what this has forgotten.
   *
   * ...and the stops come off the glass HERE, not at the next render: Drop and
   * the replies to a press answer on their own and do not render, so for up to
   * the second-long tick a put-down order's stops were still being shown. */
  function forgetDest() {
    destSaid = '';
    plannerSaid = null;
    showStops(false);
  }

  /* Why the planner the last press read gave the order in the car no end, as
   * the SCANNER decided it — see planner_destination in rpi/scan_pi.py — or ''.
   *
   * Read off the line, not worked out here. This page used to count the
   * dropoffs itself, which was a second copy of half the scanner's rule: it
   * said nothing when the one dropoff did not read whole, and nothing could
   * have told it the list ran off the screen.
   *
   * '' the moment the button has an end on it, whichever read put it there.
   * "End not guessed" beside a green "Read as: …" was two answers to one
   * question on the glass at once — a two-dropoff planner, then the address
   * seen on the navigation screen — and the second is the one that holds. */
  function unfiledNow() {
    return (!destSaid && plannerSaid && plannerSaid.unfiled) || '';
  }

  // Each reason twice: the line under the stops, which has to survive the
  // thirty characters the 3.5" hat's scene picture gives a line, and the
  // sentence it stands for on the button's title. Keyed by the words
  // planner_destination returns, and rpi/test_lint.py holds the two lists to
  // each other: a reason the scanner gives that this has no words for would
  // throw in the middle of drawing the driving screen.
  var UNFILED_THEN = ' so the order\'s destination is left as it was. Press this '
    + 'over the navigation screen for it instead.';
  var UNFILED_SAID = {
    dropoffs: function (drops) {
      return { note: drops + ' dropoffs: end not guessed',
               title: 'The Trip Planner lists ' + drops + ' dropoffs and the rig '
                 + 'does not guess which one is this order\'s,' + UNFILED_THEN };
    },
    list: function () {
      return { note: 'list cut off: end not guessed',
               title: 'The rig could not see both ends of the Trip Planner\'s list — '
                 + 'the title over the first stop and "Waybill" under the last — so '
                 + 'the one dropoff it read may not be the trip\'s only one,'
                 + UNFILED_THEN };
    },
    address: function () {
      return { note: 'dropoff address unread',
               title: 'The Trip Planner\'s dropoff did not read as a street and a '
                 + 'town,' + UNFILED_THEN };
    }
  };

  function unfiledSaid(why, stops) {
    return UNFILED_SAID[why]((stops || []).filter(function (s) {
      return s.kind === 'dropoff';
    }).length);
  }

  // "4:18" off minutes since midnight. No AM or PM: a stop is expected within
  // the hour of the trip it is on, and the line has no room for two letters
  // that say nothing the driver does not know.
  function clockOf(minutes) {
    var h = Math.floor(minutes / 60) % 12;
    var m = minutes % 60;
    return (h || 12) + ':' + (m < 10 ? '0' : '') + m;
  }

  // One stop, as one line: "▸ Dropoff by 4:18 · Pat Q. · 4821 Kestrel Dr,
  // Marietta". The rig's own words for each field and nothing in place of one
  // it did not read — a closed block on the planner prints no address, and the
  // line stops at the name.
  //
  // What and when first, because that is the order of the trip and it is the
  // part that must never be cut: in the 3.5" hat's scene picture the column is
  // about thirty characters wide, and with the name ahead of the time a
  // "Taco Hut Express" pickup lost its "by 12:05" to the ellipsis — measured,
  // rpi/test_layout.py. The name and the street are what give way, from the end.
  function stopLine(s) {
    var line = '▸ ' + (s.kind === 'pickup' ? 'Pickup' : 'Dropoff')
      + (typeof s.orders === 'number' && s.orders > 1 ? ' ×' + s.orders : '');
    if (typeof s.expectedBy === 'number') line += ' by ' + clockOf(s.expectedBy);
    // The name as shown: the stop's icon read as letters in front of it
    // goes (MV.plannerName); the stop keeps it as read.
    var name = s.name && MV && MV.plannerName ? MV.plannerName(s.name) : s.name;
    if (name) line += ' · ' + name;
    if (s.line) line += ' · ' + s.line;
    return line;
  }

  // At most four lines. A planner longer than that shows its first three and
  // says how many more there are, so the driver knows the list goes on rather
  // than reading three as the trip.
  var STOPS_SHOWN = 4;

  /* The stops the last ⌖ press read off Uber's Trip Planner, one line each,
   * in order — between offers.
   *
   * Between offers because that is when the card has room: it holds the phase
   * and nothing else (see #stops in the stylesheet), so the block costs the
   * panel nothing it was using. A card being judged takes the space back —
   * render() hides the block whenever a reading carries a verdict — and the
   * stops come back when it goes, for as long as they are remembered, which
   * ends at exactly the moments the read destination does: see forgetDest.
   *
   * When the scanner gave the order in the car no end off the planner — two
   * dropoffs, a list it could not see both ends of, a dropoff that did not
   * read whole — this says so in a line of its own, because the button staying
   * amber is the only other sign of it. See unfiledNow.
   *
   * THE NOTICE FIRST. Between offers the card also holds the notice — the
   * journal refusing writes, the phone too bright or too dim, the phase's
   * own message — and the notice is the item that gives
   * way (see `#warn` in the stylesheet), while these lines are `flex: none`.
   * So on a small panel the stops took the notice's room, and it went with
   * nothing saying so: on the 3.5" hat's scene picture "Offers are NOT being
   * saved" with "too bright" after it needs 139px, had 121 on the glass before
   * four stops arrived, and 17 after (rpi/test_layout.py, this fold switched
   * off). Now the stops give way first, a
   * line at a time from the end, each one counted into "+ N more stops", down
   * to one line saying how many there are — so neither disappears silently.
   * That one line can still cost a notice that does not fit even without it;
   * a notice longer than the card is scrollable, and was cut before. */
  function showStops(show) {
    var stops = show && plannerSaid ? plannerSaid.stops : [];
    var why = stops.length ? unfiledNow() : '';
    var note = why ? unfiledSaid(why, stops).note : '';
    var k = stops.length > STOPS_SHOWN ? STOPS_SHOWN - 1 : stops.length;
    var drawn = drawStops(stopsLines(stops, k, note));
    while (k && noticeCut()) {
      var fewer;
      do { k--; fewer = stopsLines(stops, k, note); } while (k && fewer.length >= drawn);
      drawn = drawStops(fewer);
    }
  }

  // The first `k` stops, the rest counted, and the note under them; with no
  // room for a single stop, one line that says how many were read.
  function stopsLines(stops, k, note) {
    if (!stops.length) return [];
    var plural = function (n) { return n + (n === 1 ? ' stop' : ' stops'); };
    if (!k) return ['▸ ' + plural(stops.length) + ': no room to list'];
    var lines = stops.slice(0, k).map(stopLine);
    if (k < stops.length) lines.push('+ ' + plural(stops.length - k).replace(' ', ' more '));
    if (note) lines.push(note);
    return lines;
  }

  function drawStops(lines) {
    while (el.stops.firstChild) el.stops.removeChild(el.stops.firstChild);
    lines.forEach(function (text) {
      var div = document.createElement('div');
      div.textContent = text;
      el.stops.appendChild(div);
    });
    el.stops.hidden = !lines.length;
    return lines.length;
  }

  // Whether the notice is showing less than it says. Measured on the element,
  // after the lines above are drawn: its height is what the card had left.
  function noticeCut() {
    return !el.warn.hidden && el.warn.scrollHeight > el.warn.clientHeight + 1;
  }

  /* The other state this button is for, which it did not used to have.
   *
   * It was built for after the accept: an order is in the car, its card never
   * said where the job ends, and the address is on the navigation screen. That
   * is still what it does — and it is not when the driver actually wants to
   * know.
   *
   * The driver's own words: "for doordash orders I need to tap the customer
   * drop off location to show the address when screening so it would be
   * possible to search on the map". They are already tapping the phone to
   * reveal the address BEFORE deciding, because where a job ends is half of
   * whether it is worth taking. The rig was looking away.
   *
   * Three conditions, and each one is doing work:
   *
   *   Nothing held, because with an order in the car the button already means
   *   something and that meaning wins — the held order's missing end is the
   *   stronger claim, since every pair judged against it is nonsense without.
   *
   *   A card the rig has on record, with an id, because an address read
   *   against no card is an address belonging to no job. That is the exact
   *   thing server.js refuses to store, and it is right to.
   *
   *   And the card is still UP. `onRecord` is deliberately not cleared — the
   *   Took button names an offer whose card has gone — so without this the
   *   button would sit lit for the rest of the shift after one card with no
   *   destination. Measured off the same clock the verdict's own "stale" uses,
   *   so the control disappears when the thing it is about does.
   */
  function screeningEnd() {
    if (holdingNow) return false;
    if (!onRecord || !onRecord.id) return false;
    if (onRecord.dropoff) return false;
    return Date.now() - readAt <= READ_STALE_MS;
  }

  function showDest() {
    var screening = screeningEnd();
    el.dest.hidden = !holdingNow && !screening;
    // A LABEL, always, and the answer said in colour instead.
    //
    // This used to become the address itself once one had been read. The bar is
    // a grid of equal columns and there are six or seven of them, so on the
    // rig's own 800x480 panel this button is 122px wide: a 42-character address
    // needs 238px and arrived as "1234 Daffodil L…". That is not a control any
    // more - it neither says what pressing it does nor shows an address the
    // driver can check - and at 480x320 the column is 69px, where even
    // "⌖ Dropoff", its label until it was renamed ⌖ Scan, was a squeeze at 74px.
    //
    // There is no width to win: the bar is full and every button shares it
    // equally. So the confirmation is a colour, which this panel already trusts
    // a driver to read before they read words, and it costs no width at all.
    // The address itself goes where there is room for it - the title, and the
    // stack line's own geography.
    el.dest.textContent = destBusy ? '⌖ reading…'
      : destFailed ? '⌖ not read' : '⌖ Scan';
    el.dest.classList.toggle('done', !destBusy && !!destSaid);
    // The same class Drop and Took already use for the same thing, so a
    // failure looks like a failure on this bar whichever control it came from.
    el.dest.classList.toggle('failed', !destBusy && destFailed);
    // ...and asked for, in the one state where pressing it changes an answer.
    //
    // The order in the car has no end the geography check can use — its card
    // printed a merchant and no address, which 106 of this driver's 604 cards
    // do — so every pair judged against it gets ENDS ? and will go on getting
    // it until this button is pressed. The chip on the stack line says the
    // question was not answered; this says which control answers it.
    //
    // The doubt colour, not the green one: green here means "already read",
    // and this is the opposite state. And only when the missing half is the
    // HELD order's — when it is the new card's own dropoff that is missing,
    // nothing this button does can help, and a control that asks to be pressed
    // for no gain is worse than one that says nothing.
    //
    // Screening asks to be pressed on a narrower condition than holding does:
    // the card has to have REFUSED a destination, not merely failed to yield
    // one. Uber printing "Customer dropoff" means the address exists and is
    // one tap away on the phone; a card the reader simply got nothing off has
    // nothing to reveal, and lighting up over it would be asking for a press
    // that cannot help. See endRefused, which is why the two are now telling
    // apart at all.
    // ...and a press that came back empty does not go on asking to be pressed
    // in the amber "this one needs you" colour while it is saying it failed.
    // Two states on one button is one too many at 74px on a moving car, and
    // the failure is the newer news.
    //
    // ...and not on a card this same panel is telling the driver to PASS.
    // Measured over the real week: the card refused a destination and none
    // was read on 457 cards, and 400 of them (87.5%) were rated `no`. The
    // driver ticked 4 of the 457 as taken, all go or warn, and none of the
    // 400. So the ask drops to 57 a week and loses no card anybody took. The
    // button stays on the bar and still reads the address when pressed — the
    // driver asked for it while screening, to look the place up — it only
    // stops asking in the doubt colour for a press the verdict has already
    // made moot. Taken anyway, and the held branch asks again.
    //
    // The card's OWN state, carried on the offer, never `last.state`: once the
    // card leaves the phone the latest reading is an `empty` one, and a PASS
    // card's button would start asking the moment it went. `!== 'no'` rather
    // than a list of the states that may ask, so an offer from a rig one
    // release behind, which carries no state, asks exactly as it did.
    var wants = !destBusy && !destSaid && !destFailed
      && (holdingNow ? heldEnds === null
                     : (screening && !!onRecord.endRefused
                        && onRecord.state !== 'no'));
    el.dest.classList.toggle('wanted', wants);
    // A Trip Planner the last press read, which the scanner gave the order no
    // end off: the panel says why under the stops, in thirty characters; this
    // is the sentence that stands for. One reason, read off the line, for
    // both. See unfiledNow.
    var unfiled = unfiledNow();
    el.dest.title = destSaid
      ? 'Read as: ' + destSaid + '. Press again to read it afresh.'
      : destFailed
      ? 'Nothing on that screen read as an address. Get the destination up on '
        + 'your phone and press again.'
      : unfiled
      ? unfiledSaid(unfiled, plannerSaid.stops).title
      : wants && holdingNow
      ? 'The order you are carrying has no address on record, so the rig '
        + 'cannot say whether a second job ends near it. Read it off your '
        + 'phone. It does not touch your phone.'
      : wants
      ? 'This card says “Customer dropoff” and no address. Tap the dropoff on '
        + 'your phone and press this, and where it goes is on the record '
        + 'before you decide. It does not touch your phone.'
      : holdingNow
      ? 'Read the destination off your phone, so the next offer can be judged '
        + 'on where it ends as well as what it pays. It does not touch your phone.'
      : 'Read where this card goes off your phone. It does not touch your phone.';
    // ...and said out loud, because the colour is the only thing on screen that
    // changed and a screen reader cannot see it.
    el.dest.setAttribute('aria-label', destSaid
      ? 'Dropoff read as ' + destSaid + '. Press again to read it afresh.'
      : destFailed
      ? 'Nothing on that screen read as an address. Press again once the '
        + 'destination is up.'
      : wants && holdingNow
      ? 'Read the dropoff off your phone. The order you are carrying has no '
        + 'address on record, so second jobs cannot be judged on where they end.'
      : wants
      ? 'Read the dropoff off your phone. This card says Customer dropoff and '
        + 'gives no address.'
      : 'Read the dropoff off your phone');
  }

  el.dest.addEventListener('click', function () {
    if (destBusy) return;
    destBusy = true;
    forgetDest();
    destFailed = false;
    showDest();
    ask('/api/dropoff', { method: 'POST' }).then(function (r) {
      return r.json().catch(function () { return null; });
    }).then(function (b) {
      // The one thing the reply does say: whether there is still an order to
      // read a destination for. The server's clock ends a hold with nothing
      // pressed here, and between offers no reading arrives to say so — so
      // Drop and ⌖ Dropoff stayed lit for an order that no longer existed,
      // and pressing this photographed the phone for nothing.
      if (b && b.holding === false && holdingNow) {
        holdingNow = false; forgetDest(); heldEnds = undefined;
        showDrop(); showStack(null); showTook();
      }
    }).catch(function () {
      /* The scanner answers on its own stream; a failed ask just reads as one
         that found nothing, which is the same thing from here. */
    }).then(function () {
      // Cleared on a timer rather than on a reply, because the reply to this
      // is not the response — it is a `dropoff` line arriving from the scanner
      // seconds later, through the same stream the verdicts come down. The
      // window is the scanner's; this only has to stop saying "reading…" once
      // it has certainly closed.
      setTimeout(function () {
        destBusy = false;
        showDest();
      }, 13000);
    });
  });

  // --- what the shift adds up to ------------------------------------------
  //
  // 4am, not midnight: a shift that ran 16:47 to 03:18 is one evening's work
  // and a calendar date cuts it in half. The same number and the same reasoning
  // as journal.html — if the two screens disagreed about when the day started
  // they would print different counts for the same day.
  //
  // Still written out here, and deliberately: this page does not load
  // advice.js. It is the screen in the car, it has to come up from the service
  // worker with no network, and pulling a library in for one integer would be
  // paying for that at the worst moment. journal.html and advice.js share the
  // one copy; this is the second and it is on purpose. See AUDITS, "The
  // panel".
  var DAY_STARTS_AT = 4;

  // The start of the day currently being driven — 4am today, or 4am yesterday
  // while it is still before four in the morning. Local time throughout,
  // because "today" means today where the driver is, and the rig cannot know
  // that: it has no real-time clock and no idea what timezone the car is in.
  // The page says, exactly as it does for /api/journal.
  //
  // Shift back four hours, floor to midnight, add four back. setHours with a
  // whole-day argument sets the field absolutely, so this is exactly 04:00
  // local whatever daylight saving did in between.
  function dayStart() {
    var d = new Date();
    d.setHours(d.getHours() - DAY_STARTS_AT);
    d.setHours(0, 0, 0, 0);
    d.setHours(DAY_STARTS_AT);
    return d.getTime();
  }

  var shiftAt = 0;
  var shiftBusy = false;
  // A request that arrived while one was in flight, to be run once it
  // lands. Marking an offer during the slow poll is exactly that case.
  var shiftAgain = false;
  // Three minutes. What an ask costs the server, on the same event loop that
  // drives the camera stream, depends on whether it has read the journal
  // since it started. The first read parses the whole file — it reaches 64MB
  // before it rolls, at most about twelve weeks at the 5.7MB a week
  // rpi/journal.py's WEEK_BYTES measures, and a third of that in real rows,
  // 22.4MB, parses in 64-223ms on the development container and more on a
  // Pi 4. Every ask after that reads only the bytes appended since
  // (readJournal in server.js, which keeps its rows), and costs a few
  // milliseconds: see SHIFT_SOON_MS below, which is what rests on that.
  // This said every ask paid the whole parse. readJournal was already tailing
  // the file when that was written, and once SHIFT_SOON_MS below quoted the
  // tail's cost the page gave two different costs for one request. The timer
  // stays at the house budget /api/journal/newest set for a journal-reading
  // GET, "every few minutes", for the reason that never depended on the cost:
  // a shift figure is not a number anybody watches tick.
  var SHIFT_EVERY_MS = 180000;

  // ...but it is a number that should not contradict the card that has just
  // been saved, and at three minutes it did. On 8 Oct the rig's own panel read
  // "✓ 0 · 0 offers" at 3:05pm under a $4.21 PASS whose row had landed 27.6
  // seconds earlier (that 📷 Snap's status.json: offerAgeMs 27566). The poll
  // was the only thing asking, bar a mark.
  //
  // So it is asked again when the rig says it has written an offer: the
  // `{offer: …}` line rpi/scan_pi.py's emit_offer sends once
  // OfferLog.consider has appended the row — journal.py closes the file
  // before it returns, so the row is on disk when the line is sent. It goes
  // out for each new card and again for a later reading of the same card that
  // landed reading differently, and both move this row: the count, and the
  // median and set-aside figures a fuller reading changes.
  //
  // Coalesced, because that is several lines a card. The week replayed through
  // OfferLog.consider wrote 2.8 rows an offer (rpi/journal.py, WEEK_BYTES) and
  // up to ten for one card, and the real week's cards landed as close as 0.87s
  // apart, 77 of 1,165 gaps under five seconds and ten cards in its busiest
  // minute. The first line arms one request SHIFT_SOON_MS later and every line
  // until then rides it. Five seconds is a second longer than the resample
  // burst that follows a card's arrival (RESAMPLE_WINDOW in rpi/scan_pi.py),
  // which is the burst of extra reads a card's fuller readings come out of.
  //
  // Replayed against the week's landing times, one line a card, that is 1,099
  // asks rather than 1,166, never more than nine in a minute. That is per
  // card, and so a floor: a card's later rows send lines too, and one that
  // lands after the window its card's first line opened has closed arms an
  // ask of its own. The export keeps one time a card, so when those landed is
  // not on file. The replay that measured WEEK_BYTES stamps each frame of a card
  // one read time (the row's `ms`) after the one before; counted over its
  // 3,265 rows that way it is 1,416 asks rather than 3,265, never more than
  // ten in a minute.
  //
  // Many more asks than the timer above makes, and outside the "every few
  // minutes" it keeps — on purpose, and on what an ask costs once the
  // journal has been read: only the appended bytes are parsed. /api/today
  // right after an append measured 2.9-3.1ms median and 6.4ms worst on the
  // replayed week (5.7MB a week, WEEK_BYTES), and 4.2-4.5ms median and 9.9ms
  // worst on four of it (22.9MB) — two runs of 60 appends each, on the
  // development container. The whole-file parse the timer was sized against
  // is paid once, by the first read of the journal after the server starts or
  // the file rolls: 44-59ms and 161-198ms on those two, as the first
  // /api/today.
  //
  // Any ask at all answers what is pending — see loadShift — so a mark inside
  // the window is the only request, not one of two.
  //
  // Not in a background tab, for the reason the poll's own tick gives: nobody
  // is reading it, and a phone with the panel open behind something else
  // would otherwise ask the rig to read its journal every five seconds of a
  // busy hub. It is left owing instead — `shiftAt` zeroed, so the first tick
  // the tab is visible again asks at once rather than up to three minutes on.
  var SHIFT_SOON_MS = 5000;
  var shiftSoonTimer = null;

  function shiftSoon() {
    if (shiftSoonTimer) return;
    shiftSoonTimer = setTimeout(function () {
      shiftSoonTimer = null;
      if (document.hidden) { shiftAt = 0; return; }
      loadShift();
    }, SHIFT_SOON_MS);
  }

  function showShift(s) {
    if (!s) { el.shift.hidden = true; return; }
    var bits;
    if (s.clockSet === false) {
      // The rig's own clock has not been set, so it does not yet know what day
      // it is on. Every window over the journal is meaningless until NTP lands,
      // and a plausible-looking count is worse than none.
      bits = ['today: waiting for the clock'];
    } else if (s.unreadable) {
      // Empty and unreadable look identical on a panel unless one of them says
      // so, and this is the one worth acting on.
      bits = ['today: the journal could not be read'];
    } else if (s.rolled) {
      bits = ['today: the journal just rolled over'];
    } else if (s.failed) {
      // The request itself failed — an answer that was a 500, a deadline that
      // fired while the server was parsing the journal, a dropped packet on
      // car wifi. This used to blank the row, and SHIFT_EVERY_MS is three
      // minutes, so one lost request took the only takings figure on the
      // panel off the glass for three minutes with nothing in its place. A
      // blank reads exactly like a night with nothing in it.
      //
      // About the FIGURES, not about reaching the rig: when the rig is really
      // gone the connection line beside this already says "reconnecting to
      // the server…", and this saying it too would be one question answered
      // twice on one bar. The case only this row can name is a reachable rig
      // whose answer did not arrive. No old figures reprinted with it — an
      // hour on, they would still read like the truth.
      bits = ['today: figures could not be fetched'];
    } else {
      // Money first. This is one line, cut with an ellipsis where it does
      // not fit, and on the 480px hat and a phone it does not: measured
      // against a fortnight of offers, 392px of text in 223px on the hat and
      // 314px in 172px on the phone. What the ellipsis took was the tail, and
      // the tail was "took 2 for $27 net · median $20/hr" — the two figures
      // a driver glances down for. They lead now; the count of offers and
      // the set-aside figure are what a small screen loses.
      bits = [];
      // "✓ 3 for $48" — the same words the offers page puts on a day
      // header, so the two screens say the same thing about the same rows.
      //
      // A TICK, not "took". `s.took` is `counted.filter(o => o.accepted)`:
      // the offers the driver MARKED, not the jobs they did, and the two are
      // known to differ. Per day over the real week (4am boundary), ticks
      // against cards the panel called ACCEPT ran 7 of 8, 1 of 2, 10 of 41,
      // 12 of 54 and 1 of 1 — the two busiest days are the two where a
      // quarter as many ticks as greens were recorded. "took 10 for $140"
      // reads as the evening's takings; the glyph is the one the Took button
      // wears once pressed and the offers page puts on a marked row, so this
      // reads as what it is, the ticks and what they came to. Two characters
      // where "took " spent five, on a line whose tail is cut on the hat —
      // shorter is the one change here that cannot push a figure off.
      //
      // Whole dollars, like the median beside it: this is read at arm's
      // length. Net, and only claimed as net when a running cost was really
      // taken off — with costs at zero the two are one number and "after
      // costs" would describe a subtraction that never happened. `earned` is
      // absent from a server one release behind, and then the count stands
      // alone as it did.
      bits.push('\u2713 ' + s.took
                + (s.took > 0 && typeof s.earned === 'number'
                   // Signed the way every other figure on these pages is:
                   // "-$1", not "$-1". A job whose mileage cost more than it
                   // paid is rare and real.
                   ? ' for ' + (s.earned < 0 ? '-$' : '$')
                     + Math.abs(Math.round(s.earned))
                     + (s.earnedCost > 0 ? ' net' : '')
                   : ''));
      // Only when there is one. A median of nothing is not zero.
      if (typeof s.median === 'number') {
        // Signed the way the `earned` figure three lines up already is, and
        // rounded the way this line always has been: whole dollars, because a
        // shift median read at a glance does not want a decimal. It wrote
        // "$-12/hr" before, which is the shape this page spends a comment at
        // line 615 refusing — and a median can go negative as soon as a
        // running cost is set.
        // ...and it now says WHAT it is the median OF, which it did not.
        //
        // `shiftSummary` builds it from `counted.map(o => o.perHour)` — every
        // offer the window read, and 935 of this driver's 1,166 were a PASS.
        // The words immediately before it were "took 10 for $140 net", so a bare
        // "median $15/hr" read as the rate of the jobs just named. It is not.
        // Replayed day by day over the real week on the 4am boundary, against
        // the median of what was actually ticked on the same day:
        //
        //   13 Sep  took 7 for $98 net · median $14/hr    took ran $25.50
        //   15 Sep  took 1 for $14 net · median $11/hr    took ran $21.70
        //   18 Sep  took 10 for $140 net · median $15/hr  took ran $34.40
        //   19 Sep  took 12 for $206 net · median $17/hr  took ran $31.00
        //   20 Sep  took 1 for $12 net · median $17/hr    took ran $25.70
        //
        // Pessimistic on all five days, by 1.88x, 1.96x, 2.28x, 1.82x and
        // 1.51x, beside a $25 target it looks measured against. The offers page
        // had this exact fault and its cure was to name the population: its big
        // figure reads `typical offer`.
        //
        // THE FIGURE GOES FIRST, and that is the whole of why this reads the
        // way it does. Copying the offers page's words was tried and measured
        // and is wrong here: this line is ellipsised from the tail, and on the
        // 480px hat "typical offer -$17/hr" put the digits at 507px against a
        // box ending at 468px — the label ate the number it was labelling,
        // which trades this project's first fault class for its second. So did
        // "typical" alone, by 5px. The budget is exactly the seven characters
        // "median " already spent.
        //
        // Putting the number in front of its noun spends nothing: the row's
        // stated rule is that the figures lead and the count and set-aside are
        // what a small screen loses, and the noun is now part of that tail. It
        // is the one arrangement where the cure cannot cost the figure.
        // `rpi/test_dashboard.py` ranges over the digits at 480px and asks
        // where they land, rather than asking `textContent` — which holds the
        // whole string whether it is painted or not.
        bits.push((s.median < 0 ? '-$' : '$')
                  + Math.abs(Math.round(s.median)) + '/hr an offer');
      }
      bits.push(s.offers + (s.offers === 1 ? ' offer' : ' offers'));
      if (s.setAside) bits.push(s.setAside + ' set aside');
      // `beforeClock` is deliberately NOT printed here. Offers the rig recorded
      // before its clock was right are stamped 1970 on disk and cannot fall
      // inside any day window — but that is true of every day, forever, so on a
      // line about today it is a suffix that never clears and attributes rows
      // from some past boot to this shift. The offers page drops them silently
      // for the same reason. It stays in the response because it is a true fact
      // about the journal and a diagnostic may want it; it is not a figure for
      // this row.
    }
    el.shift.textContent = '· ' + bits.join(' · ');
    el.shift.hidden = false;
  }

  // 1 Jan 2025, the same floor server.js applies. Below this a clock is not a
  // clock: the Pi has no RTC, boots in 1970 and jumps when NTP arrives.
  var CLOCK_BELIEVABLE_AFTER = 1735689600000;

  function loadShift() {
    // Whoever asked, the answer is worked out after every offer line that has
    // arrived so far — sent now, or queued behind the request in flight by
    // `shiftAgain` below — so an ask an offer left pending is already answered.
    if (shiftSoonTimer) {
      clearTimeout(shiftSoonTimer);
      shiftSoonTimer = null;
    }
    // The page's OWN clock first. On the panel bolted to the dashboard this
    // browser is running on the Pi, so an unset clock makes dayStart() a 1970
    // moment — which the server refuses, correctly, and the line would simply
    // vanish with nothing said. The server's own answer covers the other case,
    // a phone with a good clock looking at a rig without one.
    var since = dayStart();
    if (since < CLOCK_BELIEVABLE_AFTER) {
      shiftAt = Date.now();
      showShift({ clockSet: false });
      return;
    }
    if (shiftBusy) {
      // Asked while one is already in the air. Dropping it silently is what
      // made marking an offer during the three-minute poll repaint the count
      // from BEFORE the mark: the answer already in flight was computed
      // without it. Remember to go again instead.
      shiftAgain = true;
      return;
    }
    shiftBusy = true;
    shiftAt = Date.now();
    // A fetch that never settles would leave shiftBusy set for the rest of the
    // shift, and the figures on the panel would stop moving with nothing saying
    // they had. This used to build its own AbortController here, which is where
    // `ask` came from: the same guard was needed by five controls that did not
    // have it, and one deadline written twice is one that drifts.
    ask('/api/today?since=' + since).then(function (r) {
      // An older build has no such route, and an unknown /api path on this
      // server falls past every handler to a text/plain 404 — so `.json()`
      // would reject with a SyntaxError rather than returning a status to
      // branch on. The status is read here instead and carried on the error,
      // because the catch below treats a 404 differently from a failure.
      if (!r.ok) {
        var e = new Error('http ' + r.status);
        e.status = r.status;
        throw e;
      }
      return r.json();
    }).then(function (s) {
      showShift(s);
    }).catch(function (e) {
      // Not a silent swallow. Leaving the last good figures up with nothing
      // saying they are old is the failure this file keeps warning about — an
      // hour into a shift they would still read like the truth.
      //
      // Hidden only for a 404, which is a server with no such route at all:
      // there are no figures to fail to fetch, and a sentence complaining
      // about them every three minutes would be a light that never clears.
      // Every other failure says so. See `s.failed` in showShift.
      showShift(e && e.status === 404 ? null : { failed: true });
    }).then(function () {
      shiftBusy = false;
      if (shiftAgain) { shiftAgain = false; loadShift(); }
    });
  }

  var PHASE_LABEL = {
    check: 'CHECKING',
    aim: 'AIM THE CAMERA',
    calibrated: 'CALIBRATED',
    scanning: 'WAITING FOR AN OFFER',
    error: 'SCANNER PROBLEM'
  };

  function money(n, d) {
    if (n === null || n === undefined || !isFinite(n)) return '--';
    return (n < 0 ? '-$' : '$') + Math.abs(Number(n)).toFixed(d);
  }

  /* body.between: no offer, and the card has nothing to say but that. In
     Map view the stylesheet then gives the map the verdict's column too
     (the driver's photograph: half the panel an empty WAITING FOR AN OFFER
     card beside a half-width map). The class flips inside render, so the
     card is back in the same frame as the offer that brings it; the map is
     told its new size there and then, or Leaflet goes on drawing tiles for
     the width it had. */
  function setBetween(on) {
    if (document.body.classList.contains('between') === on) return;
    document.body.classList.toggle('between', on);
    if (theMap && viewMode === 'map') {
      theMap.invalidateSize();
      requestAnimationFrame(function () { if (theMap) theMap.invalidateSize(); });
    }
  }

  function render() {
    var r = last;
    // A rig that cannot see takes this branch with a reading on hand too. Its
    // newest reading is from before it went blind — a dark box has made none
    // for a minute — or, from a camera frozen on a card, is that card read
    // again and again, as fresh-looking as a real one. Either way there is no
    // verdict on this rig to show, and the word for why goes where it would.
    if (!r || !r.ready || blind) {
      // Before the first offer the useful thing to show is setup progress, so
      // the page doubles as the aiming instructions.
      var p = phase || {};
      // Not `no`. A fault is not a verdict, and painting the panel in the PASS
      // red means a glance at a dead scanner reads as "decline this offer" —
      // the driver acts on a decision nothing made.
      //
      // `blind` IS red, and is still not `no`: no fill, a dashed border — no
      // solid border on this screen means anything but a verdict — a warning
      // sign where the verdict's mark goes, and words that are not PASS. It is
      // the one state here where the rig is not working at all, and the muted
      // grey of a fault is how a whole shift went past unread.
      el.verdict.className = 'verdict ' + (blind ? 'blind'
        : p.phase === 'error' ? 'fault' : 'empty');
      // A card under the reader is not "waiting for an offer", and saying so
      // was the panel's least honest second and a half. Not while aiming or
      // faulted: both of those are about the rig rather than about a card, and
      // both are what the driver is there to fix.
      var busy = readingAt && (Date.now() - readingAt) < READING_MS
                 && p.phase !== 'error' && p.phase !== 'aim';
      // ...but "the card" only while there may be one. The motion gate fires
      // on any picture that moves and settles, so a navigation map, DoorDash's
      // "Finding offers" and a "Switch to dash in this busier zone" prompt are
      // each read again and again — and every one of those reads put READING
      // THE CARD, "working out the pay, the time and the distance", over a
      // phone with no card on it, with the "no offer on screen" each one came
      // to on the glass for the few milliseconds before the next read began.
      // So when the last reading came to nothing offer-like, what is said is
      // what it found and that the rig is looking again. A card that has just
      // arrived over that screen gets the same true cue — the rig is reading
      // the screen — and its verdict in the second and a half after. After a
      // reading that had something of an offer on it, or before any reading
      // at all, it is still READING THE CARD.
      var again = busy && r && noVerdictSaid(r) === NO_OFFER_SAID;
      el.verdictLabel.textContent = blind ? BLIND_LABEL[blind] || 'CANNOT SEE'
        : again ? 'READING THE SCREEN'
        : busy ? 'READING THE CARD'
        : (PHASE_LABEL[p.phase] || 'WAITING FOR AN OFFER');
      // Only while aiming, where the number means pixels and says so. On any
      // other phase this put a four-digit camera measurement in the position
      // and size of the headline rate, under the label "/hr" — the single most
      // prominent number on a screen read while driving, saying $1847 an hour.
      var aimingNow = p.phase === 'aim';
      setRate(aimingNow && p.cardPixels ? String(p.cardPixels) : '--',
              aimingNow ? 'px' : '/hr');
      el.vPay.textContent = el.vMin.textContent = el.vMile.textContent = '--';

      var aiming = p.phase === 'aim';
      el.lPay.textContent = aiming ? 'card px' : 'pay';
      el.lMin.textContent = aiming ? 'sharpness' : 'minutes';
      el.lMile.textContent = aiming ? 'steady' : 'miles';
      if (aiming) {
        el.vPay.textContent = p.cardPixels ? p.cardPixels + 'px' : '--';
        el.vMin.textContent = p.sharpness !== null && p.sharpness !== undefined ? p.sharpness : '--';
        el.vMile.textContent = (p.stable || 0) + '/' + (p.need || 6);
      }
      // Ahead of the phase message, because it is the one the driver can act
      // on: a washed-out card between offers is exactly the state where there
      // is no reading to hang it off, which is why it is here as well as below.
      // `notSaving` leads here as it does below, and it has to be here at all
      // for a reason the others only half share: between offers there is no
      // reading to hang it off, and the journal is just as dead between offers
      // as during one.
      // The camera's line before all of them: every other note here is about
      // a reading, and while it holds there is none coming.
      var setup = [blind ? BLIND_NOTE[blind] || '' : '',
                   notSaving || '', tooBright ? TOO_BRIGHT : '',
                   tooDim ? TOO_DIM : '', p.message || ''].filter(Boolean);
      el.warn.textContent = setup.join(' ');
      el.warn.hidden = !setup.length;
      // No card, no address. Leaving the last one up would have it read as
      // belonging to whatever comes next.
      showPlaces(null);
      showStack(null);
      // ...and this is where the Trip Planner's stops go, if a press read one:
      // no card is being judged. Not while aiming, when the card is showing
      // the mount's own measurements.
      showStops(p.phase !== 'aim');
      var quiet = Date.now() - seenAt;
      el.detail.textContent = aiming
        ? 'the view below is live — move the mount until this says good'
        : (quiet > STALE_MS
            ? 'nothing from the scanner for ' + Math.round(quiet / 1000)
              + 's — it may have stopped'
            // Nothing while blind: the word above and the connection line
            // below already say it. Every sentence noVerdictSaid() has is
            // about a picture the rig has just said it cannot trust: "no
            // offer on screen" is a claim about a screen it cannot see, and
            // "box may cut it off" would send the driver to ▣ Set box over a
            // camera that is stalled or a box too dark to read. The reading
            // it would be said of is the last one before the word, too: the
            // word clears at the next read.
            : (blind ? ''
               : again ? 'no offer on screen · reading again'
               : busy ? 'working out the pay, the time and the distance'
               : (r ? noVerdictSaid(r) + trackNote(r) : '')));
      el.verdict.classList.toggle('stale', quiet > STALE_MS);
      el.working.hidden = true;
      showRaw(r && r.text);
      /* Between offers, and nothing on the card but WAITING FOR AN OFFER:
         Map view takes the whole width (see body.between in the stylesheet).
         Only then — not while aiming, faulted, blind, reading a card, stale,
         or with a notice or the Trip Planner's stops on the card, each of
         which is the card saying something. */
      // No phase is the ordinary shift (a `scanning` phase is cleared when
      // the scanner first speaks), and its label is the same.
      setBetween(!blind && (!p.phase || p.phase === 'scanning') && !busy && quiet <= STALE_MS
                 && el.warn.hidden && el.stops.hidden);
      return;
    }
    // An offer: the verdict back on the glass, in this same render.
    setBetween(false);

    var stale = Date.now() - readAt > READ_STALE_MS;
    el.verdict.className = 'verdict ' + r.state + (stale ? ' stale' : '');
    // `whole` and `locked` are two different claims and only one of them is the
