<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uber Scan — Live</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<!-- The deciding behind the map mode: the geocoder, its one-a-second rule, the
     shared cache of answers, the box drawn around where the car was, and the
     detour arithmetic. Same-origin, in the service worker's shell, and the
     same file the offer log and the map page use — which is the point. A
     second copy of this reasoning on the panel is how one question comes to
     have two answers that drift apart.

     Leaflet is NOT loaded here. It comes from a CDN and this page has to open
     on a dead hotspot; it is fetched the first time somebody switches to the
     map, and never otherwise. -->
<script src="map-view.js"></script>
<style>
  /* Read at arm's length, in a car, at a glance. Nothing subtle here. */
  #app { justify-content: center; }
  .live { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--pad); }

  /* On the rig's own dashboard screen — wide, short, 800x480 or less — the
     verdict and the camera view sit side by side instead of stacked. Stacked,
     each got half of 480px and the verdict ended up smaller on the dedicated
     display than on a phone, which is exactly backwards: this panel exists to
     be read from the driver's seat.

     The camera view is the half that gives way. It matters while aiming the
     mount and hardly at all afterwards, whereas the verdict is the entire
     reason the screen is there. */
  @media (orientation: landscape) {
    /* Half each, for the scene view — a picture of the cabin is landscape and
       does use the width it is given. The phone view overrides this below,
       because a portrait picture does not. */
    #app { display: grid;
           grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
           grid-template-rows: minmax(0, 1fr) auto auto;
           align-content: start; }
    /* `safe`, which is the difference between overflowing downward and
       overflowing upward. Centred content that is taller than its box spills
       equally in both directions, and the top is where the word ACCEPT lives —
       so on the one screen whose whole job is to show a verdict, the verdict's
       name was the first thing to be clipped away. `safe center` centres while
       it fits and falls back to the top when it does not. */
    .live { grid-column: 1; grid-row: 1; justify-content: safe center; }
    /* The panel takes the height of the row it is in rather than only the
       height of its own words. On a 1280x800 panel the verdict was 352px of a
       788px column and the rest was black — the same complaint that started
       this, one screen along. Stretched, with the contents centred inside it,
       so the number has somewhere to grow into and the card looks like a card
       rather than a label floating in the dark. */
    .live #verdict { flex: 1 1 auto; display: flex; flex-direction: column;
                     justify-content: center; min-height: 0; }
    /* The notice is the item that gives way, on every panel.

       `#verdict` is a centred column, so prose taller than the card spills
       equally out of BOTH ends of it — and the top of the card is where the
       word ACCEPT and the rate live. Measured: a long enough notice put both
       outside the card on the 800x480 panel the rig is bolted to, and on the
       3.5" hat the three notices a single uncertain reading already writes did
       it. Neither says anything; #app clips at `overflow: hidden` and the
       verdict is simply not there.

       One declaration does all of it, and not the obvious one. A flex item's
       automatic minimum size is its own content, so a block of prose refuses to
       give even when it is the only item with anything to give — and the rule
       that removes that floor is `overflow` being anything but `visible`. So
       `overflow-y: auto` both makes the notice shrinkable and makes what does
       not fit reachable, in the same word. (A `min-height: 0` alongside it is
       the declaration everyone reaches for and it changes nothing here; see the
       same note on `.places` and `.stackline` above, which take the other half
       of this rule — `overflow: hidden` — and needed `flex: none` to get their
       floor BACK.)

       Not `safe center` — which is what the same fault one box out called for.
       Here it would move the whole overflow to the bottom edge, and the cards
       on the 800x480 panel run a few pixels into their own padding, which is
       invisible and harmless until it is all pushed to one side. */
    .live #verdict > #warn { overflow-y: auto; }
    /* ...and inside that column, the one-line facts do not shrink.

       A flex item's automatic minimum size is its content — except when it has
       `overflow: hidden`, which removes that floor entirely. Both of these do,
       to ellipsise, so both were shrinkable to NOTHING while the big rate block
       beside them kept every pixel. Measured on the rig's own 800x480 panel:
       `#places` drew 9px tall for a 15px font, and 0px once the stack line
       grew — the address of the job, on the one screen the driver looks at
       while deciding, painted at no height at all.

       The rate block is the item with room to give: it is 125px of figure and
       loses nothing legible by giving up ten. These two are one line each and
       there is no such thing as most of a line. */
    .live #verdict > .places,
    .live #verdict > .stackline,
    .live #verdict > .stops,
    .live #verdict > .heldnext,
    .live #verdict > .heldline { flex: none; }
    /* `stretch`, not `center`, and this is the difference between a picture
       that fits and one that is cut.
       
       `#viewWrap > img { max-height: 100% }` resolves against the wrapper, and a
       wrapper that is `align-self: center` takes the height of its contents —
       so the percentage had nothing to measure against and was ignored. On the
       800x480 panel the phone drew 612px tall in a 468px row and `overflow:
       hidden` took the difference off both ends: 109px off the TOP, which on
       an offer card is where the payout is, and 23px off the bottom. It got
       worse on bigger panels, 137px off the top at 1024x600.
       
       Stretched, the wrapper is the row, the percentage has a number to
       resolve against, and the picture is centred inside it whole. */
    #viewWrap { grid-column: 2; grid-row: 1; margin: 0; min-height: 0;
                align-self: stretch; display: flex;
                align-items: center; justify-content: center; }
    /* Bounded by the row it is in rather than by the viewport. It used to be
       `100dvh - 132px`, which is a guess at what the bars below it cost, and a
       guess that is too big overflows the page — the whole reason the bottom
       bar ended up off the glass. `100%` is the row, and the row is what is
       actually left over. */
    #viewWrap > img { max-height: 100%; object-fit: contain; }
    /* The map takes the row the same way, and takes what is LEFT of it rather
       than all of it: the caption under it is the line that says how far out
       of the way the pickup is, which is the whole reason a driver switched
       here. At `height: 100%` the map is the row on its own and that line is
       pushed off the glass — on this panel there is exactly one row to spend
       and nothing below it scrolls. */
    #viewWrap:has(#liveMap:not([hidden])) { flex-direction: column;
                                            align-items: stretch; }
    #liveMap { flex: 1; min-height: 0; }
    /* The details block has no room on a dashboard panel and is hidden below,
       but it still needs a cell or it lands in the middle of the grid. */
    #raw { grid-column: 1 / -1; grid-row: 2; }
    .connbar { grid-column: 1 / -1; grid-row: 2; }
    .bottombar { grid-column: 1 / -1; grid-row: 3; }
    /* Never taller than the glass. Everything above lays the page out across
       the panel instead of down it precisely so it fits; this is the assertion
       that it did, and it is what stops a bar of controls scrolling out of
       reach of a driver who is not going to be scrolling. */
    #app { height: 100dvh; min-height: 0; overflow: hidden; }
    /* When there is no camera frame to show — before the first one arrives, or
       on a machine with no camera at all — the verdict takes the whole panel
       rather than sitting in half of it beside a black rectangle. The view is
       what gives way, because it matters while aiming the mount and the
       verdict is why the screen is bolted to the dashboard. */
    #app:has(#viewWrap.gone) { grid-template-columns: minmax(0, 1fr); }
    #viewWrap.gone { display: none; }
    /* ...and the other way round, in Map view between offers: the card has
       nothing on it but WAITING FOR AN OFFER (setBetween says when), and the
       map takes its column. Measured on the 1024x600 panel in the driver's
       photograph, the map was 500px of the 1008 across. The card comes back
       in the render that brings an offer. */
    body.between #app:has(#liveMap:not([hidden])) { grid-template-columns: minmax(0, 1fr); }
    body.between #app:has(#liveMap:not([hidden])) .live { display: none; }
    body.between #app:has(#liveMap:not([hidden])) #viewWrap { grid-column: 1; }

    /* Reading the phone rather than aiming at it.
     *
     * A phone is portrait and this panel is landscape, so the picture is
     * bounded by height and the columns should not be split evenly: at
     * 1.25fr/1fr the image was width-bound at 345px on an 800x480 screen and
     * drew 260px tall in a 468px row, leaving 200px of the one dimension it
     * actually wanted. Given the height, the same phone comes out 468px tall —
     * a little under twice the linear size, on top of the six-fold gain in the
     * picture itself.
     *
     * The verdict keeps the rest of the width. It is still the reason the
     * screen is bolted to the dashboard; it is just no longer the only thing
     * on it worth looking at, and a phone screen you cannot read the buttons
     * on is not a phone you can drive with a mouse. */
    /* The picture takes the width it needs and no more, which is not the same
       as taking less than half.

       A phone is portrait and this panel is landscape, so the picture is bound
       by HEIGHT. Given the 468 rows an 800x480 panel has left after the page
       margins, the phone's own shape fixes the width, and no arrangement of
       columns changes it. Splitting the panel evenly was tried and measured on
       exactly this card: the phone came out the same size to the pixel, the
       rest of its column went black, and the other half paid for it — the
       address sliced to 11px of its 17px line, the age line wrapped onto two,
       and five controls sharing 388px instead of 559px close enough that two
       labels touched.

       So the column is sized to the picture and what is left goes to the
       verdict and the controls. Same phone, room for everything else. */
    body.phoneview #app { grid-template-columns: minmax(0, 1fr) auto; }
    /* Down the whole panel, not just the row the verdict is in. The bar of
       controls and the connection line were spanning both columns, so the
       picture stopped 78px above the bottom of an 800x480 screen and the space
       it stopped for was black: the verdict does not fill its row either. With
       every row to itself the same phone is 468px tall instead of 382, and the
       controls lose nothing — five buttons across the remaining 520px is still
       104px each. */
    body.phoneview #viewWrap  { grid-column: 2; grid-row: 1 / -1; }
    body.phoneview .connbar   { grid-column: 1; }
    body.phoneview .bottombar { grid-column: 1; }
    body.phoneview #viewWrap { align-self: stretch; display: flex;
                               align-items: center; justify-content: center; }
    body.phoneview #viewWrap > img {
      /* Height first, and width whatever the phone's own shape makes it. The
         base rule is `width: 100%`, which on a portrait picture in a landscape
         cell is the wrong axis to pin. */
      width: auto; height: 100%; max-width: 100%; max-height: 100%;
    }
    /* The caption sits under a picture that is now as tall as the row, so it
       has nowhere to be. The picture says what it is. */
    body.phoneview #viewNote { display: none; }
    /* ...and the line ▣ Set box leaves up for six seconds once a box is
       read ("boxes sent — offers are read in the card box, …"). In this
       column it was a flex item beside the picture, and the column is as
       wide as what is in it (`auto`, above): the sentence on one line took it
       to 640-776px at 800x480 against the picture's 269, every control on the
       bar went to 10-16px for those six seconds (by what else was on it), and
       a click on Set box landed on ⛶ Scene. Over the picture instead, the column's width and wrapping
       inside it, so it sizes nothing. Over its top and not its foot: the offer
       card sits on its button bar at the bottom of the phone's screen
       (rpi/cardfind.py), and that is what the six seconds should not hide.
       rpi/test_layout.py holds every control on the bar to its width with the
       line up. */
    body.phoneview #drawHint {
      position: absolute; left: 0; right: 0; top: 0; z-index: 2;
      padding: 6px 8px; background: var(--bg);
    }
    /* The rate is sized against the panel it sits in, and that panel is now a
       column rather than the whole width.
       Four limits, and whichever bites first wins: the panel's width, the
       panel's height, an absolute ceiling, and the column the number has to fit
       inside. The height term is what lets a 1024x600 panel spend its extra
       room on the one number the screen exists for — the flat 92px cap left it
       the same size as on an 800x480, with 130px of black above and below.
       The ceiling is 170 rather than 140 because at 140 it was the term that
       bit on a 1024x600 panel, which put the absolute cap back in charge of
       the exact screen the height term was added for; at 170 the height wins
       there (156px) and the width still wins on an 800x480 (128px), which is
       the arrangement intended. */
    #perHour { font-size: min(16vw, 26dvh, 240px,
                              calc((100cqw - 40px) / (var(--chars) * 0.62))); }
    /* ...and with the answer on the card under a pair (#way, showWay), that
       row's 20px comes out of the height term: 18dvh, not 26. Measured in
       rpi/test_layout.py at 800x480, the pair's card with the line under it
       ran 4px past its border beside the phone, the word PASS the part that
       went, and 12px beside the scene picture, where the card's width binds
       and 20dvh still left it 3px over. 86px at 480 tall, still the largest
       thing on the card by four times. Not where a notice is up too, whose
       own rule takes more; and put back where there is the room, on 1024x600,
       the rig's own (the min-width: 1000px block), and the hat keeps its own
       (its block). */
    .live:not(.driving) #verdict:has(#way:not([hidden])):not(:has(#warn:not([hidden]))) #perHour {
      font-size: min(16vw, 18dvh, 240px, calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
    /* ...and it gives some of that back when there is something to say. A
       notice is two more lines inside a panel that is already as tall as the
       row it sits in, so without this the panel grows past the glass and the
       word ACCEPT is the part that goes — clipped off the top, on the one
       screen whose whole job is to show it. */
    #verdict:has(#warn:not([hidden])) #perHour {
      font-size: min(12vw, 17dvh, 96px,
                     calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
    /* ...and the room comes out of the line that is already on screen twice.
       This hid the whole working, which is where the raw $/hr lives and the
       only place on this page it appears. A notice is showing for the whole
       life of a card whenever the distance was unreadable — that flag is a
       stored property of the merged reading and never clears — so on 52 of
       one real shift's 121 offers the raw figure was not slow to arrive, it
       never arrived at all. Those are also exactly the offers where no
       mileage cost was taken off, so the working had no net line either and
       the block rendered nothing: a hidden empty box, bought at the price of
       the one number it was there to show.

       The net line is the headline, in small type. Dropping that costs
       nothing a glance needs and buys the same line of height. */
    #verdict:has(#warn:not([hidden])) .working .net { display: none; }
    /* The same line, for the same reason, when a pair is on screen. The stack
       line is a row of its own under the address, and the card had no row to
       give it: measured beside the phone on an 800x480 panel, the verdict's
       contents ran 27px past its box, centred, so the word PASS started 4px
       above the card's border and the stack line — the row a driver presses —
       ended 2px below it. The net line is 32px there; without it the stack
       line ends 11px inside the border. */
    #verdict:has(#stack:not([hidden])) .working .net { display: none; }
    #raw, #viewNote { display: none; }
    /* ...except when it is the map's line, which is the one thing the caption
       has ever had worth a row. "camera view · inset is what the reader sees"
       is a label on a picture that says what it is; "+3.2 mi out of your way"
       is the answer the driver switched modes to get, and a map with it hidden
       is a map they have to judge by eye alone. Bigger than the 11px above for
       the same reason everything on this panel is: it is read at arm's length,
       through a windscreen, at a glance. */
    /* ...and it is CAPPED, in rows, because everything under it is the map.
       The cap used to live in a comment at the mapDrew call — "short on
       purpose, this line is a row of the panel" — and nothing enforced it.
       Measured in this 388px column at 15px, twelve of the twenty-one forms
       this caption can take ran past one row — ten of its branches, seven a
       fixed string and three built round a value. The worst is not any of
       the ones AUDITS counted: the misread-name line interpolates a place
       read off a card, bounded only by the parser's MAX_PLACE of 60, so it
       ran to 171 characters and FOUR rows here and SIX on the 3.5" hat,
       where it left the map 104px — under the 120px this suite's own check
       calls a map rather than a texture, on the only sentence no check had
       ever been given.

       Two rows, and the number is measured rather than chosen: it was set
       by the detour line with the age-of-fix hedge it carried then — "+3.2 mi
       out of your way — straight lines, not roads, from where you were 12 min
       ago" — which was two rows here. That hedge went when the figure began
       to be measured from the card's own fix; the longest line now is a pin a
       card contradicts, "wrong pin for McDonald's — 21.8 mi from you, past
       the card's 9.4 mi (rig-corrected)", and rpi/test_layout.py holds it
       whole inside two rows at its widest. Three rows would be spending map
       on sentences that explain why there is no figure. The hat takes three
       for the same reason and no other: in a 228px column that line keeps
       everything before its `, past` clause only with a third row, and a
       hedge clipped off a number is this project's first fault class.

       Clamped rather than hidden, so the ellipsis says that something was
       cut. What it cuts is always the tail, and these lines are written
       load-bearing end first — figure, then the straight-line warning, then
       the count of places with no pin; a card's figure travels with its
       hedge in the `, past` clause, so the two are cut together or not at
       all, behind "wrong pin for", which no clamp reaches. */
    #viewWrap:has(#liveMap:not([hidden])) #viewNote {
      /* `block` first and on its own line, and it is not decoration. The rule
         above this one is `display: none`, and a browser that does not know
         `-webkit-box` drops that declaration and keeps the none — which would
         take the caption off the glass entirely to save it from being two rows
         too tall. Stated twice, the worst case is an uncapped row. */
      display: block;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      overflow: hidden;
      font-size: 15px; color: var(--text); padding: 5px 0 0;
    }
  }

  /* Smaller again, and the arithmetic behind the headline gives up most of its
     room: the verdict, the rate and the figures off the card are what a glance
     needs, and the sum that connects them can be checked on a bigger screen
     when parked.

     Most of it, not all of it. This hid the working outright, and the working
     is the only place on this page the raw $/hr appears — so between here and
     the notice rule above there were two separate ways for that figure to be
     absent and nothing on screen to tell either of them from a number the page
     had failed to work out. What survives is the one line that is not written
     anywhere else; the net line goes, because it is the headline in small type,
     and so does the pay-and-time half of the raw line, which is a check against
     the card rather than a figure. */
  @media (orientation: landscape) and (max-height: 380px) {
    /* One more row for the caption, and the reason is the figure rather than
       the room. This column is 228px, and the line for a pin a card
       contradicts takes a third row in it to reach its `, past` clause — so a
       two-row cap here would ellipsise the place or the map's figure. Measured when the cap was set, the third row cost the map
       155px instead of 172px, and the check under it wants 120. */
    #viewWrap:has(#liveMap:not([hidden])) #viewNote { -webkit-line-clamp: 3; }
    .working .net { display: none; }
    .working .raw span:first-child { display: none; }
    .working .raw i { font-style: normal; }
    /* `=` opens a sum whose left-hand side is no longer on screen. */
    .working .raw i:first-of-type { display: none; }
    .working { font-size: 11px; margin-top: 2px; }
    /* This was `#detail { display: none; }`, and #detail is not only the
       diagnostics. It is also how old the reading is — the one figure on this
       page a driver acts on continuously, since it is what says whether the
       numbers belong to the card in front of them or the one before it — and,
       when there is no card, the whole of what the page has to say: "nothing
       from the scanner for 40s — it may have stopped", and the aiming
       instruction "move the mount until this says good". So the 3.5" hat was
       the one screen with no way to tell a stopped scanner from a quiet one and
       no instructions for pointing the camera, which is exactly backwards: it
       is the screen with the least room to work anything out.

       The diagnostics — the read time, the leg count, the tracker's drift —
       genuinely have no room here, and they are all questions for a parked
       driver on a bigger screen. They go; the line stays. */
    #detail .diag { display: none; }
    /* And it costs what it costs, so it costs as little as possible: the
       verdict is the row's other occupant and every pixel this line takes comes
       out of it. At the shared 12.5px/1.5 that was 16px, enough on its own to
       push the headline off the glass. Ten. The three rules below are where it
       is paid for. */
    #detail { font-size: 10px; line-height: 1; margin: 0; }
    /* On a panel this small a notice and the figures cannot both fit, and the
       notice wins: it is there because something is wrong with the reading, so
       the four numbers underneath it are the ones not to trust. The headline
       and the reason for doubting it are the pair worth keeping.
       Said "three" until $/mi joined the row, three lines from the edit that
       added it. On the current week the pair never actually collides — 0 of the
       222 go-or-warn cards carry a notice, because `milesUncertain` is down to
       4 in 1,166 — so this hides nothing today and the count still has to be
       right, because the day it fires is the day nobody is reading the CSS. */
    #verdict:has(#warn:not([hidden])) .submetrics { display: none; }
    /* ...and hiding the figures is not enough on its own, which took measuring
       to see. A card can carry three notices at once — a distance that could not
       be read, an hour worked out without one, and a journey still arriving —
       and on this panel that is a 139px block of prose inside a 191px verdict.
       The verdict is a centred flex column, so the overflow went out BOTH ends:
       the headline sat 2px above the glass and the word PASS 25px above it,
       clipped away by #app. The one screen where a driver has the least room to
       work anything out was the one that answered a three-note card by hiding
       its own verdict, and nothing said so.

       There is no rule here for it, which is the point of saying so here: it is
       settled for every panel by `.live #verdict > #warn` above, and this panel
       is where that rule earns its keep. With the figures hidden the card has
       83px left and the three notes want 127, so on the 3.5" hat — and only
       there — the reason for the doubt is a line and a bit plus a scroll.
       Smaller type was tried and is not in this file: at 11px the same notice
       still scrolls, so it bought a fraction of a line and a claim nothing
       could check. Nothing on this panel closes a gap of four lines. The
       alternative was the verdict itself leaving the screen. */
    /* The other half of the same measurement, on a card with no notice at all.
       The verdict's column on this panel is 191px and the four card figures
       took 78 of it: the block is `minmax(74px, 1fr)` columns, the verdict here
       is narrow because the phone picture has the width, so only two columns
       fit and the four figures wrapped to two rows of a value stacked over its
       label. 184px of content in 173px of room, centred — so the verdict label
       was painted over the top border of its own card and the address over the
       bottom one, and with a pair on screen the stack line was outside the box
       entirely.

       Value beside label rather than above it. Two rows of one line instead of
       two rows of two: 41px rather than 78, which is 37 handed back to a column
       that was 11 short. Nothing is dropped and nothing is smaller — "8.00 PAY"
       reads as readily across a car as "8.00" over "PAY". */
    #verdict .sub { flex-direction: row; align-items: baseline;
                    justify-content: center; gap: 5px; }
    /* And the last of it off the headline, only when there is a pair. A second
       job in the car puts the stack line under everything else, and that is the
       one row on this page a driver presses; this panel already asks the
       headline to give up 19px of its 77 so it fits, and with the age back on
       the glass it gives up the same again. 38px is still four times the size
       of anything else in the card, and the alternative was that row hanging
       outside the box it belongs to, which is where this started.

       Only when there is a pair, because a pair is the only card where it is
       true: nothing else on this panel needs it, and a headline permanently
       smaller to pay for a line that is usually not there would be the same
       mistake in the other direction. */
    #verdict:has(#stack:not([hidden])) #perHour {
      font-size: min(8vw, calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
    /* The phone layout above gives the picture every row so that on an
       800x480 panel the phone stands 468px tall. On the 3.5" hat that left the
       verdict a 279px column, and measured with a phone on the glass: the
       five-button bar wrapped to 74px, the verdict's row came out 192px for
       205px of content before any pair was on screen, and with a pair the
       stack line — the one row a driver presses — was painted under the
       connection line, where nothing could reach it.

       So here the bar and the connection line take the width back, which
       puts the five buttons on one line, and the picture keeps the row that
       is left: 122x211 rather than 177x314, on a screen where the verdict is
       still the reason it is there. The headline gives up 19px of its 77 and
       the working line its padding so the pair fits under them: 199px of
       content inside the verdict's 207px, with the stack line in its own box
       and every chip on it reachable. */
    body.phoneview .connbar, body.phoneview .bottombar { grid-column: 1 / -1; }
    body.phoneview #viewWrap { grid-row: 1; }
    #perHour { font-size: min(12vw, calc((100cqw - 40px) / (var(--chars) * 0.62))); }
    .working { padding: 0 0 2px; }
    /* The pair line leads with its range, larger, and here the range and the
       ENDS chip and the route link cannot share a row: the link goes to a
       second one. At its 34px that row put the word PASS 5px over the card's
       top border beside the phone, so on this panel the link is as tall as
       its words and their padding (24px) and the row gaps are halved. Still a
       wide target, which is what a mouse at a light needs (see .maplink). */
    .stackline { margin-top: 3px; row-gap: 2px; font-size: 13px; }
    .stackline .maplink { min-height: 0; padding: 3px 8px; }
    /* The answer on the card (#way) has no row to be given here: the pair's
       card beside the phone was 6px inside its border without it and 18px
       past it with it, the word PASS the part that went (rpi/test_layout.py,
       measured). So here it takes the address line's row — the one this line
       answers for at a glance: where the new job is against the run the car
       is on (an Open entry in AUDITS.md, since the owner's 17 Oct decision
       that an offer's ends are decision information) — and is
       set in the pair line's 13px and as tight, which together leave the
       card as it was. */
    #verdict:has(#way:not([hidden])) .places { display: none; }
    /* ...and so the same-store note (sameNote) cannot ride the address line
       here, which the answer on the card puts away. It goes on the pair
       line's first row instead, which on this panel holds the range alone
       (the ENDS chip and the link are on the second): a third track of the
       sum, after the words that give way, in its short form — "same store
       ①", "same store" — since beside the scene picture the row has 86px
       past the range and "same store as in car" is 110. Never both. */
    #places .same, #places .withsame > .sp { display: none; }
    .stackline .sum.withsame { grid-template-columns: auto minmax(0, max-content) auto; }
    #stack .sum .same { display: inline; font-size: 0.88em; }
    .live:not(.driving) .wayline { margin-top: 2px; font-size: 12px; line-height: 1.2; }
    /* ...and the headline as the pair has it here, not the panels' 18dvh. */
    .live:not(.driving) #verdict:has(#way:not([hidden])):not(:has(#warn:not([hidden]))) #perHour {
      font-size: min(8vw, calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
  }

  /* The number is sized to the panel and to how many characters it has to
     hold. A fixed 180px fits "$25" and runs "$41.6" off the edge — which is
     what a real offer did on a wide screen, pushing the "/hr" past the border.
     Sized against the panel rather than the viewport because the panel is what
     it has to fit inside. */
  .verdict { container-type: inline-size; }
  .big .rate-value {
    --chars: 4;
    font-size: min(28vw, 180px, calc((100cqw - 70px) / (var(--chars) * 0.62)));
  }
  /* Nothing to report: a 180px "--" is a pair of grey slabs, not information,
     and a row of dashes under a rule reads as a table that failed to load.
     Between offers the panel says only what it knows, which is the phase. */
  .verdict.novalue .rate,
  .verdict.novalue .submetrics { display: none; }
  /* The headline is the one number that cannot be shown here. $1184 over twenty
     minutes is $3548/hr, and at that size, in that position, it is read before
     the label above it is. The card's own pay, time and distance stay below,
     because those are what the driver checks against the phone in their hand. */
  /* The working goes; the rate keeps its box and shows nothing. */
  .verdict.doubt .working { display: none; }
  .verdict.doubt .rate-value { color: var(--doubt); }
  /* A rig that cannot see — see `blind` in the script. Red, because it is the
     one state on this page where the rig is not working at all, and red only
     where PASS is not: no red fill but the page's own black, a dashed border
     where every verdict's is solid, a warning sign where PASS has its cross,
     and words that are not a verdict. The line under it is red as well, on
     that black at 6.15:1 — the instruction is half the warning. Here and not
     in styles.css: the keypad and the phone's scanner have no camera of the
     rig's to lose. */
  .verdict.blind { background: var(--bg); border-color: var(--no);
                   border-style: dashed; }
  .verdict.blind .verdict-label { color: var(--no); }
  .verdict.blind .verdict-label::before { content: '\26A0\00a0'; }
  .verdict.blind .notice { color: var(--no); }
  .stale { opacity: .35; }
  /* Diagnostics, not a heading. It was uppercase with wide tracking, which
     made a line of read timings shout louder than the verdict above it. */
  .pending { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  /* ...except the age, which is not a diagnostic. On a panel beside a phone
     being worked with a mouse, "does this rate belong to the card in front of
     me or the one before it" is the question the whole line exists to answer,
     and it is answered in seconds. Full-strength text at the front of a dim
     line, so it reads without being read. */
  .pending .age { color: var(--text); font-weight: 700; }
  .connbar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; color: var(--muted); padding: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--no); }
  .connbar a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
  /* The connection state keeps its width and the shift line gives way.
     Both are flex items on one row; without this the longer shift line
     wraps "no Pi scanner on this machine" onto two lines, which is the
     message that matters most at the moment it is hardest to read. */
  #conn { white-space: nowrap; flex: 0 0 auto; }
  /* One line, and it gives way rather than widening the row. `min-width: 0`
     because a flex item will not shrink below its content without it, and this
     row sits on a panel the page is held to fitting — a long shift line that
     pushed the row wider would scroll the whole screen sideways. No colour of
     its own: it inherits the row's muted grey, which is what a fact you glance
     at rather than drive by should look like beside a verdict. */
  #shift {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #shift[hidden] { display: none; }
  /* 📷 Snap, on the status row — the markup says why it is here. It is drawn
     as a quiet outlined camera in the row's own grey and size, because it is a
     thing for a parked driver and must not compete with the verdict.

     IT COSTS THE ROW NO HEIGHT, and that is the property the placement rests
     on. The boundary is an inset shadow rather than a border, so it takes no
     room; the padding that makes it a target taller than its own text is
     handed straight back by an equal negative margin, so the row is laid out
     as if the button were bare text. The extra height lands in the row's own
     padding, which is there anyway. rpi/test_layout.py measures the row and
     every control on the bar with this and without it, at all six panels.

     WHAT IT DOES COST IS WIDTH, and it comes out of the shift line, which is
     the item on this row that gives way. The first thing on the shift line is
     its median — "-$17/hr an offer", ellipsised from the tail on a budget
     already measured to the character (see showShift) — so the question is
     whether those digits still reach the glass. rpi/test_layout.py measures
     it with the widest real shift line beside the longest connection line
     the row says in ordinary use ("nothing from the scanner for 300s"), with
     its phone picture in the other column: at 800x480 the whole label
     "📷 Snap" cuts the digits by 16px, and the camera alone leaves them 22px
     to spare. So the word is not painted. It is still in the button, for a
     screen reader, and on its title for a mouse resting on it. */
  #snap {
    appearance: none; font: inherit; color: inherit; background: transparent;
    border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 8px;
    padding: 4px 8px; margin: -4px 0; line-height: inherit;
    flex: none; white-space: nowrap; cursor: pointer;
  }
  /* "…": the rest of the status row (fillMore). Drawn as 📷 is and costing
     the row no height for the same reason; the one thing on the row that is
     always drawn after the figures, so the row can be short. 48px wide where
     the row has the room, which is every panel's rule for a glyph pressed in
     a car. */
  #more {
    appearance: none; font: inherit; font-weight: 700; color: var(--text);
    background: transparent; border: 0; box-shadow: inset 0 0 0 1px var(--line);
    border-radius: 8px; padding: 4px 7px; margin: -4px 0; line-height: inherit;
    flex: none; cursor: pointer;
  }
  #more[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--text); }
  /* "scanner reading" is said by the green dot (showConnection). */
  #conn.steady { display: none; }
  /* The separator before the shift line, when something stands before it. */
  #shift::before { content: '\00b7\00a0'; }
  .connbar:has(#conn.steady):has(#health[hidden]) #shift::before { content: none; }
  .moresheet {
    position: fixed; left: 8px; right: 8px; bottom: 72px; z-index: 38;
    padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel-2); color: var(--text);
    font-size: 15px; line-height: 1.4;
  }
  .moresheet[hidden] { display: none; }
  .moresheet a { color: inherit; }
  .moresheet .m-health, .moresheet .m-conn { color: var(--muted); }
  #snap .word { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
                overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* What the press kept, said on the control itself. It can be a sentence —
     "saved — no screenshot: grim is not installed" — so while it shows, the
     shift line stands down to give it the row, and what still does not fit
     ends in an ellipsis rather than widening the page. The whole of it is on
     the control's title, and every snap's full account is on snaps.html. */
  #snap.said { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .connbar:has(#snap.said) #shift { display: none; }
  #snap.failed { color: var(--no); box-shadow: inset 0 0 0 1px var(--no); }
  #snap[disabled] { cursor: progress; }
  /* ...and not drawn at all on a row too narrow to give it the width.

     The same measurement decides it everywhere: drawn wherever the median's
     digits still reach the glass with the camera beside them, and nowhere
     else. A figure cut to make room for a camera button is this project's
     first fault class bought for a convenience, so a row without the width
     keeps its figure.

     So the rule is the row's own width, asked of the row: it is a container,
     and the camera goes below the width at which it starts to cut the digits.
     That is 464.5px of row in landscape, where the row is set at 15px, and
     384.5px in portrait, at 12px — the row's content box, inside its 4px and
     8px padding — measured by widening the screen a pixel at a time until
     the digits came clear (765 to 766 wide at 480 tall, content boxes of
     463.98 and 464.98px; 420 to 421 upright, 384 and 385). That is with the
     row as it is since the rest went behind "…": the widest short line,
     "✓10 $141 · -$17/hr an offer", beside "nothing from the scanner for
     300s" and "…". (It was 476 and 389 with the whole line on the row and
     no "…".) The screen's size was the rule before, as a stand-in, and it
     was wrong both ways: it hid the camera from rows with room for it (a
     tablet upright at 768x1024, 44px to spare now; a phone on its side at
     740x360, whose median is not cut at all) and drew it over digits it cut
     (700x400, by 19px now); and it drew it on a phone held on its side at
     844x390, which the words beside it said it would not.

     Measured with the short line, the spare is to the end of the line where
     nothing is cut: 800x480 keeps 32px to spare with it, 1024x768 14 (its
     row is 18px there), 1024x600 and 1280x800 the whole of " an offer". The
     3.5" hat (8px short) and a phone held upright (29 short) do not draw it;
     snaps.html carries the same press for them, reached from the offers
     page. A phone on its side does draw it, and what it photographs from
     there is the rig's display, not the phone's — the same as snaps.html's
     press, and the control's title says so. */
  .connbar { container: connrow / inline-size; }
  @media (orientation: landscape) {
    @container connrow (width < 464.5px) { #snap { display: none; } }
  }
  @media (orientation: portrait) {
    @container connrow (width < 384.5px) { #snap { display: none; } }
  }
  /* What the rig says about itself — the GPS, a throttling Pi — between the
     two. Same one-line rule as the shift line, and it outranks it: the shift
     line gives way first and this one only once that is gone. An ellipsis,
     never a clip, so a note cut on a narrow screen still says that something
     was cut. Muted like the rest of the row — a fact for the next stop, not
     something to drive by.

     The shrink is a weight, not a priority, and it is weighted by width: at
     equal weights a 209px note gave up 1px of itself beside a 370px shift line
     on the 800x480 panel, and an ellipsis took its last letter. A million to
     one leaves this note under a thousandth of a pixel of any overflow the
     shift line can still absorb, which no renderer draws.

     The million is put on THIS note's resistance, not on the shift line's
     eagerness. Set as `#shift { flex-shrink: 1000000 }` it also made the shift
     line give way to the connection text beside it, which it had shared with
     at equal weight, and on a phone held upright the median lost a pixel —
     measured, -1px at 390x844 with the 📷 control not drawn, against 4px to
     spare before. With the weight here, the shift line and the connection
     text share as they always did, and only this note holds out. */
  #health {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #health[hidden] { display: none; }
  #health { flex-shrink: 0.000001; }
  /* The heat guard's chip, at the front of the note (heatNote): the
     notices' outline and weight in the row's own grey, a fact for the next
     stop like the rest of the row. Inline, as the map caption's chips are, so
     its outline is drawn round the text and the row is not one pixel taller
     for it; rpi/test_layout.py holds the row and the bar where they were. */
  #health .chip {
    padding: 0 6px; border: 1px solid currentColor; border-radius: 999px;
    font-weight: 700;
  }
  .dot.on { background: var(--go); }
  #viewWrap { margin: 0; }
  /* The camera's picture and nothing else: `>`, the one <img> that is the
     pane's own child. Written `#viewWrap img`, every rule for the picture
     reached into the map in the same pane too, and Leaflet draws its tiles
     as <img>s: each 256px tile got this 1px border in --line and 14px round
     corners. On the glass that was a grid of long slate lines across the
     map, one tile apart, and a dark four-pointed star wherever four tiles'
     rounded corners met — the "lines crossing the map" a driver read as
     roads, with the star by the car. rpi/test_dashboard.py puts a tile in
     the map and holds its border and corners at zero. */
  #viewWrap > img {
    width: 100%; display: block; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel);
  }
  #viewWrap > img.stalefeed { opacity: .4; }
  /* `display: block` above is an author rule and the browser's own
     `[hidden] { display: none }` is not, so setting .hidden on the picture did
     nothing at all to it. In map mode the img went on taking the pane — it is
     `width: 100%` — and the map grew to the two pixels of its own border,
     which is a map-shaped border and no map. */
  #viewWrap > img[hidden] { display: none; }
  #viewNote { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 0 0; }
  #viewWrap.gone > img { display: none; }

  /* The map mode, in the same pane and the same shape as the picture it
     replaces, so switching between them does not move the rest of the page.
     A min-height because a Leaflet map in a box of zero draws one tile in the
     corner and nothing else, and on a phone the wrapper has no height of its
     own to give it. */
  #liveMap {
    width: 100%; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel);
  }
  /* Stacked down the page, the pane has no row to take a height from and a
     Leaflet map in a box of zero draws one tile in the corner — so the map
     needs a height of its own here. Portrait only, and deliberately: the
     landscape layout gives it the row and a min-height written once for both
     wins over that rule by coming later in the file. Measured, not reasoned
     about — 240px inside a 200px row at 480x320 pushed the bar of controls
     clean off the glass, and `overflow: hidden` on #app means nothing reports
     it. The driver just cannot reach the button that would put the map away. */
  @media (orientation: portrait) { #liveMap { min-height: 240px; } }
  #liveMap[hidden] { display: none; }
  /* Leaflet's own default is white, which on this panel is a flash of daylight
     at a red light before the tiles land. */
  #liveMap .leaflet-container { background: var(--panel); }
  /* The night palette (showNight in the script): after civil dusk at the
     car's position. The words and labels dimmer and closer to the page —
     the words from #eef4fb to #c3cfdb (17.4:1 on the page to 13.3), the
     labels from #9fb3c9 to #8ea0b4 (8.9 to 7.8) — the page black, the card
     a shade darker, and the four verdict fills darker in the same order, so
     the ladder that carries the verdict without colour still runs
     brightest to darkest. The verdict words keep their colours: they are
     the verdict. Every pair is held by rpi/test_layout.py to the day's own
     readability floors, read out of this rule. */
  html.night {
    --bg: #000000;
    --panel: #222e3d;
    --panel-2: #263243;
    --line: #4e637b;
    --text: #c3cfdb;
    --muted: #8ea0b4;
    --go-dim: #0d5530;
    --warn-dim: #5c3e06;
    --no-dim: #3f0b14;
    --doubt-dim: #30254a;
  }
  /* ...and the map's tiles darker again under the same filter, half the
     day's brightness, so the map is not the brightest thing in the car. */
  html.night #liveMap .leaflet-tile-pane { filter: saturate(.25) brightness(.45) contrast(.9); }
  /* The tiles muted, so what this page draws is what the eye lands on. OSM's
     standard style is drawn to be read on its own, in full colour: motorways
     red and orange, parks green, every road cased — and on it a 3px orange
     run and a 9px pin were one more road and one more dot. Desaturated and
     a little darker, they sit back on the dark panel as the ground under the
     marks. The pane only: the marks, the key and Leaflet's own controls are
     not filtered. The same tiles from the same host; nothing else asked. */
  #liveMap .leaflet-tile-pane { filter: saturate(.3) brightness(.78) contrast(.9); }
  /* P and D on the pins (drawMap's put): the letter centred on the dot,
     bold, dark on a solid pin and white on a ring, deaf to the pointer so
     the dot under it still opens its popup. */
  #liveMap .mv-letter { display: flex; align-items: center; justify-content: center;
                        font: 700 13px/1 'DejaVu Sans', sans-serif; color: #0b0d10;
                        pointer-events: none; background: none; border: 0; }
  #liveMap .mv-letter-ring { color: #fff;
                             text-shadow: 0 0 2px #0b0d10, 0 0 2px #0b0d10; }
  /* ...and ✓ on a pickup the car has called at (visitPickups in server.js),
     at the faded dot's strength. */
  #liveMap .mv-done { opacity: .55; }
  /* Drawn for a driver, not for a desk: the popups on this panel are read at
     arm's length and dismissed with a bluetooth mouse. */
  #liveMap .leaflet-popup-content { font-size: 13px; line-height: 1.45; }
  /* The "you are here" label, in the map's top-right corner: Leaflet's zoom
     buttons hold the top-left and its attribution the bottom-right. Above
     Leaflet's own panes (its controls sit at 800 and 1000), clear of the zoom
     buttons by the max-width, and allowed to wrap rather than ellipsise,
     because what an ellipsis would eat is the error figure or the age. Grey
     with the dot when the fix is older than gps.py's staleness rule.
     rpi/test_layout.py holds it inside the map at 800x480, 1024x600 and
     480x320. */
  /* Leaflet's zoom buttons, which are pressed in the car: 48px square, where
     Leaflet draws 30. Whole here — display, width, height and line height —
     so the size is this rule's and not Leaflet's stylesheet's, which arrives
     from the CDN with the map. The bar stays 10px in with Leaflet's 2px
     border, so the column of two ends 62px across and 110px down; the
     "you are here" label and the key are held clear of that, on every
     panel and the 3.5" hat too (rpi/test_layout.py, beside the phone). */
  #liveMap .leaflet-control-zoom a {
    display: block; width: 48px; height: 48px; line-height: 48px;
    font-size: 26px; text-align: center;
  }
  #hereNote { position: absolute; top: 8px; right: 8px; z-index: 1001;
              max-width: calc(100% - 80px); box-sizing: border-box;
              padding: 2px 8px; border-radius: 10px; font-size: 13px;
              line-height: 1.35; color: var(--text);
              background: rgba(11, 13, 16, .85); pointer-events: none; }
  #hereNote.grey { color: var(--muted); }
  #hereNote[hidden] { display: none; }
  /* The key to drawHow's marks, one line across the map's foot, above
     Leaflet's attribution (which keeps the bottom-right corner, 16px) and
     clear of nothing else Leaflet draws. One line and never two: it is read
     in a glance, and rpi/test_layout.py holds it to one row inside the map
     at 800x480, 1024x600 and 480x320, nothing spilling. The glyphs carry the
     colours drawHow uses, so the key is the marks themselves. */
  #liveMap { position: relative; }
  #mapKey { position: absolute; left: 8px; bottom: 18px; z-index: 1001;
            max-width: calc(100% - 16px); box-sizing: border-box;
            padding: 1px 7px; border-radius: 9px; font-size: 12px;
            line-height: 1.35; white-space: nowrap; overflow: hidden;
            color: var(--text); background: rgba(11, 13, 16, .85);
            pointer-events: none; }
  #mapKey[hidden] { display: none; }
  #mapKey .k-disc { color: #7aa2f7; }
  /* The pins' letters, as the pins draw them: a solid badge for this
     offer's, an edged one for the order already in the car. */
  #mapKey .k-pin, #mapKey .k-drop, #mapKey .k-hpick {
    display: inline-block; min-width: 1.15em; padding: 0 1px; border-radius: 50%;
    text-align: center; font-weight: 700; line-height: 1.15; box-sizing: border-box; }
  #mapKey .k-pin { background: #17c964; color: #0b0d10; }
  #mapKey .k-drop { background: #f5a524; color: #0b0d10; }
  #mapKey .k-cand { color: #8a8f98; }
  #mapKey .k-out { color: #8a8f98; }
  #mapKey .k-hpick { color: #fff; border: 2px solid #17c964;
                     background: rgba(23, 201, 100, .35); }
  /* ...and the lines and the numbers, with an order in the car and a card
     on the map: the run already committed to, solid in the order's amber;
     the miles this card adds to it, dashed in violet; and the stops in the
     order the car would call at them, as the pins carry them. */
  #mapKey .k-run { color: #f5a524; font-weight: 700; }
  #mapKey .k-extra { color: #c084fc; font-weight: 700; }
  #mapKey .k-job { color: #2dd4bf; font-weight: 700; }
  #mapKey .k-num { display: inline-block; min-width: 1.15em; margin-right: 1px;
                   border: 1px solid var(--text); border-radius: 50%; text-align: center;
                   font-weight: 700; line-height: 1.15; box-sizing: border-box; }
  /* With the held pickup in it the long form is 388px of words in DejaVu
     Sans at 12px, past the 800x480 map's room: the two long words go
     whenever that item is shown, 320px. :has() rather than a class showKey
     sets, so what rpi/test_layout.py measures — every item shown — is what
     this rule sees. */
  #mapKey:has(.k-item[data-k="hpick"]:not([hidden])) .k-long { display: none; }
  /* ...and with the order's run, the extra and the numbered stops in it
     (drawMap) the short words too, and a second row where the first is full:
     every item at once is past one row of the 800x480 map (two there,
     ending 357 and 116px in). Measured in rpi/test_layout.py, held to two
     rows on every panel, the hat's two included (see its rule below). */
  #mapKey:has(.k-item[data-k="run"]:not([hidden])) .k-long { display: none; }
  #mapKey:has(.k-item[data-k="run"]:not([hidden])) { white-space: normal; }
  /* What a mark of drawHow's says about itself, shown while the pointer is
     on it (or it was tapped): ONE box across the map's foot, over the key,
     wrapped to the map's width — never a Leaflet tooltip beside the mark. A
     refusal with its disc is long (the suite's McDonald's outside a 9.4 mi
     card's disc is 142 characters), and Leaflet puts a tooltip beside its
     mark and lets the map clip it: wrapped at 200px, measured in DejaVu Sans
     with Leaflet 1.9.4's own placement at the mark's every position along
     the map's middle row, up to 92px of its 200 hidden on the 3.5" hat's
     228px map and 12px on the 800x480 panel's 388px one. A box the map places rather than the mark is inside the map
     wherever the mark is; rpi/test_layout.py holds it there, whole, at
     every panel. */
  #mapTip { position: absolute; left: 8px; right: 8px; bottom: 18px;
            z-index: 1002; box-sizing: border-box; padding: 3px 7px;
            border-radius: 6px; font-size: 12px; line-height: 1.35;
            white-space: normal; overflow-wrap: anywhere; color: var(--text);
            background: rgba(11, 13, 16, .92); pointer-events: none; }
  #mapTip[hidden] { display: none; }
  /* The 3.5" hat's map is 228px wide and the whole key 270px at this size,
     so there it drops two words and two pixels of padding a side, and is
     205px in a 216px room: "◯ reach · ● pin · ● found · ○ outside".
     Measured in DejaVu Sans; rpi/test_layout.py holds both forms. */
  @media (max-height: 380px) {
    #mapKey { left: 6px; max-width: calc(100% - 12px); padding: 1px 5px; }
    /* ...and on the hat no form of it with the held pickup fits one row:
       293px of words for 206 (measured, DejaVu Sans 11px). It takes two
       there, and only then, rather than lose a word off its end. */
    #mapKey:has(.k-item[data-k="hpick"]:not([hidden])) { white-space: normal; }
    #mapKey .k-long { display: none; }
    /* ...and the word after the pins' letters: with the P and D badges the
       short key was 226px of words for the 214 the hat's map gives it
       (measured, DejaVu Sans 12px), and the letters say what they are on
       the pins themselves. The same for the word after the numbered
       stops' 1 2, and after the offer's own trip, which its teal says
       beside the run's amber: with it the full key was three rows there
       (measured, rpi/test_layout.py). */
    #mapKey .k-pinword { display: none; }
    /* ...and with the order's run, the extra and the numbered stops in it
       as well that is still three rows (ending 209, 190 and 15px in), the
       last the 1 2 alone: with the spaces round its dots drawn in, two,
       ending 204 and 174px in of 209 (measured, DejaVu Sans 12px) — the two
       it already took, at the size the rest of the hat is held to. */
    #mapKey:has(.k-item[data-k="run"]:not([hidden])) .k-sep { word-spacing: -.2em; }
    #mapTip { left: 6px; right: 6px; padding: 1px 5px; }
  }

  /* Drawing the box to read. The scanner finds the phone by looking for it,
     which is right almost always and useless when it is not — a reflection, a
     second lit screen, a phone with nothing darker around it. There is no
     aiming your way out of those, so the person looking at the picture can say
     where the card is instead. */
  #viewWrap { position: relative; }
  #viewWrap.drawing > img { touch-action: none; cursor: crosshair; }
  #drawn {
    position: absolute;
    border: 2px solid #17c964;          /* the outline the scanner draws, same green */
    border-radius: 4px;
    /* A tint rather than a hole punched in a full-page dim: this page keeps the
       verdict above and the buttons below usable while the box is being drawn. */
    background: rgba(23, 201, 100, .14);
    pointer-events: none;
  }
  #drawn[hidden] { display: none; }
  /* The screen box, held on the picture while the card box is drawn inside it.
     Dashed and untinted, so the two boxes cannot be mistaken for each other. */
  #drawnScreen {
    position: absolute;
    border: 2px dashed #17c964;
    border-radius: 4px;
    pointer-events: none;
  }
  #drawnScreen[hidden] { display: none; }
  #drawTools { display: none; gap: 8px; padding: 8px 0 0; }
  #viewWrap.drawing #drawTools { display: flex; }
  /* .linkbtn is only styled inside .bottombar, and these two are not there. */
  #drawTools button {
    flex: 1;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 6px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
  }
  #drawTools #drawUse:not([disabled]) { background: #0d5c31; border-color: #17c964; color: #d7ffe6; }
  #drawTools button[disabled] { opacity: .45; }
  #drawTools button[hidden] { display: none; }
  #drawHint { font-size: 12px; color: var(--muted); text-align: center; padding: 6px 0 0; }
  /* A label that does not fit is allowed a second line.
   *
   * This said `white-space: nowrap`, written when this bar had four buttons and
   * a phone's width to put them in. It now has six and sits beside the phone
   * picture, so on the panel the rig is bolted to each button is 78px wide —
   * and nowrap plus the default `overflow: visible` does not clip a long label,
   * it *centres* it and paints the ends outside the button. Measured at 17px,
   * which is what the landscape rule below actually renders:
   *
   *   800x480    "Took $12.45?" wants 91px in 78 → driver sees "ok $12.4"
   *              "▣ Set box"    wants 79px in 78 → driver sees " Set bo"
   *   1024x600   "Took $12.45?" wants 104 in 102 → driver sees "ook $12.45"
   *   1024x768   the same
   *
   * A button whose first letters are missing is worse than a small one: "ok
   * $12.4" is not a word, and the word is the half of this label that says the
   * press records a decision already made rather than making one.
   *
   * Wrapping was the answer the shared stylesheet already gave — "clipping
   * 'Camera' to 'Camer' is a worse answer than letting it wrap" — and this
   * rule was quietly overriding it. Measured with the frame on the glass, in
   * both bar populations, at all six panels: every label now renders whole on
   * every landscape panel, the 3.5" hat goes from five clipped labels to three,
   * and the bar grows 52px → 55px only on the panels where something wraps.
   * The page still fits the glass on all of them, the rate figure is untouched
   * at 124.8px, and the verdict gives up 3px to pay for it.
   *
   * `line-height: 1.1` rather than the default: two lines at 1.2 make the bar
   * 59px and there is no reason to spend the extra four. Held by
   * rpi/test_layout.py, which measures what a screenshot would show.
   *
   * ...and THE BAR IS ONE HEIGHT IN EVERY STATE: two of those lines and the
   * padding, set as a height rather than left to the tallest label. Left to
   * the label, the bar was 52px with the four fixed controls (44 on the 3.5"
   * hat), 55px once a "Took $112.45?" wrapped, and 74 or 93px once that
   * button said how old its card was — and back to 55 when the next card
   * came up, so every control on it, and the card above it, moved under the
   * driver's finger twice per offer. Measured on the unchanged page with the
   * widest pay and six controls up: 74px at 1024x600 beside the phone and at
   * 800x480 beside the scene, 93px at 800x480 beside the phone and on the
   * hat in both pictures. So no label here may take a third line at the
   * bar's own size; the Took button, the one with something to add, says it
   * on a smaller line of its own (#took .status, below). On a phone held
   * upright the 52px floor is the taller of the two and holds it instead. */
  .bottombar button, .bottombar .linkbtn {
    font-size: 13px; padding: 10px 4px; line-height: 1.1;
    height: calc(2.2em + 22px);
  }
  #setBox.on {
    background: #0d5c31; border-color: #17c964; color: #d7ffe6;
  }
  /* What has become of the card on record, on a line of its own under the
     label (showTook): how long ago it was recorded once it has left the
     phone (tookAge), "not saved" after a press the journal refused, "in car"
     for the order already taken. It used to ride on the end of the label
     ("Took $112.45? · 59 min ago"), which in a 78px button (71px on the 3.5"
     hat) is four rows, and the bar grew to hold them.

     A tenth smaller than the label: 15.3px, over the 15px floor
     rpi/test_layout.py holds the panels to. Its own line, so it never wraps
     into the label's: the age is written short for it — "59m ago", 59.5px,
     where "59 min ago" was 75.7 against the 67.8px inside the narrowest
     panel's button (60.7 on the hat) — and in hours and days past those, so
     no age is wider. Measured in DejaVu Sans.

     One line, never wrapped: "not saved" is 66.3px against the hat's 60.7
     and takes the padding either side, where wrapped it was a fourth line
     and pushed "Took" and "saved" out of the button.

     Three lines in the bar's height, at line-height 1 with a pixel of padding:
     17 + 17 + 15.3px is 49.3 inside the 53.4 the button has between its
     borders, every glyph inside them (rpi/test_layout.py, at 1024x600,
     800x480 and 480x320 in both pictures). Only while there is such a line;
     the label alone keeps the bar's own spacing. */
  #took .status { display: block; font-size: .9em; font-weight: 500;
                  white-space: nowrap; }
  #took:has(.status) { line-height: 1; padding-top: 1px; padding-bottom: 1px; }

  /* What the reader actually saw. Folded away by default, because it is only
     ever wanted after a wrong answer — and after a wrong answer it is the only
     thing that explains it. */
  #raw { font-size: 11px; color: var(--muted); }
  #raw summary { cursor: pointer; padding: 4px 0; }
  #raw pre {
    margin: 4px 0 0; padding: 8px; white-space: pre-wrap; word-break: break-word;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    max-height: 28vh; overflow: auto; font-size: 11px; line-height: 1.45;
  }

  /* The notices as chips (showNotes in the script): each a rounded outline in
     the notice's own amber, the words bold, so three of them read as three
     things rather than one paragraph. A chip wraps inside itself only when it
     is wider than the card (the 3.5" hat), never off its edge. Tapped open,
     the notice is the sentences again, in the notice's own type. */
  #warn { cursor: pointer; }
  #warn .chip {
    display: inline-block; max-width: 100%; margin: 2px 2px;
    padding: 1px 8px; border: 1px solid currentColor; border-radius: 999px;
    font-weight: 700; line-height: 1.3; white-space: normal;
  }
  /* ...and the map caption's refusals the same way (mapSay, MV.captionChip):
     one chip in the caption's own colour, the sentence a tap away. Inline,
     with its outline cloned onto each row it wraps to, so the caption's row
     clamp counts its rows as it counts a sentence's, and holds a chip to the
     same two rows (three on the hat) — rpi/test_layout.py measures every
     chip there, whole, with the map over its 120px floor. */
  /* Measured without the two rules below, a chip's outline ran out of the
     caption's box, which clips: where a place name in bold is one word wider
     than the column (it may break anywhere instead), and where the padding
     and outline cloned onto a row's end stand past its last glyph (the
     caption keeps their width clear at each side while it holds a chip; the
     sentence, opened, is as it always was). The selector is the clamp's own
     and one class more, or the clamp's padding wins. */
  #viewNote.chipped { cursor: pointer; }
  #viewNote .chip { overflow-wrap: anywhere; }
  #viewNote.chipped:not(.open),
  #viewWrap:has(#liveMap:not([hidden])) #viewNote.chipped:not(.open) {
    padding-left: 8px; padding-right: 8px;
  }
  #viewNote .chip {
    padding: 0 7px; border: 1px solid currentColor; border-radius: 999px;
    font-weight: 700; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }

  /* The Trip Planner's stops, one line each, after a ⌖ press.
   *
   * Only ever drawn between offers (see showStops), when the card holds the
   * phase and the notice and nothing else — the rate and the four figures are
   * `novalue`, above — so there is room in it, and rpi/test_layout.py
   * measures that nothing else on the panel moves for it. `flex: none` like
   * the address line, so a stop is never drawn as part of a line; the notice
   * is not starved by that, because showStops takes lines off the end while
   * the notice is cut. Each stop one line, ellipsised at
   * the end: the kind and the time first, which may not be cut (see
   * stopLine), then the name, then the street, which is the part a driver
   * already has on the phone in front of them. The size is the address
   * line's, `.places`, which this sits where. */
  .stops { margin-top: 6px; font-size: clamp(12px, 3vw, 15px); line-height: 1.35; }
  .stops > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stops[hidden] { display: none; }

  /* The order in the car (showHeld). Between offers, where it goes next in
   * the place WAITING FOR AN OFFER had: the kind and the time in the label's
   * size, the name larger than anything else on the card, up to two lines and
   * then cut, because a restaurant's name runs to fifty characters. Sized on
   * the card (`cqw`, the verdict is the container), not the screen, because
   * the card is half the screen or less. */
  .heldnext { margin-top: 2px; }
  .heldnext .when {
    font-size: clamp(16px, 6cqw, 32px); font-weight: 800;
    letter-spacing: .04em; color: var(--muted);
  }
  .heldnext .where {
    font-size: clamp(20px, 9cqw, 48px); font-weight: 800; line-height: 1.15;
    color: var(--text); overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .heldnext[hidden] { display: none; }
  /* ...and its one line. While a card is being read, or the rig is blind,
   * it is the card's last line, at the address line's size: the pay and the
   * GPS drop's state whole (`flex: none`), the next stop the part that gives
   * way, as the pair line's words do. (With a verdict up it is under the
   * card instead: `#detail .held`.) Between offers it is under the name,
   * larger, and may take a row each for the pay and the state where the card
   * has the height and not the width — the 3.5" hat beside the scene, whose
   * card is 228px across. */
  .heldline {
    display: flex; justify-content: center; gap: .35em; margin-top: 6px;
    font-size: clamp(12px, 3.2cqw, 16px); font-weight: 700;
    color: var(--muted); white-space: nowrap;
  }
  .heldline .pay { color: var(--text); }
  .heldline .pay, .heldline .gps { flex: none; }
  .heldline .stop { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .heldline .stop[hidden] { display: none; }
  .heldline.between { font-size: clamp(15px, 4.4cqw, 22px); margin-top: 8px; flex-wrap: wrap; }
  .heldline[hidden] { display: none; }
  #heldLine, #heldLine2, #detail .held { cursor: pointer; }
  /* ...and the same line under an offer, after the reading's age in place of
   * the diagnostics (showHeld says why it is not in the card). One row: the
   * age, the pay and the GPS state whole, the stop the part that gives way. */
  #detail.withheld { display: flex; justify-content: center; white-space: nowrap; }
  #detail.withheld .age { flex: none; }
  #detail.withheld .diag { display: none; }
  #detail .held { display: flex; min-width: 0; gap: .3em; margin-left: .3em; }
  #detail .held .pay { flex: none; color: var(--text); font-weight: 700; }
  #detail .held .gps { flex: none; }
  #detail .held .stop { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* TWO ORDERS IN THE CAR (carrying two on: carryTwo in server.js). One
   * compact line each — "① $9.48 → Kestrel Dr · ● armed" — in the in-car
   * line's own style (#heldLine is ①, #heldLine2 is ②), and under them, when
   * the rig has read addresses it cannot give to either, how many: "2
   * dropoffs read · whose?", in the doubt colour, because it is a question
   * and not an answer. See showHeld. */
  .whose { color: var(--doubt); }
  .whose[hidden] { display: none; }

  /* The chooser: whose is the address a ⌖ press read, or which order Drop
   * puts down, when the rig will not guess (whoseDropoff, dropDecides in
   * server.js). A sheet OVER THE VERDICT PANE — never a control on the bar,
   * which holds six (AUDITS.md, Settled) — with a row per answer, 96px tall
   * where the pane has the height (1024x600, 800x480) and no shorter than the
   * bar's own 52px where it does not (the 3.5" hat), measured in
   * rpi/test_layout.py. It closes on its own after ten seconds with nothing
   * filed; that is the server's rule too (CHOOSER_MS). */
  .chooser {
    position: fixed; left: 8px; right: 8px; top: 8px; z-index: 40;
    display: flex; flex-direction: column; gap: 6px; padding: 8px;
    background: var(--panel); border: 2px solid var(--doubt); border-radius: 14px;
    min-height: 0; overflow: hidden;
  }
  .chooser[hidden] { display: none; }
  /* ...and holding one line, what became of the press (chooserSays): as
     tall as the line, at the top of the pane, not over the whole verdict. */
  .chooser.said { align-self: start; }
  .chooser .ask {
    flex: none; font-size: clamp(13px, 2.2vw, 19px); font-weight: 700; color: var(--doubt);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chooser button {
    flex: 0 1 96px; min-height: 52px; padding: 0 14px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: clamp(17px, 3.2vw, 30px); font-weight: 800;
    display: flex; align-items: center; white-space: nowrap; overflow: hidden;
  }
  /* The number and the pay whole; the street is the part that gives way —
   * it is what the driver already has on the phone, and "① $9.48" is the
   * answer the row stands for. Measured in rpi/test_layout.py. */
  .chooser button .who { flex: none; }
  .chooser button .end { min-width: 0; overflow: hidden; text-overflow: ellipsis;
                         margin-left: .3em; color: var(--muted); }
  .chooser button.none { flex: 0 1 52px; font-size: clamp(15px, 2.4vw, 22px);
                         font-weight: 700; color: var(--muted); }
  /* ...and the Undo a Took that ADDED an order offers for five seconds: the
   * same press the Took button makes pressed again (an untick), for the
   * order the Took added and no other. Over the foot of the verdict pane.
   *
   * The status row's "…" sheet sits over the same foot, and the two were
   * drawn one on top of the other: "…" pressed in the five seconds after a
   * Took that added an order put the sheet under the Undo, and measured
   * that way the centre of the sheet and of every line in it landed on the
   * Undo, at 1024x600, 800x480 and 480x320 in both pictures and on the
   * phone — the sheet unreadable where they crossed and untappable, with
   * nothing saying so. Now they STACK: the Undo keeps its place, where the
   * thumb that pressed Took finds it, and the sheet rides above it by the
   * Undo's height and a gap while the Undo shows. One fixed height,
   * --undo-h, so the offset is the box and not an estimate of it.
   * rpi/test_layout.py measures both whole, apart, and each the element its
   * own centre hits, on those four. */
  :root { --undo-h: 52px; --undo-gap: 6px; }
  .undo {
    position: fixed; left: 8px; right: 8px; bottom: 72px; z-index: 39;
    height: var(--undo-h); padding: 0 14px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: clamp(15px, 2.4vw, 22px); font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .undo[hidden] { display: none; }
  @media (orientation: landscape) {
    /* In the verdict's own grid cell, over it: column one, row one. */
    #app > .chooser, #app > .undo {
      position: relative; left: auto; right: auto; top: auto; bottom: auto;
      grid-column: 1; grid-row: 1; margin: 0;
    }
    #app > .undo { align-self: end; }
    #app > .moresheet {
      position: relative; left: auto; right: auto; bottom: auto;
      grid-column: 1; grid-row: 1; margin: 0; align-self: end;
    }
    /* ...above the Undo while it shows (see .undo). */
    #app:has(> .undo:not([hidden])) > .moresheet {
      margin-bottom: calc(var(--undo-h) + var(--undo-gap));
    }
  }
  /* Upright, both are fixed to the glass: the same offset as a lift. */
  @media (orientation: portrait) {
    body:has(#undo:not([hidden])) .moresheet {
      bottom: calc(72px + var(--undo-h) + var(--undo-gap));
    }
  }
  /* The pair line with two orders in the car and carrying two turned OFF
   * (two read back from a hold file at boot): weighed against ① alone, and
   * it says so. Whole, like the chip beside it: a range that does not say it
   * ignores an order in the car is the confidently wrong number. With
   * carrying two on the range is against both (Stage 6), "with ① + ②". */
  .stackline .vs { flex: none; margin-left: .35em; color: var(--doubt); }
  /* ...and with it on, "with ① + ②": the same slot, whole, in the row's own
   * colour — it names what the range covers and doubts nothing. */
  .stackline .both { flex: none; margin-left: .35em; }
  /* "same store as ①" at the head of the address line (sameNote): in the
   * card's own text colour where the addresses are muted, so it is read
   * before them, and bold like the pair line above it — but no chip, no
   * fill, no verdict colour: a fact about the pickup, never a verdict. */
  #places .same { color: var(--text); font-weight: 700; }
  /* ...and its short form on the pair line, drawn only on the 3.5" hat (see
     the rule there); everywhere else the address line has it. */
  .stackline .sum .same { display: none; color: var(--text); }
  /* The answer on the card (showWay, MV.sayWay): under the pair line, one
   * line, Map view's caption figure in it.
   *
   * NO VERDICT COLOUR, and nothing that reads as one. The card's own text and
   * muted greys, the card's own line colour round the call, no fill, and the
   * same for all four forms: ON THE WAY is not green, OUT OF THE WAY not
   * amber, CAN'T TELL not the doubt violet. The verdict ladder is the
   * headline's and nothing on this line may borrow it (Settled: no verdict
   * colour on the pair line, the colour the pair row lost when 45 of its 71
   * greens sat under offers that failed the target). Only the words say
   * which, which is also why the call is in an outline and not a filled
   * block: a filled block on this card is a verdict's panel.
   *
   * The call and the figure, or a refusal's state ("NO PIN"), never shrink;
   * the ends, and what a refusal is about, are what an ellipsis takes, with
   * the whole sentence one tap away (MV.wayLine's `keep`). */
  .wayline { display: flex; align-items: baseline; justify-content: center;
             gap: 0 .3em; margin-top: 4px; font-size: clamp(12px, 3.2vw, 16px);
             font-weight: 600; color: var(--text); white-space: nowrap;
             min-width: 0; cursor: pointer; }
  .wayline[hidden] { display: none; }
  .wayline .call { flex: none; padding: 0 .35em; border: 1px solid var(--line);
                   border-radius: 4px; font-weight: 700; letter-spacing: .02em; }
  .wayline .fig, .wayline .why { flex: none; }
  .wayline .more { min-width: 0; overflow: hidden; text-overflow: ellipsis;
                   color: var(--muted); }
  .wayline.way-wait .call { color: var(--muted); border-style: dashed; }
  .wayline.open { display: block; white-space: normal; color: var(--muted);
                  font-weight: 400; text-align: center; }
  .live #verdict > .wayline { flex: none; }
  /* ...and on a card too narrow for the call and the widest figure side by
     side, "OUT OF WAY" and "ON WAY", set closer: the 3.5" hat's card beside
     the scene picture gives the line 208px, and OUT OF THE WAY · +18.8–19.2
     road mi took 226.8px of it at the hat's 12px (DejaVu Sans, measured) —
     a figure cut short, or a second row the card does not have. Without the
     word, 198.5px parked and 206.7 driving at 12.5. The word that goes is
     the one that says least; the figure is never cut. #verdict is the
     container. */
  @container (max-width: 260px) {
    .wayline { gap: 0; }
    .wayline .the { display: none; }
    .wayline .call { padding: 0 .2em; }
  }

  /* ---------- Sizes for the driver's seat ----------
   *
   * Last in the file on purpose. Everything above is written for a phone held
