      color: held ? colour : '#0b0d10',
      fillColor: colour, fillOpacity: ring ? 0.35 : 1
    }).bindPopup('<b>' + esc(label) + '</b>'
                 // What the CARD called it. In map mode the verdict pane is
                 // not on the glass, so these popups are the only place the
                 // names appear at all — and "pick this one up" over an
                 // unnamed dot is a map a driver cannot check against the card
                 // they are looking at on the phone.
                 + (name ? '<br>' + esc(name) : ''));
  }

  /* Take the pins down without drawing new ones. Its own function because two
     paths need it and neither of them reaches drawMap: a card that names
     nowhere, and a map that could not be loaded at all. */
  function clearMap() {
    if (theMap && mapLayer) { theMap.removeLayer(mapLayer); mapLayer = null; }
    discLayers = [];
    lastBounds = null;
    mapKey.hidden = true;
    mapTip.hidden = true;
  }

  /* A mark's words, in the one box across the map's foot (#mapTip), while
     the pointer is on it or after it was tapped — never beside the mark,
     where the map clips them (see #mapTip's rule). The words are set as
     text, so nothing in a place name is read as markup. Kept on the layer
     as `mvTip` too, which is how the suite reads what each mark says. */
  function tipOn(layer, text) {
    layer.mvTip = text;
    function show() { mapTip.textContent = text; mapTip.hidden = false; }
    function hide() { if (mapTip.textContent === text) mapTip.hidden = true; }
    return layer.on('mouseover', show).on('click', show).on('mouseout', hide);
  }

  /* HOW EACH PLACE WAS FOUND, drawn — the driver's words: "show on the map
     how the rig located each place, so they can see at a glance that it is
     working (or why it refused)".

     Under the pins, faint, and deciding nothing: MV.discShape and MV.located
     say what to draw, off what the walk already holds — the card's own fix
     and distance, and each NucBox answer kept with what was chosen from it
     (want.nbxSeen). No question is asked to draw any of it.

       the card's disc    a dashed circle at the card's fix, its distance
                          plus half a mile: the card's reach. Its PICKUP pin
                          is refused past it (MV.cardRefuses, red), and the
                          order in the car's end past ITS card's disc; the
                          dropoff pin is held to no disc. With the NucBox
                          answering, each of the card's places is searched
                          inside it and a candidate past it is never used;
                          with no NucBox (or one that could not be asked)
                          they go to the public geocoder in the 60 mi box
                          round the car, then with no box, and only the
                          pickup's refusal above holds. Blue as the car it is
                          drawn round; amber for the order in the car.
       also found         a small grey dot for every candidate the NucBox
                          sent (a corner: every meeting of its two streets),
                          edged in the disc's colour; the pin in colour on
                          top is what was chosen from them.
       outside            a hollow dashed ring: sent, but past the disc.
       a street           a numberless street's stretch inside the disc, as
                          a line — solid in the disc's colour when it was
                          pinned, grey and dashed when refused. Nothing
                          outside the disc is drawn.

     A refused place has no pin and its candidates carry the refusal as what
     they say when pointed at (tipOn), word for word the caption's (MV.nbxRefusal, cut to the same
     DISC_PLACE_SHOWN), so the map and the line under it cannot disagree.

     None of it has a say in the view. drawMap's one fit is the car and the
     pins, as it was before any of this was drawn, and a disc bigger than
     that view runs past its edge. Fitted to the discs too, measured with
     Leaflet 1.9.4's own getBoundsZoom and the fit's 34px padding, a 9.4 mi
     card took the hat's 228px map from zoom 10 to 8 and a 20 mi card to 7,
     to frame a circle that says only how far the card reaches; and a candidate outside its disc gets no say for the
     reason a stray gets none on the map page. Returns whether anything was
     drawn, which is whether the key under the map is shown. */
  var HOW_COLOUR = { 'new': '#7aa2f7', held: '#f5a524' };
  var HOW_GREY = '#8a8f98';

  /* A card's disc whose radius is more than the view — the longer side of
     the map, at the zoom it is at — is not drawn: what is on the glass of it
     then is an arc or two running edge to edge, which says nothing about
     reach and reads as a road. The driver's own case was a 21.6 mi held
     card, a 22.1 mi radius, on a 500px map at zoom 11: about 560px of
     radius (Leaflet's metres a pixel at that latitude, worked out, not
     measured on the rig). Asked again at every moveend, so zooming out
     brings it back once it fits and zooming in takes it away; the key
     names it only while one is shown. */
  var DISC_OPACITY = 0.6, DISC_FILL = 0.03;
  var discLayers = [];
  function sizeDiscs() {
    if (!theMap) return false;
    var size = theMap.getSize();
    var room = Math.max(size.x, size.y);
    var any = false;
    discLayers.forEach(function (c) {
      var d = c.mvDisc;
      var mid = theMap.latLngToContainerPoint([d.lat, d.lon]);
      var top = theMap.latLngToContainerPoint([d.lat + d.miles / 69.0, d.lon]);
      var fits = room > 0 && Math.abs(mid.y - top.y) <= room;
      c.setStyle({ opacity: fits ? DISC_OPACITY : 0, fillOpacity: fits ? DISC_FILL : 0 });
      c.mvShown = fits;
      if (fits) any = true;
    });
    var item = mapKey.querySelector('.k-item[data-k="disc"]');
    if (item && item.mvWanted && discLayers.length) {
      item.mvWanted.disc = any;
      // A key with every item off is an empty box over the map: gone too.
      if (!showKeyItems(item.mvWanted) && mapKey.querySelector('.k-fail').hidden) {
        mapKey.hidden = true;
      } else if (mapLayer) {
        mapKey.hidden = false;
      }
    }
    return any;
  }

  function drawHow(want) {
    // Every layer made first and only then put on the map, all of them, so a
    // throw part-way leaves nothing of it half drawn (see drawMap).
    var made = [];
    discLayers = [];
    // Which marks of the key are on the map: the circle, the grey (a
    // candidate dot, or a refused street's grey stretch) and the hollow. A
    // pinned street's stretch, in the disc's colour, is the pin's own.
    var kinds = { disc: false, cand: false, out: false };
    var cards = [['new', MV.discFor(want.card)]];
    if (want.held) cards.push(['held', MV.discFor(want.heldCard)]);
    cards.forEach(function (c) {
      var d = MV.discShape(c[1]);
      if (!d) return;
      kinds.disc = true;
      // Thin and faint, a fine dashed edge and the barest tint: it is the
      // card's reach, not a road. 1.25px at .6, down from 1.5px at .7; at
      // 1px and .45 it did not show at all over the muted tiles (looked at
      // in a browser, Leaflet 1.9.4). Shown only while it is no bigger than
      // the view; see sizeDiscs.
      var disc = L.circle([d.lat, d.lon], {
        radius: d.metres, weight: 1.25, color: HOW_COLOUR[c[0]], opacity: DISC_OPACITY,
        dashArray: '4 6', fillColor: HOW_COLOUR[c[0]], fillOpacity: DISC_FILL,
        interactive: false, className: 'mv-how mv-disc mv-' + c[0]
      });
      disc.mvDisc = { lat: d.lat, lon: d.lon, miles: d.miles };
      discLayers.push(disc);
      made.push(disc);
    });
    var seen = want.nbxSeen || {};
    Object.keys(seen).forEach(function (q) {
      var s = seen[q];
      var how = MV.located(s.res, s.disc, shortPlace(q, DISC_PLACE_SHOWN), s.whose);
      var colour = HOW_COLOUR[s.whose] || HOW_GREY;
      how.lines.forEach(function (l) {
        var chosen = l.kind === 'chosen';
        if (!chosen) kinds.cand = true;
        made.push(tipOn(L.polyline(l.pts, {
          color: chosen ? colour : HOW_GREY, weight: chosen ? 5 : 4,
          opacity: chosen ? .55 : .8, dashArray: chosen ? null : '6 5',
          bubblingMouseEvents: false,
          className: 'mv-how mv-street mv-' + l.kind + ' mv-' + s.whose
        }), l.tip));
      });
      how.marks.forEach(function (m) {
        var out = m.kind === 'outside';
        kinds[out ? 'out' : 'cand'] = true;
        made.push(tipOn(L.circleMarker([m.lat, m.lon], {
          radius: 5, weight: 2, color: out ? HOW_GREY : colour,
          dashArray: out ? '2 3' : null,
          fillColor: HOW_GREY, fillOpacity: out ? 0 : .9,
          bubblingMouseEvents: false,
          className: 'mv-how ' + (out ? 'mv-out' : 'mv-cand') + ' mv-' + s.whose
        }), m.tip));
      });
    });
    // Under the pins, which drawMap put down first: each sent to the back in
    // turn from the last made, so the discs end lowest and the candidates
    // over them, as they were made.
    for (var i = made.length - 1; i >= 0; i--) made[i].addTo(mapLayer).bringToBack();
    return made.length ? kinds : false;
  }

  /* The key, for what drawHow did: the kinds it drew, and the key names
     those and no others (plus "pin" when a pin is on the map); false,
     nothing to explain and no key; null, it failed and the key says only
     that — not the marks, which are not there. It named all four whatever
     was drawn: "○ outside" over a map with no hollow ring on it. */
  function showKey(drawn, pinned, heldPick) {
    // A held pickup's ring is in the key whether or not drawHow drew
    // anything: with no NucBox there is nothing of how it was found to
    // explain, and a green ring beside the green pin is still a mark to name.
    mapKey.hidden = drawn === false && !heldPick;
    mapKey.querySelector('.k-all').hidden = drawn === null;
    mapKey.querySelector('.k-fail').hidden = drawn !== null;
    if (drawn === null) return;
    var has = drawn ? { disc: drawn.disc, pin: pinned, cand: drawn.cand, out: drawn.out } : {};
    has.hpick = !!heldPick;
    // Kept for sizeDiscs, which takes the disc's item off while no disc is
    // shown at the zoom the map is at.
    mapKey.querySelector('.k-item[data-k="disc"]').mvWanted = has;
    showKeyItems(has);
  }

  // Whether any item is on.
  function showKeyItems(has) {
    var first = true;
    [].forEach.call(mapKey.querySelectorAll('.k-item'), function (el) {
      var on = !!has[el.getAttribute('data-k')];
      el.hidden = !on;
      var sep = el.querySelector('.k-sep');
      if (sep) sep.hidden = first;
      if (on) first = false;
    });
    return !first;
  }

  /* What the pins are, and which of them cannot be right — asked once, by
     drawMap for the colours and the line, and by showMap for whether the line
     will state a figure at all (and so whether to ask the router). One answer
     for both, so the road is never measured past a refusal the map makes. */
  function mapJudge(want, found, here) {
    /* Which of these pins cannot be where it says it is.
       A geocoder handed a misread street answers with a real street somewhere,
       at the same confidence as a right one, and this pane has two or three
       places — far too few for the whole-shift test, which takes the middle of
       the pins and would here be the midpoint of the two it is judging. The
       car's own GPS fix is the one point on this map that was measured rather
       than looked up, so the accusation is made against that. No fix, no
       accusation. */
    var wrong = MV.farFrom(here, found);
    var pick = want.pickup ? found[want.pickup] : null;
    var drop = want.dropoff ? found[want.dropoff] : null;
    var held = want.held ? found[want.held] : null;

    /* ...and which pins a CARD refuses: farther from where that card came up
       than its own distance plus half a mile (MV.cardRefuses). Asked once
       here and used for both the pin and the line under it. The line used to
       ask on its own, behind the guards for the order in the car, so with
       nothing held the study's wrong McDonald's was an ordinary green pickup
       under "nothing in the car to compare this against" — and even when the
       line did refuse it, the pin stayed green, because only farFrom turned
       a pin red. One answer, two uses, so the map and its caption cannot
       disagree about which pin is wrong. */
    var off = { pick: MV.cardRefuses(want.card, here, pick),
                held: MV.cardRefuses(want.heldCard,
                                     MV.cardFix(want.heldCard).at, held) };
    // The held order's pickups, each held to its card's disc as its end is.
    var heldPicks = (want.heldPicks || []).map(function (p) {
      var at = found[p.q] || null;
      return { q: p.q, name: p.name, at: at,
               off: at ? MV.cardRefuses(want.heldCard, MV.cardFix(want.heldCard).at, at)
                       : null };
    });
    return { wrong: wrong, pick: pick, drop: drop, held: held, off: off,
             heldPicks: heldPicks };
  }

  /* `settled` is false while places are still being asked about, and the tail
     of this function is the whole of what it changes: pins and lines go up as
     they land, and not one geocoded CLAIM is made until every answer is in.
     `road` is the router's detour when one was asked for, and `heldRoad` the
     held order's run along the roads, or null (see showMap). */
  function drawMap(want, found, here, settled, road, heldRoad) {
    var j = mapJudge(want, found, here);
    var wrong = j.wrong, pick = j.pick, drop = j.drop, held = j.held, off = j.off;

    if (mapLayer) theMap.removeLayer(mapLayer);
    mapLayer = L.layerGroup().addTo(theMap);
    // The marks the tip box spoke for are gone with the layer.
    mapTip.hidden = true;
    var bounds = [];
    /* `letter` is what the pin says without being clicked: P where something
       is picked up, D where it is dropped. A divIcon over the dot, not part
       of it, and deaf to the pointer, so the dot's popup is still what a
       press opens. Dark on a solid pin; white on a ring, haloed so it reads
       over whatever the ring shows of the map. */
    function put(at, colour, label, name, ring, letter) {
      if (!at) return;
      mapDot(at, colour, label, name, ring, letter).addTo(mapLayer);
      if (letter) {
        L.marker([at.lat, at.lon], {
          interactive: false, keyboard: false,
          icon: L.divIcon({ className: 'mv-letter' + (ring ? ' mv-letter-ring' : ''),
                            html: letter, iconSize: [26, 26], iconAnchor: [13, 13] })
        }).addTo(mapLayer);
      }
      bounds.push([at.lat, at.lon]);
    }

    // The car first, because every other mark here is a guess and this one is
    // not. A pickup pin a long way from it is a pin to distrust whatever the
    // geocoder said, and the driver can see that in one look.
    // The one mark here that was MEASURED rather than looked up: where the
    // car was when this card came up, which is what every figure under the
    // map is measured from. The live dot beside it is where the car is now.
    put(here, '#7aa2f7', 'where you were when this card came up',
        here ? '±' + Math.round(want.card.gpsErr) + ' m' : null, true);
    /* Red beats both roles, the same rule the whole-shift map keeps: whether a
       wrong coordinate was a pickup or a dropoff is not the thing to notice
       about it. Drawn rather than hidden, because a pin quietly dropped is the
       driver wondering where their dropoff went. */
    function colourFor(name, role, refused) {
      return (wrong[name] || refused) ? '#f31260' : role;
    }
    function sayFor(name, said, refused) {
      return wrong[name]
        ? said + ' — ' + Math.round(wrong[name]) + ' mi from you, so this pin is wrong'
        : refused
        ? said + ' — ' + refused.crow.toFixed(1) + ' mi from where its card came '
          + 'up, past its ' + refused.miles + ' mi, so this pin is wrong'
        : said;
    }
    /* Ringed, and that is one rule covering all four marks rather than a
       second meaning for the same flag: SOLID is part of the offer being
       decided, a RING is context the driver did not choose just now. The car
       above is already drawn that way and this is the other one — where you
       are, and where you are already committed to going.
       Without it these two amber dots were byte-identical, both
       {radius:9, fillOpacity:1, fillColor:'#f5a524'}, and the one comparison
       the driver opened this map to make had to be done by clicking each dot
       in turn with a bluetooth mouse at the wheel.
       Red still beats the role, because the ring is orthogonal to the colour:
       a held order whose pin cannot be right is a red ring, this card's is a
       red disc. And where this card's dropoff IS the held order's destination,
       mapWants already dedupes the lookup and the two land as a solid disc
       inside a ring, which is exactly what that means. */
    put(held, colourFor(want.held, '#f5a524', off.held),
        sayFor(want.held, 'where the order in your car is going', off.held),
        want.held, true, 'D');
    put(pick, colourFor(want.pickup, '#17c964', off.pick),
        sayFor(want.pickup, 'pick this one up', off.pick), want.pickup, false, 'P');
    /* The held order's pickups: a GREEN RING, by the rule above — green for
       a pickup, ringed for the order already in hand — and in the key as
       "held pickup". Named as the planner listed it, less the icon's litter
       (MV.plannerName), with the address searched under it. */
    j.heldPicks.forEach(function (p) {
      put(p.at, colourFor(p.q, '#17c964', p.off),
          sayFor(p.q, 'pick up the order in your car', p.off),
          [p.name, p.q.replace(/,$/, '')].filter(Boolean).join(' · '), true, 'P');
    });
    put(drop, colourFor(want.dropoff, '#f5a524'),
        sayFor(want.dropoff, 'and drop it here'), want.dropoff, false, 'D');

    // The run already committed to, and the run this card would add. Dashed
    // for the detour, solid for the job, which is the same distinction the map
    // page draws: a dashed line is miles nobody pays for.
    //
    // 5px over a 9px dark casing, the way a road map draws a route over its
    // roads: at 3px and no casing they were the same weight as the tiles' own
    // streets and an orange run read as one more of them. Each casing is put
    // down before its line, so the lines are over every casing they cross.
    function runLine(pts, opts) {
      L.polyline(pts, { color: '#0b0d10', weight: 9, opacity: .55, interactive: false,
                        lineCap: 'round', lineJoin: 'round',
                        className: 'mv-casing' }).addTo(mapLayer);
      L.polyline(pts, Object.assign({ weight: 5, lineCap: 'round', lineJoin: 'round' }, opts))
        .addTo(mapLayer);
    }
    // The held order's run: the car, its pickups not yet visited, its end
    // (MV.heldRun) — along the roads when the NucBox's router drew them
    // (`heldRoad`, see showMap), straight otherwise.
    var heldAt = j.heldPicks.map(function (p) { return p.at; });
    var run = heldRoad || (MV.heldRun ? MV.heldRun(here, heldAt, held)
      : (here && held ? [[here.lat, here.lon], [held.lat, held.lon]] : []));
    if (run.length && (held || heldAt.some(Boolean))) {
      runLine(run, { color: '#f5a524', opacity: .9,
                     className: 'mv-held-run' + (heldRoad ? ' mv-road' : '') });
    }
    // The detour, car -> pickup -> held end, along the road the router
    // measured it on when it did (`road.line`: only with a figure, see
    // MV.NbxSearch.detour); the two straight legs otherwise.
    var detourRoad = road && road.line && here && pick && held ? road.line : null;
    if (detourRoad) {
      runLine(detourRoad, { color: '#c084fc', dashArray: '2 9', opacity: .95,
                            className: 'mv-detour mv-road' });
    }
    if (here && pick && !detourRoad) {
      runLine([[here.lat, here.lon], [pick.lat, pick.lon]],
              { color: '#c084fc', dashArray: '2 9', opacity: .95, className: 'mv-detour' });
    }
    if (pick && drop) {
      runLine([[pick.lat, pick.lon], [drop.lat, drop.lon]],
              { color: '#17c964', opacity: .9 });
    }
    if (pick && held && !detourRoad) {
      runLine([[pick.lat, pick.lon], [held.lat, held.lon]],
              { color: '#c084fc', dashArray: '2 9', opacity: .95, className: 'mv-detour' });
    }

    /* How each place was found, AFTER everything above and guarded, so that
       any failure in it costs it alone: the car, the pins, the runs, the view
       and the line under the map are already decided and are drawn the
       same. Drawn first and unguarded it took all of them down — and the
       likely throw is not a bug in it: sw.js revalidates each file on its
       own, so this page can run against the map-view.js before it, where
       MV.discShape is undefined. A failure leaves nothing of it half drawn
       (drawHow puts its layers down only once all are made) and the key
       says it was not drawn rather than naming marks that are not there.
       Under the pins all the same: see drawHow. */
    var drewHow;
    try {
      drewHow = drawHow(want);
    } catch (e) {
      drewHow = null;
      if (window.console) console.error('drawing how each place was found:', e);
    }
    showKey(drewHow, !!(held || pick || drop), heldAt.some(Boolean));

    fitView(bounds);
    // Against the view as it stands; the fit's own moveend asks again at the
    // zoom it lands on (see the map's moveend).
    sizeDiscs();
    // Kept so coming back to this same card can put both of them back — the
    // words under the map and the view they describe.
    lastBounds = bounds;
    // The dot over a new set of pins, redrawn last so it is on top of them.
    hereKey = '';
    drawHere();

    if (!settled) {
      /* Progress, and nothing that reads as a verdict.
         mapSay and never mapDrew: `lastLine` is what DESCRIBES a drawn map,
         and coming back to this card later must not be told "2 of 3" about a
         map that finished ten minutes ago.
         And never mapLine. A place still in flight and a place the geocoder
         answered nothing for are the SAME empty slot in `found` — only this
         branch can tell them apart. "not found" printed over a street nobody
         has asked about yet is a pin that never arrived reading as a pin that
         arrived somewhere wrong, which is the one thing this panel may never
         produce. So no detour, no "N mi from you", no count of what is
         missing, until every answer is in. */
      var placed = want.names.filter(function (q) { return !!found[q]; }).length;
      mapSay('placing ' + placed + ' of ' + want.names.length + ' — still asking');
      return;
    }

    mapDrew(mapLine(want, found, here, j, road));
  }

  /* The one line of words under the map, and the only figure this mode
     produces. It answers the question the driver asked it for — is this pickup
     on my way, or behind me — and it says in the same breath whether that is
     a straight line or the road, because a driver acting on it is acting on
     three geocoded points. Every reason not to state it first (mapRefusal),
     and only then the figure (mapFigure). */
  function mapLine(want, found, here, j, road) {
    var stop = mapRefusal(want, found, here, j);
    // `drop` is deliberately not passed. The detour is car -> pickup -> where
    // the order in the car is going, because that order HAS to be delivered;
    // where the new job ends after that is a further guess, and a parameter
    // nothing reads is a parameter that will one day be read by mistake. The
    // router is asked about the same three points and no others.
    return stop !== null ? stop : mapFigure(want, found, here, j.pick, j.held, road);
  }

  /* Why the figure is not stated, in words, or null when it may be. showMap
     asks this too, before it asks the router, so the road is measured only
     where the straight line would have been stated. */
  function mapRefusal(want, found, here, j) {
    var pick = j.pick, held = j.held, off = j.off, wrong = j.wrong;

    /* A pin the page can see is wrong may not be one end of a figure the driver
       acts on. That is the header of map-view.js in one sentence: a coordinate
       invented from a misread street, turned into a distance, turned into a
       number on the panel, is the exact failure this project refuses. The pins
       are still drawn and still marked — seeing them is how the driver knows
       what happened — but the arithmetic stops. */
    wrong = wrong || {};
    var badEnd = (want.pickup && wrong[want.pickup]) ? want.pickup
               : (want.held && wrong[want.held]) ? want.held : null;

    // No detour to state, and WHICH of these it is matters: a driver told
    // nothing assumes the rig checked and found nothing worth saying.
    // The only line here whose length is not in this file. `badEnd` is a place
    // read off a card, so it is whatever the parser let through — MAX_PLACE is
    // 60 — and 39% of this driver's own places carry an `&`. Both mattered: at
    // 60 characters this ran to four rows at 800x480 and six on the hat, which
    // left the map 104px, and `esc()` put `&amp;` on the glass, because this
    // string goes to textContent and textContent does not un-escape anything.
    // So no esc, and the name is cut to what identifies a pin the driver can
    // also see marked on the map.
    if (badEnd) return shortPlace(badEnd) + ' is '
                     + Math.round(wrong[badEnd])
                     + ' mi away — almost certainly a misread name, so no '
                     + 'distance';
    /* A pin a CARD refuses, next — before anything is asked about the order
       in the car, because the refusal is about the pin and holds whether or
       not anything is held. A straight line cannot beat the road, so a
       pickup pin farther from where the car was when this card came up than
       the card's own distance (plus half a mile) is a pin the map got wrong:
       a same-brand branch in the next town, answered as confidently as the
       right one. That pin printed "+31.3 mi out of your way" on a job whose
       whole trip was 9.4 mi, and farFrom's 75 miles above cannot see it. The
       held order's end the same way, from ITS card's fix. `off` is drawMap's
       one answer, the same one that turned the pin red. */
    if (off.pick) return MV.againstCard(want.card, here, pick,
                                        shortPlace(want.pickup, DISC_PLACE_SHOWN),
                                        'new');
    if (off.held) return MV.againstCard(want.heldCard,
                                        MV.cardFix(want.heldCard).at, held,
                                        shortPlace(want.held, DISC_PLACE_SHOWN),
                                        'held');
    /* ...and a pin the NucBox would not choose, for the same reason and in
       the same place in the order: it is the disc's refusal made before a
       pin was drawn instead of after (MV.pickInDisc) — none of its
       candidates inside the card's distance, several that disagree, a
       corner whose streets meet in several places or not at all inside it,
       or a cross street with no street index to ask (MV.nbxRefusal has every
       kind) — and it holds whether or not anything
       is in the car. The dropoff's refusal is not here: the figure does not
       use it, and it is counted in the figure's " · 1 not found". */
    var nbxNo = want.nbxWhy || {};
    if (want.pickup && nbxNo[want.pickup]) {
      return MV.nbxRefusal(nbxNo[want.pickup].res, nbxNo[want.pickup].disc,
                           shortPlace(want.pickup, DISC_PLACE_SHOWN), 'new');
    }
    if (want.held && want.held !== want.pickup && nbxNo[want.held]) {
      // In the words of the disc it was searched in: the held card's, unless
      // this card's dropoff is the same place and was searched in this one's.
      return MV.nbxRefusal(nbxNo[want.held].res, nbxNo[want.held].disc,
                           shortPlace(want.held, DISC_PLACE_SHOWN),
                           nbxNo[want.held].whose);
    }
    // THIS card's fix, and why there is none: a card that came up with no
    // fix and one whose fix the gate refused are different states, and "no
    // position" would say the GPS never answered when it answered too roughly
    // to measure from. The line names which, with gpsd's own figure.
    if (!here) return MV.fixLine(MV.cardFix(want.card), 'new');
    if (!want.held) return holdingNow
      ? 'the order in your car has no address on record — ⌖ Scan reads it '
        + 'off your phone'
      : 'nothing in the car to compare this against';
    // The card naming no pickup is not the geocoder failing to place one, and
    // saying "could not be placed" for it blames the lookup for something the
    // card did. Uber prints the merchant on every offer, so this is rare — but
    // "rare" is how a wrong sentence survives a year on a panel.
    if (!want.pickup) return 'this card does not say where to collect it';
    if (!pick) return found[want.pickup] === undefined
      // "Nothing is stored" was the mechanism and "switching back here asks
      // again" is what a driver does about it, and the two together were three
      // rows. The mechanism goes: it is already written at the top of this
      // function, where `dead` is worked out, and it is not a thing the glass
      // has to carry.
      ? 'could not reach the geocoder for the pickup — no network, or busy. '
        + 'Coming back asks again.'
      : 'the geocoder found nothing for the pickup — usually a misread name';
    // ...and the same for the other end of the comparison. `want.held` is
    // already known to be set by the time this is reached, so this one really
    // is the lookup and not the card.
    if (!held) return found[want.held] === undefined
      ? 'could not reach the geocoder for where your order is going'
      : 'the geocoder found nothing for where your order is going';

    /* Every pin is in and no card refused one. What is left is whether each
       card COULD have: MV.againstCard says which card may be held against a
       pin at all — an Early look card, or one whose distance is not known to
       start at the car, is "no yardstick yet" — and a figure checked against
       nothing is withheld, said instead of printed. A pin it refuses was
       returned above, so here it answers the yardstick or nothing. */
    var said = MV.againstCard(want.card, here, pick,
                              shortPlace(want.pickup, DISC_PLACE_SHOWN), 'new');
    if (said) return said;
    // ...and the order in the car the same way, from ITS card's fix: where
    // the car was when that card came up is where its distance started. A
    // hold with no card at all says that, not "no GPS fix" (MV.cardFix).
    var heldFix = MV.cardFix(want.heldCard);
    if (!heldFix.at) return MV.fixLine(heldFix, 'held');
    said = MV.againstCard(want.heldCard, heldFix.at, held,
                          shortPlace(want.held, DISC_PLACE_SHOWN), 'held');
    if (said) return said;
    /* ...and a numberless street whose figure depends on where along it the
       stop is: MV.stretchSpan measures the figure at every point of its
       stretch inside the card's disc, and where those are not one answer
       the line says how long the street runs there instead of choosing a
       point. Measured to the point nearest the car, this showed true +1.5
       as +0.6 and true +0.4 as +5.1 (tests/mapview.test.js). */
    var span = MV.stretchSpan(here, pick, held);
    if (span && !span.stated) {
      return MV.spanRefusal(span, shortPlace(span.whose === 'new' ? want.pickup : want.held,
                                             DISC_PLACE_SHOWN), span.whose);
    }
    return null;
  }

  /* The figure. No minutes — a distance turned into time is a pace, and
     AUDITS.md refuses re-timing at one; OSRM's duration has no traffic in it
     and server.js drops it before it can reach this page — and no route
     through where the new job ends (Settled too). No age of the fix either:
     it is this card's own, taken when the card landed, and the gate refuses
     one older than rpi/gps.py's STALE_AFTER.

     By ROAD when the NucBox's router answered (`road.miles`, MV.NbxSearch's
     detour: road car -> pickup -> held end, less road car -> held end) and
     labelled "road mi", so the two figures are never mistaken for each
     other; otherwise in straight lines, labelled as it always was, with the
     reason the road is missing said in the tail where there was one. Same
     half-mile cut for both. */
  function mapFigure(want, found, here, pick, held, road) {
    /* Why a place has no pin, in the three kinds this project keeps apart
       everywhere else — because only one of them is about the rig's reading.
       An empty answer is stored as null; a lookup that could not be MADE is
       not stored at all, so the next press asks again. Reporting the second as
       the first told a driver in a dead spot on I-75 that a dozen of their
       streets do not exist, and they went looking at the crop for a fault that
       was the tunnel. */
    var missed = want.names.filter(function (q) { return !found[q]; });
    var dead = missed.filter(function (q) { return found[q] === undefined; });
    var count = missed.length
      ? ' · ' + missed.length + (dead.length ? ' not asked' : ' not found')
      : '';
    // Which of the NucBox's services did not answer, if one was asked. The
    // search first: its absence means the pins after it came from the public
    // map, which is the bigger thing to know about the line.
    // Keyed on MV.NbxSearch's own words for it, so nothing but caption text
    // is written as a literal here (rpi/test_layout.py measures every one).
    // The last three are a road figure the router DID give and this page
    // will not state: a point it moved more than MV.SNAP_MI to reach a road,
    // a figure below zero by more than the panel's rounding (OSRM's fastest
    // road direct, a shorter slower one by the pickup — MV.ROAD_SAME_MI),
    // and the relay refusing the question, which is a bug here. And
    // `street`, a road figure the router was never asked for: an end that is
    // a numberless street, whose figure is the straight line's over its
    // whole stretch (MV.stretchSpan; showMap).
    var roadDown = { unreachable: ' · NucBox router down', noroute: ' · no road found',
                     snap: ' · a pin over ' + MV.SNAP_MI + ' mi off road',
                     otherroads: ' · router took different roads',
                     refused: ' · road question refused, a bug',
                     street: ' · whole street, no road figure' };
    // One or the other, the search first. Both together ran past two rows at
    // 800x480 (rpi/test_layout.py), and with the search down the line still
    // says it is straight lines, not roads — only the road's reason goes.
    // "public map used" when the NucBox answered nothing before it went
    // down; when it answered some places first — a corner, a street's
    // stretch — those pins are its own, and the line says the public map
    // had only the rest.
    var nucbox = want.nbxDown
      ? (want.nbxAnswered ? ' · NucBox down, public map for the rest'
                          : ' · NucBox down, public map used')
      : (road && road.why && roadDown[road.why]) || '';
    var cut = MV.ON_WAY_MI;
    if (road && isFinite(road.miles)) {
      return (road.miles < cut ? 'this pickup is on your way by road'
                               : '+' + road.miles.toFixed(1) + ' road mi out of your way')
        + count + nucbox;
    }
    /* An end that is a numberless street: the figure wherever on it the stop
       is (MV.stretchSpan; mapRefusal refused it where that is not one
       answer). "On your way" is true of all of it, or the least and the most
       as a range, so nothing is measured to a point the card never named.
       The range needs no hedge after it: it IS the hedge, in the figure's
       own place, where no clamp reaches. */
    var span = MV.stretchSpan(here, pick, held);
    var lo = span ? span.lo : MV.detour(here, pick, held), hi = span ? span.hi : lo;
    var most = hi.toFixed(1) === lo.toFixed(1) ? '' : '–' + hi.toFixed(1);
    return (hi < cut ? 'this pickup is on your way'
                     : '+' + lo.toFixed(1) + most + ' mi out of your way')
      + ' — straight lines, not roads'
      + count + nucbox;
  }

  // Last, not beside the button it belongs to: it can put the pane into map
  // mode, and the map mode's own state has to exist before it does.
  applyViewMode();

  // --- drawing the box to read -------------------------------------------
  //
  // The scanner locates the phone by looking for the brightest quadrilateral,
  // which is right almost always and useless in the cases where it is wrong: a
  // windscreen reflection, a second lit screen, a phone filling the frame with
  // nothing darker to be told apart from. None of those can be aimed out of —
  // the rig reads a strip of the car indefinitely and reports corners held —
  // and the only fix was ssh and eight pixel coordinates guessed off a
  // photograph. The person holding the phone can see exactly where the card is,
  // so they can draw it.
  //
  // Sent as fractions of the picture, never pixels. This is a 480px JPEG of a
  // 2328px sensor frame, and corners measured against one size and read against
  // another are refused on every check, silently, for as long as the rig runs.
  var setBox = document.getElementById('setBox');
  var drawn = document.getElementById('drawn');
  var drawUse = document.getElementById('drawUse');
  var drawSkip = document.getElementById('drawSkip');
  var drawCancel = document.getElementById('drawCancel');
  var drawHint = document.getElementById('drawHint');
  var drawnScreen = document.getElementById('drawnScreen');
  var box = null;             // {x, y, w, h} as fractions, or null
  var dragFrom = null;
  // TWO boxes, one after the other. The first is the whole phone screen; the
  // second is where the offer cards land, inside it. Offers are read in the
  // card box, and a ⌖ press reads all of the screen box — because one tight
  // box round the cards, which is what this used to ask for, also blinded ⌖ to
  // the trip planner's addresses outside it. `screenBox` is the first box once
  // Next is pressed, and null while it is still being drawn.
  var screenBox = null;
  var STEP_SCREEN = 'drag a box around the whole phone screen';
  var STEP_CARD = 'now drag a box around where offer cards appear, inside the '
    + 'dashed screen box — or press No card box to read all of it';

  // The card box as fractions of the SCREEN box, which is what the scanner
  // crops by: the warp turns the screen box into the picture it reads.
  function cardInScreen(b, sb) {
    var x0 = Math.max(b.x, sb.x), y0 = Math.max(b.y, sb.y);
    var x1 = Math.min(b.x + b.w, sb.x + sb.w), y1 = Math.min(b.y + b.h, sb.y + sb.h);
    if (x1 <= x0 || y1 <= y0) return null;
    return { x: (x0 - sb.x) / sb.w, y: (y0 - sb.y) / sb.h,
             w: (x1 - x0) / sb.w, h: (y1 - y0) / sb.h };
  }
  function cardOk() {
    var c = box && screenBox ? cardInScreen(box, screenBox) : null;
    return bigEnough(c);
  }
  function placeBox(el, b) {
    var r = view.getBoundingClientRect();
    var wrap = viewWrap.getBoundingClientRect();
    el.style.left = (r.left - wrap.left + b.x * r.width) + 'px';
    el.style.top = (r.top - wrap.top + b.y * r.height) + 'px';
    el.style.width = (b.w * r.width) + 'px';
    el.style.height = (b.h * r.height) + 'px';
  }

  // Which mode the scene is on loan FROM for a drawing, or null. It was a
  // boolean while the phone was the only other thing this pane could show;
  // with a map in the cycle, "put it back" has to name what it is putting
  // back, or pressing Set box from the map ends with the driver on a picture
  // of their own car.
  var lentFrom = null;

  function drawingMode(on) {
    if (!on && lentFrom) {
      viewMode = lentFrom;
      lentFrom = null;
      applyViewMode();
      if (streaming) startStream();
      else refreshView();
    }
    viewWrap.classList.toggle('drawing', on);
    // The view is borrowed for the length of the drawing, so it may not be
    // given back mid-drag.
    //
    // The guard on Set box above checks the view at the moment it is PRESSED
    // and never again. The toggle stayed live throughout, so the driver could
    // switch to the phone view with a box half-drawn, and "Read this box"
    // re-checked only that the box was big enough — then POSTed it as camera
    // frame fractions and answered "box sent" in green. That is the exact
    // silent failure the guard was written to prevent, reached by pressing a
    // button beside it: a box accepted, a quad moved, and the scanner reading
    // a patch of car door.
    //
    // Disabled rather than checked again at send time: there is nothing to
    // decide here. You cannot draw the phone's outline on a picture that has
    // already been cropped to it, so switching away is not a thing to refuse
    // politely, it is a thing that cannot be meant.
    viewModeBtn.disabled = on;
    viewModeBtn.title = on ? 'the box is drawn on the scene — cancel first'
                           : '';
    drawHint.hidden = !on;
    // The label stays put and the button lights up instead: "▣ Drawing" wraps
    // onto two lines in a four-slot bar on a phone, and a bar that changes
    // height mid-drag moves the picture out from under the finger.
    setBox.classList.toggle('on', on);
    if (!on) {
      box = dragFrom = screenBox = null;
      drawn.hidden = true;
      drawnScreen.hidden = true;
      drawSkip.hidden = true;
      drawUse.disabled = true;
      drawUse.textContent = 'Next: card box';
    }
  }

  function at(e) {
    var r = view.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return {
      x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
    };
  }

  function showBox() {
    // Positioned against the picture rather than the figure, which also holds
    // the caption and the buttons.
    if (screenBox) placeBox(drawnScreen, screenBox);
    drawnScreen.hidden = !screenBox;
    if (!box) { drawn.hidden = true; return; }
    placeBox(drawn, box);
    drawn.hidden = false;
  }

  // What the green button may do now: move on from the screen box, or send.
  function canUse() { return screenBox ? cardOk() : bigEnough(box); }

  // 5% each way, the same floor the server and the scanner apply: at 5% of a
  // 2328px frame the card would be 116px tall against a 380px floor, so there
  // is nothing readable inside a box that small.
  function bigEnough(b) { return b && b.w >= 0.05 && b.h >= 0.05; }

  view.addEventListener('pointerdown', function (e) {
    if (!viewWrap.classList.contains('drawing')) return;
    var p = at(e);
    if (!p) return;
    e.preventDefault();
    view.setPointerCapture(e.pointerId);
    dragFrom = p;
    box = { x: p.x, y: p.y, w: 0, h: 0 };
    showBox();
  });

  view.addEventListener('pointermove', function (e) {
    if (!dragFrom) return;
    var p = at(e);
    if (!p) return;
    box = {
      x: Math.min(dragFrom.x, p.x), y: Math.min(dragFrom.y, p.y),
      w: Math.abs(p.x - dragFrom.x), h: Math.abs(p.y - dragFrom.y)
    };
    showBox();
    drawUse.disabled = !canUse();
  });

  function endDrag() {
    if (!dragFrom) return;
    dragFrom = null;
    drawUse.disabled = !canUse();
    drawHint.textContent = canUse()
      ? (screenBox ? 'drag again to change the card box, or read both boxes'
                   : 'drag again to change it, or go on to the card box')
      : (screenBox ? 'that card box is too small, or outside the screen box — '
                     + 'drag a bigger one inside the dashed box'
                   : 'that box is too small to read — drag a bigger one');
  }
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', endDrag);
  // The picture is replaced several times a second, and a box measured against
  // one layout is wrong in the next if the image changed size.
  window.addEventListener('resize', showBox);
  view.addEventListener('load', showBox);

  setBox.addEventListener('click', function () {
    var on = !viewWrap.classList.contains('drawing');
    // The box is drawn on the picture, so there has to be one. Without this the
    // hidden image measures zero and every drag is silently ignored, which
    // reads as a broken button rather than a scanner that has not sent a frame.
    if (on && viewWrap.classList.contains('gone')) {
      drawHint.hidden = false;
      drawHint.textContent = 'no camera view yet — the box is drawn on the picture, '
        + 'which appears within a few seconds of the scanner starting';
      return;
    }
    // A box dragged here is sent as a fraction of the *camera frame*, and the
    // phone view is not the camera frame — it is one rectangle out of it,
    // flattened and blown up to fill the picture. The same drag would land
    // somewhere else entirely, and the failure would be silent: a box
    // accepted, a quad moved, and the scanner reading a patch of car door.
    //
    // Switched rather than refused. The scene is the picture this button needs
    // and there is nothing to lose by going there — you cannot draw the
    // phone's outline on a picture that has been cropped to it already.
    //
    // Borrowed, not switched: the remembered view is not touched, and the
    // phone view comes back when the drawing ends — cancelled or used.
    // Before this one press of Set box wrote 'scene' into the preference,
    // and neither Cancel nor a box read put the phone back: the phone was a
    // third of a cabin thumbnail until the driver found ⛶ Phone again.
    //
    // The map is borrowed from for the same reason and with more force: there
    // is no camera frame under it at all, so a box dragged there would be
    // drawn on a street map and sent as camera-frame fractions.
    if (on && viewMode !== 'scene') {
      lentFrom = viewMode;
      viewMode = 'scene';
      applyViewMode();
      if (streaming) startStream();
      else refreshView();
    }
    drawingMode(on);
    if (on) {
      drawHint.textContent = STEP_SCREEN;
      viewWrap.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  });

  drawCancel.addEventListener('click', function () { drawingMode(false); });

  drawUse.addEventListener('click', function () {
    if (!screenBox) {
      // Step one done: hold the screen box on the picture and draw the cards.
      if (!bigEnough(box)) return;
      screenBox = box;
      box = null;
      showBox();
      drawUse.disabled = true;
      drawUse.textContent = '✓ Read both boxes';
      drawSkip.hidden = false;
      drawHint.textContent = STEP_CARD;
      return;
    }
    if (!cardOk()) return;
    sendBoxes(cardInScreen(box, screenBox));
  });

  // The screen box alone: offers are read in all of it, as before there were
  // two boxes.
  drawSkip.addEventListener('click', function () {
    if (screenBox) sendBoxes(null);
  });

  function sendBoxes(card) {
    var sent = screenBox;
    var body = { box: [sent.x, sent.y, sent.w, sent.h] };
    if (card) body.card = [card.x, card.y, card.w, card.h];
    drawUse.disabled = drawSkip.disabled = true;
    drawUse.textContent = '✓ sending…';
    ask('/api/crop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return { ok: r.ok }; });
    }).then(function (out) {
      if (!out || !out.ok) throw new Error((out && out.error) || 'refused');
      drawingMode(false);
      // No confirmation dialog: the green outline in the picture below moves
      // onto the box within a second or two, which is the same news and is the
      // thing worth looking at anyway.
      drawSkip.disabled = false;
      drawHint.hidden = false;
      drawHint.textContent = card
        ? 'boxes sent — offers are read in the card box, and ⌖ reads the whole screen box'
        : 'box sent — the green outline moves onto it in a moment';
      setTimeout(function () { drawHint.hidden = true; }, 6000);
    }).catch(function (e) {
      drawUse.disabled = false;
      drawSkip.disabled = false;
      drawUse.textContent = '✓ Read both boxes';
      drawHint.textContent = 'could not set the box: ' + e.message;
    });
  }

  connect();
  // Keeps the "last seen" counter honest, and — since silence is exactly the
  // condition worth noticing — is the only thing that can ever discover the
  // scanner has gone quiet. Nothing arrives to trigger that discovery.
  setInterval(function () {
    render();
    showConnection();
    // The dot's age and its grey, which change while nothing arrives — and a
    // beat that stopped coming is exactly when nothing does.
    drawHere();
    // The screening state ages out on a clock and nothing arrives to announce
    // it: between cards the scanner can be silent for minutes, which is the
    // whole reason this tick exists. Without it ⌖ Dropoff would stay lit over
    // a card that left the screen long ago.
    showDest();
    // The shift figures ride the one-second tick rather than adding a timer of
    // their own, on an elapsed check so the cadence is three minutes however
    // many ticks it took. `document.hidden` because this tick keeps running in
    // a background tab — only the camera stream is stopped on visibilitychange
    // — and an unattended tab has no reason to keep asking the rig to parse its
    // journal. The next visible tick catches up.
    if (!document.hidden && Date.now() - shiftAt >= SHIFT_EVERY_MS) loadShift();
  }, 1000);
  loadShift();

  /* The offline shell, installed by the page that most needs it.
   *
   * `sw.js` lists live.html in ASSETS and this file's comments treat the panel
   * as part of the shell — it is the screen bolted to the car, it has to come
   * up with no network, and that is the stated reason it does not load
   * advice.js for a single integer. It never registered the worker.
   *
   * The only three registrations in the repo were scan.js, ui.js and
   * journal.html, so the panel was covered only when the same browser profile
   * had already opened the keypad, the phone scanner or the offers page — and
   * then only because sw.js claims clients at scope '/'. On the Pi that is
   * usually true, because index.html is where the driver lands and ui.js
   * registers there. The profile it is not true for is the one that matters
   * most: a browser pointed straight at /live.html and nothing else, which is
   * the dashboard panel and the 480x320 hat.
   *
   * The existing checks made this look covered without testing it:
   * rpi/test_scanjs.py asserts every .html in the directory is in ASSETS — a
   * check about the LIST — and separately that scan.html registers. Nothing
   * asked this page.
   *
   * NOT on `load`, which is what scan.js and ui.js do and what this was written
   * as first. THE LOAD EVENT NEVER FIRES ON THIS PAGE. The panel holds an open
   * MJPEG stream — `/api/frame.mjpeg`, see viewSrc — and a document with a
   * response that never completes never finishes loading. Copied from the
   * keypad it registered nothing at all, which the check in
   * rpi/test_scanjs.py caught by timing out waiting for `load` and then
   * counting zero registrations.
   *
   * So: straight away, at the end of boot. The cost of that is a fetch of
   * sw.js competing with the first verdict, and it is small and paid once;
   * the cost of the other version is the panel having no offline shell at
   * all, which is the thing this page's whole design is arranged around. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
