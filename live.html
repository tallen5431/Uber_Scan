    // the widest pair line, those kept only "with ①" at 800x480 beside the
    // scene picture and "with ① +" on the 3.5" hat — a range against two
    // read as a range against one.
    if (s.heldCount > 1) {
      var both = document.createElement('span');
      both.className = 'both';
      both.textContent = 'with ' + Array.apply(null, Array(s.heldCount)).map(function (x, i) {
        return circled(i + 1);
      }).join(' + ');
      both.title = 'Two orders are in the car. This weighs the new one against both: '
        + 'the most time is all of them one after another, the least the longest '
        + 'single one.';
      put(both);
    }
    put(chip);
  }

  function onTimeSaid(s) {
    if (!s) return null;
    if (s.onTime === 'both') return 'both on time';
    if ((s.onTime === 'late1' || s.onTime === 'late2') && s.lateMin > 0) {
      return circled(s.onTime === 'late1' ? 1 : 2) + ' late ~' + s.lateMin + ' min';
    }
    if (typeof s.offWayMi === 'number' && waySearch !== true) {
      return '+' + s.offWayMi.toFixed(1) + ' mi out of the way';
    }
    return null;
  }

  // ...and the same question handed to a map, which answers it in driving
  // minutes with live traffic where the line above can only answer it in the
  // card's own words. Appended as a real link rather than folded into the
  // text, because it is the one thing on this panel a driver is meant to
  // press — and only when both ends were named, which is about half the time.
  //
  // Opened in another tab so the driving screen is still there behind it. It
  // is also the panel's browser, not the phone's: the phone keeps showing the
  // offer and the rig does not lose the card while the map is up.
  //
  // Made once and kept, last on the line. It was a new element on every
  // render, and a press is a mousedown and a mouseup on the SAME element: a
  // reading or the one-second tick landing between the two took the link
  // away under the pointer and the press opened nothing. Measured: 5 of 5
  // presses opened the route with nothing between, 0 of 5 with a reading
  // between, 0 of 5 across the tick. Now its href changes in place.
  var routeLink = null;
  function showRoute(href) {
    if (!href) {
      if (routeLink && routeLink.parentNode) routeLink.parentNode.removeChild(routeLink);
      return;
    }
    if (!routeLink) {
      routeLink = document.createElement('a');
      routeLink.className = 'maplink';
      routeLink.target = '_blank';
      routeLink.rel = 'noopener noreferrer';
      routeLink.textContent = '\u2933 route';
      routeLink.title = 'Open the drive from where the order you have ends to where '
                      + 'this one ends, with current traffic.';
    }
    setAttr(routeLink, 'href', href);
    if (routeLink.parentNode !== el.stack) el.stack.appendChild(routeLink);
  }

  // The last offer the scanner wrote to the journal, and whether the driver has
  // said they took it.
  //
  // Not the offer on screen: those are the same thing only in the moment before
  // a decision, and the decision is made on the phone, after which the card
  // goes away. This is what the button marks and what it is named after.
  var onRecord = null;
  var tookState = false;
  var tookBusy = false;
  // Whether the last press failed to reach the journal. It used to show
  // nothing: the label flickered to "…" and came straight back to "Took
  // $10.00?", and the driver either assumed it registered or pressed again.
  // Drop on the same bar already says "Drop · failed"; this says "not
  // saved", and says it until the next press.
  var tookFailed = false;
  // When the offer on record was first recorded, on THIS page's clock — from
  // the stream when a new id arrives, from /api/status's offerAgeMs at load —
  // or null when nothing says. See tookAge.
  var recordAt = null;

  /* How long ago the card on record was recorded, once it has left the phone:
   * "2m ago", "just now", or '' while a verdict is on the glass.
   *
   * The Took button names the last offer on record, which is the right one in
   * the moment after a decision and the wrong one minutes later: the phone has
   * moved on, the next card was never written (a PASS screened off, or a
   * reading that never settled), and "Took $5.00?" sits on the bar naming a
   * card the driver no longer remembers. Shift snaps on 12 Oct show it over
   * WAITING FOR AN OFFER with nothing on the glass to say which card it was.
   * The age says it. Not while a card is up: the verdict beside it is that
   * card or the next, and the age of either is not the question.
   *
   * Whole minutes, rounded DOWN, for the reason the GPS line gives: "1m" at
   * 119 seconds is true and "2m" would not be. Short, because it has a line
   * of its own in a button 71px across on the 3.5" hat (see #took .status):
   * past an hour it is hours, past a day days, rounded down the same way, so
   * no age is wider than "59m ago". */
  function tookAge() {
    if (recordAt === null || (last && last.ready && !blind)) return '';
    var m = Math.floor(Math.max(0, Date.now() - recordAt) / 60000);
    return m < 1 ? 'just now' : m < 60 ? m + 'm ago'
      : m < 1440 ? Math.floor(m / 60) + 'h ago' : Math.floor(m / 1440) + 'd ago';
  }

  function showTook() {
    if (!onRecord || !onRecord.id) {
      setHidden(el.took, true);
      return;
    }
    setHidden(el.took, false);
    // Past tense, and the amount. "Took $8.04" is a note about a decision
    // already made; anything in the imperative could be read, on a screen
    // bolted to a dashboard next to a verdict, as doing something to the offer
    // — and the one thing this rig must never do is press Accept.
    var what = (typeof onRecord.pay === 'number')
      ? '$' + onRecord.pay.toFixed(2) : 'the last one';
    // The order in the car, back on the phone under its own id or a new one
    // (heldCard, see heldOwnCard in server.js): shown as the order already
    // taken, not as an offer to tick, and the press does nothing — the driver
    // has said this once.
    if (heldAgain()) {
      tookSays('\u2713 Took ' + what, 'in car');
      setTitle(el.took, 'The order you already took, on the phone again. Nothing to record.');
      el.took.classList.remove('failed');
      el.took.classList.add('on');
      setAttr(el.took, 'aria-pressed', 'true');
      return;
    }
    // No "undo" in the label: at this width it overflowed the button by 20px
    // and the word was clipped off, which is worse than not offering it — an
    // affordance nobody can see is not an affordance. It is a toggle, styled
    // when set, exactly as the same control on the offers page behaves.
    // ...and how old that card is, once it has gone, or that the press was
    // not saved: on the line under the label, never on the end of it.
    tookSays(tookBusy ? '…'
             : tookFailed ? 'Took ' + what
             : (tookState ? '\u2713 Took ' + what : 'Took ' + what + '?'),
             tookBusy ? '' : tookFailed ? 'not saved' : tookAge(), !tookFailed);
    setTitle(el.took, tookFailed
      ? 'The journal could not be written. Press again to retry.'
      : tookState
      ? 'Recorded as taken. Press again if that was wrong.'
      : 'Record that you accepted this offer. It does not touch your phone.');
    el.took.classList.toggle('failed', tookFailed);
    el.took.classList.toggle('on', tookState);
    setAttr(el.took, 'aria-pressed', tookState ? 'true' : 'false');
  }

  /* The Took button's label, and under it, when there is one, its status
   * line: the card's age, "not saved" or "in car" (#took .status). One run
   * of text inside one span: the button is a flex box, and the label and a
   * second span as two children of it were two flex items side by side, the
   * second painted past the button's edge rather than under the first. The
   * space between them is for a screen reader, which reads the two as one
   * name; a block line after it draws none. `age` marks the line as the age,
   * which rpi/test_layout.py measures at its widest. */
  function tookSays(label, status, age) {
    if (!drawnAs(el.took, JSON.stringify([label, status, !!age]))) return;
    el.took.textContent = status ? '' : label;
    if (!status) return;
    var both = document.createElement('span');
    both.textContent = label + ' ';
    var line = document.createElement('span');
    line.className = 'status' + (age ? ' ago' : '');
    line.textContent = status;
    both.appendChild(line);
    el.took.appendChild(both);
  }

  // Whether the card on record is the held order's own card come back.
  function heldAgain() {
    return !!(holdingNow && onRecord && onRecord.heldCard);
  }

  // --- the order in the car, on the card -------------------------------------
  //
  // The order as the server last described it — heldForPanel on a reading or
  // a mark reply, /api/status's `holding` at load — with the GPS drop's state
  // brought up to date by every beat (`heldEnd`, heldEndState in server.js).
  // Only what showHeld says from; holdingNow is still whether there is one.
  var heldSaid = null;

  // The server's reasons for not arming the GPS drop (heldEndState), in the
  // two or three words the in-car line has room for. Keyed by the server's
  // words; a reason this has no entry for is said in its first three words,
  // so a new one is shortened rather than dropped.
  var END_WHY_SHORT = {
    'no house number': 'no house no.',
    'not inside the card\'s reach': 'outside reach',
    'several answers': 'several answers',
    'too many answers': 'too many answers',
    'no card fix': 'no card fix',
    'NucBox down': 'NucBox down',
    'door next to the pickup': 'door at pickup',
    // The held end's place asked after its door, and nothing of that name
    // (server.js searchHeldPlace).
    'no door, place not found': 'no door/place'
  };

  /* The GPS drop's state in a few words: "at door" once the car has arrived
   * (the beat's atDropoff, or the hold's own arrival, which survives a reload),
   * "● armed" with a door-level pin and nothing against it, the reason when
   * there is one, and "○ not armed" when there is neither — no pin, and no
   * refusal yet, which is also what a server with no NucBox search says. */
  function gpsDropSaid() {
    return gpsSaidOf(heldSaid || {}, atDropoff);
  }

  // ...for any one order in the car: `here` is the beat's word that the car
  // is at a held door now, which with two orders is said per order by its own
  // `arrived` instead.
  function gpsSaidOf(h, here) {
    if (here || h.arrived) return 'at door';
    if (h.endWhy) {
      return END_WHY_SHORT[h.endWhy] || String(h.endWhy).split(' ').slice(0, 3).join(' ');
    }
    // ...and an end the server pinned by the place the phone printed for it,
    // its door not being on the NucBox (searchHeldPlace, `endBy` 'place'):
    // armed all the same, and said, since that pin is a building's and not a
    // door's.
    return h.endPinned ? (h.endBy === 'place' ? '● armed by place'
      : h.endBy === 'street' ? '● armed by street' : '● armed')
      : '○ not armed';
  }

  // A dropoff as the line has room for it: the street, without the town, the
  // state or the ZIP, and without letters the reader made of an icon in front
  // of it (MV.searchText).
  function streetOf(text) {
    if (!text) return null;
    var s = MV && MV.searchText ? MV.searchText(text) : String(text).trim();
    return s.split(',')[0].trim() || null;
  }

  /* Where the order in the car goes next: { kind, by, name }.
   *
   * A pickup the planner lists, the first of them not yet visited, until the
   * car is at the door. The planner lists the stops still ahead, and a list
   * read after the pickup no longer carries it; but the app keeps listing it
   * until the driver swipes it, so one the server has seen the car stop at
   * and leave (`visited`, visitPickups in server.js) is behind the car too,
   * named by the planner line MV.pickupKey gives it. Then the dropoff,
   * shortened, with the planner's expected-by time when the planner names
   * one dropoff and so that time can only be this order's. Nothing is worked
   * out from distance or speed: a time on this line is one the phone
   * printed, and a visit moves the stop on without moving any time. */
  function nextStop() {
    var stops = heldPlan && heldPlan.of === heldOwner() ? heldPlan.stops : [];
    var kind = function (k) {
      return stops.filter(function (s) { return s && s.kind === k; });
    };
    var there = atDropoff || !!(heldSaid && heldSaid.arrived);
    var done = visitedNow();
    var pick = there ? null : kind('pickup').filter(function (s) {
      var q = MV && MV.pickupKey ? MV.pickupKey(s) : null;
      return !q || done.indexOf(q) === -1;
    })[0];
    if (pick) {
      return { kind: 'Pickup', by: pick.expectedBy,
               name: (MV && MV.plannerName ? MV.plannerName(pick.name) : pick.name)
                     || pick.street || null };
    }
    var drops = kind('dropoff');
    var drop = drops.length === 1 ? drops[0] : null;
    return { kind: 'Dropoff', by: drop ? drop.expectedBy : null,
             name: streetOf(heldEnds) || (drop && drop.street) || null };
  }

  // The held order's pickups the server says are behind the car, by planner
  // line (heldEndState in server.js): [] when none are, or nothing is held.
  function visitedNow() {
    return holdingNow && heldSaid && Array.isArray(heldSaid.visited) ? heldSaid.visited : [];
  }

  /* The order in the car, said on the panel. `mode` is 'between' when there
   * is no offer and nothing else the card has to say, 'offer' with a verdict
   * on the glass, and 'line' for the rest — a card being read, the rig blind
   * or being aimed.
   *
   * Between offers the card held WAITING FOR AN OFFER and nothing else. Of
   * the driver's 69 📷 Snaps of 8-12 Oct, 47 have no verdict on the glass and
   * 24 of those an order in the car: half a panel of empty card, on the
   * screen of the one job that is paying. So with an order held, the card says
   * where it goes next and by when, large, and under it one line: what it
   * pays and whether the GPS will put it down. With nothing held the card says
   * what it said.
   *
   * With an offer up the same facts are one line, "In car $28.08 · ▸ Burger
   * Barn · ● armed", and it is NOT in the card: it is the line under it,
   * after the reading's age, in place of the read diagnostics. Two reasons.
   * A line in the card costs the card a row it does not have: put at the
   * card's foot, with a pair up, the card's contents ran past its box at both
   * ends on the 800x480 panel beside the scene picture even with the headline
   * made 20px smaller to pay for it, and on the 3.5" hat beside the phone the
   * word PASS 11px above the card's edge and the line 10px below it. And a
   * figure inside the verdict's colours reads as the offer's: the pay here is
   * the held order's, and says "In car" in front of it for the same reason.
   * The diagnostics it stands in for —
   * costs, legs, reads — are questions for a parked driver, and are back the
   * moment nothing is held. The pay and the GPS state never shrink; the stop
   * is the part that gives way (`#detail .held` in the stylesheet).
   *
   * In Map view between offers the card is not drawn at all (setBetween), and
   * the big block goes with it: the map is showing the same order's run. */
  var heldMode = null;
  function showHeld(mode) {
    heldMode = mode;
    var on = !!(holdingNow && mode);
    var between = on && mode === 'between';
    var inDetail = on && mode === 'offer';
    // Two orders in the car: a line each, and no single "next stop" — which
    // of two runs is next is the detour's question (Stage 6), not this one's.
    var two = on && twoHeld();
    var next = on && !two ? nextStop() : null;
    setHidden(el.heldNext, !between || two);
    setHidden(el.verdictLabel, between);
    setHidden(el.heldLine, !on || inDetail);
    el.heldLine.classList.toggle('between', between);
    setHidden(el.heldLine2, !two || inDetail);
    el.heldLine2.classList.toggle('between', between);
    setHidden(el.whose, !two || inDetail || !unownedNow);
    el.whose.classList.toggle('between', between);
    setText(el.whose, unownedNow
      ? unownedNow + (unownedNow === 1 ? ' dropoff' : ' dropoffs') + ' read \u00b7 whose?' : '');
    el.detail.classList.toggle('withheld', inDetail);
    if (!on) return heldInDetail(null);
    if (two) return showTwoHeld(inDetail);
    var pay = heldSaid && typeof heldSaid.pay === 'number' ? money(heldSaid.pay, 2) : '';
    // A batched trip (server.js batchDrops, Assemble.batchPlan): one card,
    // more than one door, the end the LAST of them — the stop on the line is
    // that last door, and the GPS drop is armed on it alone. Said "2 drops":
    // between offers beside the pay; under an offer at the HEAD of the stop,
    // the part that gives way, since beside the pay it pushed the GPS words
    // off the glass on the 800x480 and 480x320 panels beside the scene
    // picture with the card moving (test_layout "pair batch"). ...and not
    // under an offer on the 3.5" hat at all: there the line has no room the
    // stop can give (the same form, measured, cut the stop's last letters),
    // and between offers the hat still says it. No control.
    var nDrops = heldSaid && typeof heldSaid.drops === 'number' && heldSaid.drops >= 2
      ? heldSaid.drops : 0;
    var drops = nDrops ? ' \u00b7 ' + nDrops + ' drops' : '';
    if (inDetail) {
      var hat = !!(window.matchMedia
                   && window.matchMedia('(orientation: landscape) and (max-height: 380px)').matches);
      return heldInDetail(['· In car' + (pay ? ' ' + pay : ''),
                           '· ▸ ' + (nDrops && !hat ? nDrops + ' drops, ' : '')
                             + (next.name || next.kind),
                           '· ' + gpsDropSaid()]);
    }
    heldInDetail(null);
    var line = el.heldLine;
    if (between) {
      setText(el.heldNext.firstChild, next.kind
        + (typeof next.by === 'number' ? ' by ' + clockOf(next.by) : ''));
      setText(el.heldNext.lastChild, next.name || 'address not read');
      setText(line.children[0], (pay ? pay + ' in car' : 'In car') + drops);
    } else {
      setText(line.children[0], 'In car' + (pay ? ' ' + pay : '') + drops);
      setText(line.children[1], '· ▸ ' + (next.name || next.kind));
    }
    setHidden(line.children[1], between);
    setText(line.children[2], '· ' + gpsDropSaid());
  }

  /* The order in the car as the one line after the reading's age, under an
     offer: its three parts' words, the third hidden where it is null, or
     null for no line. Drawn again only when the words move. */
  function heldInDetail(parts) {
    var old = el.detail.querySelector('.held');
    var key = JSON.stringify(parts);
    if (old && old.drawnKey === key) return;
    if (old) el.detail.removeChild(old);
    if (!parts) return;
    var line = document.createElement('span');
    line.className = 'held';
    line.drawnKey = key;
    ['pay', 'stop', 'gps'].forEach(function (c, i) {
      var part = document.createElement('span');
      part.className = c;
      if (parts[i] === null) part.hidden = true;
      else part.textContent = parts[i];
      line.appendChild(part);
    });
    el.detail.appendChild(line);
  }

  // The circled number an order goes by on the panel: ① first-taken.
  function circled(n) {
    return String.fromCharCode(0x245f + n);
  }

  // One order's compact line: "① $9.48", "→ Kestrel Dr", "· ● armed"; its end
  // as "?" when none is on record. An Uber add-on's pay is said the way its
  // card printed it, "② +$9.50": it joined the trip on the line above
  // (server.js placeTook), and the plus is the panel saying so.
  function orderLine(line, o, inDetail) {
    setText(line.children[0], circled(o.n) + ' ' + plus(o)
      + (typeof o.pay === 'number' ? money(o.pay, 2) : '?'));
    setHidden(line.children[1], false);
    setText(line.children[1], '\u2192 ' + (streetOf(o.dropoff) || '?'));
    setText(line.children[2], '\u00b7 ' + gpsSaidOf(o, false));
    setHidden(line.children[2], !!inDetail);
  }

  function plus(o) {
    return o && o.addOn ? '+' : '';
  }

  /* The orders after ① when there are more than two — an original and two
     Uber add-ons, one trip (server.js placeTook; the owner's 16 Oct trip
     details show one) — said on ONE line, the second: "②–③ +$16.39",
     "→ 1/2 ends". The panel has two lines for the car and no room beside the
     card at 1024x600 for a third; the chooser and Map view still name each
     order, and how many of their ends are read is what this line is for.
     The pay is their sum, as Uber pays the trip: "?" when one is unknown. */
  function restLine(line, rest) {
    var known = rest.filter(function (o) { return !!streetOf(o.dropoff); }).length;
    setText(line.children[0], restPay(rest));
    setHidden(line.children[1], false);
    setText(line.children[1], '\u2192 ' + known + '/' + rest.length + ' ends');
    setHidden(line.children[2], true);
  }

  function restPay(rest) {
    var paid = rest.every(function (o) { return typeof o.pay === 'number'; });
    var sum = rest.reduce(function (s, o) { return s + (paid ? o.pay : 0); }, 0);
    return circled(rest[0].n) + '\u2013' + circled(rest[rest.length - 1].n) + ' '
      + (rest.every(function (o) { return o.addOn; }) ? '+' : '')
      + (paid ? money(sum, 2) : '?');
  }

  /* showHeld with two orders: ① on #heldLine, ② on #heldLine2 (with three or
     more, ② onwards on #heldLine2: restLine); under an offer, one line after
     the reading's age — "In car ① $9.48 · ② $28.08" — since the row there has
     room for one, and the card above has the pair. */
  function showTwoHeld(inDetail) {
    var a = heldList[0], rest = heldList.slice(1), b = rest[0];
    if (inDetail) {
      return heldInDetail(['\u00b7 In car ' + circled(a.n) + ' ' + plus(a) + money(a.pay, 2),
                           '\u00b7 ' + (rest.length > 1 ? restPay(rest)
                             : circled(b.n) + ' ' + plus(b) + money(b.pay, 2)), null]);
    }
    heldInDetail(null);
    orderLine(el.heldLine, a, false);
    if (rest.length > 1) restLine(el.heldLine2, rest);
    else orderLine(el.heldLine2, b, false);
  }

  // Whether two orders are in the car, by the server's list (ordersForPanel),
  // which only a server carrying two sends — or one carrying an Uber add-on
  // with its trip (server.js carryingTwo).
  function twoHeld() {
    return holdingNow && heldList.length >= 2;
  }

  el.took.addEventListener('click', function () {
    if (!onRecord || !onRecord.id || tookBusy || heldAgain()) return;
    var want = !tookState;
    tookBusy = true;
    showTook();
    ask('/api/offers/mark', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // By id, never by pay-and-minutes. Marking by the figures is a *rule*
      // that catches every offer paying that to the cent, and two genuinely
      // different cards doing exactly that inside one window is a case this
      // project has already met — see rpi/test_repeats.py.
      //
      // And the offer itself. The server keeps the offer on record in
      // memory, so after a restart mid-shift it has none — while this page
      // still shows "Took $10.00?" for it. Sent along, the server can put
      // the order in the car from what this page knows.
      //
      // Pressed again it takes the tick back with `null`, not `false`: "that
      // was wrong", pressed at the wheel, is not "I passed on it", which is
      // an answer of its own now (Passed, on the offers page) and one the
      // advice reads as a fact. `via` names this screen — see MARK_VIA in
      // server.js.
      body: JSON.stringify({ id: onRecord.id, accepted: want ? true : null,
                             via: 'panel', offer: onRecord })
    }).then(function (r) {
      if (!r.ok) { tookFailed = true; return null; }
      tookFailed = false;
      tookState = want;
      return r.json().catch(function () { return null; });
    }).then(function (body) {
      // The order in the car, learned HERE and not from the next reading.
      //
      // This is the moment the destination is on the phone: the driver has
      // just accepted, the card is gone from the mount, and they pressed the
      // button that says so. But `holdingNow` was only ever set from a reading
      // — and there is no reading, because there is no card. So Drop and
      // ⌖ Dropoff stayed hidden until the NEXT offer arrived, by which point
      // the phone is showing that offer and pressing ⌖ Dropoff photographs the
      // wrong screen. The one feature that exists for the 18% of cards naming
      // no address could not be reached on the path it was built for.
      //
      // Believing the server rather than the press, like Drop below: the mark
      // may have been refused, or the hold may already have expired on the
      // server's own clock, and a button for an order that is not there is
      // worse than no button.
      // A Took that put another order down (server.js writes its drop row
      // `by: 'replaced'`). Said on the status row like the GPS drop.
      if (body && body.replaced) {
        replacedSaidUntil = Date.now() + (body.replaced.saidForMs || 60000);
        replacedPay = typeof body.replaced.pay === 'number' ? body.replaced.pay : null;
      }
      if (body && typeof body.holding === 'boolean') {
        if (holdingNow && !body.holding) forgetDest();
        holdingNow = body.holding;
        // ...and where it ends, which the reply now says (heldForPanel in
        // server.js). It said only whether an order was held, and this was
        // cleared to wait for the next reading — so from ✓ Took until then
        // Map view drew the taken card's dropoff as that CARD's, and the
        // next card's offer line took it off the glass with the card it
        // belonged to: the driver's "it did not hold those pins". A server
        // older than the field leaves it as it was, waiting for a reading;
        // never a stale end from the last order, which would tint the
        // button for a job that is finished.
        var held = body.holding ? body.held : null;
        heldEnds = held ? (held.dropoff || null) : undefined;
        heldCard = held ? (held.card || null) : null;
        // ...and what the in-car line says of it (showHeld), from the same
        // description.
        heldSaid = held || null;
        // ...and every order, with carrying two on, and the Undo for one
        // this Took added beside another.
        takeOrders(body);
        if (body.added) offerUndo(body.added);
        showDrop();
        showDest();
        if (viewMode === 'map') showMap();
      }
    }).catch(function () {
      /* The record is the point; a failed write must not look like a success. */
      tookFailed = true;
    }).then(function () {
      tookBusy = false;
      showTook();
      // The tick on the status row is about to be wrong by one. It is one of
      // two things on this screen that ask again off the timer — the other is
      // the rig saying it has written an offer, see SHIFT_SOON_MS — and
      // leaving it until the next slow poll would mean pressing "took it" and
      // watching the number beside it not move. This comment used to say
      // marking was the only thing that changes the row, which was never
      // true: every card the rig saves is one more offer on it.
      loadShift();
    });
  });

  // --- the order in the car ------------------------------------------------
  //
  // Held by the server, not here. Several panels may be open — the dashboard,
  // a phone, a laptop indoors — and an order tracked per page would have each
  // of them measuring the next offer against a different job, or against none.
  //
  // The button only appears while there is one to put down. A control for a
  // state you are not in is a control that teaches people to ignore the bar,
  // and this bar is the one a driver reaches for without looking.
  var holdingNow = false;
  // ...and whether the rig knows where it ENDS, which is a different question
  // and the one that decides whether the dropoff button is worth pressing.
  //
  // An offer card names where a delivery ends on only some cards — 106 of this
  // driver's 604 print a merchant and no address — so the order in the car
  // often has no end the geography check can use, and half of all pairs get no
  // verdict on where they finish. The button that fixes that is in the bar
  // already, and it looked identical whether pressing it would change the
  // answer or not.
  //
  // `undefined` while nothing is held; a string or null once something is.
  var heldEnds;
  // ...and the card that order came from, as the server kept it: where the car
  // was when it came up and how far it said the job ran. Map view checks the
  // held end against these (MV.againstCard). Set beside `heldEnds` from the
  // same message, and read only while `heldEnds` names an end, so a stale one
  // can never be measured with.
  var heldCard = null;
  // ...and the server's name for that order, which a door-level pin of its end
  // is posted under (pinHeldEnd), so a pin can never land on the next order.
  var heldId = null;
  // The GPS drop's two words on the status row (healthNote): the car is at the
  // held order's door now, per the last beat; and when the server put the
  // order down because the car left it, until when to say so.
  var atDropoff = false;
  var gpsDropSaidUntil = 0;
  // ...and until when to say a Took put the previous order down — and, when a
  // Took past two put one down, its pay.
  var replacedSaidUntil = 0;
  var replacedPay = null;
  // Every order in the car as the server described them (ordersForPanel),
  // first-taken first: sent only by a server carrying two, and [] otherwise.
  // `holdingNow` and the names beside it are still ① alone.
  var heldList = [];
  // ...and how many addresses the rig read that it cannot give to either.
  var unownedNow = 0;
  var dropBusy = false;
  var dropFailed = false;
  // What the failed press was about, so the failure can be forgotten when the
  // car is carrying something else. A refused Drop leaves the order where it
  // was, so "the hold went away" is not the signal — the order that failed to
  // go down is still there, and the next thing to happen is a DIFFERENT order
  // being picked up. The card has no id for a hold, so the figures it does
  // print stand in for one.
  var dropFailedFor = null;
  // The order in the car as last described, so a failure can be tied to it.
  var heldSig = null;

  /* The Trip Planner's stops as Map view's source for the held order's
   * pickups — { of, stops }, `of` the order they were read for (heldOwner).
   *
   * Not `plannerSaid`, and on purpose a longer life. plannerSaid is the
   * answer to a press, and goes when a different offer goes on the record
   * (forgetDest): kept to that, the restaurant's pin would leave the map at
   * the next card — the one moment Map view is opened to weigh a card
   * against the order in the car. This is where that order is collected
   * from, which a new card does not change: kept until the order goes, or
   * until a newer planner read while it is held replaces it (the rig reads
   * the planner unpressed while an order is marked taken, and a list read
   * after the pickup no longer carries it). A reload has only what the
   * server kept, which is plannerSaid's life (forgetPlanner in server.js). */
  var heldPlan = null;

  function heldOwner() { return holdingNow ? (heldId || heldSig) : null; }

  function holdSignature(holding) {
    return holding ? String(holding.pay) + '/' + String(holding.minutes) : null;
  }

  function showDrop() {
    setHidden(el.drop, !holdingNow);
    // "Drop ▾" with two in the car: one tap may ask which (the chooser).
    setText(el.drop, dropBusy ? '…' : dropFailed ? 'Drop · failed'
      : twoHeld() ? 'Drop \u25be' : 'Drop');
    el.drop.classList.toggle('failed', dropFailed);
    setTitle(el.drop, 'Put the order down, so the next offer is judged on its own '
                    + 'again. It does not touch your phone.');
  }

  /* Map view pinned the held order's end at DOOR level: tell the server, which
     puts the order down once the car has stopped at that door and then left it
     (gpsArrival in server.js). Only a door — the place names a house number
     and the NucBox's answer carries it — and the server asks both again. A
     street or a town is never sent. Fire and forget: a refused or lost post
     costs only the GPS drop, and the timer and Drop still end the order. */
  function pinHeldEnd(want, q, got) {
    var plan = MV.searchPlan(q);
    if (!want.heldId || !got.at || !plan || plan.kind !== 'street' || !plan.door
        || !MV.hasDoor(got.at, plan.house)) return;
    ask('/api/held-end', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ holdId: want.heldId, dropoff: q, lat: got.at.lat,
                             lon: got.at.lon, name: got.at.name, doorLevel: true }) })
      .catch(function () {});
  }

  /* The held end as the server pinned it (heldEndState: endPinned, endBy
     'server', 'place' or 'street', endAt), as an answer Map view draws, for
     the end text `q` it was pinned for; else null. */
  var SERVER_PINS = ['server', 'place', 'street'];
  function serverEnd(q) {
    var h = heldSaid;
    var at = h && h.endAt;
    if (!h || h.dropoff !== q || !h.endPinned || SERVER_PINS.indexOf(h.endBy) === -1
        || !at || typeof at.lat !== 'number' || typeof at.lon !== 'number') return null;
    return { at: { lat: at.lat, lon: at.lon, name: q }, n: 1, by: h.endBy };
  }

  /* ...and where one of its pickups is, found inside the held card's disc as
     its end is: the server does not arm a door within 150 m of one (the
     restaurant guard, pickupNearEnd in server.js). The server now searches
     the planner's pickups itself (searchHeldPickup), so this is a second
     opinion, kept by the same path. Fire and forget, too. */
  function pinHeldPickup(want, q, got) {
    if (!want.heldId || !got.at) return;
    // ...named by its planner line, which is what the server marks visited
    // when the car has stopped there and left (visitPickups in server.js).
    ask('/api/held-pickup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ holdId: want.heldId, lat: got.at.lat, lon: got.at.lon, q: q }) })
      .catch(function () {});
  }

  // The order is down: Drop's reply, or the server's word that the GPS put it
  // down (msg.gpsDrop). One function, so the two cannot forget different things.
  function orderDown() {
    holdingNow = false; forgetDest(); heldEnds = undefined; heldSig = null;
    heldId = null; atDropoff = false; heldPlan = null; heldSaid = null;
    heldList = []; unownedNow = 0;
    // ...and the card's line with the pair line it qualifies, in the same
    // moment: no order, nothing to be on the way of.
    showStack(null); showWay(null); showDest(); showTook(); showHeld(heldMode);
  }

  el.drop.addEventListener('click', function () {
    if (dropBusy) return;
    dropBusy = true;
    showDrop();
    ask('/api/delivered', { method: 'POST' }).then(function (r) {
      // Believe the server, not the press. If the write failed the order is
      // still in the car and the next offer must still be measured against it.
      dropFailed = !r.ok;
      dropFailedFor = r.ok ? null : heldSig;
      if (!r.ok) return null;
      return r.json().catch(function () { return {}; }).then(function (body) {
        // Two orders in the car and nothing to say which was delivered: the
        // server put none down and sent the chooser (dropDecides).
        if (body && body.choose) return openChooser(body.choose);
        dropAnswered(body);
      });
    }).catch(function () {
      /* Left as it was: an order the server still holds is the truth. */
      dropFailed = true;
      dropFailedFor = heldSig;
    }).then(function () {
      dropBusy = false;
      showDrop();
    });
  });

  // --- reading the destination off the screen after the accept -------------
  //
  // The one thing the offer card cannot tell you. Uber prints "Customer
  // dropoff" and no address on 106 of this driver's 604 cards — 18% of
  // everything the rig sees — so the order in the car has no destination and
  // the stack line has nothing to compare the next offer against. The address
  // is on the screen that comes AFTER the accept, and this is the driver
  // saying "that is what you are looking at now".
  //
  // The press only opens a window; the scanner keeps reading for a few seconds
  // (see DROPOFF_WINDOW) because the driver still has to get the destination
  // up, and a phone in a mount showing a navigation screen is exactly what the
  // motion gate scores as nothing happening.
  var destBusy = false;
  var destSaid = '';
  // Whether the last press came back with nothing. Cleared by the next press
  // and by an address arriving, the same way `tookFailed` is — a failure that
  // outlived the thing that failed would be worse than not saying it.
  var destFailed = false;
  // ...and the Trip Planner the same press read, when it was one: the stops,
  // in the order the phone listed them, and the scanner's reason for filing
  // none of them as the order's end — {stops, unfiled} — or null. See
  // showStops and unfiledNow.
  var plannerSaid = null;
  // ...and a press the order in the car REFUSED, because the phone was showing
  // the store: Uber's navigation to the restaurant, or the order's own pickup
  // (server.js, dropoffArrived; Assemble.dropoff, rule 5) — {why, kept}, the
  // server's reason and the end the order kept, or null. It is an answer to
  // the press, so it goes when the press's other answers go (forgetDest) and
  // when an address arrives after it, pressed for or read on its own (the
  // navigation screen, once the car leaves the store). On 17 Oct a press at
  // the restaurant read the store's town and the button went green, "Dropoff
  // read as <Town>, GA 30066", over an order whose door was already on record.
  // The face is two words because the bar gives it no more ('⌖ not read' is
  // as long); the sentence, with the end kept, is on the title.
  var destStore = null;
  var DEST_STORE_FACE = '⌖ a pickup';

  /* What a press read is forgotten, all of it, in one place.
   *
   * `destSaid` was cleared at seven places in this file — a new press, a hold
   * that ended four different ways, a new offer on the record, a reload with
   * nothing held — and the planner's stops are the same answer to the same
   * press, so they have to go at exactly those seven moments and no others.
   * Seven more assignments beside the seven would be two lifetimes for one
   * answer the first time somebody added an eighth to one list and not the
   * other: stops still on the glass for an order already put down, which is a
   * route for a trip that is over. rpi/test_dashboard.py holds every one of
   * them to this function. server.js drops the stops it keeps on the order in
   * the car at the same moments (forgetPlanner), so a reload does not bring
   * back what this has forgotten.
   *
   * ...and the stops come off the glass HERE, not at the next render: Drop and
   * the replies to a press answer on their own and do not render, so for up to
   * the second-long tick a put-down order's stops were still being shown. */
  function forgetDest() {
    destSaid = '';
    destStore = null;
    plannerSaid = null;
    showStops(false);
  }

  /* Why the planner the last press read gave the order in the car no end, as
   * the ASSEMBLER decided it — see plannerDestination in assemble.js, whose
   * word server.js puts on the planner line — or ''.
   *
   * Read off the line, not worked out here. This page used to count the
   * dropoffs itself, which was a second copy of half the scanner's rule: it
   * said nothing when the one dropoff did not read whole, and nothing could
   * have told it the list ran off the screen.
   *
   * '' the moment the button has an end on it, whichever read put it there.
   * "End not guessed" beside a green "Read as: …" was two answers to one
   * question on the glass at once — a two-dropoff planner, then the address
   * seen on the navigation screen — and the second is the one that holds. */
  function unfiledNow() {
    return (!destSaid && plannerSaid && plannerSaid.unfiled) || '';
  }

  // Each reason twice: the line under the stops, which has to survive the
  // thirty characters the 3.5" hat's scene picture gives a line, and the
  // sentence it stands for on the button's title. Keyed by the words
  // assemble.js's plannerDestination returns, and rpi/test_lint.py holds the
  // two lists to each other: a reason it gives that this has no words for would
  // throw in the middle of drawing the driving screen.
  var UNFILED_THEN = ' so the order\'s destination is left as it was. Press this '
    + 'over the navigation screen for it instead.';
  var UNFILED_SAID = {
    dropoffs: function (drops) {
      return { note: drops + ' dropoffs: end not guessed',
               title: 'The Trip Planner lists ' + drops + ' dropoffs and the rig '
                 + 'does not guess which one is this order\'s,' + UNFILED_THEN };
    },
    list: function () {
      return { note: 'list cut off: end not guessed',
               title: 'The rig could not see both ends of the Trip Planner\'s list — '
                 + 'the title over the first stop and "Waybill" under the last — so '
                 + 'the one dropoff it read may not be the trip\'s only one,'
                 + UNFILED_THEN };
    },
    address: function () {
      return { note: 'dropoff address unread',
               title: 'The Trip Planner\'s dropoff did not read as a street and a '
                 + 'town,' + UNFILED_THEN };
    }
  };

  function unfiledSaid(why, stops) {
    return UNFILED_SAID[why]((stops || []).filter(function (s) {
      return s.kind === 'dropoff';
    }).length);
  }

  // "4:18" off minutes since midnight. No AM or PM: a stop is expected within
  // the hour of the trip it is on, and the line has no room for two letters
  // that say nothing the driver does not know.
  function clockOf(minutes) {
    var h = Math.floor(minutes / 60) % 12;
    var m = minutes % 60;
    return (h || 12) + ':' + (m < 10 ? '0' : '') + m;
  }

  // One stop, as one line: "▸ Dropoff by 4:18 · Pat Q. · 4821 Kestrel Dr,
  // Marietta". The rig's own words for each field and nothing in place of one
  // it did not read — a closed block on the planner prints no address, and the
  // line stops at the name.
  //
  // What and when first, because that is the order of the trip and it is the
  // part that must never be cut: in the 3.5" hat's scene picture the column is
  // about thirty characters wide, and with the name ahead of the time a
  // "Taco Hut Express" pickup lost its "by 12:05" to the ellipsis — measured,
  // rpi/test_layout.py. The name and the street are what give way, from the end.
  function stopLine(s) {
    var line = '▸ ' + (s.kind === 'pickup' ? 'Pickup' : 'Dropoff')
      + (typeof s.orders === 'number' && s.orders > 1 ? ' ×' + s.orders : '');
    if (typeof s.expectedBy === 'number') line += ' by ' + clockOf(s.expectedBy);
    // The name as shown: the stop's icon read as letters in front of it
    // goes (MV.plannerName); the stop keeps it as read.
    var name = s.name && MV && MV.plannerName ? MV.plannerName(s.name) : s.name;
    if (name) line += ' · ' + name;
    if (s.line) line += ' · ' + s.line;
    return line;
  }

  // At most four lines. A planner longer than that shows its first three and
  // says how many more there are, so the driver knows the list goes on rather
  // than reading three as the trip.
  var STOPS_SHOWN = 4;

  /* The stops the last ⌖ press read off Uber's Trip Planner, one line each,
   * in order — between offers.
   *
   * Between offers because that is when the card has room: it holds the phase
   * and nothing else (see #stops in the stylesheet), so the block costs the
   * panel nothing it was using. A card being judged takes the space back —
   * render() hides the block whenever a reading carries a verdict — and the
   * stops come back when it goes, for as long as they are remembered, which
   * ends at exactly the moments the read destination does: see forgetDest.
   *
   * When the scanner gave the order in the car no end off the planner — two
   * dropoffs, a list it could not see both ends of, a dropoff that did not
   * read whole — this says so in a line of its own, because the button staying
   * amber is the only other sign of it. See unfiledNow.
   *
   * THE NOTICE FIRST. Between offers the card also holds the notice — the
   * journal refusing writes, the phone too bright or too dim, the phase's
   * own message — and the notice is the item that gives
   * way (see `#warn` in the stylesheet), while these lines are `flex: none`.
   * So on a small panel the stops took the notice's room, and it went with
   * nothing saying so: on the 3.5" hat's scene picture "Offers are NOT being
   * saved" with "too bright" after it needs 139px, had 121 on the glass before
   * four stops arrived, and 17 after (rpi/test_layout.py, this fold switched
   * off). Now the stops give way first, a
   * line at a time from the end, each one counted into "+ N more stops", down
   * to one line saying how many there are — so neither disappears silently.
   * That one line can still cost a notice that does not fit even without it;
   * a notice longer than the card is scrollable, and was cut before. */
  function showStops(show) {
    var stops = show && plannerSaid ? plannerSaid.stops : [];
    var why = stops.length ? unfiledNow() : '';
    var note = why ? unfiledSaid(why, stops).note : '';
    var k = stops.length > STOPS_SHOWN ? STOPS_SHOWN - 1 : stops.length;
    var drawn = drawStops(stopsLines(stops, k, note));
    while (k && (noticeCut() || stopsSpill())) {
      var fewer;
      do { k--; fewer = stopsLines(stops, k, note); } while (k && fewer.length >= drawn);
      drawn = drawStops(fewer);
    }
  }

  // The first `k` stops, the rest counted, and the note under them; with no
  // room for a single stop, one line that says how many were read.
  function stopsLines(stops, k, note) {
    if (!stops.length) return [];
    var plural = function (n) { return n + (n === 1 ? ' stop' : ' stops'); };
    if (!k) return ['▸ ' + plural(stops.length) + ': no room to list'];
    var lines = stops.slice(0, k).map(stopLine);
    if (k < stops.length) lines.push('+ ' + plural(stops.length - k).replace(' ', ' more '));
    if (note) lines.push(note);
    return lines;
  }

  function drawStops(lines) {
    setHidden(el.stops, !lines.length);
    if (!drawnAs(el.stops, JSON.stringify(lines))) return lines.length;
    while (el.stops.firstChild) el.stops.removeChild(el.stops.firstChild);
    lines.forEach(function (text) {
      var div = document.createElement('div');
      div.textContent = text;
      el.stops.appendChild(div);
    });
    return lines.length;
  }

  // The notices, as chips (see `note`), or — tapped — as the sentences.
  //
  // Open stays open until the notices change or WARN_OPEN_MS passes: render()
  // repaints every second, and a new card's notices are not the ones the
  // driver asked to read, so they come up as chips again. A sentence left
  // open on the glass by a tap a minute ago would be the long block this
  // replaced, back for good.
  var WARN_OPEN_MS = 20000;
  var warnOpenAt = 0;
  var warnSaid = '';

  function showNotes(list) {
    var said = list.map(function (n) { return n.full; }).join(' ');
    if (said !== warnSaid) { warnSaid = said; warnOpenAt = 0; }
    // In the driving form (between offers), never the sentences: a tap there
    // is the peek. With an offer up, moving or not, the card is the whole
    // card, and a tap on a notice is its sentence as it is parked.
    var open = !drivingShown && !!warnOpenAt && Date.now() - warnOpenAt < WARN_OPEN_MS;
    if (!open) warnOpenAt = 0;
    // ...and, in the driving form, the first chip only, with a chip saying
    // how many more there are, so the rest are put away rather than gone
    // with nothing saying so. Every sentence stays on the notice's title.
    // Never under an offer: every notice there is about the offer, or about
    // whether its reading can be trusted, which is the same thing.
    if (drivingShown && list.length > 1) {
      list = [list[0], note('+' + (list.length - 1) + ' more', said)];
    }
    setHidden(el.warn, !list.length);
    if (!drawnAs(el.warn, JSON.stringify([open, list]))) return;
    el.warn.textContent = '';
    if (open) {
      el.warn.textContent = said;
    } else {
      list.forEach(function (n) {
        var c = document.createElement('span');
        c.className = 'chip';
        c.textContent = n.chip;
        c.title = n.full;
        el.warn.appendChild(c);
        el.warn.appendChild(document.createTextNode(' '));
      });
    }
    el.warn.classList.toggle('open', open);
    el.warn.title = said;
    el.warn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  // A tap on the notice is the "what does that mean" — and a second tap puts
  // the chips back. It moves nothing a press on the bar decides: the notice
  // is part of the card, not a control on the bar (which holds six).
  el.warn.setAttribute('role', 'button');
  el.warn.tabIndex = 0;
  function toggleNotes() {
    warnOpenAt = warnOpenAt ? 0 : Date.now();
    render();
  }
  el.warn.addEventListener('click', toggleNotes);
  el.warn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleNotes(); }
  });

  // Whether the notice is showing less than it says. Measured on the element,
  // after the lines above are drawn: its height is what the card had left.
  function noticeCut() {
    return !el.warn.hidden && el.warn.scrollHeight > el.warn.clientHeight + 1;
  }

  // ...or whether the stops run past the foot of the card themselves, with no
  // notice to give way: the order in the car's next stop and its line above
  // them (showHeld) are `flex: none` too, and on the 3.5" hat, with four stops
  // read, the three together are taller than the card. The card centres what
  // it cannot hold, so stops past its foot are the same height again cut off
  // its top: with this switched off, the next stop's "Pickup by 11:52" was
  // over the card's top border in both pictures (rpi/test_layout.py, HELD).
  // Its bottom border is 2px (`.verdict`).
  function stopsSpill() {
    if (el.stops.hidden) return false;
    return el.stops.getBoundingClientRect().bottom
      > el.verdict.getBoundingClientRect().bottom - 2 + 0.5;
  }

  /* The other state this button is for, which it did not used to have.
   *
   * It was built for after the accept: an order is in the car, its card never
   * said where the job ends, and the address is on the navigation screen. That
   * is still what it does — and it is not when the driver actually wants to
   * know.
   *
   * The driver's own words: "for doordash orders I need to tap the customer
   * drop off location to show the address when screening so it would be
   * possible to search on the map". They are already tapping the phone to
   * reveal the address BEFORE deciding, because where a job ends is half of
   * whether it is worth taking. The rig was looking away.
   *
   * Three conditions, and each one is doing work:
   *
   *   Nothing held, because with an order in the car the button already means
   *   something and that meaning wins — the held order's missing end is the
   *   stronger claim, since every pair judged against it is nonsense without.
   *
   *   A card the rig has on record, with an id, because an address read
   *   against no card is an address belonging to no job. That is the exact
   *   thing server.js refuses to store, and it is right to.
   *
   *   And the card is still UP. `onRecord` is deliberately not cleared — the
   *   Took button names an offer whose card has gone — so without this the
   *   button would sit lit for the rest of the shift after one card with no
   *   destination. Measured off the same clock the verdict's own "stale" uses,
   *   so the control disappears when the thing it is about does.
   */
  function screeningEnd() {
    if (holdingNow) return false;
    if (!onRecord || !onRecord.id) return false;
    if (onRecord.dropoff) return false;
    return Date.now() - readAt <= READ_STALE_MS;
  }

  function showDest() {
    var screening = screeningEnd();
    setHidden(el.dest, !holdingNow && !screening);
    // A LABEL, always, and the answer said in colour instead.
    //
    // This used to become the address itself once one had been read. The bar is
    // a grid of equal columns and there are six or seven of them, so on the
    // rig's own 800x480 panel this button is 122px wide: a 42-character address
    // needs 238px and arrived as "1234 Daffodil L…". That is not a control any
    // more - it neither says what pressing it does nor shows an address the
    // driver can check - and at 480x320 the column is 69px, where even
    // "⌖ Dropoff", its label until it was renamed ⌖ Scan, was a squeeze at 74px.
    //
    // There is no width to win: the bar is full and every button shares it
    // equally. So the confirmation is a colour, which this panel already trusts
    // a driver to read before they read words, and it costs no width at all.
    // The address itself goes where there is room for it - the title, and the
    // stack line's own geography.
    setText(el.dest, destBusy ? '⌖ reading…'
      : destStore ? DEST_STORE_FACE
      : destFailed ? '⌖ not read' : '⌖ Scan');
    el.dest.classList.toggle('done', !destBusy && !!destSaid);
    // The same class Drop and Took already use for the same thing, so a
    // failure looks like a failure on this bar whichever control it came from.
    el.dest.classList.toggle('failed', !destBusy && destFailed);
    // ...and asked for, in the one state where pressing it changes an answer.
    //
    // The order in the car has no end the geography check can use — its card
    // printed a merchant and no address, which 106 of this driver's 604 cards
    // do — so every pair judged against it gets ENDS ? and will go on getting
    // it until this button is pressed. The chip on the stack line says the
    // question was not answered; this says which control answers it.
    //
    // The doubt colour, not the green one: green here means "already read",
    // and this is the opposite state. And only when the missing half is the
    // HELD order's — when it is the new card's own dropoff that is missing,
    // nothing this button does can help, and a control that asks to be pressed
    // for no gain is worse than one that says nothing.
    //
    // Screening asks to be pressed on a narrower condition than holding does:
    // the card has to have REFUSED a destination, not merely failed to yield
    // one. Uber printing "Customer dropoff" means the address exists and is
    // one tap away on the phone; a card the reader simply got nothing off has
    // nothing to reveal, and lighting up over it would be asking for a press
    // that cannot help. See endRefused, which is why the two are now telling
    // apart at all.
    // ...and a press that came back empty does not go on asking to be pressed
    // in the amber "this one needs you" colour while it is saying it failed.
    // Two states on one button is one too many at 74px on a moving car, and
    // the failure is the newer news.
    //
    // ...and not on a card this same panel is telling the driver to PASS.
    // Measured over the real week: the card refused a destination and none
    // was read on 457 cards, and 400 of them (87.5%) were rated `no`. The
    // driver ticked 4 of the 457 as taken, all go or warn, and none of the
    // 400. So the ask drops to 57 a week and loses no card anybody took. The
    // button stays on the bar and still reads the address when pressed — the
    // driver asked for it while screening, to look the place up — it only
    // stops asking in the doubt colour for a press the verdict has already
    // made moot. Taken anyway, and the held branch asks again.
    //
    // The card's OWN state, carried on the offer, never `last.state`: once the
    // card leaves the phone the latest reading is an `empty` one, and a PASS
    // card's button would start asking the moment it went. `!== 'no'` rather
    // than a list of the states that may ask, so an offer from a rig one
    // release behind, which carries no state, asks exactly as it did.
    var wants = !destBusy && !destSaid && !destFailed
      && (holdingNow ? heldEnds === null
                     : (screening && !!onRecord.endRefused
                        && onRecord.state !== 'no'));
    el.dest.classList.toggle('wanted', wants);
    // A Trip Planner the last press read, which the scanner gave the order no
    // end off: the panel says why under the stops, in thirty characters; this
    // is the sentence that stands for. One reason, read off the line, for
    // both. See unfiledNow.
    var unfiled = unfiledNow();
    // A refused press: no colour — the order's end is as it was, which is
    // neither news to celebrate nor a fault of the rig's — and the sentence.
    var storeSaid = destStore
      ? 'Restaurant screen, not where this order goes — '
        + (destStore.kept ? 'kept ' + destStore.kept : 'nothing filed')
        + '. Press again over the customer\'s address.'
      : '';
    setTitle(el.dest, storeSaid ? storeSaid
      : destSaid
      ? 'Read as: ' + destSaid + '. Press again to read it afresh.'
      : destFailed
      ? 'Nothing on that screen read as an address. Get the destination up on '
        + 'your phone and press again.'
      : unfiled
      ? unfiledSaid(unfiled, plannerSaid.stops).title
      : wants && holdingNow
      ? 'The order you are carrying has no address on record, so the rig '
        + 'cannot say whether a second job ends near it. Read it off your '
        + 'phone. It does not touch your phone.'
      : wants
      ? 'This card says “Customer dropoff” and no address. Tap the dropoff on '
        + 'your phone and press this, and where it goes is on the record '
        + 'before you decide. It does not touch your phone.'
      : holdingNow
      ? 'Read the destination off your phone, so the next offer can be judged '
        + 'on where it ends as well as what it pays. It does not touch your phone.'
      : 'Read where this card goes off your phone. It does not touch your phone.');
    // ...and said out loud, because the colour is the only thing on screen that
    // changed and a screen reader cannot see it.
    setAttr(el.dest, 'aria-label', storeSaid ? storeSaid
      : destSaid
      ? 'Dropoff read as ' + destSaid + '. Press again to read it afresh.'
      : destFailed
      ? 'Nothing on that screen read as an address. Press again once the '
        + 'destination is up.'
      : wants && holdingNow
      ? 'Read the dropoff off your phone. The order you are carrying has no '
        + 'address on record, so second jobs cannot be judged on where they end.'
      : wants
      ? 'Read the dropoff off your phone. This card says Customer dropoff and '
        + 'gives no address.'
      : 'Read the dropoff off your phone');
  }

  /* Drop's answer: the car empty, or — with carrying two on — the order left
     in it, which the reply describes (holding, held, orders). */
  function dropAnswered(body) {
    if (body && body.holding && body.held) {
      setHeldFrom(body.held, body);
      showDrop(); showDest(); showTook(); showHeld(heldMode);
      if (viewMode === 'map') showMap();
      return;
    }
    orderDown();
  }

  /* The order in the car as a message describes it — `holding` on a reading,
     `held` on a reply — in the five names this page keeps it under. */
  function setHeldFrom(h, msg) {
    holdingNow = !!h;
    heldSig = holdSignature(h);
    heldEnds = h ? (h.dropoff || null) : undefined;
    heldCard = h ? (h.card || null) : null;
    heldId = h ? (h.holdId || null) : null;
    heldSaid = h || null;
    takeOrders(msg);
  }

  // The list of orders and the count waiting for an owner, off any message
  // that carries them (a server carrying two). Nothing held is no list.
  function takeOrders(msg) {
    if (!holdingNow) { heldList = []; unownedNow = 0; return; }
    if (msg && Array.isArray(msg.orders)) heldList = msg.orders;
    // ...and a list about another hold is no list. A server carrying an Uber
    // add-on with its trip sends one only while the trip is joined
    // (server.js carryingTwo), so the original put down, or a Took that
    // replaced the trip, would otherwise leave two orders drawn over one.
    // The list is first-taken first, as `holding` is: its first is the hold
    // this message names, or the list is stale.
    else if (heldList.length && heldList[0].holdId !== heldId) heldList = [];
    if (msg && typeof msg.unowned === 'number') unownedNow = msg.unowned;
  }

  /* ---------- the chooser ---------------------------------------------------
   *
   * {id, kind: 'scan'|'drop', line, rows: [{pick, n, pay, end}], card, closesInMs}:
   * the server's (chooserForPanel, or Drop's reply). Rows "① $9.48 · Kestrel
   * Dr", "② $28.08 · ?"; for a scan the card being screened as a third row and
   * "Neither"; for Drop, "Both". A press answers it; nothing answers it in ten
   * seconds and it closes, with nothing filed — the server's chooser closes on
   * the same clock and refuses a late answer. */
  var choosing = null;
  var chooserTimer = null;

  function openChooser(c) {
    choosing = Object.assign({}, c, { until: Date.now() + (c.closesInMs || 10000),
                                      // The card "This card" means: the one on
                                      // the record as the chooser opened.
                                      cardOf: onRecord ? onRecord.id : null });
    drawChooser();
    clearTimeout(chooserTimer);
    chooserTimer = setTimeout(closeChooser, Math.max(0, choosing.until - Date.now()));
  }

  function closeChooser() {
    clearTimeout(chooserTimer);
    choosing = null;
    drawChooser();
  }

  // One row: what it is, whole (`who`), and where it ends, the part that
  // gives way (`end`), when it has one.
  function chooserRow(text, cls, pick, end) {
    var b = document.createElement('button');
    b.type = 'button';
    if (cls) b.className = cls;
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = text;
    b.appendChild(who);
    if (end !== undefined) {
      var to = document.createElement('span');
      to.className = 'end';
      to.textContent = '\u00b7 ' + end;
      b.appendChild(to);
    }
    b.addEventListener('click', function () { choose(pick); });
    el.chooser.appendChild(b);
  }

  function drawChooser() {
    while (el.chooser.firstChild) el.chooser.removeChild(el.chooser.firstChild);
    el.chooser.classList.remove('said');
    el.chooser.hidden = !choosing;
    if (!choosing) return;
    var ask = document.createElement('div');
    ask.className = 'ask';
    ask.textContent = choosing.kind === 'drop' ? 'Which did you drop?'
      : 'Whose is ' + (streetOf(choosing.line) || 'this') + '?';
    el.chooser.appendChild(ask);
    (choosing.rows || []).forEach(function (r) {
      chooserRow(circled(r.n) + ' ' + (typeof r.pay === 'number' ? money(r.pay, 2) : '?'),
                 'order', r.pick, streetOf(r.end) || '?');
    });
    // "This card" only while it is still the card on the record. The server
    // stops offering it the moment its card leaves (chooserForPanel) and
    // refuses it after; the sheet went on offering it, under the next
    // card's verdict, a row whose press could only be refused.
    if (choosing.kind !== 'drop' && choosing.card
        && (onRecord ? onRecord.id : null) === choosing.cardOf) {
      chooserRow('This card ' + (typeof choosing.card.pay === 'number'
                                 ? money(choosing.card.pay, 2) : ''), 'card', 'card');
    }
    if (choosing.kind === 'drop') chooserRow('Both', 'none', 'both');
    else chooserRow('Neither', 'none', 'neither');
  }

  function choose(pick) {
    var c = choosing;
    closeChooser();
    if (!c) return;
    if (c.kind === 'drop') {
      var ids = pick === 'both' ? (c.rows || []).map(function (r) { return r.pick; }) : [pick];
      dropBusy = true;
      showDrop();
      ask('/api/delivered', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ holdIds: ids }) }).then(function (r) {
        dropFailed = !r.ok;
        dropFailedFor = r.ok ? null : heldSig;
        return r.ok ? r.json().catch(function () { return {}; }).then(dropAnswered) : null;
      }).catch(function () {
        dropFailed = true;
        dropFailedFor = heldSig;
      }).then(function () {
        dropBusy = false;
        showDrop();
      });
      return;
    }
    // The address itself comes back on the stream when it is filed, as any
    // address does; a refused or late answer files nothing, which is what the
    // driver was told the chooser would do.
    //
    // ...and SAYS so. The server refuses a row the chooser no longer has —
    // "This card" after the card left, an answer past its ten seconds — and
    // the sheet had already closed on the press, so the refusal closed
    // silently: the driver had picked, and nothing on the glass said the
    // address went nowhere. The sheet says it in the place the press was
    // made, for CHOOSER_SAID_MS, and the answer is the same press again.
    var refused = function () { chooserSays('not filed — press ⌖ again'); };
    ask('/api/choose', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify({ id: c.id, pick: pick }) })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) {
          if (!r.ok || !b || b.ok === false) refused();
        });
      }, refused).catch(function () {});
  }

  /* The chooser's sheet holding one line and no rows: what became of the
     press made on it. Gone after CHOOSER_SAID_MS, or as soon as another
     chooser opens over it. Four seconds, chosen and not measured: long
     enough to read at a glance, short enough not to stand over the verdict. */
  var CHOOSER_SAID_MS = 4000;
  function chooserSays(text) {
    clearTimeout(chooserTimer);
    choosing = null;
    drawChooser();
    var line = document.createElement('div');
    line.className = 'ask';
    line.textContent = text;
    el.chooser.appendChild(line);
    el.chooser.classList.add('said');
    el.chooser.hidden = false;
    chooserTimer = setTimeout(closeChooser, CHOOSER_SAID_MS);
  }

  /* ---------- Undo, after a Took that added an order ------------------------ */
  var undoing = null;
  var undoTimer = null;

  // `said`: the bar's words in place of "Added \u2461 \u2026 \u00b7 Undo" \u2014 an Undo that was
  // not saved, offered again for the same order (see the press below).
  function offerUndo(added, said) {
    undoing = added;
    el.undo.textContent = said || ('Added ' + circled(heldList.length || 2) + ' '
      + (typeof added.pay === 'number' ? money(added.pay, 2) : '') + ' \u00b7 Undo');
    el.undo.hidden = false;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function () { undoing = null; el.undo.hidden = true; },
                           added.undoForMs || 5000);
  }

  // The untick the Took button sends pressed again — `accepted: null`, from
  // this panel — for the order the Took added. The server puts that order
  // down and no other (the mark handler's untick).
  el.undo.addEventListener('click', function () {
    var u = undoing;
    undoing = null;
    clearTimeout(undoTimer);
    el.undo.hidden = true;
    if (!u) return;
    // Believing the server, as Took does: the untick is only taken back when
    // the journal took it. A refused one (the journal not writing, a
    // deadline) used to read "Took $9.25?" on the bar all the same, while the
    // order stayed in the car and on the record as taken — two answers to
    // one press, and the wrong one on the glass. Refused, it says so on the
    // bar it was pressed on, and a press there tries again.
    var notSaved = function () {
      offerUndo(u, 'Undo not saved · press to try again');
    };
    ask('/api/offers/mark', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: u.id, accepted: null, via: 'panel', offer: { id: u.id } }) })
      .then(function (r) {
        if (!r.ok) return notSaved();
        return r.json().catch(function () { return null; }).then(function (body) {
          if (onRecord && onRecord.id === u.id) tookState = false;
          if (body && typeof body.holding === 'boolean') {
            if (body.holding) setHeldFrom(body.held, body);
            else orderDown();
          }
          showDrop(); showDest(); showTook(); showHeld(heldMode);
          if (viewMode === 'map') showMap();
        });
      }, notSaved).catch(function () {});
  });

  el.dest.addEventListener('click', function () {
    if (destBusy) return;
    destBusy = true;
    forgetDest();
    destFailed = false;
    showDest();
    ask('/api/dropoff', { method: 'POST' }).then(function (r) {
      return r.json().catch(function () { return null; });
    }).then(function (b) {
      // The one thing the reply does say: whether there is still an order to
      // read a destination for. The server's clock ends a hold with nothing
      // pressed here, and between offers no reading arrives to say so — so
      // Drop and ⌖ Dropoff stayed lit for an order that no longer existed,
      // and pressing this photographed the phone for nothing.
      //
      // ...and ALL of it down, through the one function that knows what an
      // order is. Four names were cleared here and the rest stayed: the hold's
      // id, its planner's stops, the two-order list and the GPS's "at the
      // door". The next ✓ Took then started under them — a reply that names
      // one order kept the old list, so the bar said "Drop ▾" and the card
      // drew a second order that had gone, beside "at dropoff".
      if (b && b.holding === false && holdingNow) {
        orderDown();
        showDrop();
      }
    }).catch(function () {
      /* The scanner answers on its own stream; a failed ask just reads as one
         that found nothing, which is the same thing from here. */
    }).then(function () {
      // Cleared on a timer rather than on a reply, because the reply to this
      // is not the response — it is a `dropoff` line arriving from the scanner
      // seconds later, through the same stream the verdicts come down. The
      // window is the scanner's; this only has to stop saying "reading…" once
      // it has certainly closed.
      setTimeout(function () {
        destBusy = false;
        showDest();
      }, 13000);
    });
  });

  // --- what the shift adds up to ------------------------------------------
  //
  // 4am, not midnight: a shift that ran 16:47 to 03:18 is one evening's work
  // and a calendar date cuts it in half. The same number and the same reasoning
  // as journal.html — if the two screens disagreed about when the day started
  // they would print different counts for the same day.
  //
  // Still written out here, and deliberately: this page does not load
  // advice.js. It is the screen in the car, it has to come up from the service
  // worker with no network, and pulling a library in for one integer would be
  // paying for that at the worst moment. journal.html and advice.js share the
  // one copy; this is the second and it is on purpose. See AUDITS, "The
  // panel".
  var DAY_STARTS_AT = 4;

  // The start of the day currently being driven — 4am today, or 4am yesterday
  // while it is still before four in the morning. Local time throughout,
  // because "today" means today where the driver is, and the rig cannot know
  // that: it has no real-time clock and no idea what timezone the car is in.
  // The page says, exactly as it does for /api/journal.
  //
  // Shift back four hours, floor to midnight, add four back. setHours with a
  // whole-day argument sets the field absolutely, so this is exactly 04:00
  // local whatever daylight saving did in between.
  function dayStart() {
    var d = new Date();
    d.setHours(d.getHours() - DAY_STARTS_AT);
    d.setHours(0, 0, 0, 0);
    d.setHours(DAY_STARTS_AT);
    return d.getTime();
  }

  var shiftAt = 0;
  var shiftBusy = false;
  // A request that arrived while one was in flight, to be run once it
  // lands. Marking an offer during the slow poll is exactly that case.
  var shiftAgain = false;
  // Three minutes. What an ask costs the server, on the same event loop that
  // drives the camera stream, depends on whether it has read the journal
  // since it started. The first read parses the whole file — it reaches 64MB
  // before it rolls, at most about twelve weeks at the 5.7MB a week
  // rpi/journal.py's WEEK_BYTES measures, and a third of that in real rows,
  // 22.4MB, parses in 64-223ms on the development container and more on a
  // Pi 4. Every ask after that reads only the bytes appended since
  // (readJournal in server.js, which keeps its rows), and costs a few
  // milliseconds: see SHIFT_SOON_MS below, which is what rests on that.
  // This said every ask paid the whole parse. readJournal was already tailing
  // the file when that was written, and once SHIFT_SOON_MS below quoted the
  // tail's cost the page gave two different costs for one request. The timer
  // stays at the house budget /api/journal/newest set for a journal-reading
  // GET, "every few minutes", for the reason that never depended on the cost:
  // a shift figure is not a number anybody watches tick.
  var SHIFT_EVERY_MS = 180000;

  // ...but it is a number that should not contradict the card that has just
  // been saved, and at three minutes it did. On 8 Oct the rig's own panel read
  // "✓ 0 · 0 offers" at 3:05pm under a $4.21 PASS whose row had landed 27.6
  // seconds earlier (that 📷 Snap's status.json: offerAgeMs 27566). The poll
  // was the only thing asking, bar a mark.
  //
  // So it is asked again when the rig says it has written an offer: the
  // `{offer: …}` line rpi/scan_pi.py's emit_offer sends once
  // OfferLog.consider has appended the row — journal.py closes the file
  // before it returns, so the row is on disk when the line is sent. It goes
  // out for each new card and again for a later reading of the same card that
  // landed reading differently, and both move this row: the count, and the
  // median and set-aside figures a fuller reading changes.
  //
  // Coalesced, because that is several lines a card. The week replayed through
  // OfferLog.consider wrote 2.8 rows an offer (rpi/journal.py, WEEK_BYTES) and
  // up to ten for one card, and the real week's cards landed as close as 0.87s
  // apart, 77 of 1,165 gaps under five seconds and ten cards in its busiest
  // minute. The first line arms one request SHIFT_SOON_MS later and every line
  // until then rides it. Five seconds is a second longer than the resample
  // burst that follows a card's arrival (RESAMPLE_WINDOW in rpi/scan_pi.py),
  // which is the burst of extra reads a card's fuller readings come out of.
  //
  // Replayed against the week's landing times, one line a card, that is 1,099
  // asks rather than 1,166, never more than nine in a minute. That is per
  // card, and so a floor: a card's later rows send lines too, and one that
  // lands after the window its card's first line opened has closed arms an
  // ask of its own. The export keeps one time a card, so when those landed is
  // not on file. The replay that measured WEEK_BYTES stamps each frame of a card
  // one read time (the row's `ms`) after the one before; counted over its
  // 3,265 rows that way it is 1,416 asks rather than 3,265, never more than
  // ten in a minute.
  //
  // Many more asks than the timer above makes, and outside the "every few
  // minutes" it keeps — on purpose, and on what an ask costs once the
  // journal has been read: only the appended bytes are parsed. /api/today
  // right after an append measured 2.9-3.1ms median and 6.4ms worst on the
  // replayed week (5.7MB a week, WEEK_BYTES), and 4.2-4.5ms median and 9.9ms
  // worst on four of it (22.9MB) — two runs of 60 appends each, on the
  // development container. The whole-file parse the timer was sized against
  // is paid once, by the first read of the journal after the server starts or
  // the file rolls: 44-59ms and 161-198ms on those two, as the first
  // /api/today.
  //
  // Any ask at all answers what is pending — see loadShift — so a mark inside
  // the window is the only request, not one of two.
  //
  // Not in a background tab, for the reason the poll's own tick gives: nobody
  // is reading it, and a phone with the panel open behind something else
  // would otherwise ask the rig to read its journal every five seconds of a
  // busy hub. It is left owing instead — `shiftAt` zeroed, so the first tick
  // the tab is visible again asks at once rather than up to three minutes on.
  var SHIFT_SOON_MS = 5000;
  var shiftSoonTimer = null;

  function shiftSoon() {
    if (shiftSoonTimer) return;
    shiftSoonTimer = setTimeout(function () {
      shiftSoonTimer = null;
      if (document.hidden) { shiftAt = 0; return; }
      loadShift();
    }, SHIFT_SOON_MS);
  }

  function showShift(s) {
    if (!s) { el.shift.hidden = true; shiftFull = ''; fillMore(); return; }
    var bits;
    // What the row itself carries, when the figures are there: the ticks and
    // what they came to, and the median with its noun (see showStatus).
    var short = null;
    if (s.clockSet === false) {
      // The rig's own clock has not been set, so it does not yet know what day
      // it is on. Every window over the journal is meaningless until NTP lands,
      // and a plausible-looking count is worse than none.
      bits = ['today: waiting for the clock'];
    } else if (s.unreadable) {
      // Empty and unreadable look identical on a panel unless one of them says
      // so, and this is the one worth acting on.
      bits = ['today: the journal could not be read'];
    } else if (s.rolled) {
      bits = ['today: the journal just rolled over'];
    } else if (s.failed) {
      // The request itself failed — an answer that was a 500, a deadline that
      // fired while the server was parsing the journal, a dropped packet on
      // car wifi. This used to blank the row, and SHIFT_EVERY_MS is three
      // minutes, so one lost request took the only takings figure on the
      // panel off the glass for three minutes with nothing in its place. A
      // blank reads exactly like a night with nothing in it.
      //
      // About the FIGURES, not about reaching the rig: when the rig is really
      // gone the connection line beside this already says "reconnecting to
      // the server…", and this saying it too would be one question answered
      // twice on one bar. The case only this row can name is a reachable rig
