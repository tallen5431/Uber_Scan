<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uber Scan — Live</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<style>
  /* Read at arm's length, in a car, at a glance. Nothing subtle here. */
  #app { justify-content: center; }
  .live { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--pad); }

  /* On the rig's own dashboard screen — wide, short, 800x480 or less — the
     verdict and the camera view sit side by side instead of stacked. Stacked,
     each got half of 480px and the verdict ended up smaller on the dedicated
     display than on a phone, which is exactly backwards: this panel exists to
     be read from the driver's seat.

     The camera view is the half that gives way. It matters while aiming the
     mount and hardly at all afterwards, whereas the verdict is the entire
     reason the screen is there. */
  @media (orientation: landscape) {
    #app { display: grid;
           grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
           grid-template-rows: minmax(0, 1fr) auto auto;
           align-content: start; }
    /* `safe`, which is the difference between overflowing downward and
       overflowing upward. Centred content that is taller than its box spills
       equally in both directions, and the top is where the word ACCEPT lives —
       so on the one screen whose whole job is to show a verdict, the verdict's
       name was the first thing to be clipped away. `safe center` centres while
       it fits and falls back to the top when it does not. */
    .live { grid-column: 1; grid-row: 1; justify-content: safe center; }
    /* The panel takes the height of the row it is in rather than only the
       height of its own words. On a 1280x800 panel the verdict was 352px of a
       788px column and the rest was black — the same complaint that started
       this, one screen along. Stretched, with the contents centred inside it,
       so the number has somewhere to grow into and the card looks like a card
       rather than a label floating in the dark. */
    .live #verdict { flex: 1 1 auto; display: flex; flex-direction: column;
                     justify-content: center; min-height: 0; }
    #viewWrap { grid-column: 2; grid-row: 1; margin: 0; min-height: 0;
                align-self: center; }
    /* Bounded by the row it is in rather than by the viewport. It used to be
       `100dvh - 132px`, which is a guess at what the bars below it cost, and a
       guess that is too big overflows the page — the whole reason the bottom
       bar ended up off the glass. `100%` is the row, and the row is what is
       actually left over. */
    #viewWrap img { max-height: 100%; object-fit: contain; }
    /* The details block has no room on a dashboard panel and is hidden below,
       but it still needs a cell or it lands in the middle of the grid. */
    #raw { grid-column: 1 / -1; grid-row: 2; }
    .connbar { grid-column: 1 / -1; grid-row: 2; }
    .bottombar { grid-column: 1 / -1; grid-row: 3; }
    /* Never taller than the glass. Everything above lays the page out across
       the panel instead of down it precisely so it fits; this is the assertion
       that it did, and it is what stops a bar of controls scrolling out of
       reach of a driver who is not going to be scrolling. */
    #app { height: 100dvh; min-height: 0; overflow: hidden; }
    /* When there is no camera frame to show — before the first one arrives, or
       on a machine with no camera at all — the verdict takes the whole panel
       rather than sitting in half of it beside a black rectangle. The view is
       what gives way, because it matters while aiming the mount and the
       verdict is why the screen is bolted to the dashboard. */
    #app:has(#viewWrap.gone) { grid-template-columns: minmax(0, 1fr); }
    #viewWrap.gone { display: none; }

    /* Reading the phone rather than aiming at it.
     *
     * A phone is portrait and this panel is landscape, so the picture is
     * bounded by height and the columns should not be split evenly: at
     * 1.25fr/1fr the image was width-bound at 345px on an 800x480 screen and
     * drew 260px tall in a 468px row, leaving 200px of the one dimension it
     * actually wanted. Given the height, the same phone comes out 468px tall —
     * a little under twice the linear size, on top of the six-fold gain in the
     * picture itself.
     *
     * The verdict keeps the rest of the width. It is still the reason the
     * screen is bolted to the dashboard; it is just no longer the only thing
     * on it worth looking at, and a phone screen you cannot read the buttons
     * on is not a phone you can drive with a mouse. */
    body.phoneview #app { grid-template-columns: minmax(0, 1fr) auto; }
    /* Down the whole panel, not just the row the verdict is in. The bar of
       controls and the connection line were spanning both columns, so the
       picture stopped 78px above the bottom of an 800x480 screen and the space
       it stopped for was black: the verdict does not fill its row either. With
       every row to itself the same phone is 468px tall instead of 382, and the
       controls lose nothing — five buttons across the remaining 520px is still
       104px each. */
    body.phoneview #viewWrap  { grid-column: 2; grid-row: 1 / -1; }
    body.phoneview .connbar   { grid-column: 1; }
    body.phoneview .bottombar { grid-column: 1; }
    body.phoneview #viewWrap { align-self: stretch; display: flex;
                               align-items: center; justify-content: flex-end; }
    body.phoneview #viewWrap img {
      /* Height first, and width whatever the phone's own shape makes it. The
         base rule is `width: 100%`, which on a portrait picture in a landscape
         cell is the wrong axis to pin. */
      width: auto; height: 100%; max-width: 100%; max-height: 100%;
    }
    /* The caption sits under a picture that is now as tall as the row, so it
       has nowhere to be. The picture says what it is. */
    body.phoneview #viewNote { display: none; }
    /* The rate is sized against the panel it sits in, and that panel is now a
       column rather than the whole width.
       Four limits, and whichever bites first wins: the panel's width, the
       panel's height, an absolute ceiling, and the column the number has to fit
       inside. The height term is what lets a 1024x600 panel spend its extra
       room on the one number the screen exists for — the flat 92px cap left it
       the same size as on an 800x480, with 130px of black above and below.
       The ceiling is 170 rather than 140 because at 140 it was the term that
       bit on a 1024x600 panel, which put the absolute cap back in charge of
       the exact screen the height term was added for; at 170 the height wins
       there (156px) and the width still wins on an 800x480 (128px), which is
       the arrangement intended. */
    #perHour { font-size: min(16vw, 26dvh, 240px,
                              calc((100cqw - 40px) / (var(--chars) * 0.62))); }
    /* ...and it gives some of that back when there is something to say. A
       notice is two more lines inside a panel that is already as tall as the
       row it sits in, so without this the panel grows past the glass and the
       word ACCEPT is the part that goes — clipped off the top, on the one
       screen whose whole job is to show it. */
    #verdict:has(#warn:not([hidden])) #perHour {
      font-size: min(12vw, 17dvh, 96px,
                     calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
    /* ...and the room comes out of the line that is already on screen twice.
       This hid the whole working, which is where the raw $/hr lives and the
       only place on this page it appears. A notice is showing for the whole
       life of a card whenever the distance was unreadable — that flag is a
       stored property of the merged reading and never clears — so on 52 of
       one real shift's 121 offers the raw figure was not slow to arrive, it
       never arrived at all. Those are also exactly the offers where no
       mileage cost was taken off, so the working had no net line either and
       the block rendered nothing: a hidden empty box, bought at the price of
       the one number it was there to show.

       The net line is the headline, in small type. Dropping that costs
       nothing a glance needs and buys the same line of height. */
    #verdict:has(#warn:not([hidden])) .working .net { display: none; }
    #raw, #viewNote { display: none; }
  }

  /* Smaller again, and the arithmetic behind the headline gives up most of its
     room: the verdict, the rate and the figures off the card are what a glance
     needs, and the sum that connects them can be checked on a bigger screen
     when parked.

     Most of it, not all of it. This hid the working outright, and the working
     is the only place on this page the raw $/hr appears — so between here and
     the notice rule above there were two separate ways for that figure to be
     absent and nothing on screen to tell either of them from a number the page
     had failed to work out. What survives is the one line that is not written
     anywhere else; the net line goes, because it is the headline in small type,
     and so does the pay-and-time half of the raw line, which is a check against
     the card rather than a figure. */
  @media (orientation: landscape) and (max-height: 380px) {
    .working .net { display: none; }
    .working .raw span:first-child { display: none; }
    .working .raw i { font-style: normal; }
    /* `=` opens a sum whose left-hand side is no longer on screen. */
    .working .raw i:first-of-type { display: none; }
    .working { font-size: 11px; margin-top: 2px; }
    #detail { display: none; }
    /* On a panel this small a notice and the figures cannot both fit, and the
       notice wins: it is there because something is wrong with the reading, so
       the three numbers underneath it are the ones not to trust. The headline
       and the reason for doubting it are the pair worth keeping. */
    #verdict:has(#warn:not([hidden])) .submetrics { display: none; }
  }

  /* The number is sized to the panel and to how many characters it has to
     hold. A fixed 180px fits "$25" and runs "$41.6" off the edge — which is
     what a real offer did on a wide screen, pushing the "/hr" past the border.
     Sized against the panel rather than the viewport because the panel is what
     it has to fit inside. */
  .verdict { container-type: inline-size; }
  .big .rate-value {
    --chars: 4;
    font-size: min(28vw, 180px, calc((100cqw - 70px) / (var(--chars) * 0.62)));
  }
  /* Nothing to report: a 180px "--" is a pair of grey slabs, not information,
     and a row of dashes under a rule reads as a table that failed to load.
     Between offers the panel says only what it knows, which is the phase. */
  .verdict.novalue .rate,
  .verdict.novalue .submetrics { display: none; }
  /* The headline is the one number that cannot be shown here. $1184 over twenty
     minutes is $3548/hr, and at that size, in that position, it is read before
     the label above it is. The card's own pay, time and distance stay below,
     because those are what the driver checks against the phone in their hand. */
  /* The working goes; the rate keeps its box and shows nothing. */
  .verdict.doubt .working { display: none; }
  .verdict.doubt .rate-value { color: var(--doubt); }
  .stale { opacity: .35; }
  /* Diagnostics, not a heading. It was uppercase with wide tracking, which
     made a line of read timings shout louder than the verdict above it. */
  .pending { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .connbar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; color: var(--muted); padding: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--no); }
  .connbar a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
  /* One line, and it gives way rather than widening the row. `min-width: 0`
     because a flex item will not shrink below its content without it, and this
     row sits on a panel the page is held to fitting — a long shift line that
     pushed the row wider would scroll the whole screen sideways. No colour of
     its own: it inherits the row's muted grey, which is what a fact you glance
     at rather than drive by should look like beside a verdict. */
  #shift {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #shift[hidden] { display: none; }
  .dot.on { background: var(--go); }
  #viewWrap { margin: 0; }
  #viewWrap img {
    width: 100%; display: block; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel);
  }
  #viewWrap img.stalefeed { opacity: .4; }
  #viewNote { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 0 0; }
  #viewWrap.gone img { display: none; }

  /* Drawing the box to read. The scanner finds the phone by looking for it,
     which is right almost always and useless when it is not — a reflection, a
     second lit screen, a phone with nothing darker around it. There is no
     aiming your way out of those, so the person looking at the picture can say
     where the card is instead. */
  #viewWrap { position: relative; }
  #viewWrap.drawing img { touch-action: none; cursor: crosshair; }
  #drawn {
    position: absolute;
    border: 2px solid #17c964;          /* the outline the scanner draws, same green */
    border-radius: 4px;
    /* A tint rather than a hole punched in a full-page dim: this page keeps the
       verdict above and the buttons below usable while the box is being drawn. */
    background: rgba(23, 201, 100, .14);
    pointer-events: none;
  }
  #drawn[hidden] { display: none; }
  #drawTools { display: none; gap: 8px; padding: 8px 0 0; }
  #viewWrap.drawing #drawTools { display: flex; }
  /* .linkbtn is only styled inside .bottombar, and these two are not there. */
  #drawTools button {
    flex: 1;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 6px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
  }
  #drawTools #drawUse:not([disabled]) { background: #0d5c31; border-color: #17c964; color: #d7ffe6; }
  #drawTools button[disabled] { opacity: .45; }
  #drawHint { font-size: 12px; color: var(--muted); text-align: center; padding: 6px 0 0; }
  /* Four buttons here, and the bar sizes itself to them. Tighter type because
     four labels in a phone's width is the tightest this bar ever gets. */
  .bottombar button, .bottombar .linkbtn {
    font-size: 13px; padding: 10px 4px; white-space: nowrap;
  }
  #setBox.on {
    background: #0d5c31; border-color: #17c964; color: #d7ffe6;
  }

  /* What the reader actually saw. Folded away by default, because it is only
     ever wanted after a wrong answer — and after a wrong answer it is the only
     thing that explains it. */
  #raw { font-size: 11px; color: var(--muted); }
  #raw summary { cursor: pointer; padding: 4px 0; }
  #raw pre {
    margin: 4px 0 0; padding: 8px; white-space: pre-wrap; word-break: break-word;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    max-height: 28vh; overflow: auto; font-size: 11px; line-height: 1.45;
  }

  /* ---------- Sizes for the driver's seat ----------
   *
   * Last in the file on purpose. Everything above is written for a phone held
   * about 30cm away; the rig's own panel has the same pixel density and sits
   * roughly twice as far off, so the same letter subtends half the angle. The
   * lines below were all literal pixel values — 12.5px of read timings, a 12px
   * connection line, a 13px bar of controls — and the dashboard breakpoint near
   * the top of this file could not touch them, because they are declared after
   * it and win on source order. Written up here, they are simply later.
   *
   * The verdict itself was never the problem. These are the small things around
   * it that a driver still has to read: which figure is which, what the buttons
   * do, and whether anything is still reading offers.
   */
  @media (orientation: landscape) {
    .pending { font-size: 16px; }
    .connbar { font-size: 15px; padding: 4px; }
    .dot { width: 11px; height: 11px; }
    .bottombar button, .bottombar .linkbtn { font-size: 17px; padding: 8px 4px; }
    #drawTools button { font-size: 17px; }
    #drawHint { font-size: 15px; }
  }
</style>
</head>
<body>

<main id="app">
  <div class="live">
    <section id="verdict" class="verdict empty">
      <div class="verdict-label" id="verdictLabel">WAITING FOR AN OFFER</div>
      <div class="rate big">
        <span class="rate-value" id="perHour">--</span>
        <span class="rate-unit" id="rateUnit">/hr</span>
      </div>
      <!-- The arithmetic behind the headline, spelled out, in two steps: what
           the card pays per hour, and what is left after running the car. A
           rate a driver cannot reconstruct at a glance is a rate they cannot
           act on, and both halves are worth seeing — one is checkable against
           the offer, the other is the one that decides. -->
      <div class="working" id="working" hidden></div>
      <!-- As read off the card, so it can be checked against the phone in the
           two seconds before the offer times out. These three are deliberately
           the raw numbers: their whole job is to match what is on the screen. -->
      <div class="submetrics">
        <div class="sub"><span id="vPay">--</span><small id="lPay">pay</small></div>
        <div class="sub"><span id="vMin">--</span><small id="lMin">minutes</small></div>
        <div class="sub"><span id="vMile">--</span><small id="lMile">miles</small></div>
        <div class="sub"><span id="vPerMile">--</span><small id="lPerMile">$/mi</small></div>
      </div>
      <!-- Where the job goes. Sent on every read since the scanner learned to
           read a map, and painted nowhere until now — so the one screen a
           driver is actually looking at while they decide was the only one that
           could not tell them whether they recognise the job. Under the
           figures, because it is what you scan to recognise a job rather than
           what you judge it by. -->
      <div class="places" id="places" hidden></div>
      <div id="warn" class="notice" hidden></div>
    </section>
    <div class="pending" id="detail" style="text-align:center"></div>
  </div>

  <!-- What the camera is actually looking at. The inset is the exact image
       handed to the reader, so aim and focus are both visible here.

       A child of #app rather than of .live, which is not a detail. On the rig's
       own dashboard panel #app becomes a two-column grid — the verdict beside
       the camera view — and this carries `grid-column: 2`. Nested one level
       deeper that property applied to nothing at all: .live is a flex column,
       so the view stacked underneath the verdict inside the left-hand column,
       and the right-hand column stayed empty. Measured on an 800x480 panel: two
       columns of 431px and 345px, the verdict rendered at 431px, the camera
       view at 431px below it, 43% of the glass black, and the page overflowing
       to 768px so the bottom bar fell off the bottom of the screen.

       Only visible when the camera is working, which is why it survived: with
       no frame the `:has(.gone)` rule collapses the grid to one column and the
       page looks right. -->
  <figure id="viewWrap">
    <img id="view" alt="live camera view">
    <!-- Where the driver says the card is, when the scanner cannot find it. -->
    <div id="drawn" hidden></div>
    <figcaption id="viewNote">camera view · inset is what the reader sees</figcaption>
    <div id="drawHint" hidden>drag a box around the offer card on the phone</div>
    <div id="drawTools">
      <button type="button" class="linkbtn" id="drawUse" disabled>✓ Read this box</button>
      <button type="button" class="linkbtn" id="drawCancel">✕ Cancel</button>
    </div>
  </figure>

  <details id="raw" hidden>
    <summary>what the reader read</summary>
    <pre id="rawText"></pre>
  </details>

  <!-- The status link lives here rather than in the bottom bar, which has three
       slots and now spends one on something needed mid-shift. This is raw JSON
       for diagnosing a rig, so it belongs next to the connection state anyway. -->
  <!-- The verdict is the content of this page and it changes without a
       navigation, a focus move or anything else assistive tech notices.
       `atomic` because "ACCEPT $25.3" is one statement, not two updates. -->
  <p class="sr-only" id="spoken" role="status" aria-live="polite" aria-atomic="true"></p>

  <!-- What the shift adds up to, on the status row rather than inside the
       verdict card. The card has 20-50px of slack at 800x480 and the rules that
       fire when a notice shows already spend a line's worth of it buying the
       headline room back — on one real shift that was 52 of 121 offers. A
       permanent line in there would take that reserve away, and the overflow
       does not scroll: #verdict centres its children with plain `center`, so
       the excess clips off the TOP and the word ACCEPT goes first.

       This row is `auto` height and already holds one line, so a second item on
       it is nearly free. It also outlives a card, which is the point — the
       address above clears when the offer goes because it belongs to that
       offer, and a shift does not. -->
  <div class="connbar"><span class="dot" id="dot"></span><a id="conn" href="/api/status">connecting…</a><span id="shift" hidden></span></div>

  <nav class="bottombar">
    <!-- The one thing the rig cannot see: whether the driver pressed Accept.
         It must never press it, so this is the only way that fact ever reaches
         the record — and until now it meant opening the offers page afterwards
         and finding the row.

         It names the offer because by the time a driver has accepted on their
         phone the card is gone from this panel: the scanner sees the navigation
         screen, reads no card, and the verdict clears. A button saying only
         "took it" would be marking something they can no longer see. -->
    <button type="button" class="linkbtn" id="took" hidden></button>
    <a class="linkbtn" href="index.html">⌨ Type</a>
    <a class="linkbtn" href="journal.html">▤ Offers</a>
    <button type="button" class="linkbtn" id="setBox">▣ Set box</button>
    <button type="button" class="linkbtn" id="reset">⟳ Re-find</button>
    <!-- Two things this picture gets used for, and they want opposite
         pictures. Aiming the mount wants the whole scene with the outline on
         it; working the phone through this screen — which is what a bluetooth
         mouse on the phone and the rig's display in front of you amounts to —
         wants the phone's screen and nothing else. `aria-pressed` because it
         is a mode, not a navigation. -->
    <button type="button" class="linkbtn" id="viewMode" aria-pressed="false"
            title="Switch between the whole scene and the phone's screen"
            >⛶ Phone</button>
  </nav>
</main>

<script>
(function () {
  'use strict';

  // An offer the scanner stopped seeing this long ago is history, not news.
  // Ninety seconds was long enough to sit through most of an offer's life
  // showing a verdict that had stopped being about anything.
  //
  // What this is measured against is a *heartbeat*, not a reading. It used to
  // be readings, on the reasoning that the scanner emits several times a second
  // while a card is on screen and keeps emitting between cards — and neither
  // half of that is true. A still picture moves the motion gate not at all, so
  // between offers there can be minutes with no read; and a card sitting
  // unchanged has its verify beat back off to twelve seconds, so with a 1.4s
  // read on the end of it the silence reaches 13.4s. The page would dim the
  // verdict and say the rig had stopped, at the moment the driver is reading it
  // to decide. The loop now says "still here" every four seconds, which is what
  // this is comparing against and is the thing actually worth knowing.
  var STALE_MS = 12000;

  var el = {};
  ['verdict', 'verdictLabel', 'perHour', 'vPay', 'vMin', 'vMile', 'warn', 'detail', 'conn', 'dot',
   'lPay', 'lMin', 'lMile', 'raw', 'rawText', 'rateUnit', 'vPerMile', 'lPerMile',
   'working', 'places', 'spoken', 'took', 'shift']
    .forEach(function (id) { el[id] = document.getElementById(id); });

  // Keep the headline number inside the panel whatever it says. The unit comes
  // with it: while aiming, that number is a pixel count, and labelling a pixel
  // count "/hr" made a mount measurement read as a fantastic offer.
  // The headline, at a size that does not move.
  //
  // Sizing to the exact character count meant $9.8 rendered about 25% larger
  // than $25.3, so the number visibly jumped every time the rate crossed ten —
  // on a screen being glanced at from a moving car, where the one thing that
  // should be still is the digit you are trying to read. Five characters is
  // the width of everything from "$9.8" to "$1234", so within any rate this
  // rig can produce the size is now constant.
  var RATE_CHARS = 5;

  function setRate(text, unit, keepLayout) {
    el.rateUnit.textContent = unit || '/hr';
    el.perHour.textContent = text;
    el.perHour.style.setProperty('--chars', Math.max(RATE_CHARS, text.length));
    el.verdict.classList.toggle('novalue', text === '--' && !keepLayout);
  }

  // "-$10.60", not "$-10.6". A minus sign wedged between the dollar and the
  // digits is a dash at a glance, and the two parked screens already write it
  // the other way — so the same offer read as a loss on one screen and,
  // briefly, as a number on the other.
  function rateText(n) {
    if (n === null || n === undefined || !isFinite(n)) return '--';
    var big = Math.abs(n) >= 100;
    return (n < 0 ? '-$' : '$') + (big ? Math.round(Math.abs(n))
                                       : Math.abs(n).toFixed(1));
  }

  // One sentence, only when it changes.
  //
  // The scanner emits several times a second, and a live region that is
  // rewritten on every frame is read continuously and tells you nothing. What
  // matters is the verdict and the rate it was made on, so that is the whole
  // announcement and it is silent until one of them moves.
  var saidLast = '';

  function announce(r) {
    var say = r.state === 'doubt'
      ? ({ pay: 'Check the pay.', time: 'Check the time.',
           speed: 'Check the distance.' }[r.doubt] || 'Read that again.')
      : (({ go: 'Accept', warn: 'Close call', no: 'Pass' }[r.state] || '')
         + ', ' + rateText(r.perHour) + ' an hour'
         + (r.locked && r.whole !== false ? '.' : ', still reading.'));
    if (say === saidLast) return;
    saidLast = say;
    el.spoken.textContent = say;
  }

  function showRaw(text) {
    var body = (text || '').trim();
    el.raw.hidden = !body;
    if (body) el.rawText.textContent = body;
  }

  var last = null;
  var phase = null;      // setup progress, before any offer exists
  // When this page last heard anything at all, by its own clock.
  var seenAt = Date.now();

  // ...and, separately, when a *reading* last arrived.
  //
  // These were one clock and had to become two the moment the loop started
  // sending a heartbeat. A heartbeat proves the loop is turning, which is what
  // the connection dot and the picture are about; it proves nothing whatever
  // about the verdict on screen. Merged, the heartbeat kept the clock fresh
  // while every read was failing — a degenerate quad, a tesseract that died, a
  // full disk — and the page went on showing the last ACCEPT at full opacity,
  // green dot, over a live picture of whatever card was actually in the mount.
  // Measured on a rig with reads raising: 50 heartbeats, 2 verdicts, and
  // nothing on the screen admitting it.
  var readAt = Date.now();

  // Longer than the verdict beat can legitimately be quiet, and no longer.
  //
  // The scanner's ceiling on that beat is VERIFY_MAX and a read lands on the
  // end of it, so the largest healthy gap between verdicts is those two added
  // together. This was 20s when the ceiling was 12s and a read was 1.4s; both
  // of those halved, and a window that stays wide after the thing it was sized
  // against got quicker is a window that lets a dead rig look alive for longer
  // than it has to. 6.0 + 0.75 is 6.75s, and this leaves most of it again as
  // slack for a loaded Pi.
  //
  // The two constants live in two files. test_scan_pi.py reads this one out of
  // this page and asserts the relationship, rather than keeping a copy of it.
  var READ_STALE_MS = 12000;

  // An age off the wire, made safe to subtract from this page's clock.
  //
  // A missing one means "no idea", and the honest answer to that is the oldest
  // thing this page can represent rather than the freshest: a verdict of
  // unknown age is exactly the one not to vouch for. A negative one is a clock
  // that disagrees with itself, and clamping it is what stops an age from
  // reading as the future and never going stale at all.
  function age(ms) {
    if (typeof ms !== 'number' || !isFinite(ms) || ms < 0) return READ_STALE_MS + 1;
    return ms;
  }
  var socketUp = false;
  var scannerState = null;
  // The camera is out of room: the phone is brighter than it can take at any
  // setting that does not make the screen ripple. Not a fault in the rig, and
  // the one thing that fixes it is a slider on the phone in the driver's hand —
  // so it belongs on this screen and nowhere else.
  var tooBright = false;
  // The same complaint from the other end, and the one nothing used to report:
  // gain on its ceiling, already on the longest exposure, and the screen still
  // under target. The picture goes dark and the reads go with it.
  var tooDim = false;

  // A card is under the reader right now. The gap this fills is the one the
  // driver actually notices: a read is about 1.4 seconds on a Pi 4 and this
  // panel spent every one of them saying WAITING FOR AN OFFER over a row of
  // dashes, which is what it says when the phone is blank. The card was there
  // and the rig had already started on it.
  var readingAt = 0;

  // ...and how long that claim is good for. A read that has not come back in
  // this long did not take a while, it failed: the loop reports a broken read
  // to its log rather than as a reading, so nothing would ever clear this.
  // Comfortably longer than a slow read on a loaded Pi and far short of the
  // staleness test above, so a stuck reader shows as stale rather than as
  // permanently busy.
  var READING_MS = 8000;

  // Said in terms of what to do, not what happened. "Clipping at the gain
  // floor" is true and useless; the driver is holding the thing that fixes it.
  var TOO_BRIGHT = 'Phone screen too bright for the camera — turn its '
                 + 'brightness down a notch.';
  var TOO_DIM = 'Phone screen too dim for the camera — turn its brightness up '
              + 'a notch, or move the mount out of the shade.';

  // Where the job goes, as the card wrote it.
  //
  // One line, ellipsised. An address can be sixty characters and this panel is
  // read at arm's length in a moving car: a second line of small grey text
  // costs the headline room it needs more. Two places are joined with an arrow,
  // the same way the offers page writes them, so the two screens read alike.
  function showPlaces(list) {
    var where = (list || []).filter(function (p) { return !!p; });
    el.places.textContent = where.join(' \u2192 ');
    el.places.hidden = !where.length;
  }

  // The last offer the scanner wrote to the journal, and whether the driver has
  // said they took it.
  //
  // Not the offer on screen: those are the same thing only in the moment before
  // a decision, and the decision is made on the phone, after which the card
  // goes away. This is what the button marks and what it is named after.
  var onRecord = null;
  var tookState = false;
  var tookBusy = false;

  function showTook() {
    if (!onRecord || !onRecord.id) {
      el.took.hidden = true;
      return;
    }
    el.took.hidden = false;
    // Past tense, and the amount. "Took $8.04" is a note about a decision
    // already made; anything in the imperative could be read, on a screen
    // bolted to a dashboard next to a verdict, as doing something to the offer
    // — and the one thing this rig must never do is press Accept.
    var what = (typeof onRecord.pay === 'number')
      ? '$' + onRecord.pay.toFixed(2) : 'the last one';
    // No "undo" in the label: at this width it overflowed the button by 20px
    // and the word was clipped off, which is worse than not offering it — an
    // affordance nobody can see is not an affordance. It is a toggle, styled
    // when set, exactly as the same control on the offers page behaves.
    el.took.textContent = tookBusy ? '…'
      : (tookState ? '\u2713 Took ' + what : 'Took ' + what + '?');
    el.took.title = tookState
      ? 'Recorded as taken. Press again if that was wrong.'
      : 'Record that you accepted this offer. It does not touch your phone.';
    el.took.classList.toggle('on', tookState);
    el.took.setAttribute('aria-pressed', tookState ? 'true' : 'false');
  }

  el.took.addEventListener('click', function () {
    if (!onRecord || !onRecord.id || tookBusy) return;
    var want = !tookState;
    tookBusy = true;
    showTook();
    fetch('/api/offers/mark', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // By id, never by pay-and-minutes. Marking by the figures is a *rule*
      // that catches every offer paying that to the cent, and two genuinely
      // different cards doing exactly that inside one window is a case this
      // project has already met — see rpi/test_repeats.py.
      body: JSON.stringify({ id: onRecord.id, accepted: want })
    }).then(function (r) {
      if (r.ok) tookState = want;
    }).catch(function () {
      /* The record is the point; a failed write must not look like a success. */
    }).then(function () {
      tookBusy = false;
      showTook();
      // The count on the status row is about to be wrong by one. Marking is the
      // only thing on this screen that changes it, so it is also the only time
      // it is worth asking again off the timer — and leaving it until the next
      // slow poll would mean pressing "took it" and watching the number beside
      // it not move.
      loadShift();
    });
  });

  // --- what the shift adds up to ------------------------------------------
  //
  // 4am, not midnight: a shift that ran 16:47 to 03:18 is one evening's work
  // and a calendar date cuts it in half. The same number and the same reasoning
  // as journal.html — if the two screens disagreed about when the day started
  // they would print different counts for the same day.
  var DAY_STARTS_AT = 4;

  // The start of the day currently being driven — 4am today, or 4am yesterday
  // while it is still before four in the morning. Local time throughout,
  // because "today" means today where the driver is, and the rig cannot know
  // that: it has no real-time clock and no idea what timezone the car is in.
  // The page says, exactly as it does for /api/journal.
  //
  // Shift back four hours, floor to midnight, add four back. setHours with a
  // whole-day argument sets the field absolutely, so this is exactly 04:00
  // local whatever daylight saving did in between.
  function dayStart() {
    var d = new Date();
    d.setHours(d.getHours() - DAY_STARTS_AT);
    d.setHours(0, 0, 0, 0);
    d.setHours(DAY_STARTS_AT);
    return d.getTime();
  }

  var shiftAt = 0;
  var shiftBusy = false;
  // Three minutes. The server has to read and parse the whole journal to
  // answer, on the same event loop that drives the camera stream — a year of
  // driving is around 19MB and the best part of a second of frozen loop on a
  // Pi 4. /api/journal/newest already sets the house budget for a
  // journal-reading GET at "every few minutes", and a shift figure is not a
  // number anybody watches tick.
  var SHIFT_EVERY_MS = 180000;

  function showShift(s) {
    if (!s) { el.shift.hidden = true; return; }
    var bits;
    if (s.clockSet === false) {
      // The rig's own clock has not been set, so it does not yet know what day
      // it is on. Every window over the journal is meaningless until NTP lands,
      // and a plausible-looking count is worse than none.
      bits = ['today: waiting for the clock'];
    } else if (s.unreadable) {
      // Empty and unreadable look identical on a panel unless one of them says
      // so, and this is the one worth acting on.
      bits = ['today: the journal could not be read'];
    } else if (s.rolled) {
      bits = ['today: the journal just rolled over'];
    } else {
      bits = [s.offers + (s.offers === 1 ? ' offer' : ' offers')];
      if (s.setAside) bits.push(s.setAside + ' set aside');
      bits.push('took ' + s.took);
      // Only when there is one. A median of nothing is not zero.
      if (typeof s.median === 'number') {
        bits.push('median $' + Math.round(s.median) + '/hr');
      }
      // Offers the rig recorded before its clock was right. They are stamped
      // 1970 on disk and cannot fall inside any day, so the count above is
      // short by this many and says so rather than quietly losing them.
      if (s.beforeClock) {
        bits.push(s.beforeClock + ' before the clock was set');
      }
    }
    el.shift.textContent = '· ' + bits.join(' · ');
    el.shift.hidden = false;
  }

  function loadShift() {
    if (shiftBusy) return;
    shiftBusy = true;
    shiftAt = Date.now();
    fetch('/api/today?since=' + dayStart()).then(function (r) {
      // An older build has no such route, and an unknown /api path on this
      // server falls past every handler to a text/plain 404 — so `.json()`
      // rejects with a SyntaxError rather than returning a status to branch on.
      // Both paths have to end up in the same place.
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (s) {
      showShift(s);
    }).catch(function () {
      // Not a silent swallow. Leaving the last good figures up with nothing
      // saying they are old is the failure this file keeps warning about — an
      // hour into a shift they would still read like the truth.
      showShift(null);
    }).then(function () {
      shiftBusy = false;
    });
  }

  var PHASE_LABEL = {
    check: 'CHECKING',
    aim: 'AIM THE CAMERA',
    calibrated: 'CALIBRATED',
    scanning: 'WAITING FOR AN OFFER',
    error: 'SCANNER PROBLEM'
  };

  function money(n, d) {
    if (n === null || n === undefined || !isFinite(n)) return '--';
    return (n < 0 ? '-$' : '$') + Math.abs(Number(n)).toFixed(d);
  }

  function render() {
    var r = last;
    if (!r || !r.ready) {
      // Before the first offer the useful thing to show is setup progress, so
      // the page doubles as the aiming instructions.
      var p = phase || {};
      // Not `no`. A fault is not a verdict, and painting the panel in the PASS
      // red means a glance at a dead scanner reads as "decline this offer" —
      // the driver acts on a decision nothing made.
      el.verdict.className = 'verdict ' + (p.phase === 'error' ? 'fault' : 'empty');
      // A card under the reader is not "waiting for an offer", and saying so
      // was the panel's least honest second and a half. Not while aiming or
      // faulted: both of those are about the rig rather than about a card, and
      // both are what the driver is there to fix.
      var busy = readingAt && (Date.now() - readingAt) < READING_MS
                 && p.phase !== 'error' && p.phase !== 'aim';
      el.verdictLabel.textContent = busy ? 'READING THE CARD'
        : (PHASE_LABEL[p.phase] || 'WAITING FOR AN OFFER');
      // Only while aiming, where the number means pixels and says so. On any
      // other phase this put a four-digit camera measurement in the position
      // and size of the headline rate, under the label "/hr" — the single most
      // prominent number on a screen read while driving, saying $1847 an hour.
      var aimingNow = p.phase === 'aim';
      setRate(aimingNow && p.cardPixels ? String(p.cardPixels) : '--',
              aimingNow ? 'px' : '/hr');
      el.vPay.textContent = el.vMin.textContent = el.vMile.textContent = '--';

      var aiming = p.phase === 'aim';
      el.lPay.textContent = aiming ? 'card px' : 'pay';
      el.lMin.textContent = aiming ? 'sharpness' : 'minutes';
      el.lMile.textContent = aiming ? 'steady' : 'miles';
      if (aiming) {
        el.vPay.textContent = p.cardPixels ? p.cardPixels + 'px' : '--';
        el.vMin.textContent = p.sharpness !== null && p.sharpness !== undefined ? p.sharpness : '--';
        el.vMile.textContent = (p.stable || 0) + '/' + (p.need || 6);
      }
      // Ahead of the phase message, because it is the one the driver can act
      // on: a washed-out card between offers is exactly the state where there
      // is no reading to hang it off, which is why it is here as well as below.
      var setup = [tooBright ? TOO_BRIGHT : '', tooDim ? TOO_DIM : '',
                   p.message || ''].filter(Boolean);
      el.warn.textContent = setup.join(' ');
      el.warn.hidden = !setup.length;
      // No card, no address. Leaving the last one up would have it read as
      // belonging to whatever comes next.
      showPlaces(null);
      var quiet = Date.now() - seenAt;
      el.detail.textContent = aiming
        ? 'the view below is live — move the mount until this says good'
        : (quiet > STALE_MS
            ? 'nothing from the scanner for ' + Math.round(quiet / 1000)
              + 's — it may have stopped'
            : (busy ? 'working out the pay, the time and the distance'
               : (r ? 'scanner running, no offer on screen' + trackNote(r) : '')));
      el.verdict.classList.toggle('stale', quiet > STALE_MS);
      el.working.hidden = true;
      showRaw(r && r.text);
      return;
    }

    var stale = Date.now() - readAt > READ_STALE_MS;
    el.verdict.className = 'verdict ' + r.state + (stale ? ' stale' : '');
    // `whole` and `locked` are two different claims and only one of them is the
    // one to act on. `locked` means two consecutive frames parsed the same —
    // and two frames that both lose the pickup leg to the same glare agree
    // perfectly with each other, so a fragment can be locked. `whole` means the
    // reading is finished: a total, or both legs of a two-leg card.
    //
    // Which way it errs matters. A card missing a leg always reads *better*
    // than it is — the same pay over less time — so an unqualified ACCEPT on
    // half a card is the one mistake this screen must not make. The scanner has
    // known the difference all along and used it to decide whether to keep
    // reading and whether to speak; it just never told the page.
    var settled = r.locked && r.whole !== false;
    announce(r);
    // A reading that cannot be true gets no verdict at all, and says which
    // figure to go and look at. The alternative is what this screen used to do
    // with a lost decimal point: a green ACCEPT on $1184 for a twenty-minute
    // ride, which is the most confident this display has ever been and the most
    // wrong. The numbers stay on screen underneath — the driver is holding the
    // same card and is the one who can see which of them is off.
    if (r.state === 'doubt') {
      el.verdictLabel.textContent =
        { pay: 'CHECK THE PAY', time: 'CHECK THE TIME',
          speed: 'CHECK THE DISTANCE' }[r.doubt] || 'READ AGAIN';
    } else {
      el.verdictLabel.textContent =
        ({ go: 'ACCEPT', warn: 'CLOSE CALL', no: 'PASS' }[r.state] || '')
        + (settled ? '' : ' ?');
    }
    // The headline is net of running costs when a cost per mile is set, and
    // saying so is not optional: a driver who checks 7.09 over 34 minutes gets
    // $12.51/hr, the screen said $10.61, and nothing here explained the gap.
    var deducted = r.cost > 0;
    // A reading that cannot be true gets no rate, but it keeps the rate's
    // space. Collapsing it moved everything below by about 140px, so the
    // submetrics a driver is being asked to check jumped up the screen at the
    // exact moment they were told to look at them.
    setRate(r.state === 'doubt' ? '--' : rateText(r.perHour), '/hr',
            r.state === 'doubt');

    // Raw, always. This row is checked against the phone, so it has to be what
    // the card says — a "net pay" here would never match and the check would
    // be worse than useless.
    el.lPay.textContent = 'pay';
    el.vPay.textContent = money(r.pay, 2);
    // The card's own minutes where it states them, the time left to a delivery
    // deadline where it does not. Not the billed minutes: this row is what a
    // driver checks against the phone in front of them, and a figure with
    // their own pad added to it would never match.
    var shown = (typeof r.cardMinutes === 'number') ? r.cardMinutes : r.minutes;
    el.vMin.textContent = (shown === null || shown === undefined)
      ? '--' : Math.round(shown);
    el.lMin.textContent = r.fromDeadline ? 'min left' : 'minutes';
    el.vMile.textContent = r.miles === null ? '--' : Number(r.miles).toFixed(1);
    // Secondary on purpose: $/hr is what decides an offer, because an hour is
    // the thing actually being spent. $/mi is the number most drivers carry a
    // rule of thumb for, so it is worth showing beside it.
    //
    // Except on a reading that cannot be true. The card's own pay, time and
    // distance stay — the driver is holding the same card and those are what
    // they check against it — but $/mi is not on the card, it is worked out
    // from the figure that is wrong. Hiding the headline rate and leaving
    // "$303/mi" underneath it withholds nothing: it is the same impossible
    // number, smaller.
    el.vPerMile.textContent = (r.state === 'doubt' || r.perMile === null
                               || r.perMile === undefined)
      ? '--' : money(r.perMile, 2);
    el.lPerMile.textContent = deducted ? 'net $/mi' : '$/mi';

    // The working, in the panel rather than in the small print, and in two
    // steps so both rates are on screen at once: what the offer itself pays
    // per hour — checkable against the card, and the number most drivers
    // already have a feel for — and what is left after running the car, which
    // is the one the verdict is made on.
    //
    // Each line is a pair of unbreakable halves, so a narrow screen splits
    // between them rather than stranding "min" on a line of its own.
    // The card's own minutes where it states them, the time left to the
    // deadline where it does not — the same fallback the submetric above uses.
    // Without it a delivery card, which states a deadline and no duration,
    // printed its raw rate over a dash: "$12.00 in -- min = $21.2/hr raw", a
    // sum with nothing under the line. That is the whole DoorDash half of a
    // shift, showing the one figure this panel had to be argued into showing
    // at all and then failing to say what it was divided by.
    var over = (typeof r.cardMinutes === 'number') ? r.cardMinutes : r.minutes;
    var mins = (over === null || over === undefined) ? '--' : Math.round(over);
    // Both rates come off the scanner, divided by the same minutes, so this
    // sum is the scanner's arithmetic rather than a second version of it.
    // Older payloads carried only the net rate; there, the card's own time is
    // the denominator, which is what those versions meant by it.
    var gross = (typeof r.grossPerHour === 'number') ? r.grossPerHour
      : (over > 0 ? r.pay / (over / 60) : null);
    // And the time it was divided by. Usually the card's own minutes, longer
    // once a shopping allowance or a pad is configured — shown as an extra so
    // the figure in the stat row below and the one these rates divide by are
    // both accounted for, instead of silently disagreeing.
    var billed = (typeof r.billedMinutes === 'number') ? r.billedMinutes : over;
    var extra = (over === null || over === undefined)
      ? 0 : Math.round(billed) - Math.round(over);
    var time = extra > 0 ? mins + ' <i>+</i> ' + extra + ' min'
             : extra < 0 ? Math.round(billed) + ' min'
             : mins + ' min';
    // Formatted exactly as the headline is, so the net figure here and the
    // big one above are visibly the same number rather than $10.60 sitting
    // under $10.6 and reading as a second, slightly different answer.
    var rate = function (n) {
      return n === null ? '--'
        : '$' + (Math.abs(n) >= 100 ? Math.round(n) : Number(n).toFixed(1));
    };
    // Named, not just ordered. The landscape rules reclaim height when a
    // notice appears and they have to take it from the net line — which is
    // the headline repeated — rather than from the raw one, which is on this
    // page exactly once. See the rule under #verdict:has(#warn...).
    var rows = [['raw', '<span>' + money(r.pay, 2) + ' <i>in</i> ' + time + '</span>'
                 + ' <span><i>=</i> <b>' + rate(gross) + '/hr</b> <i>raw</i></span>']];
    if (deducted) {
      rows.push(['net',
                 '<span><i>less</i> ' + money(r.cost, 2) + ' <i>car costs</i></span>'
                 + ' <span><i>=</i> <b>' + rate(r.perHour) + '/hr</b> <i>net</i></span>']);
    }
    showPlaces(r.places);
    el.working.innerHTML = rows.map(function (row) {
      return '<div class="' + row[0] + '">' + row[1] + '</div>';
    }).join('');
    el.working.hidden = false;

    var notes = [];
    // First, because it is the only note on this screen with an action attached
    // to it, and because the reading it is sitting on top of was taken through
    // a washed-out card.
    if (tooBright) notes.push(TOO_BRIGHT);
    if (tooDim) notes.push(TOO_DIM);
    if (r.milesUncertain) notes.push('Distance unreadable — pay shown before mileage cost.');
    else if (r.milesCorrected) notes.push('Recovered a decimal in the distance — check the miles.');
    // Said out loud, because a fragment is not a small error in a safe
    // direction: the same pay divided by less time always looks better. The
    // scanner is still resampling when this is showing, so it is a "wait" and
    // not a "no".
    if (r.whole === false) {
      notes.push('Still reading this card — the journey may not be all there yet, '
                 + 'which makes it look better than it is.');
    }
    el.warn.textContent = notes.join(' ');
    el.warn.hidden = !notes.length;

    el.detail.textContent = (stale ? 'last read ' + Math.round((Date.now() - readAt) / 1000) + 's ago · ' : '')
      + (deducted ? 'after $' + Number(r.costPerMile).toFixed(2) + '/mi costs · ' : '')
      + r.ms + 'ms'
      + (r.legs > 1 ? ' · ' + r.legs + ' legs' : '')
      + (r.mergedFrom > 1 ? ' · ' + r.mergedFrom + ' reads' : '')
      + (r.items ? ' · ' + r.items + ' items' : '')
      + trackNote(r);
    showRaw(r.text);
  }

  // Only worth saying when it is not the quiet default: corners that are being
  // followed, or a screen that went missing.
  function trackNote(r) {
    var bits = [];
    var t = r.track;
    if (t && t.lost) bits.push('screen not visible');
    else if (t && t.jumps) bits.push('re-locked on the phone');
    else if (t && t.drift >= 25) bits.push('tracking ' + Math.round(t.drift) + 'px');
    return bits.length ? ' · ' + bits.join(' · ') : '';
  }

  // What the dot means.
  //
  // It used to mean "this page has a socket to the web server", which is true
  // whenever the page is loaded at all — so it sat green and said "scanner
  // connected" over a camera that had crashed twenty minutes earlier. The one
  // fact a driver needs from it is whether anything is still reading offers.
  // The socket only decides whether that answer is current.
  function showConnection() {
    var quiet = Date.now() - seenAt;
    var alive = socketUp && quiet <= STALE_MS;
    // The camera view is the most convincing thing on this page and the last
    // to look wrong: a frozen JPEG of a phone showing an offer is
    // indistinguishable from a live one. The rule to dim it had been written
    // and never wired to anything, so the picture was served at full strength
    // however long the scanner had been dead. Dimming is not decoration here —
    // it is the only cue that what is on screen is a photograph of the past.
    var img = document.getElementById('view');
    if (img) img.classList.toggle('stalefeed', quiet > STALE_MS);
    if (!socketUp) {
      el.conn.textContent = 'reconnecting to the server…';
    } else if (scannerState && !scannerState.enabled) {
      el.conn.textContent = 'no Pi scanner on this machine';
    } else if (scannerState && !scannerState.running) {
      el.conn.textContent = 'scanner not running'
        + (scannerState.error ? ': ' + scannerState.error : '');
    } else if (quiet > STALE_MS) {
      el.conn.textContent = 'nothing from the scanner for '
        + Math.round(quiet / 1000) + 's';
    } else if (Date.now() - readAt > READ_STALE_MS) {
      // The loop is turning and the reader is not. Worth its own line: the two
      // failures need different things done about them, and "scanner reading"
      // is the one sentence that must not be printed over a verdict nothing
      // has refreshed.
      el.conn.textContent = 'the loop is running but nothing has been read for '
        + Math.round((Date.now() - readAt) / 1000) + 's';
    } else {
      el.conn.textContent = 'scanner reading';
    }
    el.dot.classList.toggle('on', alive
      && !(scannerState && (!scannerState.enabled || !scannerState.running)));
  }

  function connect() {
    var src = new EventSource('/api/events');
    src.onopen = function () {
      socketUp = true;
      showConnection();
    };
    src.onmessage = function (e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      // Stamped here, on the clock this page is going to compare it against.
      // `at` comes off the Pi, and a Pi 4 has no real-time clock: it boots in
      // 1970 and jumps when the network arrives. Subtracting one machine's
      // clock from another's is how "12 seconds old" became "fifty-six years
      // old" — or, worse, a negative age that never trips the stale test at
      // all, leaving a frozen verdict on screen looking live.
      seenAt = msg.replay ? Math.min(seenAt, Date.now() - age(msg.ageMs))
                          : Date.now();
      // The camera saying it has run out of room. It rides the heartbeat rather
      // than a reading precisely because the state it describes is the one
      // where there may be no reading — the phone is brighter than the camera
      // can take, the card is washing out, and everything below keys on
      // `ready`, so a message that carries no verdict is dropped whole. This
      // has to be read off the message before that happens.
      if (msg.tooBright !== undefined) tooBright = !!msg.tooBright;
      if (msg.tooDim !== undefined) tooDim = !!msg.tooDim;
      // A new offer on the record. `tookState` resets with it — the mark
      // belongs to the offer, not to the button.
      if (msg.offer && msg.offer.id) {
        if (!onRecord || onRecord.id !== msg.offer.id) tookState = false;
        onRecord = msg.offer;
        showTook();
      }
      // A read started, and — on the next message carrying a verdict — ended.
      // Same shape as the two above: no `ready`, so it cannot stand in for one.
      if (msg.reading) readingAt = Date.now();
      if (msg.ready !== undefined) readingAt = 0;
      // Only a reading moves the verdict's own clock. The guard is the same one
      // the next line uses to decide whether this message replaces the verdict
      // at all — a heartbeat carries no `ready`, and must not vouch for one.
      // A replay is not a read. The server sends the last reading to every
      // socket that connects, so a dropped connection coming back re-stamped a
      // dead rig's verdict as freshly read — once per reconnect, indefinitely.
      // Its age comes with it, for the same reason the seed above takes one.
      if (msg.ready !== undefined) {
        readAt = msg.replay ? Date.now() - age(msg.ageMs) : Date.now();
      }
      if (msg.phase) phase = msg;
      if (msg.ready !== undefined) last = msg;
      render();
      showConnection();
    };
    src.onerror = function () {
      socketUp = false;
      showConnection();
    };
  }

  // Seed from the current state so a fresh tab is not blank until the next read.
  //
  // Aged, not adopted. `readAt` and `seenAt` start at "now" because loading the
  // page is hearing something — but what this seeds is a reading that may be
  // hours old, and starting its clock at zero paints a dead rig's last ACCEPT
  // at full confidence for twelve seconds and leaves it unlabelled for twenty.
  // On the one screen whose whole job is a verdict, that is the confidently
  // wrong number this project exists to avoid, and it happens on every load.
  //
  // The server sends how old it is rather than when it happened, because a Pi
  // has no real-time clock and subtracting its idea of now from this browser's
  // is exactly the arithmetic the message handler below already refuses to do.
  fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
    if (s.last) {
      last = s.last;
      readAt = Date.now() - age(s.lastAgeMs);
    }
    // ...and the same for having heard from the scanner at all. Without this a
    // page loaded against a stopped scanner showed a live connection dot over
    // a frozen picture, because the fetch that proved the *web server* was up
    // was taken as proof the camera was.
    if (s.heardAgeMs !== undefined && s.heardAgeMs !== null) {
      seenAt = Date.now() - age(s.heardAgeMs);
    } else if (s.last) {
      seenAt = readAt;
    }
    if (s.status) phase = s.status;
    // The offer on record survives a reload and a dropped socket, which is the
    // normal case rather than the odd one: the driver accepts on the phone, the
    // card goes, and only then do they look at this screen.
    if (s.offer && s.offer.id) {
      onRecord = s.offer;
      // ...and whether it has already been marked. Without this the button was
      // page-local: mark an offer, reload the panel, and it offered to mark it
      // again while the count on the status row had already counted it — two
      // figures forty pixels apart disagreeing about the same act.
      tookState = !!s.offer.accepted;
      showTook();
    }
    scannerState = s.scanner || null;
    render();
    showConnection();
  }).catch(function () {});

  /* The camera view, streamed where that works and polled where it does not.
   *
   * This used to fetch a still, wait for it, wait a further 60ms and fetch
   * again — measured at 13.7 distinct frames a second against a scanner
   * producing 30, with a request, a file read, a response and a decode for
   * every one of them whether or not the picture had changed. The driver
   * watches this panel to decide whether to press Accept, so the lag between
   * the phone changing and the screen showing it is the whole quality of it.
   *
   * A multipart stream holds one connection open and the server writes a part
   * only when the frame is actually new: measured at 29.0 distinct frames a
   * second on the same rig, which is the writer's own rate. Polling is kept as
   * the fallback because a stream is one more thing that can fail — a proxy
   * that buffers it, a browser that will not render it — and a still that
   * arrives slowly beats a picture that never appears. */
  var view = document.getElementById('view');
  var viewNote = document.getElementById('viewNote');
  var viewWrap = document.getElementById('viewWrap');
  /* Which picture to ask the rig for. The scanner reads this off the same
     file that tells it somebody is watching, so it travels on the request for
     a frame rather than in a call of its own — see touchWatchFile in
     server.js. It is a query parameter and not a header because the <img> tag
     is what makes these requests, and an <img> cannot set a header. */
  var VIEW_KEY = 'uberscan.liveView';
  var phoneView = false;
  try { phoneView = localStorage.getItem(VIEW_KEY) === 'screen'; } catch (e) { phoneView = false; }

  function streamUrl() {
    return '/api/frame.mjpeg?view=' + (phoneView ? 'screen' : 'scene');
  }
  var FRAME_GAP = 30;          // a floor for the fallback, so it cannot spin
  var streaming = false;
  var streamTried = 0;
  var framePending = false;
  var watchdog = null;

  function sawAFrame() {
    viewWrap.classList.remove('gone');
    viewNote.textContent = phoneView
      ? "the phone's screen, flattened"
      : 'camera view · inset is what the reader sees';
    clearTimeout(watchdog);
    watchdog = null;
  }

  function noFrameYet() {
    viewWrap.classList.add('gone');
    viewNote.textContent = 'no camera view yet — the scanner writes one every few seconds';
  }

  function startStream() {
    streaming = true;
    streamTried++;
    view.src = streamUrl();
    // If nothing renders at all, the stream is not working here — whatever the
    // reason — and a still every 30ms is a great deal better than a blank box.
    clearTimeout(watchdog);
    watchdog = setTimeout(function () {
      if (streaming && !view.naturalWidth) fallBackToStills();
    }, 4000);
  }

  function fallBackToStills() {
    streaming = false;
    clearTimeout(watchdog);
    watchdog = null;
    framePending = false;
    refreshView();
  }

  // Chained, not on a timer. A fixed interval asks for the next frame whether
  // or not the last one has arrived, so on a weak signal the requests stack up
  // and the picture gets further behind the longer you watch. Asking again only
  // once the previous frame has landed makes the rate whatever the link can
  // actually carry.
  function refreshView() {
    if (streaming || document.hidden || framePending) return;
    framePending = true;
    view.src = '/api/frame.jpg?view=' + (phoneView ? 'screen' : 'scene')
             + '&t=' + Date.now();
  }

  function frameDone() {
    framePending = false;
    if (!streaming && !document.hidden) setTimeout(refreshView, FRAME_GAP);
  }

  view.addEventListener('load', function () {
    sawAFrame();
    if (!streaming) frameDone();
  });
  view.addEventListener('error', function () {
    if (streaming) {
      // The connection dropped, or this browser will not render the stream.
      // One retry, because a scanner restarting underneath it is the ordinary
      // cause and it comes straight back; after that, stills.
      if (streamTried < 2) return startStream();
      noFrameYet();
      return fallBackToStills();
    }
    noFrameYet();
    frameDone();
  });

  startStream();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      // A stream to a hidden tab is bytes and CPU spent on nobody.
      if (streaming) { streaming = false; view.src = ''; }
      return;
    }
    streamTried = 0;
    startStream();
  });

  // Ask the scanner to forget where it thinks the phone is. The automatic
  // recovery handles the unambiguous case — corners off to one side while the
  // card is in the middle — but corners sitting on the screen at the wrong size
  // are equally "the phone moved" and "the outline is on part of it", and only
  // the person looking at the picture can tell. So they get to say.
  var resetBtn = document.getElementById('reset');
  resetBtn.addEventListener('click', function () {
    resetBtn.disabled = true;
    resetBtn.textContent = '⟳ …';
    fetch('/api/recalibrate', { method: 'POST' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function () { resetBtn.textContent = '⟳ re-finding'; })
      .catch(function () { resetBtn.textContent = '⟳ failed'; })
      .then(function () {
        setTimeout(function () {
          resetBtn.disabled = false;
          resetBtn.textContent = '⟳ Re-find';
        }, 2500);
      });
  });

  // --- which picture ------------------------------------------------------
  //
  // Remembered, because it is a property of how this rig is used rather than
  // of this page load. A driver reading the phone off this display through a
  // bluetooth mouse is doing that for the whole shift, and having to press a
  // button again every time the page reloads is the kind of small tax that
  // ends with the feature unused.
  var viewModeBtn = document.getElementById('viewMode');

  function applyViewMode() {
    document.body.classList.toggle('phoneview', phoneView);
    viewModeBtn.setAttribute('aria-pressed', phoneView ? 'true' : 'false');
    // The label says what pressing it gets you, not what you are looking at.
    viewModeBtn.textContent = phoneView ? '⛶ Scene' : '⛶ Phone';
    if (!viewWrap.classList.contains('gone')) sawAFrame();
  }

  viewModeBtn.addEventListener('click', function () {
    phoneView = !phoneView;
    try { localStorage.setItem(VIEW_KEY, phoneView ? 'screen' : 'scene'); } catch (e) { /* private mode */ }
    applyViewMode();
    // The mode rides on the request for a frame, so the rig does not hear
    // about it until the next one is asked for. A stream is one request that
    // never ends — it would go on delivering the old picture until something
    // else restarted it — so it is restarted here.
    if (streaming) startStream();
    else refreshView();
  });

  applyViewMode();

  // --- drawing the box to read -------------------------------------------
  //
  // The scanner locates the phone by looking for the brightest quadrilateral,
  // which is right almost always and useless in the cases where it is wrong: a
  // windscreen reflection, a second lit screen, a phone filling the frame with
  // nothing darker to be told apart from. None of those can be aimed out of —
  // the rig reads a strip of the car indefinitely and reports corners held —
  // and the only fix was ssh and eight pixel coordinates guessed off a
  // photograph. The person holding the phone can see exactly where the card is,
  // so they can draw it.
  //
  // Sent as fractions of the picture, never pixels. This is a 480px JPEG of a
  // 2328px sensor frame, and corners measured against one size and read against
  // another are refused on every check, silently, for as long as the rig runs.
  var setBox = document.getElementById('setBox');
  var drawn = document.getElementById('drawn');
  var drawUse = document.getElementById('drawUse');
  var drawCancel = document.getElementById('drawCancel');
  var drawHint = document.getElementById('drawHint');
  var box = null;             // {x, y, w, h} as fractions, or null
  var dragFrom = null;

  function drawingMode(on) {
    viewWrap.classList.toggle('drawing', on);
    drawHint.hidden = !on;
    // The label stays put and the button lights up instead: "▣ Drawing" wraps
    // onto two lines in a four-slot bar on a phone, and a bar that changes
    // height mid-drag moves the picture out from under the finger.
    setBox.classList.toggle('on', on);
    if (!on) {
      box = dragFrom = null;
      drawn.hidden = true;
      drawUse.disabled = true;
      drawUse.textContent = '✓ Read this box';
    }
  }

  function at(e) {
    var r = view.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return {
      x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
    };
  }

  function showBox() {
    if (!box) { drawn.hidden = true; return; }
    // Positioned against the picture rather than the figure, which also holds
    // the caption and the buttons.
    var r = view.getBoundingClientRect();
    var wrap = viewWrap.getBoundingClientRect();
    drawn.style.left = (r.left - wrap.left + box.x * r.width) + 'px';
    drawn.style.top = (r.top - wrap.top + box.y * r.height) + 'px';
    drawn.style.width = (box.w * r.width) + 'px';
    drawn.style.height = (box.h * r.height) + 'px';
    drawn.hidden = false;
  }

  // 5% each way, the same floor the server and the scanner apply: at 5% of a
  // 2328px frame the card would be 116px tall against a 380px floor, so there
  // is nothing readable inside a box that small.
  function bigEnough(b) { return b && b.w >= 0.05 && b.h >= 0.05; }

  view.addEventListener('pointerdown', function (e) {
    if (!viewWrap.classList.contains('drawing')) return;
    var p = at(e);
    if (!p) return;
    e.preventDefault();
    view.setPointerCapture(e.pointerId);
    dragFrom = p;
    box = { x: p.x, y: p.y, w: 0, h: 0 };
    showBox();
  });

  view.addEventListener('pointermove', function (e) {
    if (!dragFrom) return;
    var p = at(e);
    if (!p) return;
    box = {
      x: Math.min(dragFrom.x, p.x), y: Math.min(dragFrom.y, p.y),
      w: Math.abs(p.x - dragFrom.x), h: Math.abs(p.y - dragFrom.y)
    };
    showBox();
    drawUse.disabled = !bigEnough(box);
  });

  function endDrag() {
    if (!dragFrom) return;
    dragFrom = null;
    drawUse.disabled = !bigEnough(box);
    drawHint.textContent = bigEnough(box)
      ? 'drag again to change it, or read this box'
      : 'that box is too small to read — drag a bigger one';
  }
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', endDrag);
  // The picture is replaced several times a second, and a box measured against
  // one layout is wrong in the next if the image changed size.
  window.addEventListener('resize', showBox);
  view.addEventListener('load', showBox);

  setBox.addEventListener('click', function () {
    var on = !viewWrap.classList.contains('drawing');
    // The box is drawn on the picture, so there has to be one. Without this the
    // hidden image measures zero and every drag is silently ignored, which
    // reads as a broken button rather than a scanner that has not sent a frame.
    if (on && viewWrap.classList.contains('gone')) {
      drawHint.hidden = false;
      drawHint.textContent = 'no camera view yet — the box is drawn on the picture, '
        + 'which appears within a few seconds of the scanner starting';
      return;
    }
    // A box dragged here is sent as a fraction of the *camera frame*, and the
    // phone view is not the camera frame — it is one rectangle out of it,
    // flattened and blown up to fill the picture. The same drag would land
    // somewhere else entirely, and the failure would be silent: a box
    // accepted, a quad moved, and the scanner reading a patch of car door.
    //
    // Switched rather than refused. The scene is the picture this button needs
    // and there is nothing to lose by going there — you cannot draw the
    // phone's outline on a picture that has been cropped to it already.
    if (on && phoneView) {
      phoneView = false;
      try { localStorage.setItem(VIEW_KEY, 'scene'); } catch (e) { /* private mode */ }
      applyViewMode();
      if (streaming) startStream();
      else refreshView();
    }
    drawingMode(on);
    if (on) {
      drawHint.textContent = 'drag a box around the offer card on the phone';
      viewWrap.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  });

  drawCancel.addEventListener('click', function () { drawingMode(false); });

  drawUse.addEventListener('click', function () {
    if (!bigEnough(box)) return;
    var sent = box;
    drawUse.disabled = true;
    drawUse.textContent = '✓ sending…';
    fetch('/api/crop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ box: [sent.x, sent.y, sent.w, sent.h] })
    }).then(function (r) {
      return r.json().catch(function () { return { ok: r.ok }; });
    }).then(function (out) {
      if (!out || !out.ok) throw new Error((out && out.error) || 'refused');
      drawingMode(false);
      // No confirmation dialog: the green outline in the picture below moves
      // onto the box within a second or two, which is the same news and is the
      // thing worth looking at anyway.
      drawHint.hidden = false;
      drawHint.textContent = 'box sent — the green outline moves onto it in a moment';
      setTimeout(function () { drawHint.hidden = true; }, 6000);
    }).catch(function (e) {
      drawUse.disabled = false;
      drawUse.textContent = '✓ Read this box';
      drawHint.textContent = 'could not set the box: ' + e.message;
    });
  });

  connect();
  // Keeps the "last seen" counter honest, and — since silence is exactly the
  // condition worth noticing — is the only thing that can ever discover the
  // scanner has gone quiet. Nothing arrives to trigger that discovery.
  setInterval(function () {
    render();
    showConnection();
    // The shift figures ride the one-second tick rather than adding a timer of
    // their own, on an elapsed check so the cadence is three minutes however
    // many ticks it took. `document.hidden` because this tick keeps running in
    // a background tab — only the camera stream is stopped on visibilitychange
    // — and an unattended tab has no reason to keep asking the rig to parse its
    // journal. The next visible tick catches up.
    if (!document.hidden && Date.now() - shiftAt >= SHIFT_EVERY_MS) loadShift();
  }, 1000);
  loadShift();
})();
</script>
</body>
</html>
