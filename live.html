  // The order in the car as last described, so a failure can be tied to it.
  var heldSig = null;

  function holdSignature(holding) {
    return holding ? String(holding.pay) + '/' + String(holding.minutes) : null;
  }

  function showDrop() {
    el.drop.hidden = !holdingNow;
    el.drop.textContent = dropBusy ? '…' : dropFailed ? 'Drop · failed' : 'Drop';
    el.drop.classList.toggle('failed', dropFailed);
    el.drop.title = 'Put the order down, so the next offer is judged on its own '
                  + 'again. It does not touch your phone.';
  }

  el.drop.addEventListener('click', function () {
    if (dropBusy) return;
    dropBusy = true;
    showDrop();
    ask('/api/delivered', { method: 'POST' }).then(function (r) {
      // Believe the server, not the press. If the write failed the order is
      // still in the car and the next offer must still be measured against it.
      dropFailed = !r.ok;
      dropFailedFor = r.ok ? null : heldSig;
      if (r.ok) {
        holdingNow = false; destSaid = ''; heldEnds = undefined; heldSig = null;
        showStack(null); showDest();
      }
    }).catch(function () {
      /* Left as it was: an order the server still holds is the truth. */
      dropFailed = true;
      dropFailedFor = heldSig;
    }).then(function () {
      dropBusy = false;
      showDrop();
    });
  });

  // --- reading the destination off the screen after the accept -------------
  //
  // The one thing the offer card cannot tell you. Uber prints "Customer
  // dropoff" and no address on 106 of this driver's 604 cards — 18% of
  // everything the rig sees — so the order in the car has no destination and
  // the stack line has nothing to compare the next offer against. The address
  // is on the screen that comes AFTER the accept, and this is the driver
  // saying "that is what you are looking at now".
  //
  // The press only opens a window; the scanner keeps reading for a few seconds
  // (see DROPOFF_WINDOW) because the driver still has to get the destination
  // up, and a phone in a mount showing a navigation screen is exactly what the
  // motion gate scores as nothing happening.
  var destBusy = false;
  var destSaid = '';

  /* The other state this button is for, which it did not used to have.
   *
   * It was built for after the accept: an order is in the car, its card never
   * said where the job ends, and the address is on the navigation screen. That
   * is still what it does — and it is not when the driver actually wants to
   * know.
   *
   * The driver's own words: "for doordash orders I need to tap the customer
   * drop off location to show the address when screening so it would be
   * possible to search on the map". They are already tapping the phone to
   * reveal the address BEFORE deciding, because where a job ends is half of
   * whether it is worth taking. The rig was looking away.
   *
   * Three conditions, and each one is doing work:
   *
   *   Nothing held, because with an order in the car the button already means
   *   something and that meaning wins — the held order's missing end is the
   *   stronger claim, since every pair judged against it is nonsense without.
   *
   *   A card the rig has on record, with an id, because an address read
   *   against no card is an address belonging to no job. That is the exact
   *   thing server.js refuses to store, and it is right to.
   *
   *   And the card is still UP. `onRecord` is deliberately not cleared — the
   *   Took button names an offer whose card has gone — so without this the
   *   button would sit lit for the rest of the shift after one card with no
   *   destination. Measured off the same clock the verdict's own "stale" uses,
   *   so the control disappears when the thing it is about does.
   */
  function screeningEnd() {
    if (holdingNow) return false;
    if (!onRecord || !onRecord.id) return false;
    if (onRecord.dropoff) return false;
    return Date.now() - readAt <= READ_STALE_MS;
  }

  function showDest() {
    var screening = screeningEnd();
    el.dest.hidden = !holdingNow && !screening;
    // A LABEL, always, and the answer said in colour instead.
    //
    // This used to become the address itself once one had been read. The bar is
    // a grid of equal columns and there are six or seven of them, so on the
    // rig's own 800x480 panel this button is 122px wide: a 42-character address
    // needs 238px and arrived as "1234 Daffodil L…". That is not a control any
    // more - it neither says what pressing it does nor shows an address the
    // driver can check - and at 480x320 the column is 69px, where even
    // "⌖ Dropoff" is a squeeze at 74px.
    //
    // There is no width to win: the bar is full and every button shares it
    // equally. So the confirmation is a colour, which this panel already trusts
    // a driver to read before they read words, and it costs no width at all.
    // The address itself goes where there is room for it - the title, and the
    // stack line's own geography.
    el.dest.textContent = destBusy ? '⌖ reading…' : '⌖ Dropoff';
    el.dest.classList.toggle('done', !destBusy && !!destSaid);
    // ...and asked for, in the one state where pressing it changes an answer.
    //
    // The order in the car has no end the geography check can use — its card
    // printed a merchant and no address, which 106 of this driver's 604 cards
    // do — so every pair judged against it gets ENDS ? and will go on getting
    // it until this button is pressed. The chip on the stack line says the
    // question was not answered; this says which control answers it.
    //
    // The doubt colour, not the green one: green here means "already read",
    // and this is the opposite state. And only when the missing half is the
    // HELD order's — when it is the new card's own dropoff that is missing,
    // nothing this button does can help, and a control that asks to be pressed
    // for no gain is worse than one that says nothing.
    //
    // Screening asks to be pressed on a narrower condition than holding does:
    // the card has to have REFUSED a destination, not merely failed to yield
    // one. Uber printing "Customer dropoff" means the address exists and is
    // one tap away on the phone; a card the reader simply got nothing off has
    // nothing to reveal, and lighting up over it would be asking for a press
    // that cannot help. See endRefused, which is why the two are now telling
    // apart at all.
    var wants = !destBusy && !destSaid
      && (holdingNow ? heldEnds === null
                     : (screening && !!onRecord.endRefused));
    el.dest.classList.toggle('wanted', wants);
    el.dest.title = destSaid
      ? 'Read as: ' + destSaid + '. Press again to read it afresh.'
      : wants && holdingNow
      ? 'The order you are carrying has no address on record, so the rig '
        + 'cannot say whether a second job ends near it. Read it off your '
        + 'phone. It does not touch your phone.'
      : wants
      ? 'This card says “Customer dropoff” and no address. Tap the dropoff on '
        + 'your phone and press this, and where it goes is on the record '
        + 'before you decide. It does not touch your phone.'
      : holdingNow
      ? 'Read the destination off your phone, so the next offer can be judged '
        + 'on where it ends as well as what it pays. It does not touch your phone.'
      : 'Read where this card goes off your phone. It does not touch your phone.';
    // ...and said out loud, because the colour is the only thing on screen that
    // changed and a screen reader cannot see it.
    el.dest.setAttribute('aria-label', destSaid
      ? 'Dropoff read as ' + destSaid + '. Press again to read it afresh.'
      : wants && holdingNow
      ? 'Read the dropoff off your phone. The order you are carrying has no '
        + 'address on record, so second jobs cannot be judged on where they end.'
      : wants
      ? 'Read the dropoff off your phone. This card says Customer dropoff and '
        + 'gives no address.'
      : 'Read the dropoff off your phone');
  }

  el.dest.addEventListener('click', function () {
    if (destBusy) return;
    destBusy = true;
    destSaid = '';
    showDest();
    ask('/api/dropoff', { method: 'POST' }).then(function (r) {
      return r.json().catch(function () { return null; });
    }).then(function (b) {
      // The one thing the reply does say: whether there is still an order to
      // read a destination for. The server's clock ends a hold with nothing
      // pressed here, and between offers no reading arrives to say so — so
      // Drop and ⌖ Dropoff stayed lit for an order that no longer existed,
      // and pressing this photographed the phone for nothing.
      if (b && b.holding === false && holdingNow) {
        holdingNow = false; destSaid = ''; heldEnds = undefined;
        showDrop(); showStack(null);
      }
    }).catch(function () {
      /* The scanner answers on its own stream; a failed ask just reads as one
         that found nothing, which is the same thing from here. */
    }).then(function () {
      // Cleared on a timer rather than on a reply, because the reply to this
      // is not the response — it is a `dropoff` line arriving from the scanner
      // seconds later, through the same stream the verdicts come down. The
      // window is the scanner's; this only has to stop saying "reading…" once
      // it has certainly closed.
      setTimeout(function () {
        destBusy = false;
        showDest();
      }, 13000);
    });
  });

  // --- what the shift adds up to ------------------------------------------
  //
  // 4am, not midnight: a shift that ran 16:47 to 03:18 is one evening's work
  // and a calendar date cuts it in half. The same number and the same reasoning
  // as journal.html — if the two screens disagreed about when the day started
  // they would print different counts for the same day.
  var DAY_STARTS_AT = 4;

  // The start of the day currently being driven — 4am today, or 4am yesterday
  // while it is still before four in the morning. Local time throughout,
  // because "today" means today where the driver is, and the rig cannot know
  // that: it has no real-time clock and no idea what timezone the car is in.
  // The page says, exactly as it does for /api/journal.
  //
  // Shift back four hours, floor to midnight, add four back. setHours with a
  // whole-day argument sets the field absolutely, so this is exactly 04:00
  // local whatever daylight saving did in between.
  function dayStart() {
    var d = new Date();
    d.setHours(d.getHours() - DAY_STARTS_AT);
    d.setHours(0, 0, 0, 0);
    d.setHours(DAY_STARTS_AT);
    return d.getTime();
  }

  var shiftAt = 0;
  var shiftBusy = false;
  // A request that arrived while one was in flight, to be run once it
  // lands. Marking an offer during the slow poll is exactly that case.
  var shiftAgain = false;
  // Three minutes. The server has to read and parse the whole journal to
  // answer, on the same event loop that drives the camera stream — a year of
  // driving is around 19MB and the best part of a second of frozen loop on a
  // Pi 4. /api/journal/newest already sets the house budget for a
  // journal-reading GET at "every few minutes", and a shift figure is not a
  // number anybody watches tick.
  var SHIFT_EVERY_MS = 180000;

  function showShift(s) {
    if (!s) { el.shift.hidden = true; return; }
    var bits;
    if (s.clockSet === false) {
      // The rig's own clock has not been set, so it does not yet know what day
      // it is on. Every window over the journal is meaningless until NTP lands,
      // and a plausible-looking count is worse than none.
      bits = ['today: waiting for the clock'];
    } else if (s.unreadable) {
      // Empty and unreadable look identical on a panel unless one of them says
      // so, and this is the one worth acting on.
      bits = ['today: the journal could not be read'];
    } else if (s.rolled) {
      bits = ['today: the journal just rolled over'];
    } else {
      // Money first. This is one line, cut with an ellipsis where it does
      // not fit, and on the 480px hat and a phone it does not: measured
      // against a fortnight of offers, 392px of text in 223px on the hat and
      // 314px in 172px on the phone. What the ellipsis took was the tail, and
      // the tail was "took 2 for $27 net · median $20/hr" — the two figures
      // a driver glances down for. They lead now; the count of offers and
      // the set-aside figure are what a small screen loses.
      bits = [];
      // "took 3 for $48" — the same words the offers page puts on a day
      // header, so the two screens say the same thing about the same rows.
      // Whole dollars, like the median beside it: this is read at arm's
      // length. Net, and only claimed as net when a running cost was really
      // taken off — with costs at zero the two are one number and "after
      // costs" would describe a subtraction that never happened. `earned` is
      // absent from a server one release behind, and then the count stands
      // alone as it did.
      bits.push('took ' + s.took
                + (s.took > 0 && typeof s.earned === 'number'
                   // Signed the way every other figure on these pages is:
                   // "-$1", not "$-1". A job whose mileage cost more than it
                   // paid is rare and real.
                   ? ' for ' + (s.earned < 0 ? '-$' : '$')
                     + Math.abs(Math.round(s.earned))
                     + (s.earnedCost > 0 ? ' net' : '')
                   : ''));
      // Only when there is one. A median of nothing is not zero.
      if (typeof s.median === 'number') {
        // Signed the way the `earned` figure three lines up already is, and
        // rounded the way this line always has been: whole dollars, because a
        // shift median read at a glance does not want a decimal. It wrote
        // "$-12/hr" before, which is the shape this page spends a comment at
        // line 615 refusing — and a median can go negative as soon as a
        // running cost is set.
        bits.push('median ' + (s.median < 0 ? '-$' : '$')
                  + Math.abs(Math.round(s.median)) + '/hr');
      }
      bits.push(s.offers + (s.offers === 1 ? ' offer' : ' offers'));
      if (s.setAside) bits.push(s.setAside + ' set aside');
      // `beforeClock` is deliberately NOT printed here. Offers the rig recorded
      // before its clock was right are stamped 1970 on disk and cannot fall
      // inside any day window — but that is true of every day, forever, so on a
      // line about today it is a suffix that never clears and attributes rows
      // from some past boot to this shift. The offers page drops them silently
      // for the same reason. It stays in the response because it is a true fact
      // about the journal and a diagnostic may want it; it is not a figure for
      // this row.
    }
    el.shift.textContent = '· ' + bits.join(' · ');
    el.shift.hidden = false;
  }

  // 1 Jan 2025, the same floor server.js applies. Below this a clock is not a
  // clock: the Pi has no RTC, boots in 1970 and jumps when NTP arrives.
  var CLOCK_BELIEVABLE_AFTER = 1735689600000;

  function loadShift() {
    // The page's OWN clock first. On the panel bolted to the dashboard this
    // browser is running on the Pi, so an unset clock makes dayStart() a 1970
    // moment — which the server refuses, correctly, and the line would simply
    // vanish with nothing said. The server's own answer covers the other case,
    // a phone with a good clock looking at a rig without one.
    var since = dayStart();
    if (since < CLOCK_BELIEVABLE_AFTER) {
      shiftAt = Date.now();
      showShift({ clockSet: false });
      return;
    }
    if (shiftBusy) {
      // Asked while one is already in the air. Dropping it silently is what
      // made marking an offer during the three-minute poll repaint the count
      // from BEFORE the mark: the answer already in flight was computed
      // without it. Remember to go again instead.
      shiftAgain = true;
      return;
    }
    shiftBusy = true;
    shiftAt = Date.now();
    // A fetch that never settles would leave shiftBusy set for the rest of the
    // shift, and the figures on the panel would stop moving with nothing saying
    // they had. This used to build its own AbortController here, which is where
    // `ask` came from: the same guard was needed by five controls that did not
    // have it, and one deadline written twice is one that drifts.
    ask('/api/today?since=' + since).then(function (r) {
      // An older build has no such route, and an unknown /api path on this
      // server falls past every handler to a text/plain 404 — so `.json()`
      // rejects with a SyntaxError rather than returning a status to branch on.
      // Both paths have to end up in the same place.
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (s) {
      showShift(s);
    }).catch(function () {
      // Not a silent swallow. Leaving the last good figures up with nothing
      // saying they are old is the failure this file keeps warning about — an
      // hour into a shift they would still read like the truth.
      showShift(null);
    }).then(function () {
      shiftBusy = false;
      if (shiftAgain) { shiftAgain = false; loadShift(); }
    });
  }

  var PHASE_LABEL = {
    check: 'CHECKING',
    aim: 'AIM THE CAMERA',
    calibrated: 'CALIBRATED',
    scanning: 'WAITING FOR AN OFFER',
    error: 'SCANNER PROBLEM'
  };

  function money(n, d) {
    if (n === null || n === undefined || !isFinite(n)) return '--';
    return (n < 0 ? '-$' : '$') + Math.abs(Number(n)).toFixed(d);
  }

  function render() {
    var r = last;
    if (!r || !r.ready) {
      // Before the first offer the useful thing to show is setup progress, so
      // the page doubles as the aiming instructions.
      var p = phase || {};
      // Not `no`. A fault is not a verdict, and painting the panel in the PASS
      // red means a glance at a dead scanner reads as "decline this offer" —
      // the driver acts on a decision nothing made.
      el.verdict.className = 'verdict ' + (p.phase === 'error' ? 'fault' : 'empty');
      // A card under the reader is not "waiting for an offer", and saying so
      // was the panel's least honest second and a half. Not while aiming or
      // faulted: both of those are about the rig rather than about a card, and
      // both are what the driver is there to fix.
      var busy = readingAt && (Date.now() - readingAt) < READING_MS
                 && p.phase !== 'error' && p.phase !== 'aim';
      el.verdictLabel.textContent = busy ? 'READING THE CARD'
        : (PHASE_LABEL[p.phase] || 'WAITING FOR AN OFFER');
      // Only while aiming, where the number means pixels and says so. On any
      // other phase this put a four-digit camera measurement in the position
      // and size of the headline rate, under the label "/hr" — the single most
      // prominent number on a screen read while driving, saying $1847 an hour.
      var aimingNow = p.phase === 'aim';
      setRate(aimingNow && p.cardPixels ? String(p.cardPixels) : '--',
              aimingNow ? 'px' : '/hr');
      el.vPay.textContent = el.vMin.textContent = el.vMile.textContent = '--';

      var aiming = p.phase === 'aim';
      el.lPay.textContent = aiming ? 'card px' : 'pay';
      el.lMin.textContent = aiming ? 'sharpness' : 'minutes';
      el.lMile.textContent = aiming ? 'steady' : 'miles';
      if (aiming) {
        el.vPay.textContent = p.cardPixels ? p.cardPixels + 'px' : '--';
        el.vMin.textContent = p.sharpness !== null && p.sharpness !== undefined ? p.sharpness : '--';
        el.vMile.textContent = (p.stable || 0) + '/' + (p.need || 6);
      }
      // Ahead of the phase message, because it is the one the driver can act
      // on: a washed-out card between offers is exactly the state where there
      // is no reading to hang it off, which is why it is here as well as below.
      // `refindRefused` matters more here than in the block below: a Re-find
      // is refused when there is nothing on the screen to find, and nothing on
      // the screen to find is precisely this branch — no reading, so the notes
      // further down never render at all.
      // `notSaving` leads here as it does below, and it has to be here at all
      // for a reason the others only half share: between offers there is no
      // reading to hang it off, and the journal is just as dead between offers
      // as during one.
      var setup = [notSaving || '', tooBright ? TOO_BRIGHT : '',
                   tooDim ? TOO_DIM : '',
                   refindRefused || '', p.message || ''].filter(Boolean);
      el.warn.textContent = setup.join(' ');
      el.warn.hidden = !setup.length;
      // No card, no address. Leaving the last one up would have it read as
      // belonging to whatever comes next.
      showPlaces(null);
      showStack(null);
      var quiet = Date.now() - seenAt;
      el.detail.textContent = aiming
        ? 'the view below is live — move the mount until this says good'
        : (quiet > STALE_MS
            ? 'nothing from the scanner for ' + Math.round(quiet / 1000)
              + 's — it may have stopped'
            : (busy ? 'working out the pay, the time and the distance'
               : (r ? 'scanner running, no offer on screen' + trackNote(r) : '')));
      el.verdict.classList.toggle('stale', quiet > STALE_MS);
      el.working.hidden = true;
      showRaw(r && r.text);
      return;
    }

    var stale = Date.now() - readAt > READ_STALE_MS;
    el.verdict.className = 'verdict ' + r.state + (stale ? ' stale' : '');
    // `whole` and `locked` are two different claims and only one of them is the
    // one to act on. `locked` means two consecutive frames parsed the same —
    // and two frames that both lose the pickup leg to the same glare agree
    // perfectly with each other, so a fragment can be locked. `whole` means the
    // reading is finished: a total, or both legs of a two-leg card.
    //
    // Which way it errs matters. A card missing a leg always reads *better*
    // than it is — the same pay over less time — so an unqualified ACCEPT on
    // half a card is the one mistake this screen must not make. The scanner has
    // known the difference all along and used it to decide whether to keep
    // reading and whether to speak; it just never told the page.
    var settled = r.locked && r.whole !== false;
    announce(r);
    // A reading that cannot be true gets no verdict at all, and says which
    // figure to go and look at. The alternative is what this screen used to do
    // with a lost decimal point: a green ACCEPT on $1184 for a twenty-minute
    // ride, which is the most confident this display has ever been and the most
    // wrong. The numbers stay on screen underneath — the driver is holding the
    // same card and is the one who can see which of them is off.
    if (r.state === 'doubt') {
      el.verdictLabel.textContent =
        { pay: 'CHECK THE PAY', time: 'CHECK THE TIME',
          speed: 'CHECK THE DISTANCE',
          // The time, because that is what is wrong with it: the reading is
          // over one leg of a journey the card printed two of, so the minutes
          // are the drive to the rider and the rate is the job's several times
          // over. The long version is in the notes below, where there is room
          // for it; this label has to be read at a glance from the seat.
          leg: 'CHECK THE TIME',
          rate: 'CHECK PAY AND TIME' }[r.doubt] || 'READ AGAIN';
    } else {
      el.verdictLabel.textContent =
        ({ go: 'ACCEPT', warn: 'CLOSE CALL', no: 'PASS' }[r.state] || '')
        + (settled ? '' : ' ?');
    }
    // The headline is net of running costs when a cost per mile is set, and
    // saying so is not optional: a driver who checks 7.09 over 34 minutes gets
    // $12.51/hr, the screen said $10.61, and nothing here explained the gap.
    var deducted = r.cost > 0;
    // A reading that cannot be true gets no rate, but it keeps the rate's
    // space. Collapsing it moved everything below by about 140px, so the
    // submetrics a driver is being asked to check jumped up the screen at the
    // exact moment they were told to look at them.
    setRate(r.state === 'doubt' ? '--' : rateText(r.perHour), '/hr',
            r.state === 'doubt');

    // Raw, always. This row is checked against the phone, so it has to be what
    // the card says — a "net pay" here would never match and the check would
    // be worse than useless.
    el.lPay.textContent = 'pay';
    el.vPay.textContent = money(r.pay, 2);
    // The card's own minutes where it states them, the time left to a delivery
    // deadline where it does not. Not the billed minutes: this row is what a
    // driver checks against the phone in front of them, and a figure with
    // their own pad added to it would never match.
    var shown = (typeof r.cardMinutes === 'number') ? r.cardMinutes : r.minutes;
    el.vMin.textContent = (shown === null || shown === undefined)
      ? '--' : Math.round(shown);
    el.lMin.textContent = r.fromDeadline ? 'min left' : 'minutes';
    el.vMile.textContent = r.miles === null ? '--' : Number(r.miles).toFixed(1);
    // Secondary on purpose: $/hr is what decides an offer, because an hour is
    // the thing actually being spent. $/mi is the number most drivers carry a
    // rule of thumb for, so it is worth showing beside it.
    //
    // Except on a reading that cannot be true. The card's own pay, time and
    // distance stay — the driver is holding the same card and those are what
    // they check against it — but $/mi is not on the card, it is worked out
    // from the figure that is wrong. Hiding the headline rate and leaving
    // "$303/mi" underneath it withholds nothing: it is the same impossible
    // number, smaller.
    el.vPerMile.textContent = (r.state === 'doubt' || r.perMile === null
                               || r.perMile === undefined)
      ? '--' : money(r.perMile, 2);
    el.lPerMile.textContent = deducted ? 'net $/mi' : '$/mi';

    // The working, in the panel rather than in the small print, and in two
    // steps so both rates are on screen at once: what the offer itself pays
    // per hour — checkable against the card, and the number most drivers
    // already have a feel for — and what is left after running the car, which
    // is the one the verdict is made on.
    //
    // Each line is a pair of unbreakable halves, so a narrow screen splits
    // between them rather than stranding "min" on a line of its own.
    // The card's own minutes where it states them, the time left to the
    // deadline where it does not — the same fallback the submetric above uses.
    // Without it a delivery card, which states a deadline and no duration,
    // printed its raw rate over a dash: "$12.00 in -- min = $21.2/hr raw", a
    // sum with nothing under the line. That is the whole DoorDash half of a
    // shift, showing the one figure this panel had to be argued into showing
    // at all and then failing to say what it was divided by.
    var over = (typeof r.cardMinutes === 'number') ? r.cardMinutes : r.minutes;
    var mins = (over === null || over === undefined) ? '--' : Math.round(over);
    // Both rates come off the scanner, divided by the same minutes, so this
    // sum is the scanner's arithmetic rather than a second version of it.
    // Older payloads carried only the net rate; there, the card's own time is
    // the denominator, which is what those versions meant by it.
    var gross = (typeof r.grossPerHour === 'number') ? r.grossPerHour
      : (over > 0 ? r.pay / (over / 60) : null);
    // And the time it was divided by. Usually the card's own minutes, longer
    // once a shopping allowance or a pad is configured — shown as an extra so
    // the figure in the stat row below and the one these rates divide by are
    // both accounted for, instead of silently disagreeing.
    var billed = (typeof r.billedMinutes === 'number') ? r.billedMinutes : over;
    var extra = (over === null || over === undefined)
      ? 0 : Math.round(billed) - Math.round(over);
    var time = extra > 0 ? mins + ' <i>+</i> ' + extra + ' min'
             : extra < 0 ? Math.round(billed) + ' min'
             : mins + ' min';
    // Formatted exactly as the headline is, so the net figure here and the
    // big one above are visibly the same number rather than $10.60 sitting
    // under $10.6 and reading as a second, slightly different answer.
    // rateText, not a second copy of it. This one wrote "$-12.4" — the minus
    // wedged between the dollar and the digits, which line 615 explains is a
    // dash at a glance and which rateText has always got right. So the headline
    // read "-$13.2" and the working line directly under it read "$-13.2": the
    // same loss, on the same screen, one of them looking like a gain.
    //
    // Reachable on an ordinary card at the IRS rate the README recommends:
    // $2.50 over 12.4 miles at $0.70/mile is -$13.24/hr.
    var rate = rateText;
    // Named, not just ordered. The landscape rules reclaim height when a
    // notice appears and they have to take it from the net line — which is
    // the headline repeated — rather than from the raw one, which is on this
    // page exactly once. See the rule under #verdict:has(#warn...).
    var rows = [['raw', '<span>' + money(r.pay, 2) + ' <i>in</i> ' + time + '</span>'
                 + ' <span><i>=</i> <b>' + rate(gross) + '/hr</b> <i>raw</i></span>']];
    if (deducted) {
      rows.push(['net',
                 '<span><i>less</i> ' + money(r.cost, 2) + ' <i>car costs</i></span>'
                 + ' <span><i>=</i> <b>' + rate(r.perHour) + '/hr</b> <i>net</i></span>']);
    }
    // The two ends, not the union: `places` is in the order the frames
    // arrived. See MV.ends, which the offers page asks too. Without MV this
    // page still draws the list, which is what it always drew.
    showPlaces(MV ? MV.ends(r) : r.places);
    // Sent by the server, which is where the order in the car is known. A page
    // works it out for nobody: several may be open and each would answer
    // slightly differently as its own clock drifted.
    showStack(r.stack);
    el.working.innerHTML = rows.map(function (row) {
      return '<div class="' + row[0] + '">' + row[1] + '</div>';
    }).join('');
    el.working.hidden = false;

    var notes = [];
    // Before the brightness notes, which used to be first. Those are about the
    // reading underneath them being poor; this is about the reading underneath
    // it not being kept at all, and it is the only note here whose cost cannot
    // be undone by looking again. A washed-out card can be re-read; an offer
    // nobody wrote down is gone.
    if (notSaving) notes.push(notSaving);
    // Then, because it is the note with a remedy in the driver's own hand, and
    // because the reading it is sitting on top of was taken through a
    // washed-out card.
    if (tooBright) notes.push(TOO_BRIGHT);
    if (tooDim) notes.push(TOO_DIM);
    // The label above has room for three words. This is where the reason goes,
    // and it has to be here rather than only in the label, because "CHECK THE
    // TIME" on its own reads as "one number looks odd" — when what happened is
    // that the rig is holding a fraction of the journey and knows it.
    // Before the leg note, because it is about the screen rather than about a
    // figure on it: when this fires there is no offer for any of the other
    // sentences to be about.
    if (r.doubt === 'screen') {
      notes.push('This looks like the app itself rather than an offer — a '
                 + 'route being planned, or a dash waiting for one. No rate is '
                 + 'shown, because the figures are not a job.');
    }
    if (r.doubt === 'leg') {
      notes.push('The card shows a leg this reading could not time'
                 + (typeof r.untimedMiles === 'number'
                    ? ' — ' + r.untimedMiles.toFixed(1) + ' mi of it'
                    : '')
                 + ', so these minutes are part of the trip, not all of it. '
                 + 'No rate is shown rather than one several times too high.');
    }
    // Above the reading-quality notes below, because those describe a card the
    // rig read and this describes the rig not having done a thing the driver
    // asked for. It stands until a Re-find actually works.
    if (refindRefused) notes.push(refindRefused);
    // A rate with no running cost taken off it is a CEILING, not the offer,
    // and the old wording — "pay shown before mileage cost" — described the
    // arithmetic without saying what it meant. On the owner's own shift 108 of
    // 202 offers were rated this way and the overstatement ran to a median of
    // 30% and a maximum of 334%. `uncosted` rather than `milesUncertain`
    // because a card that states no distance at all lands in the same place,
    // and because with no cost per mile configured there is nothing missing.
    if (r.uncosted) {
      // Short because it has to fit: the first wording of this ran twenty
      // characters longer and pushed the headline rate off the 480x320 panel,
      // which the layout checks caught. "Ceiling" is the word that matters —
      // it says the number may be anywhere below itself.
      notes.push(r.milesUncertain
        ? 'Distance unreadable — rate is a ceiling.'
        : 'No distance on the card — rate is a ceiling.');
    } else if (r.milesUncertain) notes.push('Distance unreadable — check the miles.');
    else if (r.milesCorrected) notes.push('Recovered a decimal in the distance — check the miles.');
    // Said out loud, because a fragment is not a small error in a safe
    // direction: the same pay divided by less time always looks better. The
    // scanner is still resampling when this is showing, so it is a "wait" and
    // not a "no".
    if (r.whole === false) {
      notes.push('Still reading this card — the journey may not be all there yet, '
                 + 'which makes it look better than it is.');
    }
    el.warn.textContent = notes.join(' ');
    el.warn.hidden = !notes.length;

    // How old this offer is, always and first.
    //
    // It used to appear only once the reading had gone stale, which is the one
    // moment it is least useful: by then the card is dimmed and the driver has
    // already stopped trusting it. What they actually need to know, on a screen
    // beside a phone they are working with a mouse, is whether the figures
    // belong to the card in front of them or to the one before it — and that is
    // a question about seconds, asked continuously.
    //
    // Rounded to whole seconds and put first so it reads at a glance from the
    // driving seat. `readAt` is set by every reading that carries a verdict, so
    // in this branch it is always a real moment.
    // Given its own element, because the rest of this line is diagnostics —
    // how long the read took, how many frames it was merged from, whether the
    // corners are being tracked — and set in the same grey at the same weight
    // the age was one `·`-separated fragment among five, indistinguishable at
    // a glance from "1517ms". The age is the only part of it a driver acts on.
    var age = Math.max(0, Math.round((Date.now() - readAt) / 1000));
    var when = document.createElement('b');
    when.className = 'age';
    when.textContent = age < 1 ? 'just now' : age + 's ago';
    // Nodes rather than innerHTML: every fragment below is built from the
    // scanner's own JSON, and `trackNote` in particular quotes what the
    // tracker reported.
    el.detail.textContent = '';
    el.detail.appendChild(when);
    // The diagnostics get an element of their own so the 3.5" hat can drop them
    // and keep the age. They used to be bare text nodes, which CSS cannot
    // address, so the hat's only way to reclaim the line was to hide all of
    // #detail — and that took the age with it, on the one screen where the
    // driver is furthest from being able to work it out for themselves. See the
    // `max-height: 380px` block.
    var diag = document.createElement('span');
    diag.className = 'diag';
    diag.appendChild(document.createTextNode(
      (deducted ? ' · after $' + Number(r.costPerMile).toFixed(2) + '/mi costs' : '')
      + ' · ' + r.ms + 'ms'
      + (r.legs > 1 ? ' · ' + r.legs + ' legs' : '')
      + (r.mergedFrom > 1 ? ' · ' + r.mergedFrom + ' reads' : '')
      + (r.items ? ' · ' + r.items + ' items' : '')
      + trackNote(r)));
    el.detail.appendChild(diag);
    showRaw(r.text);
  }

  // Only worth saying when it is not the quiet default: corners that are being
  // followed, or a screen that went missing.
  function trackNote(r) {
    var bits = [];
    var t = r.track;
    if (t && t.lost) bits.push('screen not visible');
    else if (t && t.jumps) bits.push('re-locked on the phone');
    else if (t && t.drift >= 25) bits.push('tracking ' + Math.round(t.drift) + 'px');
    return bits.length ? ' · ' + bits.join(' · ') : '';
  }

  // What the dot means.
  //
  // It used to mean "this page has a socket to the web server", which is true
  // whenever the page is loaded at all — so it sat green and said "scanner
  // connected" over a camera that had crashed twenty minutes earlier. The one
  // fact a driver needs from it is whether anything is still reading offers.
  // The socket only decides whether that answer is current.
  function showConnection() {
    var quiet = Date.now() - seenAt;
    var alive = socketUp && quiet <= STALE_MS;
    // The camera view is the most convincing thing on this page and the last
    // to look wrong: a frozen JPEG of a phone showing an offer is
    // indistinguishable from a live one. The rule to dim it had been written
    // and never wired to anything, so the picture was served at full strength
    // however long the scanner had been dead. Dimming is not decoration here —
    // it is the only cue that what is on screen is a photograph of the past.
    var img = document.getElementById('view');
    if (img) img.classList.toggle('stalefeed', quiet > STALE_MS);
    if (!socketUp) {
      el.conn.textContent = 'reconnecting to the server…';
    } else if (scannerState && !scannerState.enabled) {
      el.conn.textContent = 'no Pi scanner on this machine';
    } else if (scannerState && !scannerState.running) {
      el.conn.textContent = 'scanner not running'
        + (scannerState.error ? ': ' + scannerState.error : '');
    } else if (quiet > STALE_MS) {
      el.conn.textContent = 'nothing from the scanner for '
        + Math.round(quiet / 1000) + 's';
    } else if (Date.now() - readAt > READ_STALE_MS) {
      // The loop is turning and the reader is not. Worth its own line: the two
      // failures need different things done about them, and "scanner reading"
      // is the one sentence that must not be printed over a verdict nothing
      // has refreshed.
      el.conn.textContent = 'the loop is running but nothing has been read for '
        + Math.round((Date.now() - readAt) / 1000) + 's';
    } else {
      el.conn.textContent = 'scanner reading';
    }
    el.dot.classList.toggle('on', alive
      && !(scannerState && (!scannerState.enabled || !scannerState.running)));
  }

  function connect() {
    var src = new EventSource('/api/events');
    src.onopen = function () {
      socketUp = true;
      showConnection();
    };
    src.onmessage = function (e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      // Stamped here, on the clock this page is going to compare it against.
      // `at` comes off the Pi, and a Pi 4 has no real-time clock: it boots in
      // 1970 and jumps when the network arrives. Subtracting one machine's
      // clock from another's is how "12 seconds old" became "fifty-six years
      // old" — or, worse, a negative age that never trips the stale test at
      // all, leaving a frozen verdict on screen looking live.
      //
      // A replay does not move this clock at all. It carries the last
      // READING's age, not the last heartbeat's, and taking the older of the
      // two put a page opened between offers — minutes since a read, a
      // heartbeat four seconds ago — on "nothing from the scanner for 300s"
      // with the dot off and the picture dimmed, until the next heartbeat.
      // The seed from /api/status already knows when the scanner last spoke.
      if (!msg.replay) seenAt = Date.now();
      // ...and a live message from the scanner is the scanner running,
      // whatever the snapshot said. `scannerState` was taken once, from
      // /api/status at load, and a page opened in the seconds the server
      // was restarting the scanner read "scanner not running" for the rest
      // of the shift, verdicts flowing beside it.
      if (!msg.replay && scannerState && scannerState.enabled && !scannerState.running) {
        scannerState.running = true;
        scannerState.error = null;
      }
      // The camera saying it has run out of room. It rides the heartbeat rather
      // than a reading precisely because the state it describes is the one
      // where there may be no reading — the phone is brighter than the camera
      // can take, the card is washing out, and everything below keys on
      // `ready`, so a message that carries no verdict is dropped whole. This
      // has to be read off the message before that happens.
      if (msg.tooBright !== undefined) tooBright = !!msg.tooBright;
      if (msg.tooDim !== undefined) tooDim = !!msg.tooDim;
      // Same channel, same reason, and one more: a Re-find is refused most
      // often when there is no screen to find, which is exactly when no
      // reading is coming to carry the news.
      if (msg.refindRefused !== undefined) refindRefused = msg.refindRefused || null;
      // Same channel again, and the one that most needs it: while the journal
      // is refusing writes every reading still arrives looking perfect, so a
      // channel that rode a reading would be carried by messages that
      // contradict it.
      if (msg.notSaving !== undefined) notSaving = msg.notSaving || null;
      // A new offer on the record. `tookState` resets with it — the mark
      // belongs to the offer, not to the button.
      //
      // ...and so does `tookFailed`, for the same reason and a worse one. It
      // says a write FAILED, which is a statement about one press on one card.
      // Left standing it was re-rendered against every later card: one dropped
      // POST — the link to the copy at home, the server restarting mid-shift —
      // and the button read "Took $8.20 · not saved" for the rest of the
      // shift, on cards the driver had never touched. Worse than a stale
      // label, because the title invites a retry, and pressing it on the wrong
      // card writes a real mark and a real pairing row into a journal whose
      // history cannot be regenerated.
      if (msg.offer && msg.offer.id) {
        if (!onRecord || onRecord.id !== msg.offer.id) {
          tookState = false;
          tookFailed = false;
          // ...and the destination read off the last card, which belongs to
          // that card and not to this one.
          //
          // `destSaid` was cleared by a press, by a held order ending, and by
          // a page load — and by nothing at all on the screening path, which
          // is the path the passive capture made ordinary. Screen a card that
          // prints "Customer dropoff", tap the pin on the phone, decline, and
          // the next card arrived with the button already green: "Dropoff read
          // as 123 Oak St. Press again to read it afresh", naming a job the
          // driver had just turned down.
          //
          // The worse half is the silence. `wants` — the amber "this one needs
          // a press" state — is gated on `!destSaid`, so a card that genuinely
          // refuses a destination stopped asking for one. Accept it and every
          // stack verdict for the rest of that delivery reads ENDS ?, with the
          // one control that would fix it sitting there claiming the answer
          // was already in.
          //
          // /api/status is fetched once, at load — it is not a poll — so
          // nothing downstream was ever going to catch this up.
          destSaid = '';
        }
        onRecord = msg.offer;
        showTook();
        // ...and the dropoff button, whose whole screening condition is a
        // property of THIS offer: whether it named a destination and whether
        // the card refused one. The tick below would get there within a
        // second; a second is a long time on a screen the driver is reading
        // to decide, and the card may be gone by then.
        showDest();
      }
      // A read started, and — on the next message carrying a verdict — ended.
      // Same shape as the two above: no `ready`, so it cannot stand in for one.
      if (msg.reading) readingAt = Date.now();
      if (msg.ready !== undefined) readingAt = 0;
      // Only a reading moves the verdict's own clock. The guard is the same one
      // the next line uses to decide whether this message replaces the verdict
      // at all — a heartbeat carries no `ready`, and must not vouch for one.
      // A replay is not a read. The server sends the last reading to every
      // socket that connects, so a dropped connection coming back re-stamped a
      // dead rig's verdict as freshly read — once per reconnect, indefinitely.
      // Its age comes with it, for the same reason the seed above takes one.
      if (msg.ready !== undefined) {
        readAt = msg.replay ? Date.now() - age(msg.ageMs) : Date.now();
      }
      if (msg.phase) phase = msg;
      if (msg.ready !== undefined) last = msg;
      // Every reading carries whether an order is being held, because the
      // server's own clock can end one — see holding() — with nothing pressed
      // here to say so. Without this the button outlives the order it puts
      // down, and a driver presses it on nothing.
      if (msg.ready) {
        // An order ending is what clears the destination read for it. Without
        // this, `destSaid` outlived its order: press Drop, or let the server's
        // own clock expire the hold, accept the next job, and the button came
        // back reading the PREVIOUS order's address with "press again to read
        // it afresh" — for an order whose destination has never been scanned,
        // so the driver has no reason to press it.
        if (holdingNow && !msg.holding) destSaid = '';
        // A different order in the car is a different write. `dropFailed` is
        // about the press that failed, not about this job, and left standing
        // it painted the NEXT order's button "Drop · failed" the moment that
        // order appeared — a failure reported for something nobody had tried
        // yet. See tookFailed above, which was the same fault on the same bar.
        if (dropFailed && holdSignature(msg.holding) !== dropFailedFor) {
          dropFailed = false;
          dropFailedFor = null;
        }
        holdingNow = !!msg.holding;
        heldSig = holdSignature(msg.holding);
        heldEnds = msg.holding ? (msg.holding.dropoff || null) : undefined;
        showDrop();
        showDest();
      }
      // The destination, arriving seconds after the button was pressed. Its own
      // message, carrying no verdict: there is no offer on the screen it was
      // read from, there is a navigation app, so it must not be able to stand
      // in for a reading. `line` is what the driver reads to tell whether the
      // scan caught the right screen.
      if (msg.dropoff && msg.dropoff.line) {
        destSaid = msg.dropoff.line;
        destBusy = false;
        showDest();
      }
      /* ...and the map, if that is what the pane is showing.
       *
       * ONE call, after every branch above has had its say. It was two — one
       * where the card lands, one where the held order does — and both halves
       * of the picture are set by different branches: the card's ends up
       * there, the order in the car down here. A message carrying both ran the
       * first call while `holdingNow` and `heldEnds` still held the LAST
       * order's, so the map was drawn against a hold that had already ended,
       * and the second call then hit the busy guard and did nothing. It
       * corrected itself a beat later through the catch-up in showMap's
       * finally, which is a bug fixing itself by accident.
       *
       * It also made the second call unreachable in every message shape the
       * server actually sends, so deleting it changed nothing that any test
       * could see — which is how a rule ends up with no check on it at all.
       *
       * A no-op unless the places actually changed, so a card re-read forty
       * times over is one drawing and no new lookups. */
      if (viewMode === 'map') showMap();
      render();
      showConnection();
    };
    src.onerror = function () {
      socketUp = false;
      showConnection();
    };
  }

  // Seed from the current state so a fresh tab is not blank until the next read.
  //
  // Aged, not adopted. `readAt` and `seenAt` start at "now" because loading the
  // page is hearing something — but what this seeds is a reading that may be
  // hours old, and starting its clock at zero paints a dead rig's last ACCEPT
  // at full confidence for twelve seconds and leaves it unlabelled for twenty.
  // On the one screen whose whole job is a verdict, that is the confidently
  // wrong number this project exists to avoid, and it happens on every load.
  //
  // The server sends how old it is rather than when it happened, because a Pi
  // has no real-time clock and subtracting its idea of now from this browser's
  // is exactly the arithmetic the message handler below already refuses to do.
  fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
    if (s.last) {
      last = s.last;
      readAt = Date.now() - age(s.lastAgeMs);
    }
    // ...and the same for having heard from the scanner at all. Without this a
    // page loaded against a stopped scanner showed a live connection dot over
    // a frozen picture, because the fetch that proved the *web server* was up
    // was taken as proof the camera was.
    if (s.heardAgeMs !== undefined && s.heardAgeMs !== null) {
      seenAt = Date.now() - age(s.heardAgeMs);
    } else if (s.last) {
      seenAt = readAt;
    }
    if (s.status) phase = s.status;
    // The offer on record survives a reload and a dropped socket, which is the
    // normal case rather than the odd one: the driver accepts on the phone, the
    // card goes, and only then do they look at this screen.
    if (s.offer && s.offer.id) {
      onRecord = s.offer;
      // ...and whether it has already been marked. Without this the button was
      // page-local: mark an offer, reload the panel, and it offered to mark it
      // again while the count on the status row had already counted it — two
      // figures forty pixels apart disagreeing about the same act.
      tookState = !!s.offer.accepted;
      showTook();
    }
    // ...and so does the order in the car. A panel opened mid-delivery — which
    // is exactly when a second app's offer arrives — would otherwise show no
    // way to put it down, and no sign that anything was being carried.
    holdingNow = !!s.holding;
    heldSig = holdSignature(s.holding);
    heldEnds = s.holding ? (s.holding.dropoff || null) : undefined;
    showDrop();
    // ...and what it was read as, so a panel opened or reloaded mid-delivery
    // shows the destination already scanned rather than offering to scan one
    // that is on the record. Only a SCANNED one: a dropoff that came off the
    // offer card is a cross-street the card printed, not an answer to this
    // button, and showing it here would say the question had been asked.
    if (s.holding && s.holding.dropoffScanned && s.holding.dropoff) {
      destSaid = s.holding.dropoff;
    } else if (!s.holding) {
      destSaid = '';
    }
    showDest();
    scannerState = s.scanner || null;
    render();
    showConnection();
  }).catch(function () {});

  /* The camera view, streamed where that works and polled where it does not.
   *
   * This used to fetch a still, wait for it, wait a further 60ms and fetch
   * again — measured at 13.7 distinct frames a second against a scanner
   * producing 30, with a request, a file read, a response and a decode for
   * every one of them whether or not the picture had changed. The driver
   * watches this panel to decide whether to press Accept, so the lag between
   * the phone changing and the screen showing it is the whole quality of it.
   *
   * A multipart stream holds one connection open and the server writes a part
   * only when the frame is actually new: measured at 29.0 distinct frames a
   * second on the same rig, which is the writer's own rate. Polling is kept as
   * the fallback because a stream is one more thing that can fail — a proxy
   * that buffers it, a browser that will not render it — and a still that
   * arrives slowly beats a picture that never appears. */
  var view = document.getElementById('view');
  var viewNote = document.getElementById('viewNote');
  var viewWrap = document.getElementById('viewWrap');
  /* Which picture to ask the rig for. The scanner reads this off the same
     file that tells it somebody is watching, so it travels on the request for
     a frame rather than in a call of its own — see touchWatchFile in
     server.js. It is a query parameter and not a header because the <img> tag
     is what makes these requests, and an <img> cannot set a header. */
  var VIEW_KEY = 'uberscan.liveView';
  /* Three things this pane can be, cycled by one button.
   *
   *   screen — the phone's own display, flattened. What the driver reads the
   *            card off, and what lets them check the rig's figures against
   *            what the card actually said.
   *   scene  — the whole cabin with the calibrated corners on it, which
   *            answers "is the mount aimed right?". A question you ask once,
   *            while setting the rig up.
   *   map    — where this offer's ends are, against where the car is and where
   *            the order already in it is going.
   *
   * A mode on the existing control rather than a fourth button: the bottom bar
   * holds six, and ▤ Offers already cost ▣ Set box its slot in the fullest
   * state. A third mode costs no columns at all.
   *
   * The phone, unless the driver has said otherwise. During a shift the screen
   * is being used to read and work the phone through, and in the scene view
   * the phone is about a third of a 640px-wide thumbnail of a car interior.
   */
  var viewMode = 'screen';
  try {
    var stored = localStorage.getItem(VIEW_KEY);
    if (stored === 'screen' || stored === 'scene') viewMode = stored;
  } catch (e) { viewMode = 'screen'; }

  /* Which picture to ask the rig for. In map mode there is no picture: the
     frame requests stop, which is also what tells the scanner nobody is
     watching. Asked for `screen` anyway when the value is wanted, because the
     map is not a third thing the rig can photograph. */
  function streamUrl() {
    return '/api/frame.mjpeg?view=' + (viewMode === 'scene' ? 'scene' : 'screen');
  }
  var FRAME_GAP = 30;          // a floor for the fallback, so it cannot spin
  var streaming = false;
  var streamTried = 0;
  var framePending = false;
  var watchdog = null;
  // Whether the stream was running when the map took the pane, so it can be
  // put back rather than silently demoted to stills.
  var wasStreaming = false;
  // One transparent pixel, which is how the <img> is made to let go of an open
  // multipart connection without raising an error the page would read as a
  // camera that has died.
  var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  // The phone view's layout — the picture height-first beside a narrow
  // verdict — is for a portrait picture of a phone. The rig writes a
  // landscape scene while it is aiming, which is what a rig on its first boot
  // does for as long as it takes, and laid out as a phone that picture
  // squeezed the verdict to 153px and the bar's buttons to 24px at 800x480.
  // The class follows the picture, not the button.
  function layoutForFrame() {
    var portrait = view.naturalHeight > view.naturalWidth;
    document.body.classList.toggle('phoneview', viewMode === 'screen' && portrait);
    return portrait;
  }

  function sawAFrame() {
    viewWrap.classList.remove('gone');
    var portrait = layoutForFrame();
    viewNote.textContent = viewMode === 'screen'
      ? (portrait ? "the phone's screen, flattened"
                  : 'camera view while the rig finds the phone')
      : 'camera view · inset is what the reader sees';
    clearTimeout(watchdog);
    watchdog = null;
  }

  function noFrameYet() {
    // Not while the map is up. `gone` collapses the view column and hands the
    // whole panel to the verdict, and a frame that never arrives — the rig
    // restarting, a camera unplugged — would otherwise take the map down with
    // it and leave the driver looking at a button that says ⛶ Phone over an
    // empty half of screen.
    if (viewMode === 'map') return;
    viewWrap.classList.add('gone');
    viewNote.textContent = 'no camera view yet — the scanner writes one every few seconds';
  }

  function startStream() {
    streaming = true;
    streamTried++;
    view.src = streamUrl();
    // If nothing renders at all, the stream is not working here — whatever the
    // reason — and a still every 30ms is a great deal better than a blank box.
    clearTimeout(watchdog);
    watchdog = setTimeout(function () {
      if (streaming && !view.naturalWidth) fallBackToStills();
    }, 4000);
  }

  function fallBackToStills() {
    streaming = false;
    clearTimeout(watchdog);
    watchdog = null;
    framePending = false;
    refreshView();
  }

  // Chained, not on a timer. A fixed interval asks for the next frame whether
  // or not the last one has arrived, so on a weak signal the requests stack up
  // and the picture gets further behind the longer you watch. Asking again only
  // once the previous frame has landed makes the rate whatever the link can
  // actually carry.
  function refreshView() {
    if (streaming || document.hidden || framePending) return;
    // Nothing is fetched while the map is up. Thirty frames a second down a
    // phone hotspot for a picture nobody can see is the kind of cost that only
    // shows up as a bill, and the same requests are what tell the scanner
    // somebody is watching — see touchWatchFile in server.js.
    if (viewMode === 'map') return;
    framePending = true;
    view.src = '/api/frame.jpg?view=' + (viewMode === 'scene' ? 'scene' : 'screen')
             + '&t=' + Date.now();
  }

  function frameDone() {
    framePending = false;
    if (!streaming && !document.hidden) setTimeout(refreshView, FRAME_GAP);
  }

  view.addEventListener('load', function () {
    // The blank pixel that closed the stream is a load like any other, and
    // taken as a frame it would rewrite the caption — over a map — to say the
    // phone's screen was on the glass. So the caption is skipped.
    //
    // The CHAIN is deliberately not stopped here. Returning outright was the
    // obvious thing and it made the rule live in two places: frameDone was
    // never reached, so refreshView's own guard could not fire, and a check
    // that cannot fire is not a check — it survived every mutation because
    // nothing could reach it. Falling through means the guard in refreshView
    // is the single place "no frames while the map is up" is decided, and it
    // is exercised on every frame that lands after the switch.
    if (viewMode !== 'map') sawAFrame();
    if (!streaming) frameDone();
  });
  view.addEventListener('error', function () {
    // No guard on the map here, deliberately. noFrameYet is what adds `gone`
    // and so what would take the map down, and it refuses to on its own — a
    // second test for the same thing in front of it meant neither could be
    // checked: delete either one and the other still caught it, so nothing in
    // the suite could tell whether the rule was there at all.
    if (streaming) {
      // The connection dropped, or this browser will not render the stream.
      // One retry, because a scanner restarting underneath it is the ordinary
      // cause and it comes straight back; after that, stills.
      if (streamTried < 2) return startStream();
      noFrameYet();
      return fallBackToStills();
    }
    noFrameYet();
    frameDone();
  });

  startStream();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      // A stream to a hidden tab is bytes and CPU spent on nobody.
      if (streaming) { streaming = false; view.src = ''; }
      return;
    }
    // ...and a tab that comes back to a map must not start a stream behind it.
    // The picture is restored by the button, which is the thing that put the
    // map there.
    if (viewMode === 'map') return;
    streamTried = 0;
    startStream();
  });

  // Ask the scanner to forget where it thinks the phone is. The automatic
  // recovery handles the unambiguous case — corners off to one side while the
  // card is in the middle — but corners sitting on the screen at the wrong size
  // are equally "the phone moved" and "the outline is on part of it", and only
  // the person looking at the picture can tell. So they get to say.
  var resetBtn = document.getElementById('reset');
  resetBtn.addEventListener('click', function () {
    resetBtn.disabled = true;
    resetBtn.textContent = '⟳ …';
    ask('/api/recalibrate', { method: 'POST' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      // "asked", not "re-finding". Everything this promise knows is that a web
      // handler touched a file; it has not spoken to the scanner and cannot
      // know whether the scanner will honour the request or refuse it for want
      // of a screen to find. It claimed the stronger of the two, so a refused
      // press read on this screen exactly like a press that worked, and the
      // driver went back to driving through corners they had just rejected.
      // What actually happened arrives on the heartbeat, as a note.
      .then(function () { resetBtn.textContent = '⟳ asked'; })
      .catch(function () { resetBtn.textContent = '⟳ failed'; })
      .then(function () {
        setTimeout(function () {
          resetBtn.disabled = false;
          resetBtn.textContent = '⟳ Re-find';
        }, 2500);
      });
  });

  // --- which picture ------------------------------------------------------
  //
  // Remembered, because it is a property of how this rig is used rather than
  // of this page load. A driver reading the phone off this display through a
  // bluetooth mouse is doing that for the whole shift, and having to press a
  // button again every time the page reloads is the kind of small tax that
  // ends with the feature unused.
  var viewModeBtn = document.getElementById('viewMode');
  var liveMap = document.getElementById('liveMap');

  // screen → scene → map → screen. The label says what pressing it gets you,
  // not what you are looking at, which is the rule the two-way version already
  // kept.
  var NEXT = { screen: 'scene', scene: 'map', map: 'screen' };
  var LABEL = { screen: '⛶ Scene', scene: '⛶ Map', map: '⛶ Phone' };

  function applyViewMode() {
    var onMap = viewMode === 'map';
    liveMap.hidden = !onMap;
    view.hidden = onMap;
    layoutForFrame();
    // Still a mode rather than a navigation, and still pressed when it is not
    // showing the ordinary picture: the phone's screen is this panel's resting
    // state and both of the others are a departure from it.
    viewModeBtn.setAttribute('aria-pressed', viewMode === 'screen' ? 'true' : 'false');
    viewModeBtn.textContent = LABEL[viewMode];
    if (onMap) {
      // `gone` hands the whole panel to the verdict, which is right when there
      // is no picture and wrong when the pane has a map in it.
      viewWrap.classList.remove('gone');
      showMap();
    } else if (!viewWrap.classList.contains('gone')) {
      sawAFrame();
    }
  }

  viewModeBtn.addEventListener('click', function () {
    viewMode = NEXT[viewMode] || 'screen';
    // The map is deliberately NOT remembered. Switching to it is what asks a
    // public geocoder about places customers live, and a remembered map mode
    // would make the next page load ask without anybody pressing anything —
    // which moves that decision away from the person whose decision it is.
    // The two pictures are remembered exactly as before.
    try {
      if (viewMode !== 'map') localStorage.setItem(VIEW_KEY, viewMode);
    } catch (e) { /* private mode */ }
    applyViewMode();
    // The mode rides on the request for a frame, so the rig does not hear
    // about it until the next one is asked for. A stream is one request that
    // never ends — it would go on delivering the old picture until something
    // else restarted it — so it is restarted here.
    if (viewMode === 'map') {
      // A multipart stream is one request that never ends, and left open
      // behind a hidden <img> it goes on pulling thirty frames a second down a
      // phone hotspot for a picture nobody is looking at. Pointing the element
      // at a blank pixel is what actually closes the connection; dropping the
      // src attribute does it too and fires an error, which this page reads as
      // a rig that has stopped.
      wasStreaming = streaming;
      streaming = false;
      framePending = false;
      view.src = BLANK;
    } else if (wasStreaming) {
      // Back to a picture, and back to the stream if that is what it was —
      // otherwise one trip through the map would leave the panel on stills for
      // the rest of the shift, at 30ms a frame instead of the writer's rate.
      wasStreaming = false;
      startStream();
    } else if (streaming) startStream();
    else refreshView();
  });

  /* --- the map mode --------------------------------------------------------
   *
   * WHAT THIS IS FOR, in the driver's own words: "it would also be helpful to
   * have the map view so I can visually see the route as well as how they may
   * chain together and if it makes sense to pickup the second offer since it
   * would be mostly along the route I am going anyways."
   *
   * So the picture is: where the car is, where the order already in it is
   * going, and where this new one starts and ends. Four points and the lines
   * between them answer a question the card's own words cannot — ENDS ? is the
   * chip on about half of real pairs, because most cards name no destination
   * until you accept.
   *
   * WHAT IT IS NOT ALLOWED TO DO. Read the header of map-view.js. Nothing
   * computed from a geocoded point may become a rate, a verdict or a billed
   * distance on this panel; the whole project refuses a number that is
   * confidently wrong and silent. The one figure that leaves this function is
   * the detour, and it is stated under the pins it was computed from, on a map
   * the driver pressed a button to open, in straight-line miles that are named
   * as straight-line miles. It never touches #perHour, the verdict, or the
   * stack line.
   *
   * AND NOTHING IS LOOKED UP UNTIL THE BUTTON IS PRESSED. Some of these places
   * are where customers live, the rig itself never sends them anywhere, and
   * switching to this mode is the press that decides it — the same gate as
   * "Place them on a map" on the map page. It is deliberately not remembered,
   * so a reload cannot ask on nobody's behalf. */
  var MV = window.MapView;
  var mapGeo = null;
  var theMap = null, mapLayer = null;
  // Which set of places is drawn, so a card re-read forty times a second does
  // not re-draw forty times, and so an answer that arrives after the driver
  // has moved on is thrown away rather than pinned under the new card's
  // heading.
  var mapFor = null;
  var mapBusy = false;
  // Where the car was, off the newest journal row that carries a position.
  // Measured by the rig's own GPS rather than looked up, which is what makes
  // it the one point here that can contradict a pin.
  var carFix = null, carAsked = 0;

  /* The words under the map, and the last of them that described what is
     drawn. `lastLine` is not simply the last thing said: "looking up 3
     places…" describes a map that is not there yet, and re-stating it on a
     drawn map would be a second way of saying nothing. Only mapDrew writes it. */
  var lastLine = '';
  var lastBounds = null;

  function mapSay(text) { viewNote.textContent = text; }

  function mapDrew(text) { lastLine = text; mapSay(text); }

  /* The places this offer and the order in the car are about. Kept in one
     place because the KEY is built from it too, and a key that disagreed with
     what was drawn is how a map ends up showing the last card under this
     card's numbers. */
  function mapWants() {
    var o = onRecord || {};
    var held = holdingNow ? (heldEnds || null) : null;
    var names = [o.pickup, o.dropoff, held].filter(Boolean)
      .filter(function (v, i, all) { return all.indexOf(v) === i; });
    return { pickup: o.pickup || null, dropoff: o.dropoff || null,
             held: held, names: names };
  }

  /* Where the car is, from the journal rather than from the browser. The
     panel's browser sits on a LAN address over plain http, where the
     geolocation API is refused outright, and would answer from wifi if it
     were not. The rig stamps every row with its own GPS fix — see rpi/gps.py —
     so the newest row that carries one is where the car was when the last card
     came up, which on a working shift is minutes old. */
  /* How old a fix may be before it stops being where the car IS.
     rpi/gps.py states the failure as a certainty rather than a risk: the app on
     the phone runs on a timer, so it WILL stop mid-shift, and the newest row
     that carries a position then stops moving while the car does not. Past
     this, the anchor is history and the detour measured from it is a claim
     about a journey nobody is on. */
  var FIX_STALE_MS = 20 * 60000;
  // ...and the point past which it is not worth mentioning that it is old.
  var FIX_AGEING_MS = 4 * 60000;

  function askCar() {
    var now = Date.now();
    if (carFix && now - carAsked < 120000) return Promise.resolve(carFix);
    carAsked = now;
    return fetch('/api/journal?days=1&limit=400')
      .then(function (r) { return r.json(); })
      .then(function (body) {
        var rows = (body && body.offers) || [];
        var best = null;
        rows.forEach(function (row) {
          var at = MV.fixOf(row);
          if (!at) return;
          if (!best || (row.at || 0) >= best.at) {
            // The row's stamp AND how stale the fix already was when the row
            // was written — rpi/journal.py keeps `gpsAge` for exactly this, and
            // both were being thrown away here. A position twenty seconds old
            // is half a mile at fifty miles an hour, and this one anchors the
            // only figure the mode produces.
            best = { at: row.at || 0, where: at,
                     wasOld: (typeof row.gpsAge === 'number' ? row.gpsAge : 0) * 1000 };
          }
        });
        carFix = best ? { lat: best.where.lat, lon: best.where.lon,
                          age: Math.max(0, now - best.at) + best.wasOld } : null;
        return carFix;
      })
      .catch(function () { return carFix; });
  }

  /* How old the anchor is NOW, rather than when it was fetched. askCar holds
     its answer for two minutes, so reading the stored age straight back would
     under-report by up to that much — and the whole point of carrying it is
     that it is the number nobody was checking. */
  function fixAge() {
    if (!carFix || typeof carFix.age !== 'number') return null;
    return carFix.age + Math.max(0, Date.now() - carAsked);
  }

  function spellAge(ms) {
    var mins = Math.round(ms / 60000);
    if (mins < 60) return mins + ' min';
    var hrs = Math.round(mins / 6) / 10;
    return hrs + 'h';
  }

  /* A place name, cut to what fits the caption's cap.
     Every other line under the map is a fixed string this file can be read
     for; this is the one that carries a value, and its bound is the parser's
     MAX_PLACE of 60. At 60 it took four of the two rows the caption has.
     20 is measured, and measured on WIDTH rather than on characters, which
     is the trap: 32 characters of this driver's own real names came out two
     rows, and 32 of the widest characters the font has came out three and was
     clipped — and this branch fires precisely when a name is OCR sludge, so
     the pathological string is the expected input, not the corner. At 20 the
     misread-name line is two rows at 800x480 and three on the 3.5" hat, which
     is the cap on each, for every real place in the owner's week AND for a
     name of twenty W's. Cut on a space where there is one near the end, so
     the driver reads whole words; the ellipsis says the rest was cut, and the
     pin it names is marked on the map beside it either way. */
  var PLACE_SHOWN = 20;

  function shortPlace(name) {
    var s = String(name == null ? '' : name).trim();
    if (s.length <= PLACE_SHOWN) return s;
    var cut = s.slice(0, PLACE_SHOWN);
    var space = cut.lastIndexOf(' ');
    if (space >= PLACE_SHOWN - 8) cut = cut.slice(0, space);
    return cut.replace(/[\s,]+$/, '') + '…';
  }

  async function showMap() {
    if (!MV) {
      // map-view.js is same-origin and in the service worker's shell, so this
      // should not happen. A control that does nothing at all, silently, is
      // this project's second named fault, and "should not happen" has never
      // been a reason to leave one in.
      mapSay('map-view.js did not load, so there is no map here.');
      return;
    }
    var want = mapWants();
    var key = want.names.join('|');
    if (mapBusy) return;
    if (mapFor === key && theMap) {
      /* Nothing to redraw — but something to SAY. Leaving the map is three
         presses round the cycle, and on the way out sawAFrame rewrites this
         row to "camera view · inset is what the reader sees". Coming back on
         the same card used to return here before any mapSay, so the pins were
         still on the glass under a caption for a picture: the one figure this
         mode exists to produce, gone, with nothing saying so, in the 15px row
         the panel spends on it.

         The view is re-fitted for the same reason. A driver who nudged the
         map with the mouse and lost the pins had no control anywhere that
         brought them back — this button is now that control. */
      mapSay(lastLine);
      theMap.invalidateSize();
      if (lastBounds && lastBounds.length > 1) {
        theMap.fitBounds(lastBounds, { padding: [34, 34] });
      } else if (lastBounds && lastBounds.length) {
        theMap.setView(lastBounds[0], 13);
      }
      return;
    }
    mapFor = key;

    if (!want.names.length) {
      // The last card's pins must not stay on the glass under this card's
      // numbers. This is the COMMONEST card there is — 129 of the driver's own
      // 272 name no dropoff — so the path that draws nothing is the path that
      // was leaving a green "pick this one up" dot and a drawn route from an
      // offer that is no longer on screen.
      clearMap();
      // Short on purpose, and the budget is now stated where it can be
      // enforced rather than here: `#viewNote` is clamped to two rendered
      // rows on a dashboard panel and three on the 3.5" hat — see the rule in
      // this page's own <style> for why those two numbers and not one. What
      // the clamp cuts is the tail, so every line under it is written with
      // the part a driver acts on first.
      // mapDrew, not mapSay: "there is nothing to draw" describes what is on
      // the glass as truly as a detour does, and it is what coming back to
      // this same card has to be told again. Left as mapSay, re-entry would
      // restate the LAST card's detour over an empty map.
      mapDrew(onRecord
        ? 'this card names nowhere yet — ⌖ Dropoff reads it off your phone'
        : 'no card read yet — nothing to put on a map');
      return;
    }

    mapBusy = true;
    try {
      mapSay('loading the map…');
      var ready = await MV.needLeaflet(document, {
        css: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
        js: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
      });
      // Said plainly rather than left as a grey rectangle. A rig on a phone
      // hotspot in a car has no signal several times a shift and that is the
      // ordinary case, not an error — and ⛶ Phone puts the picture back.
      if (!ready) {
        // Shortened to the cap, not to taste: at its old length this was four
        // rows on the 3.5" hat and lost "the picture back" to the clamp, which
        // is the half that says what to press.
        mapSay('no signal — the map needs it for both its code and its '
               + 'tiles. ⛶ Phone puts the picture back.');
        return;
      }
      if (viewMode !== 'map' || mapFor !== key) return;

      if (!theMap) {
        theMap = L.map(liveMap, { zoomControl: true }).setView([33.94, -84.58], 11);
        // The attribution stays. These tiles are given away on the condition
        // that it does, and a panel being small is not an exemption.
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(theMap);
        mapGeo = new MV.Geocoder({
          // No "near" box on this panel and nothing to type one into at the
          // wheel. The box around the car's own position is the better answer
          // anyway and is what this page uses — see boxFor below.
          hint: function () { return ''; },
          store: {
            get: function () { return localStorage.getItem('uberscan.geocode.v1'); },
            set: function (s) { localStorage.setItem('uberscan.geocode.v1', s); },
            clear: function () { localStorage.removeItem('uberscan.geocode.v1'); }
          }
        });
      }
      // The pane was display:none when the map was made, so Leaflet measured a
      // box of zero and drew one tile in the corner. Asked again now it is on
      // screen, and again after the next frame, because the grid row it lives
      // in is sized from the viewport and is not final within this tick.
      theMap.invalidateSize();
      requestAnimationFrame(function () { if (theMap) theMap.invalidateSize(); });

      var here = await askCar();
      if (viewMode !== 'map' || mapFor !== key) return;

      var found = {};
      // A box around where the car actually is, which is the whole of what
