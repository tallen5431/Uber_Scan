    // one to act on. `locked` means two consecutive frames parsed the same —
    // and two frames that both lose the pickup leg to the same glare agree
    // perfectly with each other, so a fragment can be locked. `whole` means the
    // reading is finished: a total, or both legs of a two-leg card.
    //
    // Which way it errs matters. A card missing a leg always reads *better*
    // than it is — the same pay over less time — so an unqualified ACCEPT on
    // half a card is the one mistake this screen must not make. The scanner has
    // known the difference all along and used it to decide whether to keep
    // reading and whether to speak; it just never told the page.
    var settled = r.locked && r.whole !== false;
    announce(r);
    // A reading that cannot be true gets no verdict at all, and says which
    // figure to go and look at. The alternative is what this screen used to do
    // with a lost decimal point: a green ACCEPT on $1184 for a twenty-minute
    // ride, which is the most confident this display has ever been and the most
    // wrong. The numbers stay on screen underneath — the driver is holding the
    // same card and is the one who can see which of them is off.
    if (r.state === 'doubt') {
      el.verdictLabel.textContent =
        { pay: 'CHECK THE PAY', time: 'CHECK THE TIME',
          speed: 'CHECK THE DISTANCE',
          // The time, because that is what is wrong with it: the reading is
          // over one leg of a journey the card printed two of, so the minutes
          // are the drive to the rider and the rate is the job's several times
          // over. The long version is in the notes below, where there is room
          // for it; this label has to be read at a glance from the seat.
          leg: 'CHECK THE TIME',
          rate: 'CHECK PAY AND TIME',
          // Not a figure to check — there is no offer to check it against.
          // Uber's route planner and DoorDash's idle screen both reached the
          // rig with a payout on them, at $68.18/hr and $376.50/hr. The Pi's
          // own panel has named this since the reason was added; this screen,
          // which is the same decision shown larger, fell through to READ
          // AGAIN and sent the driver looking for a card that is not there.
          screen: 'NOT AN OFFER' }[r.doubt] || 'READ AGAIN';
    } else {
      el.verdictLabel.textContent =
        ({ go: 'ACCEPT', warn: 'CLOSE CALL', no: 'PASS' }[r.state] || '')
        + (settled ? '' : ' ?');
    }
    // The headline is net of running costs when a cost per mile is set, and
    // saying so is not optional: a driver who checks 7.09 over 34 minutes gets
    // $12.51/hr, the screen said $10.61, and nothing here explained the gap.
    var deducted = r.cost > 0;
    // A reading that cannot be true gets no rate, but it keeps the rate's
    // space. Collapsing it moved everything below by about 140px, so the
    // submetrics a driver is being asked to check jumped up the screen at the
    // exact moment they were told to look at them.
    setRate(r.state === 'doubt' ? '--' : rateText(r.perHour), '/hr',
            r.state === 'doubt');

    // Raw, always. This row is checked against the phone, so it has to be what
    // the card says — a "net pay" here would never match and the check would
    // be worse than useless.
    //
    // ...and labelled PAY ? when the payout was read off a card the rig went
    // looking for above the drawn card box rather than off the box
    // (pipeline.Scanner._look, rpi/cardfind.py): `cropFrom` on the line, which
    // the scanner says per card, not per read, so it stays while the panel
    // shows that card's payout (payout_from in rpi/scan_pi.py). The live view's
    // amber outline says the same and shows which card, but the live view is
    // not always up, and this row is the one a driver checks against the
    // phone — a payout the box did not hold is the one most worth checking.
    // The "?" is the panel's own word for "not settled, look again", as on
    // "ACCEPT ?" above. "FOUND PAY" was tried first and measured off: it
    // wrapped to two lines under the figure at 800x480 and lifted the verdict
    // label 9px, and on the 3.5" hat it ran letters out of its cell. "PAY?"
    // ran its "?" out of the cell on the hat's phone picture; "PAY ?" breaks
    // there, as "MIN LEFT" does beside it. rpi/test_layout.py holds it inside
    // its cell and on the glass, moving nothing but the figure a few pixels
    // sideways, at 1024x600, 800x480 and 480x320 in both pictures.
    el.lPay.textContent = r.cropFrom === 'found' ? 'pay ?' : 'pay';
    el.vPay.textContent = money(r.pay, 2);
    // The card's own minutes where it states them, the time left to a delivery
    // deadline where it does not. Not the billed minutes: this row is what a
    // driver checks against the phone in front of them, and a figure with
    // their own pad added to it would never match.
    var shown = (typeof r.cardMinutes === 'number') ? r.cardMinutes : r.minutes;
    el.vMin.textContent = (shown === null || shown === undefined)
      ? '--' : Math.round(shown);
    el.lMin.textContent = r.fromDeadline ? 'min left' : 'minutes';
    el.vMile.textContent = r.miles === null ? '--' : Number(r.miles).toFixed(1);
    // Secondary on purpose: $/hr is what decides an offer, because an hour is
    // the thing actually being spent. $/mi is the cross-check, for the case
    // the driver named — "some apps have very bad time estimates but the $/mi
    // could be used to judge it as well". Nothing else here covers it: an
    // optimistic time raises no doubt at all (SANE_MINUTES runs 2 to 240, and
    // an app twenty minutes hopeful sails through), so on exactly those offers
    // $/hr is quietly wrong and this is quietly right. A cross-check, not a
    // decision rule — AUDITS has the measurement that ranking on $/mile earns
    // less, and that stands.
    //
    // RAW, which is the whole of what makes it checkable, and what the row's
    // own rule already demanded: `perMile` off the reading is
    // (pay − miles × costPerMile) ÷ miles, the raw figure minus a constant
    // thirty cents, so $14.00 over 7.0 mi printed $1.70 between two boxes that
    // divide to $2.00. Nothing is lost — the working directly below spells the
    // deduction out, and the offers page and keypad still carry the net rate.
    //
    // It survives ONE of the six doubts, because `doubt` names which figure
    // the reader cannot believe and only one leaves this one standing:
    //
    //   pay    the payout is outside SANE_PAY: the same impossible number,
    //          divided.
    //   rate   pay over time is impossible and either half could be the liar.
    //   speed  miles over time is impossible; the miles could be the liar.
    //   leg    part of the journey was never timed, so the distance is partial.
    //   screen not an offer at all.
    //   time   the MINUTES are outside SANE_MINUTES — the one case where the
    //          pay and the distance have each passed their own test. This is
    //          built from those two and nothing else, so it is the last figure
    //          on the card still worth reading.
    //
    // `milesUncertain` refuses it whatever the verdict, for the same reason
    // `perMile` is null there: a rate off a distance the reader itself doubts
    // is a confident number with nothing behind it.
    // One clause, because only one of them can change an answer. A guard on
    // the denominator was written first — `r.miles > 0 &&`, mirroring
    // offer_parser's `miles and not miles_uncertain` — and no input could make
    // it matter: a delivery card states a deadline and no route, `miles`
    // arrives null, and the division comes out Infinity, which `money` already
    // answers '--' to along with a zero and a NaN. The mutation that weakens
    // it to `!== 0` survives every check in the suite. So the missing-distance
    // case is `money`'s refusal, and the check below pins it there.
    //
    // Nothing tests the types either: this runs only on a ready reading, and a
    // reading is not ready until `net = pay - cost` has been worked out, so a
    // pay that is not a number cannot arrive here.
    var rawPerMile = r.milesUncertain ? null : r.pay / r.miles;
    var mileStands = r.state !== 'doubt' || r.doubt === 'time';
    el.vPerMile.textContent = (rawPerMile === null || !mileStands)
      ? '--' : money(rawPerMile, 2);
    el.lPerMile.textContent = '$/mi';

    // The working, in the panel rather than in the small print, and in two
    // steps so both rates are on screen at once: what the offer itself pays
    // per hour — checkable against the card, and the number most drivers
    // already have a feel for — and what is left after running the car, which
    // is the one the verdict is made on.
    //
    // Each line is a pair of unbreakable halves, so a narrow screen splits
    // between them rather than stranding "min" on a line of its own.
    // The card's own minutes where it states them, the time left to the
    // deadline where it does not — the same fallback the submetric above uses.
    // Without it a delivery card, which states a deadline and no duration,
    // printed its raw rate over a dash: "$12.00 in -- min = $21.2/hr raw", a
    // sum with nothing under the line. That is the whole DoorDash half of a
    // shift, showing the one figure this panel had to be argued into showing
    // at all and then failing to say what it was divided by.
    var over = (typeof r.cardMinutes === 'number') ? r.cardMinutes : r.minutes;
    var mins = (over === null || over === undefined) ? '--' : Math.round(over);
    // Both rates come off the scanner, divided by the same minutes, so this
    // sum is the scanner's arithmetic rather than a second version of it.
    // Older payloads carried only the net rate; there, the card's own time is
    // the denominator, which is what those versions meant by it.
    var gross = (typeof r.grossPerHour === 'number') ? r.grossPerHour
      : (over > 0 ? r.pay / (over / 60) : null);
    // And the time it was divided by. Usually the card's own minutes, longer
    // once a shopping allowance or a pad is configured — shown as an extra so
    // the figure in the stat row below and the one these rates divide by are
    // both accounted for, instead of silently disagreeing.
    var billed = (typeof r.billedMinutes === 'number') ? r.billedMinutes : over;
    var extra = (over === null || over === undefined)
      ? 0 : Math.round(billed) - Math.round(over);
    var time = extra > 0 ? mins + ' <i>+</i> ' + extra + ' min'
             : extra < 0 ? Math.round(billed) + ' min'
             : mins + ' min';
    // Formatted exactly as the headline is, so the net figure here and the
    // big one above are visibly the same number rather than $10.60 sitting
    // under $10.6 and reading as a second, slightly different answer.
    // rateText, not a second copy of it. This one wrote "$-12.4" — the minus
    // wedged between the dollar and the digits, which line 615 explains is a
    // dash at a glance and which rateText has always got right. So the headline
    // read "-$13.2" and the working line directly under it read "$-13.2": the
    // same loss, on the same screen, one of them looking like a gain.
    //
    // Reachable on an ordinary card at the IRS rate the README recommends:
    // $2.50 over 12.4 miles at $0.70/mile is -$13.24/hr.
    var rate = rateText;
    // Named, not just ordered. The landscape rules reclaim height when a
    // notice appears and they have to take it from the net line — which is
    // the headline repeated — rather than from the raw one, which is on this
    // page exactly once. See the rule under #verdict:has(#warn...).
    var rows = [['raw', '<span>' + money(r.pay, 2) + ' <i>in</i> ' + time + '</span>'
                 + ' <span><i>=</i> <b>' + rate(gross) + '/hr</b> <i>raw</i></span>']];
    if (deducted) {
      rows.push(['net',
                 '<span><i>less</i> ' + money(r.cost, 2) + ' <i>car costs</i></span>'
                 + ' <span><i>=</i> <b>' + rate(r.perHour) + '/hr</b> <i>net</i></span>']);
    }
    // The two ends, not the union: `places` is in the order the frames
    // arrived. See MV.ends, which the offers page asks too. Without MV this
    // page still draws the list, which is what it always drew.
    showPlaces(MV ? MV.ends(r) : r.places);
    // A card being judged takes the stops' room back. See showStops.
    showStops(false);
    // Sent by the server, which is where the order in the car is known. A page
    // works it out for nobody: several may be open and each would answer
    // slightly differently as its own clock drifted.
    //
    // ...but against the hold as it is NOW, not as it was when this reading
    // arrived, which is the same rule `withStack` applies in server.js: no
    // hold, no pair line.
    //
    // `r` is `last`, the stored reading, and its `stack` was computed while an
    // order was still held. render() runs on the one-second tick, so it UNDID
    // all three of this page's own `showStack(null)` calls — press Drop and a
    // second later "+ $26 to $35/hr with the one you have" was back under the
    // verdict with the Drop button beside it already gone, until the next
    // reading arrived two and a half to six seconds later. The un-tick path
    // never even flickered, because that handler calls showDrop and showDest
    // and not showStack.
    //
    // server.js fixed exactly this for the reload path and its comment
    // describes the same screen: "press Drop and reload, and the panel showed
    // '+ $25-50/hr with the one you have' under the verdict while the Drop
    // button beside it was hidden because nothing was held". The live path was
    // left holding the reading's own copy.
    //
    // `holdingNow`, not `r.holding`: the page is told the hold has ended by the
    // mark reply, the Drop reply, the event stream and the status poll, and the
    // whole fault is that the READING is the one thing that has not heard.
    showStack(holdingNow ? r.stack : null);
    el.working.innerHTML = rows.map(function (row) {
      return '<div class="' + row[0] + '">' + row[1] + '</div>';
    }).join('');
    el.working.hidden = false;

    var notes = [];
    // Before the brightness notes, which used to be first. Those are about the
    // reading underneath them being poor; this is about the reading underneath
    // it not being kept at all, and it is the only note here whose cost cannot
    // be undone by looking again. A washed-out card can be re-read; an offer
    // nobody wrote down is gone.
    if (notSaving) notes.push(notSaving);
    // The order in the car, read again under either id: no pair is weighed
    // (server.js sends no stack for it), and this says why.
    if (holdingNow && r.heldCard) notes.push('The order you took, on the phone again \u2014 not a new offer.');
    // Then, because it is the note with a remedy in the driver's own hand, and
    // because the reading it is sitting on top of was taken through a
    // washed-out card.
    if (tooBright) notes.push(TOO_BRIGHT);
    if (tooDim) notes.push(TOO_DIM);
    // The label above has room for three words. This is where the reason goes,
    // and it has to be here rather than only in the label, because "CHECK THE
    // TIME" on its own reads as "one number looks odd" — when what happened is
    // that the rig is holding a fraction of the journey and knows it.
    // Before the leg note, because it is about the screen rather than about a
    // figure on it: when this fires there is no offer for any of the other
    // sentences to be about.
    if (r.doubt === 'screen') {
      notes.push('This looks like the app itself rather than an offer — a '
                 + 'route being planned, or a dash waiting for one. No rate is '
                 + 'shown, because the figures are not a job.');
    }
    if (r.doubt === 'leg') {
      notes.push('The card shows a leg this reading could not time'
                 + (typeof r.untimedMiles === 'number'
                    ? ' — ' + r.untimedMiles.toFixed(1) + ' mi of it'
                    : '')
                 + ', so these minutes are part of the trip, not all of it. '
                 + 'No rate is shown rather than one several times too high.');
    }
    // A rate with no running cost taken off it is a CEILING, not the offer,
    // and the old wording — "pay shown before mileage cost" — described the
    // arithmetic without saying what it meant. On the owner's own shift 108 of
    // 202 offers were rated this way and the overstatement ran to a median of
    // 30% and a maximum of 334%. `uncosted` rather than `milesUncertain`
    // because a card that states no distance at all lands in the same place,
    // and because with no cost per mile configured there is nothing missing.
    if (r.uncosted) {
      // Short because it has to fit: the first wording of this ran twenty
      // characters longer and pushed the headline rate off the 480x320 panel,
      // which the layout checks caught. "Ceiling" is the word that matters —
      // it says the number may be anywhere below itself.
      notes.push(r.milesUncertain
        ? 'Distance unreadable — rate is a ceiling.'
        : 'No distance on the card — rate is a ceiling.');
    } else if (r.milesUncertain) notes.push('Distance unreadable — check the miles.');
    else if (r.milesCorrected) notes.push('Recovered a decimal in the distance — check the miles.');
    // Said out loud, because a fragment is not a small error in a safe
    // direction: the same pay divided by less time always looks better. The
    // scanner is still resampling when this is showing, so it is a "wait" and
    // not a "no".
    if (r.whole === false) {
      notes.push('Still reading this card — the journey may not be all there yet, '
                 + 'which makes it look better than it is.');
    }
    el.warn.textContent = notes.join(' ');
    el.warn.hidden = !notes.length;

    // How old this offer is, always and first.
    //
    // It used to appear only once the reading had gone stale, which is the one
    // moment it is least useful: by then the card is dimmed and the driver has
    // already stopped trusting it. What they actually need to know, on a screen
    // beside a phone they are working with a mouse, is whether the figures
    // belong to the card in front of them or to the one before it — and that is
    // a question about seconds, asked continuously.
    //
    // Rounded to whole seconds and put first so it reads at a glance from the
    // driving seat. `readAt` is set by every reading that carries a verdict, so
    // in this branch it is always a real moment.
    // Given its own element, because the rest of this line is diagnostics —
    // how many frames it was merged from, whether the corners are being
    // tracked, and once how long the read took. Set in the same grey at the
    // same weight, the age was one `·`-separated fragment among five,
    // indistinguishable at a glance from "1517ms". The age is the only part of
    // it a driver acts on.
    var age = Math.max(0, Math.round((Date.now() - readAt) / 1000));
    var when = document.createElement('b');
    when.className = 'age';
    when.textContent = age < 1 ? 'just now' : age + 's ago';
    // Nodes rather than innerHTML: every fragment below is built from the
    // scanner's own JSON, and `trackNote` in particular quotes what the
    // tracker reported.
    el.detail.textContent = '';
    el.detail.appendChild(when);
    // The diagnostics get an element of their own so the 3.5" hat can drop them
    // and keep the age. They used to be bare text nodes, which CSS cannot
    // address, so the hat's only way to reclaim the line was to hide all of
    // #detail — and that took the age with it, on the one screen where the
    // driver is furthest from being able to work it out for themselves. See the
    // `max-height: 380px` block.
    var diag = document.createElement('span');
    diag.className = 'diag';
    // No read time. "· 1800ms" sat here on every reading: how long the Pi
    // took over the card, which is the rig's telemetry and nothing a driver
    // can act on. It is on the reading /api/status serves and in the CSV's
    // `ms` column, which is where anyone tuning the reader looks. On this
    // line it was a four-digit number set beside the age, the one figure in
    // the line that is for the driver.
    diag.appendChild(document.createTextNode(
      (deducted ? ' · after $' + Number(r.costPerMile).toFixed(2) + '/mi costs' : '')
      + (r.legs > 1 ? ' · ' + r.legs + ' legs' : '')
      + (r.mergedFrom > 1 ? ' · ' + r.mergedFrom + ' reads' : '')
      + (r.items ? ' · ' + r.items + ' items' : '')
      + trackNote(r)));
    el.detail.appendChild(diag);
    showRaw(r.text);
  }

  // Only worth saying when it is not the quiet default: corners that are being
  // followed, or a screen that went missing.
  function trackNote(r) {
    var bits = [];
    var t = r.track;
    if (t && t.lost) bits.push('screen not visible');
    // `t.jumps` used to sit here, printing 're-locked on the phone'. It is a
    // LIFETIME count — QuadTracker.jumps is incremented on every re-lock and
    // reset nowhere — so one
    // re-lock at any point in a shift put that note on every reading after it,
    // and between offers too. The rig's own health log already carries the
    // same number correctly labelled, 're-locked %dx since start'.
    //
    // Worse, it sat in the middle of an else-if chain between two LIVE states,
    // so after the first re-lock the drift note below could never appear
    // again. Saying a true thing in the present tense about the past cost the
    // one note here that is about now.
    //
    // Not replaced with a recent-re-lock note, because nothing measures one:
    // status() publishes jumps, moves, misses and rebaselines, and every one
    // of them counts since start.
    else if (t && t.drift >= 25) bits.push('tracking ' + Math.round(t.drift) + 'px');
    return bits.length ? ' · ' + bits.join(' · ') : '';
  }

  // What a reading with no verdict in it DID read, in words and no figures.
  //
  // Every one of them used to get "scanner running, no offer on screen", which
  // is a claim about the phone this page has no way to know. On 8 Oct an Uber
  // Est. delivery card sat square in front of the camera: the card box cut
  // its $14.48 in half, the reader got "Includes expected tip", the deadline,
  // "8.6 mi" and both addresses, and the panel told the driver there was no
  // offer. A reading carries what it got — `pay`, `minutes`, `deliverBy`,
  // `miles`, `places` and `clipped` are all on every message emit() sends —
  // so this says what was got, and the one thing the driver can do about it.
  //
  // `clipped` first, because it is the one case where the rig KNOWS the box
  // cut a card: the reader found a payout flush against the box's top edge
  // and threw the whole parse away for it (pipeline.money_is_clipped), so the
  // reading arrives as empty as one of a blank screen, and before `clipped`
  // was on the wire it got the old sentence. The 8 Oct card missed that path
  // only because its cut digits read as "gg Pit.", which is no payout to be
  // flush against anything; a box edge a little lower would have left them
  // readable, flush, and dropped. A payout is the rig's own test for a card
  // (`card_on_screen` in rpi/scan_pi.py), so "pay" is said outright here.
  //
  // NOT "a card is in view" for the rest, which is the obvious sentence and
  // is not true either. Of the corpus's 19 texts that read no payout, 18 read
  // a time, a distance or a place, and 12 of those are not cards at all: the
  // app's zone prompt (5) and Uber's map screen — "a map screen is not an
  // offer" and its six variants (7), every one of which reads as 39 minutes
  // and 1.0 mi. That map is the navigation screen, and a navigation screen
  // sits in front of the camera for a whole delivery (AUDITS.md, the `screen`
  // rows), so expect "no pay read" for long stretches of every delivery. The
  // panel cannot tell a card missing its pay from a screen that never had
  // one, so it says the half it knows, with the remedy hedged on the half it
  // does not, and the hedge is what keeps it true over the map.
  //
  // A pay with no verdict has no time to divide it by: `> 0` as is_complete
  // has it. Every reading that reaches this with a pay read no time at all,
  // but for a deadline rate() could not count down — one due this very
  // minute (minutes_until wraps anything earlier to tomorrow), or read before
  // the Pi's clock was set (clock_minutes) — or a `pad` in config.json
  // negative enough to cancel the card's own minutes; and "no time" is the
  // truth about those as well.
  //
  // No figure, in any: no verdict was reached, and a number on this line is
  // one the driver would read as the reading's. The box, not the card box: a
  // driver who pressed No card box reads the whole screen box, and the
  // control that fixes either is ▣ Set box.
  //
  // Each sentence is no wider than the one it replaced, in the page's own
  // font on every panel (rpi/test_layout.py), because trackNote() appends to
  // this line and the old sentence was already sized to what it appends:
  // with " · tracking 30px" it was 226px of the 3.5" hat's 228px scene line.
  // The first wordings here, 46 and 45 characters, wrapped beside that note at
  // 480x320 and at 800x480 and lifted the verdict label 5px and 12px where
  // the old line had left it alone. No wider means whatever fitted beside the
  // old sentence fits beside these.
  //
  // Measured on the real week's 5,491 stored frames: 135, on 59 of the 1,166
  // cards, read a pay and no time — each one a card until a frame of it with a
  // time merges in. 19 read a time and no pay, and all 19 are the app's zone
  // prompt, five prompts and not one card: a frame with no payout passes the
  // accumulator untouched (accumulate.add's first guard), so over those this
  // line now says "no pay read", where "no offer on screen" was true as well.
  // Those are the frames kept on offer rows; the navigation screens between
  // offers are not among them. The card it was written for, a pay the box
  // cut off, is not in that week's frames at all; it is the 8 Oct one.
  // What a reading with nothing offer-like on it is said as. Named, because
  // render() asks whether that is what the last reading came to: a read
  // starting over a screen that has just read as no offer is the rig
  // looking again, not a card being priced.
  var NO_OFFER_SAID = 'scanner running, no offer on screen';

  function noVerdictSaid(r) {
    if (r.clipped) return 'pay at the box edge — not trusted';
    // The app's own idle screen, by its own words (OP.NOT_AN_OFFER, sent as
    // `notAnOffer`). Whatever else the read picked off the map is not part of
    // a card: the corpus's Uber online frame reads the day's takings, $142.60,
    // as a payout and said "pay, no time", and 3 of the journal's 54 "Finding
    // trips" screens read a time or a place off the map and said "no pay
    // read" — each a READING THE CARD on the next read, over a phone saying
    // it has no offers. Before the pay test, which is what it overrules.
    if (r.notAnOffer) return NO_OFFER_SAID;
    if (typeof r.pay === 'number' && r.pay > 0) {
      return 'pay, no time — box may cut it off';
    }
    // The places asked of MV.ends, as showPlaces asks: the one rule for what
    // a reading named (rpi/test_lint.py holds the page to it).
    var named = MV ? MV.ends(r) : (r.places || []);
    if ((typeof r.minutes === 'number' && r.minutes > 0)
        || (r.deliverBy !== null && r.deliverBy !== undefined)
        || typeof r.miles === 'number'
        || named.length) {
      return 'no pay read — box may cut it off';
    }
    return NO_OFFER_SAID;
  }

  // What the dot means.
  //
  // It used to mean "this page has a socket to the web server", which is true
  // whenever the page is loaded at all — so it sat green and said "scanner
  // connected" over a camera that had crashed twenty minutes earlier. The one
  // fact a driver needs from it is whether anything is still reading offers.
  // The socket only decides whether that answer is current.
  function showConnection() {
    var quiet = Date.now() - seenAt;
    var alive = socketUp && quiet <= STALE_MS;
    // The camera view is the most convincing thing on this page and the last
    // to look wrong: a frozen JPEG of a phone showing an offer is
    // indistinguishable from a live one. The rule to dim it had been written
    // and never wired to anything, so the picture was served at full strength
    // however long the scanner had been dead. Dimming is not decoration here —
    // it is the only cue that what is on screen is a photograph of the past.
    var img = document.getElementById('view');
    if (img) img.classList.toggle('stalefeed', quiet > STALE_MS);
    // Set in one branch only, below. Every other branch is the scanner not
    // being heard from, and a GPS word off a heartbeat that has stopped is a
    // word about a minute that has passed.
    var note = '';
    if (!socketUp) {
      el.conn.textContent = 'reconnecting to the server…';
    } else if (scannerState && !scannerState.enabled) {
      el.conn.textContent = 'no Pi scanner on this machine';
    } else if (scannerState && !scannerState.running) {
      el.conn.textContent = 'scanner not running'
        + (scannerState.error ? ': ' + scannerState.error : '');
    } else if (quiet > STALE_MS) {
      el.conn.textContent = 'nothing from the scanner for '
        + Math.round(quiet / 1000) + 's';
    } else {
      // There was a branch above this: "the loop is running but nothing has
      // been read for Ns", whenever the last READING was more than
      // READ_STALE_MS old. That is not a fault, it is the rig between offers:
      // a still screen moves the motion gate not at all, so no read is
      // submitted until the next card — which is why STALE_MS was moved off
      // readings and onto the heartbeat. Over the real week, 774 of the 1,155
      // gaps between one offer and the next inside a shift ran past 16s, 18.9
      // of their 23.3 hours, so this line read like a reader fault for most
      // of the time the driver was waiting for work, while #detail said
      // "scanner running, no offer on screen" over the same second.
      //
      // Deleted rather than gated. The case it was written for — a verdict
      // nothing has refreshed — is already said where the verdict is: the
      // pane dims on the same READ_STALE_MS and #detail prints its age. A
      // reader that has gone for good stops the heartbeat at READ_STUCK_S in
      // scan_pi.py, and the branch above says "nothing from the scanner".
      //
      // ...and "reading" is not what a rig that cannot see is doing. This line
      // said it for the whole of the owner's blind 9.4 days, over a loop that
      // was turning and reading nothing; with the camera's word on the beat it
      // says what is true, beside the red word where the verdict goes.
      el.conn.textContent = blind ? 'scanner running, cannot see' : 'scanner reading';
      note = healthNote();
    }
    el.health.textContent = note;
    el.health.hidden = !note;
    // ...and the dot with it. A rig that cannot see is not reading offers,
    // which is the one thing the dot is for; left green it said "reading"
    // beside the words saying it could not.
    el.dot.classList.toggle('on', alive && !blind
      && !(scannerState && (!scannerState.enabled || !scannerState.running)));
  }

  // What the rig has to say about itself, on the connection line rather than
  // on a control or in the verdict: none of it changes what the offer in front
  // of the driver is worth, and every one of it has a remedy that can wait for
  // the next stop. Said only when something is wrong, the way trackNote is.
  //
  // NOTHING for a rig run without --gps. That is a choice the driver made, and
  // a line about it would stand for the whole of every shift and become
  // furniture — the same reason `notSaving` says nothing for --no-journal.
  // The scanner's start row in the journal is where that choice is recorded.
  // Nothing for a working GPS either: "GPS ok" on every glance is a word the
  // driver learns to skip, and then skips the one that is not ok.
  //
  // The Pi first, because it is about the readings — a throttled Pi reads
  // slower — and the GPS is about the rows. Only what the Pi itself reports
  // as happening NOW: its temperature alone is not a warning, because no
  // threshold here would be the Pi's, and the firmware already acts on its
  // own. The words are the scanner's; this page does not know the bits.
  //
  // ONE word of them, the first, which the scanner lists cause first (see
  // THROTTLE_BITS). Every word was tried and does not fit: a weak supply says
  // "under-voltage, throttled", and with a stale GPS beside it the note needed
  // 370px where the 3.5" hat has 315 and the rig's own panel, beside the
  // phone, 357 — so the tail was cut, and the tail is the GPS's minutes. The
  // rest are on the status link and in every `seen` row.
  //
  // ...and the temperature beside every word but `under-voltage`. Heat is
  // what the temperature explains: beside "temp limit" it says how far over,
  // and beside "throttled" or "capped" whether heat is why. A weak supply's
  // remedy is the power lead, and the number beside it told the driver
  // nothing to act on — while it cost the GPS its unit: on the 3.5" hat
  // "Pi under-voltage 61°C · GPS: no fix for 123 min" needed 315px of a 313px
  // span, and the ellipsis took "min". Without it, 278px. The widest left is
  // "Pi temp limit 85°C · GPS: no fix for 1000 min", 296px.
  function healthNote() {
    var bits = [];
    var t = throttledNow;
    if (t && t.now && t.now.length) {
      bits.push('Pi ' + t.now[0]
                + (cpuNow !== null && t.now[0] !== 'under-voltage'
                  ? ' ' + Math.round(cpuNow) + '\u00b0C' : ''));
    }
    var g = gpsNow;
    if (g && g.state === 'stale') {
      // Whole minutes, rounded DOWN: "no fix for 1 min" at 119 seconds is true
      // and "2 min" would not be. The scanner settles on stale only once
      // gps.py's twenty seconds and its own GPS_HOLD minute have both passed,
      // so the age on a beat that says stale is 80 seconds or more in every
      // ordinary run, and always a number: gps.py ages a fix on the

    // that cannot fire is not a check — it survived every mutation because
    // nothing could reach it. Falling through means the guard in refreshView
    // is the single place "no frames while the map is up" is decided, and it
    // is exercised on every frame that lands after the switch.
    if (viewMode !== 'map') sawAFrame();
    if (!streaming) frameDone();
  });
  view.addEventListener('error', function () {
    // No guard on the map here, deliberately. noFrameYet is what adds `gone`
    // and so what would take the map down, and it refuses to on its own — a
    // second test for the same thing in front of it meant neither could be
    // checked: delete either one and the other still caught it, so nothing in
    // the suite could tell whether the rule was there at all.
    if (streaming) {
      // The connection dropped, or this browser will not render the stream.
      // One retry, because a scanner restarting underneath it is the ordinary
      // cause and it comes straight back; after that, stills.
      if (streamTried < 2) return startStream();
      noFrameYet();
      return fallBackToStills();
    }
    noFrameYet();
    frameDone();
  });

  startStream();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      // A stream to a hidden tab is bytes and CPU spent on nobody.
      if (streaming) { streaming = false; view.src = ''; }
      return;
    }
    // ...and a tab that comes back to a map must not start a stream behind it.
    // The picture is restored by the button, which is the thing that put the
    // map there.
    if (viewMode === 'map') return;
    streamTried = 0;
    startStream();
  });

  // There was a ⟳ Re-find here: a press asked the scanner to forget where it
  // thought the phone was and find it again — and, with a box drawn, to throw
  // the drawn boxes away and go back to finding the screen by itself. On the
  // owner's mount that finds the map, not the card, and they reported that it
  // "tends to get stuck and not let me set it". It was taken off the bar at
  // their request: ▣ Set box is the way to fix the boxes, and the scanner
  // never second-guesses a box a person drew. See AUDITS.md's Settled list.

  // --- 📷 Snap ------------------------------------------------------------
  //
  // A picture of this screen, the camera's last picture and what /api/status
  // says, kept on the rig in a folder to be shared — see takeSnap in server.js.
  // The screenshot is taken by the rig's desktop, not by this page, so it is
  // the panel as it was painted: including this control saying "📷 …", which
  // is the honest picture of the moment it was pressed.
  //
  // The answer is said on the control, and it is the server's own line, not a
  // second wording of it: "saved", or "saved — no screenshot: grim is not
  // installed". A press that keeps less than it was asked to and says only
  // "saved" is the second fault class, met on the one control whose whole job
  // is to keep evidence.
  //
  // Through ask(), so a request that hangs comes back. Every control on the bar
  // learned that the hard way (see POST_TIMEOUT_MS); this one starts with it.
  var snapBtn = document.getElementById('snap');
  // The label as the markup writes it — the word in a span of its own, which
  // the stylesheet does not paint and a screen reader still reads. See #snap.
  function snapLabel() {
    var word = document.createElement('span');
    word.className = 'word';
    word.textContent = ' Snap';
    snapBtn.textContent = '📷';
    snapBtn.appendChild(word);
  }
  // How long the answer stays before the label comes back. This can be a
  // sentence, read from the driving seat. The
  // last answer stays on the title after the words go, so a mouse resting on
  // the control can still ask what the last press kept.
  var SNAP_SAID_MS = 8000;
  var snapBack = null;
  // No "already pressed" guard: the control is disabled while a press is out,
  // and a disabled button is sent no click — by the mouse, Enter, Space or
  // .click() — so a guard here could never be reached. rpi/test_dashboard.py
  // presses it again while the first is out and counts the POSTs.
  snapBtn.addEventListener('click', function () {
    clearTimeout(snapBack);
    snapBtn.disabled = true;
    snapBtn.classList.remove('said', 'failed');
    snapBtn.textContent = '📷 …';
    ask('/api/snap', { method: 'POST' })
      .then(function (r) {
        return r.json().then(function (body) { return { ok: r.ok, body: body || {} }; },
                             function () { return { ok: false, body: {} }; });
      })
      .then(function (got) {
        if (got.ok && got.body.ok && typeof got.body.said === 'string') {
          return { text: '📷 ' + got.body.said, failed: false };
        }
        return { text: '📷 not saved: ' + (got.body.error || 'the rig refused it'),
                 failed: true };
      }, function () {
        // The deadline, or no network at all. Whether the rig kept anything is
        // exactly what this page cannot know, so it says the one thing it can:
        // nothing answered. "Not saved" would be a guess, and a wrong one
        // whenever the rig was merely slow to reply.
        return { text: '📷 no answer from the rig', failed: true };
      })
      .then(function (said) {
        snapBtn.textContent = said.text;
        snapBtn.title = said.text;
        snapBtn.classList.add('said');
        snapBtn.classList.toggle('failed', said.failed);
        snapBtn.disabled = false;
        snapBack = setTimeout(function () {
          snapLabel();
          snapBtn.classList.remove('said', 'failed');
          snapBtn.title = '📷 Snap: keep a picture of the rig\'s own screen, on the rig. Last time: '
                        + said.text.replace(/^📷 /, '');
        }, SNAP_SAID_MS);
      });
  });

  // --- which picture ------------------------------------------------------
  //
  // Remembered, because it is a property of how this rig is used rather than
  // of this page load. A driver reading the phone off this display through a
  // bluetooth mouse is doing that for the whole shift, and having to press a
  // button again every time the page reloads is the kind of small tax that
  // ends with the feature unused.
  var viewModeBtn = document.getElementById('viewMode');
  var liveMap = document.getElementById('liveMap');

  // screen → scene → map → screen. The label says what pressing it gets you,
  // not what you are looking at, which is the rule the two-way version already
  // kept.
  var NEXT = { screen: 'scene', scene: 'map', map: 'screen' };
  var LABEL = { screen: '⛶ Scene', scene: '⛶ Map', map: '⛶ Phone' };

  function applyViewMode() {
    var onMap = viewMode === 'map';
    liveMap.hidden = !onMap;
    view.hidden = onMap;
    layoutForFrame();
    // Still a mode rather than a navigation, and still pressed when it is not
    // showing the ordinary picture: the phone's screen is this panel's resting
    // state and both of the others are a departure from it.
    viewModeBtn.setAttribute('aria-pressed', viewMode === 'screen' ? 'true' : 'false');
    viewModeBtn.textContent = LABEL[viewMode];
    if (onMap) {
      // `gone` hands the whole panel to the verdict, which is right when there
      // is no picture and wrong when the pane has a map in it.
      viewWrap.classList.remove('gone');
      // A fresh Map view frames where the dot is NOW, once. See hereAnchor.
      hereAnchor = null;
      hereWanted = true;
      // ...and follows it again, whatever a hand on the map did last time.
      following = true;
      showMap();
    } else if (!viewWrap.classList.contains('gone')) {
      sawAFrame();
    }
    drawHere();
  }

  viewModeBtn.addEventListener('click', function () {
    viewMode = NEXT[viewMode] || 'screen';
    // The map is deliberately NOT remembered. Switching to it is what asks a
    // public geocoder about places customers live, and a remembered map mode
    // would make the next page load ask without anybody pressing anything —
    // which moves that decision away from the person whose decision it is.
    // The two pictures are remembered exactly as before.
    try {
      if (viewMode !== 'map') localStorage.setItem(VIEW_KEY, viewMode);
    } catch (e) { /* private mode */ }
    applyViewMode();
    // The mode rides on the request for a frame, so the rig does not hear
    // about it until the next one is asked for. A stream is one request that
    // never ends — it would go on delivering the old picture until something
    // else restarted it — so it is restarted here.
    if (viewMode === 'map') {
      // A multipart stream is one request that never ends, and left open
      // behind a hidden <img> it goes on pulling thirty frames a second down a
      // phone hotspot for a picture nobody is looking at. Pointing the element
      // at a blank pixel is what actually closes the connection; dropping the
      // src attribute does it too and fires an error, which this page reads as
      // a rig that has stopped.
      wasStreaming = streaming;
      streaming = false;
      framePending = false;
      view.src = BLANK;
    } else if (wasStreaming) {
      // Back to a picture, and back to the stream if that is what it was —
      // otherwise one trip through the map would leave the panel on stills for
      // the rest of the shift, at 30ms a frame instead of the writer's rate.
      wasStreaming = false;
      startStream();
    } else if (streaming) startStream();
    else refreshView();
  });

  /* --- the map mode --------------------------------------------------------
   *
   * WHAT THIS IS FOR, in the driver's own words: "it would also be helpful to
   * have the map view so I can visually see the route as well as how they may
   * chain together and if it makes sense to pickup the second offer since it
   * would be mostly along the route I am going anyways."
   *
   * So the picture is: where the car is, where the order already in it is
   * going, and where this new one starts and ends. Four points and the lines
   * between them answer a question the card's own words cannot — ENDS ? is the
   * chip on about half of real pairs, because most cards name no destination
   * until you accept.
   *
   * WHAT IT IS NOT ALLOWED TO DO. Read the header of map-view.js. Nothing
   * computed from a geocoded point may become a rate, a verdict or a billed
   * distance on this panel; the whole project refuses a number that is
   * confidently wrong and silent. The one figure that leaves this function is
   * the detour, and it is stated under the pins it was computed from, on a map
   * the driver pressed a button to open, in straight-line miles that are named
   * as straight-line miles — or, with the NucBox's router set, road miles named
   * as road miles, over the same three points. It never touches #perHour, the
   * verdict, or the stack line.
   *
   * AND NOTHING IS LOOKED UP UNTIL THE BUTTON IS PRESSED. Some of these places
   * are where customers live, the rig itself never sends them anywhere, and
   * switching to this mode is the press that decides it — the same gate as
   * "Place them on a map" on the map page. It is deliberately not remembered,
   * so a reload cannot ask on nobody's behalf. */
  var MV = window.MapView;
  var mapGeo = null;
  // The NucBox's search and router, through this rig's server; made the
  // first time a walk finds either set (MV.NbxSearch, and showMap below).
  var mapNbx = null;
  var theMap = null, mapLayer = null;
  // Which set of places is drawn, so a card re-read forty times a second does
  // not re-draw forty times, and so an answer that arrives after the driver
  // has moved on is thrown away rather than pinned under the new card's
  // heading.
  var mapFor = null;
  var mapBusy = false;

  /* The words under the map, and the last of them that described what is
     drawn. `lastLine` is not simply the last thing said: "looking up 3
     places…" describes a map that is not there yet, and re-stating it on a
     drawn map would be a second way of saying nothing. Only mapDrew writes it. */
  var lastLine = '';
  var lastBounds = null;

  /* YOU ARE HERE. The heartbeat's newest fix, as a dot with a circle the size
     of the GPS's own error estimate, and the label in the map's corner. What
     to draw is MV.hereDot's decision, shared with map.html; the gate behind it
     is rpi/gps.py's, and nothing here asks it again.

     THE MAP FOLLOWS THE DOT AT ITS EDGES, NOT ON EVERY BEAT. The driver
     asked for it ("visually it would be best for me to know it is working
     right"), over the earlier rule that it never followed because nobody
     had measured the tiles. Entering Map view fits the view to the pins
     and where the dot was then (`hereAnchor`); after that a fresh dot that
     leaves the middle FOLLOW_MIDDLE of the map in either direction is
     panned back to the centre, at the zoom the map is at. Inside the middle
     nothing moves, so the Pi redraws the map every half mile or so and not
     on every beat. Measured with Leaflet 1.9.4 in the 1024x600 panel's map
     (500x472), a beat every 0.05 mi (four seconds at 45 mph) along three
     straight 10 mi lines out of Marietta Square: 5 to 7 pans at zoom 13, 10
     to 14 at 14, 20 to 28 at 15, against 200 for a pan on every beat. The
     TILES are nearly the same either way — 0.8 to 1.4 new tiles a mile at
     zoom 13, 2.1 to 3.2 at 14, 3.0 to 6.0 at 15, plus 6 to 9 for the view
     on the way in, where a pan on every beat is the same or at most 0.4 a
     mile more — because a strip of map along the road is the same tiles
     however it is panned through. What a tile weighs was not measured: this
     machine's proxy refuses tile.openstreetmap.org. A grey dot is where the
     car WAS and a refused fix is no position, so neither moves the map.

     A hand on the map pauses it. Leaflet says `dragstart` only for a drag,
     and `zoomstart` for every zoom, the page's own fits included, so the
     page's moves go through moveMap and a zoom inside one is not the
     driver's. Paused, the corner says FOLLOW_PAUSED after the age, and
     nothing but ⛶ Map round again — the press that already re-frames the
     view — starts it again. No control for it on the bar: there are six,
     and a seventh is settled against. */
  var hereLayer = null;
  var hereAnchor = null;
  var hereWanted = false;
  var hereNote = document.getElementById('hereNote');
  // The key to how each place was found; see drawHow.
  var mapKey = document.getElementById('mapKey');
  // ...and what one of those marks says, while it is pointed at; see tipOn.
  var mapTip = document.getElementById('mapTip');
  // What is drawn now — position, error and grey — so the once-a-second tick
  // that ages the label does not take the dot down and put it back each time,
  // closing its popup under the driver's pointer.
  var hereKey = '';
  // The share of the map's width and of its height, centred, a fresh dot may
  // wander in before the view goes after it.
  var FOLLOW_MIDDLE = 0.6;
  var FOLLOW_PAUSED = ' · not following';
  var following = true;
  // Where the dot was when the follow last looked at it, or a fit last
  // framed it. The follow asks only of a dot that has MOVED since: a fit
  // that left the car near the edge of the pins is the frame the driver
  // pressed for, and the once-a-second tick that ages the label is not the
  // car going anywhere.
  var herePos = '', judgedPos = '';
  // Until when a zoomstart is the page's own: a second past its last fit or
  // pan. Leaflet fires a fit's zoomstart a frame AFTER the call, inside a
  // 250ms animation, so a flag cleared on moveend was not enough: entering
  // Map view fits twice back to back, the first fit's moveend cleared the
  // flag, and the second fit's zoomstart paused the follow before it had
  // moved once. A deadline cannot be left standing by a move that never
  // ends; the cost is that a hand zooming within a second of the page's
  // own fit leaves the follow on.
  var OWN_MOVE_MS = 1000;
  var ownUntil = 0;

  function moveMap(how) {
    ownUntil = Date.now() + OWN_MOVE_MS;
    how();
  }

  /* Once, when the map is made: what tells a hand on the map from the page. */
  function watchHands(map) {
    map.on('dragstart', function () { following = false; drawHere(); });
    map.on('zoomstart', function () {
      if (Date.now() > ownUntil) { following = false; drawHere(); }
    });
  }

  /* The pins, and the dot's position when this Map view was entered (or
     last followed), if it had one: the fit every new card's map makes, and
     the one ⛶ Map makes on the way in. */
  function fitView(pins) {
    var b = hereAnchor ? pins.concat([hereAnchor]) : pins;
    judgedPos = herePos;
    if (b.length > 1) moveMap(function () { theMap.fitBounds(b, { padding: [34, 34] }); });
    else if (b.length) moveMap(function () { theMap.setView(b[0], 13); });
  }

  /* A fresh dot that moved outside the middle of the map, while nobody has
     taken it: the view goes to the dot at the zoom it is at. */
  function followDot(d) {
    if (herePos === judgedPos) return;
    judgedPos = herePos;
    if (!following || d.grey) return;
    var size = theMap.getSize();
    var at = theMap.latLngToContainerPoint([d.lat, d.lon]);
    var edge = (1 - FOLLOW_MIDDLE) / 2;
    if (at.x >= size.x * edge && at.x <= size.x * (1 - edge)
        && at.y >= size.y * edge && at.y <= size.y * (1 - edge)) return;
    hereAnchor = [d.lat, d.lon];
    moveMap(function () { theMap.panTo([d.lat, d.lon]); });
  }

  function drawHere() {
    var onMap = viewMode === 'map' && !!theMap;
    var d = onMap && MV && gpsNow ? MV.hereDot(gpsNow.fix, Date.now() - gpsAt) : null;
    hereNote.hidden = !d;
    hereNote.textContent = d ? (d.line || d.label + (following ? '' : FOLLOW_PAUSED)) : '';
    hereNote.classList.toggle('grey', !!(d && d.grey));
    if (!theMap) return;
    var key = d && !d.line ? [d.lat, d.lon, d.err, d.grey].join('|') : '';
    herePos = key ? d.lat + ',' + d.lon : '';
    if (key !== hereKey) {
      hereKey = key;
      if (hereLayer) { theMap.removeLayer(hereLayer); hereLayer = null; }
    }
    if (key && !hereLayer) {
      hereLayer = L.layerGroup().addTo(theMap);
      var colour = d.grey ? '#8a8f98' : '#38bdf8';
      // The circle is the GPS's own estimate in metres, not a promise: gpsd
      // calls its certainty unknown. It is what the receiver claimed, drawn.
      L.circle([d.lat, d.lon], {
        radius: d.err, weight: 1, color: colour, opacity: .8,
        fillColor: colour, fillOpacity: .12, dashArray: d.grey ? '4 5' : null
      }).addTo(hereLayer);
      // The age is the corner's to say; a popup is opened once and read later.
      L.circleMarker([d.lat, d.lon], {
        radius: 7, weight: 3, color: '#ffffff', fillColor: colour, fillOpacity: 1
      }).bindPopup('<b>you are here</b><br>±' + Math.round(d.err) + ' m')
        .addTo(hereLayer);
    }
    /* The one fit, and only on the first draw of this Map view whatever it
       found. Waiting for a dot instead left hereWanted standing when the view
       was entered with no fix, so the first fix to come in — minutes later,
       after the driver had panned to look at something — pulled the view
       back to it: a fit on a beat, the pins and the zoom thrown away for the
       car. With no dot at entry there is nothing to include, and ⛶ Map round
       again is the press that frames it. Every draw after the first follows
       the dot instead, at the edges and the zoom it finds — and not at all
       once the driver has panned. */
    if (hereWanted) {
      hereWanted = false;
      if (key) {
        hereAnchor = [d.lat, d.lon];
        fitView(lastBounds || []);
      }
    } else if (key && onMap) {
      followDot(d);
    }
  }

  function mapSay(text) { viewNote.textContent = text; }

  function mapDrew(text) { lastLine = text; mapSay(text); }

  /* The places this offer and the order in the car are about. Kept in one
     place because the KEY is built from it too, and a key that disagreed with
     what was drawn is how a map ends up showing the last card under this
     card's numbers. */
  function mapWants() {
    var o = onRecord || {};
    var held = holdingNow ? (heldEnds || null) : null;
    /* ...and the held order's pickups off its Trip Planner, while it is held:
       the restaurant the driver read with ⌖ was never on this map, so the
       order and the place it is collected from were never seen together
       (the driver: "even after scanning the restaurant it failed to
       associate it"). Guarded for a map-view.js from before them, which
       sw.js can serve this page (see drawHow). Never the order's end: that
       is `held`, off holding.dropoff, and nothing here writes it. */
    var plan = heldPlan && heldPlan.of === heldOwner() ? heldPlan.stops : null;
    var heldPicks = (holdingNow && plan && MV && MV.heldPickups)
      ? MV.heldPickups(plan).filter(function (p) { return p.q !== held; }) : [];
    var names = [o.pickup, o.dropoff, held]
      .concat(heldPicks.map(function (p) { return p.q; })).filter(Boolean)
      .filter(function (v, i, all) { return all.indexOf(v) === i; });
    return { pickup: o.pickup || null, dropoff: o.dropoff || null,
             held: held, heldPicks: heldPicks, names: names,
             // The two cards the line is measured with: this one, whose fix
             // is where the car was when it came up, and the one the order in
             // the car came from, whose own fix and distance its end is
             // checked against. See MV.againstCard.
             card: onRecord, heldCard: held ? heldCard : null,
             heldId: held ? heldId : null,
             // The card is part of the key: two cards naming the same places
             // came up in two places, and the figure is measured from each
             // one's own fix.
             //
             // ...and so is which of them is the order in the car. `names` is
             // deduplicated, so a card whose dropoff becomes the held end at
             // ✓ Took names the same places before and after, and the key
             // did not move: the map kept the pin as the CARD's "and drop it
             // here", which the next card took away with it. Measured in
             // rpi/test_dashboard.py, 'held end: the ✓ Took reply's end...'.
             key: names.join('|') + '#' + (o.id || '') + '@' + (held || ''),
             // What the NucBox said about these places on this walk: a
             // refusal per place, with the disc it was made in, and why the
             // NucBox could not be asked at all (and the public map was) —
             // and how many it answered before that, so "public map used"
             // is never said of a pin the NucBox gave.
             nbxWhy: {}, nbxDown: null, nbxAnswered: 0,
             // ...and every answer it gave, pinned or not, with its disc:
             // what drawHow draws of how each place was found. The same
             // objects the walk chose from, so drawing asks nothing.
             nbxSeen: {} };
  }

  /* A place name, cut to what fits the caption's cap.
     Every other line under the map is a fixed string this file can be read
     for; this is the one that carries a value, and its bound is the parser's
     MAX_PLACE of 60. At 60 it took four of the two rows the caption has.
     20 is measured, and measured on WIDTH rather than on characters, which
     is the trap: 32 characters of this driver's own real names came out two
     rows, and 32 of the widest characters the font has came out three and was
     clipped — and this branch fires precisely when a name is OCR sludge, so
     the pathological string is the expected input, not the corner. At 20 the
     misread-name line is two rows at 800x480 and three on the 3.5" hat, which
     is the cap on each, for every real place in the owner's week AND for a
     name of twenty W's. Cut on a space where there is one near the end, so
     the driver reads whole words; the ellipsis says the rest was cut, and the
     pin it names is marked on the map beside it either way. */
  var PLACE_SHOWN = 20;

  /* ...and shorter again in the line for a pin a card contradicts, which
     carries two figures and the rig's repair besides the name. At twenty of
     the widest letter both of those lines ran past two rows at 800x480; at
     12 they fit, and the `, past` clause the hat may eat holds the card's
     figure with its hedge, behind "wrong pin for". "McDonald's (Marietta Sq)" is cut on its
     space, to "McDonald's…". Measured by rpi/test_layout.py. */
  var DISC_PLACE_SHOWN = 12;

  function shortPlace(name, cap) {
    var most = cap || PLACE_SHOWN;
    var s = String(name == null ? '' : name).trim();
    if (s.length <= most) return s;
    var cut = s.slice(0, most);
    var space = cut.lastIndexOf(' ');
    if (space >= most - 8) cut = cut.slice(0, space);
    return cut.replace(/[\s,]+$/, '') + '…';
  }

  async function showMap() {
    if (!MV) {
      // map-view.js is same-origin and in the service worker's shell, so this
      // should not happen. A control that does nothing at all, silently, is
      // this project's second named fault, and "should not happen" has never
      // been a reason to leave one in.
      mapSay('map-view.js did not load, so there is no map here.');
      return;
    }
    var want = mapWants();
    var key = want.key;
    if (mapBusy) return;
    if (mapFor === key && theMap) {
      /* Nothing to redraw — but something to SAY. Leaving the map is three
         presses round the cycle, and on the way out sawAFrame rewrites this
         row to "camera view · inset is what the reader sees". Coming back on
         the same card used to return here before any mapSay, so the pins were
         still on the glass under a caption for a picture: the one figure this
         mode exists to produce, gone, with nothing saying so, in the 15px row
         the panel spends on it.

         The view is re-fitted for the same reason. A driver who nudged the
         map with the mouse and lost the pins had no control anywhere that
         brought them back — this button is now that control. */
      mapSay(lastLine);
      theMap.invalidateSize();
      // On the press only. Every message the scanner sends comes through
      // here — a beat every four seconds — and a fit on each pulled the view
      // back over the driver's drag and over the follow's last pan, so the
      // map went to the pins and back to the car on every beat.
      if (lastBounds && hereWanted) fitView(lastBounds);
      drawHere();
      return;
    }
    mapFor = key;

    if (!want.names.length) {
      // The last card's pins must not stay on the glass under this card's
      // numbers. This is the COMMONEST card there is — 129 of the driver's own
      // 272 name no dropoff — so the path that draws nothing is the path that
      // was leaving a green "pick this one up" dot and a drawn route from an
      // offer that is no longer on screen.
      clearMap();
      // Short on purpose, and the budget is now stated where it can be
      // enforced rather than here: `#viewNote` is clamped to two rendered
      // rows on a dashboard panel and three on the 3.5" hat — see the rule in
      // this page's own <style> for why those two numbers and not one. What
      // the clamp cuts is the tail, so every line under it is written with
      // the part a driver acts on first.
      // mapDrew, not mapSay: "there is nothing to draw" describes what is on
      // the glass as truly as a detour does, and it is what coming back to
      // this same card has to be told again. Left as mapSay, re-entry would
      // restate the LAST card's detour over an empty map.
      mapDrew(onRecord
        ? 'this card names nowhere yet — ⌖ Scan reads it off your phone'
        : 'no card read yet — nothing to put on a map');
      return;
    }

    mapBusy = true;
    try {
      mapSay('loading the map…');
      var ready = await MV.needLeaflet(document, {
        css: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
        js: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
      });
      // Said plainly rather than left as a grey rectangle. A rig on a phone
      // hotspot in a car has no signal several times a shift and that is the
      // ordinary case, not an error — and ⛶ Phone puts the picture back.
      if (!ready) {
        // Shortened to the cap, not to taste: at its old length this was four
        // rows on the 3.5" hat and lost "the picture back" to the clamp, which
        // is the half that says what to press.
        mapSay('no signal — the map needs it for both its code and its '
               + 'tiles. ⛶ Phone puts the picture back.');
        return;
      }
      if (viewMode !== 'map' || mapFor !== key) return;

      if (!theMap) {
        theMap = L.map(liveMap, { zoomControl: true }).setView([33.94, -84.58], 11);
        watchHands(theMap);
        // A tapped mark's words go when the map itself is tapped: on a touch
        // panel there is no pointer to leave the mark. drawHow's marks do not
        // pass their own taps on to the map (bubblingMouseEvents), so this is
        // never the same tap that showed them.
        theMap.on('click', function () { mapTip.hidden = true; });
        // A card's disc is shown only while it is no bigger than the view;
        // every zoom and pan, the page's own fits included, ends here.
        theMap.on('moveend', sizeDiscs);
        // The attribution stays. These tiles are given away on the condition
        // that it does, and a panel being small is not an exemption.
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(theMap);
        mapGeo = new MV.Geocoder({
          // No "near" box on this panel and nothing to type one into at the
          // wheel. The box around the car's own position is the better answer
          // anyway and is what this page uses — see boxFor below.
          hint: function () { return ''; },
          store: {
            get: function () { return localStorage.getItem('uberscan.geocode.v1'); },
            set: function (s) { localStorage.setItem('uberscan.geocode.v1', s); },
            clear: function () { localStorage.removeItem('uberscan.geocode.v1'); }
          }
        });
      }
      // The pane was display:none when the map was made, so Leaflet measured a
      // box of zero and drew one tile in the corner. Asked again now it is on
      // screen, and again after the next frame, because the grid row it lives
      // in is sized from the viewport and is not final within this tick.
      theMap.invalidateSize();
      requestAnimationFrame(function () { if (theMap) theMap.invalidateSize(); });

      /* Where the car was when THIS card came up: the fix the scanner took
         once when the card landed and put on the offer line, which is also
         where the platform measured the card's own distance from. Only a fix
         rpi/gps.py's gate passed — MV.fixOf reads `gpsOk` and nothing else.
         It used to be the newest journal row that carried a position, up to
         twenty minutes old and cached two more, which is another card's car;
         that fetch, its cache and its age hedges are gone with it. */
      var here = MV.cardFix(want.card).at;

      var found = {};
      // A box around where the car actually is, which is the whole of what
      // makes a street name answerable: handed "Cobb Pkwy" a geocoder returns
      // a real Cobb Pkwy somewhere, and this driver works one metro.
      var box = here ? MV.boxAround(here) : null;

      /* The car, before a single question goes out — and the last card's pins
         down in the same call.
         Until now nothing reached the glass until every lookup had finished.
         Measured against the real map-view.js at a 500ms round trip, press to
         first mark: 1.6s for a card that names no dropoff, 3.8s for three
         fresh places, 6.0s when the box refuses all three. That is a decision
         the driver makes in tens of seconds, spent looking at a rectangle.
         And it was not an EMPTY rectangle, which is worse: the only teardown
         is inside drawMap, so the previous card's four pins and its route sat
         there the whole time, under this card's numbers. The branch above
         refuses exactly that for a card that names nowhere — "the last card's
         pins must not stay on the glass under this card's numbers" — and this
         is the other branch of the same rule.
         The car is the one mark here that was measured rather than looked up,
         so it is the one that can be drawn at once. */
      drawMap(want, found, here, false);
      function landed() {
        // Same guard as the settled draw below, and for the same reason: the
        // driver may have been shown a different card while this was in
        // flight, and half-drawn pins belonging to the old one are still the
        // old one's.
        if (viewMode !== 'map' || mapFor !== key) return;
        drawMap(want, found, here, false);
      }

      /* The NucBox at home, when this rig's server has it set (see server.js
         nbxRoute and MV.NbxSearch). Asked AFTER the car is down, so the one
         local question never delays the first mark. With neither setting,
         `nbx` is both false and everything below this is exactly the walk
         this page always made — the public geocoder, the box, the wide
         retry. Asked at every walk rather than kept: it is one question to
         this rig's own server, and a kept answer is a second copy of a
         setting that lives there. */
      var nbx = await MV.nbxSettings();
      if (viewMode !== 'map' || mapFor !== key) return;
      if ((nbx.search || nbx.route) && !mapNbx) mapNbx = new MV.NbxSearch();
      var askPublic = want.names;
      if (nbx.search) {
        /* Each place inside ITS card's disc: this card's for its own pickup
           and dropoff, the held card's for where the order in the car is
           going. A refusal is kept with the disc it was made in, so the line
           under the map can say what was searched and what was found. */
        var discs = { card: MV.discFor(want.card), held: MV.discFor(want.heldCard) };
        askPublic = [];
        for (var n = 0; n < want.names.length; n++) {
          var q = want.names[n];
          if (want.nbxDown) { askPublic.push(q); continue; }
          // The held order's pickups are its card's places too, and are
          // searched in its disc as its end is.
          var heldsOwn = q === want.held
            || want.heldPicks.some(function (p) { return p.q === q; });
          var whose = (heldsOwn && q !== want.pickup && q !== want.dropoff)
            ? 'held' : 'new';
          var disc = whose === 'held' ? discs.held : discs.card;
          // `here` for a numberless street's pin: the point of its stretch
          // nearest the car (MV.stretchInDisc), when the street index is set.
          var got = await mapNbx.place(q, disc,        // eslint-disable-line no-await-in-loop
                                       { streets: nbx.streets, car: here });
          if (viewMode !== 'map' || mapFor !== key) return;
          if (got.why === 'unreachable') {
            // Today's path for this place and every one after it, under the
            // same press: one dead NucBox is not three timeouts in a row.
            // Only this: a question the relay REFUSED ('refused') is a bug
            // here, kept below and said as one, never handed to the public
            // map to answer instead.
            want.nbxDown = got.error;
            askPublic.push(q);
            continue;
          }
          found[q] = got.at || null;
          want.nbxAnswered++;
          want.nbxSeen[q] = { res: got, disc: disc, whose: whose };
          // The END only: a pickup's pin is never sent as the held end.
          if (whose === 'held' && q === want.held && disc) pinHeldEnd(want, q, got);
          // ...and a pickup's pin goes as a pickup, for the restaurant guard.
          else if (whose === 'held' && disc) pinHeldPickup(want, got);
          if (!got.at) want.nbxWhy[q] = { res: got, disc: disc, whose: whose };
          landed();
        }
      }
      if (askPublic.length) {
        await mapGeo.walk(askPublic, function () { return box; }, found, landed);
        // Asked again without the box, exactly as the other two pages do it: a
        // box is a claim that the answer is within sixty miles of the car, and a
        // genuinely distant dropoff must not be lost to a feature meant to find
        // things. Never for a place the NucBox answered: its disc IS the
        // claim, and asking wide is how a wrong branch gets a pin.
        var refused = askPublic.filter(function (q) { return box && !found[q]; });
        if (refused.length) {
          await mapGeo.walk(refused, function () { return null; }, found, landed);
        }
      }

      // The driver has been shown a different card since these went out. The
      // pins about to be drawn would be the old one's, under the new one's
      // numbers — a confidently wrong answer, which is the one thing this
      // panel may never produce.
      if (viewMode !== 'map' || mapFor !== key) return;

      /* The detour by road, when the router is set and only when the line
         would state a figure at all: every refusal mapRefusal makes — a pin
         farFrom or a card's disc refuses, no fix, no yardstick, nothing held
         — stands exactly as it does for the straight line, and no point the
         panel will not measure from is sent anywhere. Asked here, inside the
         walk and under the busy guard, so a driver who leaves Map view while
         it is in flight cannot come back to the previous card's line. */
      var road;
      if (nbx.route) {
        var j = mapJudge(want, found, here);
        if (mapRefusal(want, found, here, j) === null) {
          // ...and never to a numberless street's pin: the router measures
          // one point, and the card says the street, not where on it. Its
          // figure is MV.stretchSpan's, over the whole stretch, in straight
          // lines, and the line says why there is no road figure.
          if (MV.stretchSpan(here, j.pick, j.held)) {
            road = { why: 'street' };
          } else {
            mapSay('measuring the detour by road…');
            road = await mapNbx.detour(here, j.pick, j.held);
            if (viewMode !== 'map' || mapFor !== key) return;
          }
        }
      }
      /* The held order's run along the roads, to draw: the car, its pickups
         with a pin, its end — the points heldRun draws straight. Drawing
         only; no figure comes of it. Not when any of them is a pin the map
         calls wrong (red) or a numberless street's point (its card names the
         street, not where on it): a road to a point nobody vouches for is a
         road drawn with more confidence than the pin under it. With no
         held pickups this is car -> held end, the question detour already
         asked, answered from the page's cache. Router down: null, and the
         straight run as before. */
      var heldRoad = null;
      if (nbx.route && mapNbx) {
        var hj = mapJudge(want, found, here);
        var runPts = [here].concat(hj.heldPicks.filter(function (p) { return p.at; })
          .map(function (p) { return p.at; }), [hj.held]).filter(Boolean);
        var trusted = hj.held && !hj.off.held && !hj.wrong[want.held]
          && hj.heldPicks.every(function (p) { return !p.at || (!p.off && !hj.wrong[p.q]); })
          && runPts.every(function (p) { return !p.stretch; });
        if (here && trusted && runPts.length >= 2) {
          heldRoad = await mapNbx.runLine(runPts);
          if (viewMode !== 'map' || mapFor !== key) return;
        }
      }
      drawMap(want, found, here, true, road, heldRoad);
    } finally {
      mapBusy = false;
      /* A walk the driver walked away from leaves this card marked as drawn
         when nothing of it reached the glass. Every early return above happens
         before the settled draw and so never reaches mapDrew, so coming back
         takes the "nothing to redraw" branch and re-states `lastLine` over
         `lastBounds` — and both of those belong to the card BEFORE this one.
         The driver gets the last offer's detour over the last offer's pins,
         under this offer's figures, and it never corrects itself, because the
         key says this card is already drawn. Forgetting the key instead makes
         the next press redraw from the start, and that costs nothing: every
         answer that did arrive is in the geocoder's cache, so the re-run asks
         nobody anything.

         ON THE MODE, and only on the mode. A `partial` flag set after the car
         was drawn used to stand in front of this, on the reasoning that
         `mapFor` is frozen for the whole walk so `partial` already implied the
         mode had changed. The implication runs ONE WAY only: the mode can
         change while nothing of this card is drawn and `partial` is false —
         a journal fetch for the car's position used to sit between taking
         the key and the first mark, and rpi/test_dashboard.py watched the
         previous card's pins stay up while this card's places were never
         asked about. That fetch is gone (the car is now this card's own fix,
         on the offer line), but `await MV.needLeaflet` still sits there on
         the first entry of a page, so the rule is the mode and not what was
         drawn.

         What must NOT be nulled is a key under a live map, and that is what
         the mode clause is for: a drawMap that THROWS would otherwise null it
         and the line below re-enters showMap at once, which on a panel read
         while driving is an unbounded retry. Measured with a deliberate throw
         in Leaflet's fitBounds: 1 draw with this clause, 5 in 6 seconds and
         climbing under `if (partial)` alone, and the panel hangs outright if
         the key is nulled unconditionally — the suite's own driver times out.
         The residual is deliberate and worth stating: a drawMap that throws
         KEEPS its key, and `lastBounds` is only assigned after `fitBounds`, so
         on that path the card still shows the previous card's line and view.
         Nulling there is the unbounded retry, and a stale map that stops is
         the better of the two. After the settled draw the mode was checked one statement earlier
         with nothing awaited in between, so a finished walk always keeps its
         key and coming back to the same card still restores its line. */
      if (viewMode !== 'map') mapFor = null;
      // A card that arrived while those lookups were in flight was dropped:
      // the busy guard returned before `mapFor` was touched, so nothing
      // remembered that a newer card was waiting and the map went on showing
      // the old one until the card after that. Caught up here instead, which
      // is also the only place that knows the walk has finished.
      if (viewMode === 'map' && mapFor !== mapWants().key) showMap();
    }
  }

  /* One dot, sized and coloured for a panel read at arm's length through a
     windscreen. Bigger than the map page's, which is read at a desk. */
  /* The only markup this page builds from text it did not write. Everything
     else here goes through textContent, deliberately — and the names below
     come off OCR of a photograph of somebody's phone, which is about as
     untrusted as a string gets. */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* Sized for the 3.5" hat as much as the 7" panel: a solid pin is 12px
     round (24px across, the letter 13px bold inside it), a ring 13. They
     were 9 and 11 with no letter, which on the muted tiles read as one more
     coloured dot among the map's own. The car's ring keeps its 11 and its
     blue: it carries no letter, and it is the one mark measured rather than
     looked up. A ring with a letter — the order already in the car — is
     edged in its own colour rather than in black, so "the order in my car"
     and "this offer" differ at a glance by more than a shade of fill. */
  function mapDot(at, colour, label, name, ring, letter) {
    var held = ring && !!letter;
    return L.circleMarker([at.lat, at.lon], {
      radius: !ring ? 12 : held ? 13 : 11, weight: held ? 4 : 3,
