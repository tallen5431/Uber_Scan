      drawSkip.hidden = false;
      drawHint.textContent = STEP_CARD;
      return;
    }
    if (!cardOk()) return;
    sendBoxes(cardInScreen(box, screenBox));
  });

  // The screen box alone: offers are read in all of it, as before there were
  // two boxes.
  drawSkip.addEventListener('click', function () {
    if (screenBox) sendBoxes(null);
  });

  function sendBoxes(card) {
    var sent = screenBox;
    var body = { box: [sent.x, sent.y, sent.w, sent.h] };
    if (card) body.card = [card.x, card.y, card.w, card.h];
    drawUse.disabled = drawSkip.disabled = true;
    drawUse.textContent = '✓ sending…';
    ask('/api/crop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return { ok: r.ok }; });
    }).then(function (out) {
      if (!out || !out.ok) throw new Error((out && out.error) || 'refused');
      drawingMode(false);
      // No confirmation dialog: the green outline in the picture below moves
      // onto the box within a second or two, which is the same news and is the
      // thing worth looking at anyway.
      drawSkip.disabled = false;
      drawHint.hidden = false;
      drawHint.textContent = card
        ? 'boxes sent — offers are read in the card box, and ⌖ reads the whole screen box'
        : 'box sent — the green outline moves onto it in a moment';
      clearTimeout(hintBack);
      hintBack = setTimeout(function () { drawHint.hidden = true; }, 6000);
    }).catch(function (e) {
      drawUse.disabled = false;
      drawSkip.disabled = false;
      drawUse.textContent = '✓ Read both boxes';
      drawHint.textContent = 'could not set the box: ' + e.message;
    });
  }

  connect();
  // Each step of the tick on its own, so one that throws costs that step and
  // not the rest. They were one function, and a throw in the first of them
  // took every one after it down for that second and every second after:
  // showNight against a map-view.js from before nightFor stopped render(),
  // which is the one thing that dims a verdict nobody has refreshed. The
  // throw still reaches the console, which is where it is a bug report.
  function step(f) {
    try { f(); } catch (e) { if (window.console) console.error(e); }
  }
  // Keeps the "last seen" counter honest, and — since silence is exactly the
  // condition worth noticing — is the only thing that can ever discover the
  // scanner has gone quiet. Nothing arrives to trigger that discovery.
  // Dusk arrives with nothing arriving to announce it.
  step(showNight);
  setInterval(function () {
    step(render);
    step(showConnection);
    step(showNight);
    // The dot's age and its grey, which change while nothing arrives — and a
    // beat that stopped coming is exactly when nothing does.
    step(drawHere);
    // The screening state ages out on a clock and nothing arrives to announce
    // it: between cards the scanner can be silent for minutes, which is the
    // whole reason this tick exists. Without it ⌖ Dropoff would stay lit over
    // a card that left the screen long ago.
    step(showDest);
    // ...and Map view, whose card goes stale on the same clock (cardOnMap):
    // drawn again when what it should show has moved.
    step(function () {
      if (viewMode === 'map' && !mapBusy && mapFor !== null && mapFor !== mapWants().key) showMap();
    });
    // The shift figures ride the one-second tick rather than adding a timer of
    // their own, on an elapsed check so the cadence is three minutes however
    // many ticks it took. `document.hidden` because this tick keeps running in
    // a background tab — only the camera stream is stopped on visibilitychange
    // — and an unattended tab has no reason to keep asking the rig to parse its
    // journal. The next visible tick catches up.
    step(function () {
      if (!document.hidden && Date.now() - shiftAt >= SHIFT_EVERY_MS) loadShift();
    });
  }, 1000);
  loadShift();

  /* The offline shell, installed by the page that most needs it.
   *
   * `sw.js` lists live.html in ASSETS and this file's comments treat the panel
   * as part of the shell — it is the screen bolted to the car, it has to come
   * up with no network, and that is the stated reason it does not load
   * advice.js for a single integer. It never registered the worker.
   *
   * The only three registrations in the repo were scan.js, ui.js and
   * journal.html, so the panel was covered only when the same browser profile
   * had already opened the keypad, the phone scanner or the offers page — and
   * then only because sw.js claims clients at scope '/'. On the Pi that is
   * usually true, because index.html is where the driver lands and ui.js
   * registers there. The profile it is not true for is the one that matters
   * most: a browser pointed straight at /live.html and nothing else, which is
   * the dashboard panel and the 480x320 hat.
   *
   * The existing checks made this look covered without testing it:
   * rpi/test_scanjs.py asserts every .html in the directory is in ASSETS — a
   * check about the LIST — and separately that scan.html registers. Nothing
   * asked this page.
   *
   * NOT on `load`, which is what scan.js and ui.js do and what this was written
   * as first. THE LOAD EVENT NEVER FIRES ON THIS PAGE. The panel holds an open
   * MJPEG stream — `/api/frame.mjpeg`, see viewSrc — and a document with a
   * response that never completes never finishes loading. Copied from the
   * keypad it registered nothing at all, which the check in
   * rpi/test_scanjs.py caught by timing out waiting for `load` and then
   * counting zero registrations.
   *
   * So: straight away, at the end of boot. The cost of that is a fetch of
   * sw.js competing with the first verdict, and it is small and paid once;
   * the cost of the other version is the panel having no offline shell at
   * all, which is the thing this page's whole design is arranged around. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
