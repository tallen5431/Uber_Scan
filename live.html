<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uber Scan — Live</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<!-- The deciding behind the map mode: the geocoder, its one-a-second rule, the
     shared cache of answers, the box drawn around where the car was, and the
     detour arithmetic. Same-origin, in the service worker's shell, and the
     same file the offer log and the map page use — which is the point. A
     second copy of this reasoning on the panel is how one question comes to
     have two answers that drift apart.

     Leaflet is NOT loaded here. It comes from a CDN and this page has to open
     on a dead hotspot; it is fetched the first time somebody switches to the
     map, and never otherwise. -->
<script src="map-view.js"></script>
<style>
  /* Read at arm's length, in a car, at a glance. Nothing subtle here. */
  #app { justify-content: center; }
  .live { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--pad); }

  /* On the rig's own dashboard screen — wide, short, 800x480 or less — the
     verdict and the camera view sit side by side instead of stacked. Stacked,
     each got half of 480px and the verdict ended up smaller on the dedicated
     display than on a phone, which is exactly backwards: this panel exists to
     be read from the driver's seat.

     The camera view is the half that gives way. It matters while aiming the
     mount and hardly at all afterwards, whereas the verdict is the entire
     reason the screen is there. */
  @media (orientation: landscape) {
    /* Half each, for the scene view — a picture of the cabin is landscape and
       does use the width it is given. The phone view overrides this below,
       because a portrait picture does not. */
    #app { display: grid;
           grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
           grid-template-rows: minmax(0, 1fr) auto auto;
           align-content: start; }
    /* `safe`, which is the difference between overflowing downward and
       overflowing upward. Centred content that is taller than its box spills
       equally in both directions, and the top is where the word ACCEPT lives —
       so on the one screen whose whole job is to show a verdict, the verdict's
       name was the first thing to be clipped away. `safe center` centres while
       it fits and falls back to the top when it does not. */
    .live { grid-column: 1; grid-row: 1; justify-content: safe center; }
    /* The panel takes the height of the row it is in rather than only the
       height of its own words. On a 1280x800 panel the verdict was 352px of a
       788px column and the rest was black — the same complaint that started
       this, one screen along. Stretched, with the contents centred inside it,
       so the number has somewhere to grow into and the card looks like a card
       rather than a label floating in the dark. */
    .live #verdict { flex: 1 1 auto; display: flex; flex-direction: column;
                     justify-content: center; min-height: 0; }
    /* The notice is the item that gives way, on every panel.

       `#verdict` is a centred column, so prose taller than the card spills
       equally out of BOTH ends of it — and the top of the card is where the
       word ACCEPT and the rate live. Measured: a long enough notice put both
       outside the card on the 800x480 panel the rig is bolted to, and on the
       3.5" hat the three notices a single uncertain reading already writes did
       it. Neither says anything; #app clips at `overflow: hidden` and the
       verdict is simply not there.

       One declaration does all of it, and not the obvious one. A flex item's
       automatic minimum size is its own content, so a block of prose refuses to
       give even when it is the only item with anything to give — and the rule
       that removes that floor is `overflow` being anything but `visible`. So
       `overflow-y: auto` both makes the notice shrinkable and makes what does
       not fit reachable, in the same word. (A `min-height: 0` alongside it is
       the declaration everyone reaches for and it changes nothing here; see the
       same note on `.places` and `.stackline` above, which take the other half
       of this rule — `overflow: hidden` — and needed `flex: none` to get their
       floor BACK.)

       Not `safe center` — which is what the same fault one box out called for.
       Here it would move the whole overflow to the bottom edge, and the cards
       on the 800x480 panel run a few pixels into their own padding, which is
       invisible and harmless until it is all pushed to one side. */
    .live #verdict > #warn { overflow-y: auto; }
    /* ...and inside that column, the one-line facts do not shrink.

       A flex item's automatic minimum size is its content — except when it has
       `overflow: hidden`, which removes that floor entirely. Both of these do,
       to ellipsise, so both were shrinkable to NOTHING while the big rate block
       beside them kept every pixel. Measured on the rig's own 800x480 panel:
       `#places` drew 9px tall for a 15px font, and 0px once the stack line
       grew — the address of the job, on the one screen the driver looks at
       while deciding, painted at no height at all.

       The rate block is the item with room to give: it is 125px of figure and
       loses nothing legible by giving up ten. These two are one line each and
       there is no such thing as most of a line. */
    .live #verdict > .places,
    .live #verdict > .stackline { flex: none; }
    /* `stretch`, not `center`, and this is the difference between a picture
       that fits and one that is cut.
       
       `#viewWrap img { max-height: 100% }` resolves against the wrapper, and a
       wrapper that is `align-self: center` takes the height of its contents —
       so the percentage had nothing to measure against and was ignored. On the
       800x480 panel the phone drew 612px tall in a 468px row and `overflow:
       hidden` took the difference off both ends: 109px off the TOP, which on
       an offer card is where the payout is, and 23px off the bottom. It got
       worse on bigger panels, 137px off the top at 1024x600.
       
       Stretched, the wrapper is the row, the percentage has a number to
       resolve against, and the picture is centred inside it whole. */
    #viewWrap { grid-column: 2; grid-row: 1; margin: 0; min-height: 0;
                align-self: stretch; display: flex;
                align-items: center; justify-content: center; }
    /* Bounded by the row it is in rather than by the viewport. It used to be
       `100dvh - 132px`, which is a guess at what the bars below it cost, and a
       guess that is too big overflows the page — the whole reason the bottom
       bar ended up off the glass. `100%` is the row, and the row is what is
       actually left over. */
    #viewWrap img { max-height: 100%; object-fit: contain; }
    /* The map takes the row the same way, and takes what is LEFT of it rather
       than all of it: the caption under it is the line that says how far out
       of the way the pickup is, which is the whole reason a driver switched
       here. At `height: 100%` the map is the row on its own and that line is
       pushed off the glass — on this panel there is exactly one row to spend
       and nothing below it scrolls. */
    #viewWrap:has(#liveMap:not([hidden])) { flex-direction: column;
                                            align-items: stretch; }
    #liveMap { flex: 1; min-height: 0; }
    /* The details block has no room on a dashboard panel and is hidden below,
       but it still needs a cell or it lands in the middle of the grid. */
    #raw { grid-column: 1 / -1; grid-row: 2; }
    .connbar { grid-column: 1 / -1; grid-row: 2; }
    .bottombar { grid-column: 1 / -1; grid-row: 3; }
    /* Never taller than the glass. Everything above lays the page out across
       the panel instead of down it precisely so it fits; this is the assertion
       that it did, and it is what stops a bar of controls scrolling out of
       reach of a driver who is not going to be scrolling. */
    #app { height: 100dvh; min-height: 0; overflow: hidden; }
    /* When there is no camera frame to show — before the first one arrives, or
       on a machine with no camera at all — the verdict takes the whole panel
       rather than sitting in half of it beside a black rectangle. The view is
       what gives way, because it matters while aiming the mount and the
       verdict is why the screen is bolted to the dashboard. */
    #app:has(#viewWrap.gone) { grid-template-columns: minmax(0, 1fr); }
    #viewWrap.gone { display: none; }

    /* Reading the phone rather than aiming at it.
     *
     * A phone is portrait and this panel is landscape, so the picture is
     * bounded by height and the columns should not be split evenly: at
     * 1.25fr/1fr the image was width-bound at 345px on an 800x480 screen and
     * drew 260px tall in a 468px row, leaving 200px of the one dimension it
     * actually wanted. Given the height, the same phone comes out 468px tall —
     * a little under twice the linear size, on top of the six-fold gain in the
     * picture itself.
     *
     * The verdict keeps the rest of the width. It is still the reason the
     * screen is bolted to the dashboard; it is just no longer the only thing
     * on it worth looking at, and a phone screen you cannot read the buttons
     * on is not a phone you can drive with a mouse. */
    /* The picture takes the width it needs and no more, which is not the same
       as taking less than half.

       A phone is portrait and this panel is landscape, so the picture is bound
       by HEIGHT. Given the 468 rows an 800x480 panel has left after the page
       margins, the phone's own shape fixes the width, and no arrangement of
       columns changes it. Splitting the panel evenly was tried and measured on
       exactly this card: the phone came out the same size to the pixel, the
       rest of its column went black, and the other half paid for it — the
       address sliced to 11px of its 17px line, the age line wrapped onto two,
       and five controls sharing 388px instead of 559px close enough that "Set
       box" and "Re-find" touch.

       So the column is sized to the picture and what is left goes to the
       verdict and the controls. Same phone, room for everything else. */
    body.phoneview #app { grid-template-columns: minmax(0, 1fr) auto; }
    /* Down the whole panel, not just the row the verdict is in. The bar of
       controls and the connection line were spanning both columns, so the
       picture stopped 78px above the bottom of an 800x480 screen and the space
       it stopped for was black: the verdict does not fill its row either. With
       every row to itself the same phone is 468px tall instead of 382, and the
       controls lose nothing — five buttons across the remaining 520px is still
       104px each. */
    body.phoneview #viewWrap  { grid-column: 2; grid-row: 1 / -1; }
    body.phoneview .connbar   { grid-column: 1; }
    body.phoneview .bottombar { grid-column: 1; }
    body.phoneview #viewWrap { align-self: stretch; display: flex;
                               align-items: center; justify-content: center; }
    body.phoneview #viewWrap img {
      /* Height first, and width whatever the phone's own shape makes it. The
         base rule is `width: 100%`, which on a portrait picture in a landscape
         cell is the wrong axis to pin. */
      width: auto; height: 100%; max-width: 100%; max-height: 100%;
    }
    /* The caption sits under a picture that is now as tall as the row, so it
       has nowhere to be. The picture says what it is. */
    body.phoneview #viewNote { display: none; }
    /* The rate is sized against the panel it sits in, and that panel is now a
       column rather than the whole width.
       Four limits, and whichever bites first wins: the panel's width, the
       panel's height, an absolute ceiling, and the column the number has to fit
       inside. The height term is what lets a 1024x600 panel spend its extra
       room on the one number the screen exists for — the flat 92px cap left it
       the same size as on an 800x480, with 130px of black above and below.
       The ceiling is 170 rather than 140 because at 140 it was the term that
       bit on a 1024x600 panel, which put the absolute cap back in charge of
       the exact screen the height term was added for; at 170 the height wins
       there (156px) and the width still wins on an 800x480 (128px), which is
       the arrangement intended. */
    #perHour { font-size: min(16vw, 26dvh, 240px,
                              calc((100cqw - 40px) / (var(--chars) * 0.62))); }
    /* ...and it gives some of that back when there is something to say. A
       notice is two more lines inside a panel that is already as tall as the
       row it sits in, so without this the panel grows past the glass and the
       word ACCEPT is the part that goes — clipped off the top, on the one
       screen whose whole job is to show it. */
    #verdict:has(#warn:not([hidden])) #perHour {
      font-size: min(12vw, 17dvh, 96px,
                     calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
    /* ...and the room comes out of the line that is already on screen twice.
       This hid the whole working, which is where the raw $/hr lives and the
       only place on this page it appears. A notice is showing for the whole
       life of a card whenever the distance was unreadable — that flag is a
       stored property of the merged reading and never clears — so on 52 of
       one real shift's 121 offers the raw figure was not slow to arrive, it
       never arrived at all. Those are also exactly the offers where no
       mileage cost was taken off, so the working had no net line either and
       the block rendered nothing: a hidden empty box, bought at the price of
       the one number it was there to show.

       The net line is the headline, in small type. Dropping that costs
       nothing a glance needs and buys the same line of height. */
    #verdict:has(#warn:not([hidden])) .working .net { display: none; }
    /* The same line, for the same reason, when a pair is on screen. The stack
       line is a row of its own under the address, and the card had no row to
       give it: measured beside the phone on an 800x480 panel, the verdict's
       contents ran 27px past its box, centred, so the word PASS started 4px
       above the card's border and the stack line — the row a driver presses —
       ended 2px below it. The net line is 32px there; without it the stack
       line ends 11px inside the border. */
    #verdict:has(#stack:not([hidden])) .working .net { display: none; }
    #raw, #viewNote { display: none; }
    /* ...except when it is the map's line, which is the one thing the caption
       has ever had worth a row. "camera view · inset is what the reader sees"
       is a label on a picture that says what it is; "+3.2 mi out of your way"
       is the answer the driver switched modes to get, and a map with it hidden
       is a map they have to judge by eye alone. Bigger than the 11px above for
       the same reason everything on this panel is: it is read at arm's length,
       through a windscreen, at a glance. */
    /* ...and it is CAPPED, in rows, because everything under it is the map.
       The cap used to live in a comment at the mapDrew call — "short on
       purpose, this line is a row of the panel" — and nothing enforced it.
       Measured in this 388px column at 15px, twelve of the twenty-one forms
       this caption can take ran past one row — ten of its branches, seven a
       fixed string and three built round a value. The worst is not any of
       the ones AUDITS counted: the misread-name line interpolates a place
       read off a card, bounded only by the parser's MAX_PLACE of 60, so it
       ran to 171 characters and FOUR rows here and SIX on the 3.5" hat,
       where it left the map 104px — under the 120px this suite's own check
       calls a map rather than a texture, on the only sentence no check had
       ever been given.

       Two rows, and the number is measured rather than chosen: the detour
       line with both of its hedges — "+3.2 mi out of your way — straight
       lines, not roads, from where you were 12 min ago" — is two rows here,
       and that line is the only thing this mode produces. One row cannot
       hold it, so one row was never a budget that could be kept; three rows
       would be spending map on sentences that explain why there is no
       figure. The hat takes three for the same reason and no other: the same
       line is three rows in a 228px column, and a hedge clipped off a number
       is this project's first fault class.

       Clamped rather than hidden, so the ellipsis says that something was
       cut. What it cuts is always the tail, and these lines are written
       load-bearing end first — figure, then the straight-line warning, then
       the age of the fix, then the count of places with no pin. */
    #viewWrap:has(#liveMap:not([hidden])) #viewNote {
      /* `block` first and on its own line, and it is not decoration. The rule
         above this one is `display: none`, and a browser that does not know
         `-webkit-box` drops that declaration and keeps the none — which would
         take the caption off the glass entirely to save it from being two rows
         too tall. Stated twice, the worst case is an uncapped row. */
      display: block;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      overflow: hidden;
      font-size: 15px; color: var(--text); padding: 5px 0 0;
    }
  }

  /* Smaller again, and the arithmetic behind the headline gives up most of its
     room: the verdict, the rate and the figures off the card are what a glance
     needs, and the sum that connects them can be checked on a bigger screen
     when parked.

     Most of it, not all of it. This hid the working outright, and the working
     is the only place on this page the raw $/hr appears — so between here and
     the notice rule above there were two separate ways for that figure to be
     absent and nothing on screen to tell either of them from a number the page
     had failed to work out. What survives is the one line that is not written
     anywhere else; the net line goes, because it is the headline in small type,
     and so does the pay-and-time half of the raw line, which is a check against
     the card rather than a figure. */
  @media (orientation: landscape) and (max-height: 380px) {
    /* One more row for the caption, and the reason is the figure rather than
       the room. This column is 228px, and the detour line with its two hedges
       is three rows in it against two at 800x480 — so a two-row cap here
       would ellipsise ", from where you were 12 min ago" off a distance the
       driver is about to act on. Measured, the third row costs the map
       155px instead of 172px, and the check under it wants 120. */
    #viewWrap:has(#liveMap:not([hidden])) #viewNote { -webkit-line-clamp: 3; }
    .working .net { display: none; }
    .working .raw span:first-child { display: none; }
    .working .raw i { font-style: normal; }
    /* `=` opens a sum whose left-hand side is no longer on screen. */
    .working .raw i:first-of-type { display: none; }
    .working { font-size: 11px; margin-top: 2px; }
    /* This was `#detail { display: none; }`, and #detail is not only the
       diagnostics. It is also how old the reading is — the one figure on this
       page a driver acts on continuously, since it is what says whether the
       numbers belong to the card in front of them or the one before it — and,
       when there is no card, the whole of what the page has to say: "nothing
       from the scanner for 40s — it may have stopped", and the aiming
       instruction "move the mount until this says good". So the 3.5" hat was
       the one screen with no way to tell a stopped scanner from a quiet one and
       no instructions for pointing the camera, which is exactly backwards: it
       is the screen with the least room to work anything out.

       The diagnostics — the read time, the leg count, the tracker's drift —
       genuinely have no room here, and they are all questions for a parked
       driver on a bigger screen. They go; the line stays. */
    #detail .diag { display: none; }
    /* And it costs what it costs, so it costs as little as possible: the
       verdict is the row's other occupant and every pixel this line takes comes
       out of it. At the shared 12.5px/1.5 that was 16px, enough on its own to
       push the headline off the glass. Ten. The three rules below are where it
       is paid for. */
    #detail { font-size: 10px; line-height: 1; margin: 0; }
    /* On a panel this small a notice and the figures cannot both fit, and the
       notice wins: it is there because something is wrong with the reading, so
       the three numbers underneath it are the ones not to trust. The headline
       and the reason for doubting it are the pair worth keeping. */
    #verdict:has(#warn:not([hidden])) .submetrics { display: none; }
    /* ...and hiding the figures is not enough on its own, which took measuring
       to see. A card can carry three notices at once — a distance that could not
       be read, an hour worked out without one, and a journey still arriving —
       and on this panel that is a 139px block of prose inside a 191px verdict.
       The verdict is a centred flex column, so the overflow went out BOTH ends:
       the headline sat 2px above the glass and the word PASS 25px above it,
       clipped away by #app. The one screen where a driver has the least room to
       work anything out was the one that answered a three-note card by hiding
       its own verdict, and nothing said so.

       There is no rule here for it, which is the point of saying so here: it is
       settled for every panel by `.live #verdict > #warn` above, and this panel
       is where that rule earns its keep. With the figures hidden the card has
       83px left and the three notes want 127, so on the 3.5" hat — and only
       there — the reason for the doubt is a line and a bit plus a scroll.
       Smaller type was tried and is not in this file: at 11px the same notice
       still scrolls, so it bought a fraction of a line and a claim nothing
       could check. Nothing on this panel closes a gap of four lines. The
       alternative was the verdict itself leaving the screen. */
    /* The other half of the same measurement, on a card with no notice at all.
       The verdict's column on this panel is 191px and the four card figures
       took 78 of it: the block is `minmax(74px, 1fr)` columns, the verdict here
       is narrow because the phone picture has the width, so only two columns
       fit and the four figures wrapped to two rows of a value stacked over its
       label. 184px of content in 173px of room, centred — so the verdict label
       was painted over the top border of its own card and the address over the
       bottom one, and with a pair on screen the stack line was outside the box
       entirely.

       Value beside label rather than above it. Two rows of one line instead of
       two rows of two: 41px rather than 78, which is 37 handed back to a column
       that was 11 short. Nothing is dropped and nothing is smaller — "8.00 PAY"
       reads as readily across a car as "8.00" over "PAY". */
    #verdict .sub { flex-direction: row; align-items: baseline;
                    justify-content: center; gap: 5px; }
    /* And the last of it off the headline, only when there is a pair. A second
       job in the car puts the stack line under everything else, and that is the
       one row on this page a driver presses; this panel already asks the
       headline to give up 19px of its 77 so it fits, and with the age back on
       the glass it gives up the same again. 38px is still four times the size
       of anything else in the card, and the alternative was that row hanging
       outside the box it belongs to, which is where this started.

       Only when there is a pair, because a pair is the only card where it is
       true: nothing else on this panel needs it, and a headline permanently
       smaller to pay for a line that is usually not there would be the same
       mistake in the other direction. */
    #verdict:has(#stack:not([hidden])) #perHour {
      font-size: min(8vw, calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
    /* The phone layout above gives the picture every row so that on an
       800x480 panel the phone stands 468px tall. On the 3.5" hat that left the
       verdict a 279px column, and measured with a phone on the glass: the
       five-button bar wrapped to 74px, the verdict's row came out 192px for
       205px of content before any pair was on screen, and with a pair the
       stack line — the one row a driver presses — was painted under the
       connection line, where nothing could reach it.

       So here the bar and the connection line take the width back, which
       puts the five buttons on one line, and the picture keeps the row that
       is left: 122x211 rather than 177x314, on a screen where the verdict is
       still the reason it is there. The headline gives up 19px of its 77 and
       the working line its padding so the pair fits under them: 199px of
       content inside the verdict's 207px, with the stack line in its own box
       and every chip on it reachable. */
    body.phoneview .connbar, body.phoneview .bottombar { grid-column: 1 / -1; }
    body.phoneview #viewWrap { grid-row: 1; }
    #perHour { font-size: min(12vw, calc((100cqw - 40px) / (var(--chars) * 0.62))); }
    .working { padding: 0 0 2px; }
  }

  /* The number is sized to the panel and to how many characters it has to
     hold. A fixed 180px fits "$25" and runs "$41.6" off the edge — which is
     what a real offer did on a wide screen, pushing the "/hr" past the border.
     Sized against the panel rather than the viewport because the panel is what
     it has to fit inside. */
  .verdict { container-type: inline-size; }
  .big .rate-value {
    --chars: 4;
    font-size: min(28vw, 180px, calc((100cqw - 70px) / (var(--chars) * 0.62)));
  }
  /* Nothing to report: a 180px "--" is a pair of grey slabs, not information,
     and a row of dashes under a rule reads as a table that failed to load.
     Between offers the panel says only what it knows, which is the phase. */
  .verdict.novalue .rate,
  .verdict.novalue .submetrics { display: none; }
  /* The headline is the one number that cannot be shown here. $1184 over twenty
     minutes is $3548/hr, and at that size, in that position, it is read before
     the label above it is. The card's own pay, time and distance stay below,
     because those are what the driver checks against the phone in their hand. */
  /* The working goes; the rate keeps its box and shows nothing. */
  .verdict.doubt .working { display: none; }
  .verdict.doubt .rate-value { color: var(--doubt); }
  .stale { opacity: .35; }
  /* Diagnostics, not a heading. It was uppercase with wide tracking, which
     made a line of read timings shout louder than the verdict above it. */
  .pending { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  /* ...except the age, which is not a diagnostic. On a panel beside a phone
     being worked with a mouse, "does this rate belong to the card in front of
     me or the one before it" is the question the whole line exists to answer,
     and it is answered in seconds. Full-strength text at the front of a dim
     line, so it reads without being read. */
  .pending .age { color: var(--text); font-weight: 700; }
  .connbar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; color: var(--muted); padding: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--no); }
  .connbar a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
  /* The connection state keeps its width and the shift line gives way.
     Both are flex items on one row; without this the longer shift line
     wraps "no Pi scanner on this machine" onto two lines, which is the
     message that matters most at the moment it is hardest to read. */
  #conn { white-space: nowrap; flex: 0 0 auto; }
  /* One line, and it gives way rather than widening the row. `min-width: 0`
     because a flex item will not shrink below its content without it, and this
     row sits on a panel the page is held to fitting — a long shift line that
     pushed the row wider would scroll the whole screen sideways. No colour of
     its own: it inherits the row's muted grey, which is what a fact you glance
     at rather than drive by should look like beside a verdict. */
  #shift {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #shift[hidden] { display: none; }
  .dot.on { background: var(--go); }
  #viewWrap { margin: 0; }
  #viewWrap img {
    width: 100%; display: block; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel);
  }
  #viewWrap img.stalefeed { opacity: .4; }
  /* `display: block` above is an author rule and the browser's own
     `[hidden] { display: none }` is not, so setting .hidden on the picture did
     nothing at all to it. In map mode the img went on taking the pane — it is
     `width: 100%` — and the map grew to the two pixels of its own border,
     which is a map-shaped border and no map. */
  #viewWrap img[hidden] { display: none; }
  #viewNote { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 0 0; }
  #viewWrap.gone img { display: none; }

  /* The map mode, in the same pane and the same shape as the picture it
     replaces, so switching between them does not move the rest of the page.
     A min-height because a Leaflet map in a box of zero draws one tile in the
     corner and nothing else, and on a phone the wrapper has no height of its
     own to give it. */
  #liveMap {
    width: 100%; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel);
  }
  /* Stacked down the page, the pane has no row to take a height from and a
     Leaflet map in a box of zero draws one tile in the corner — so the map
     needs a height of its own here. Portrait only, and deliberately: the
     landscape layout gives it the row and a min-height written once for both
     wins over that rule by coming later in the file. Measured, not reasoned
     about — 240px inside a 200px row at 480x320 pushed the bar of controls
     clean off the glass, and `overflow: hidden` on #app means nothing reports
     it. The driver just cannot reach the button that would put the map away. */
  @media (orientation: portrait) { #liveMap { min-height: 240px; } }
  #liveMap[hidden] { display: none; }
  /* Leaflet's own default is white, which on this panel is a flash of daylight
     at a red light before the tiles land. */
  #liveMap .leaflet-container { background: var(--panel); }
  /* Drawn for a driver, not for a desk: the popups on this panel are read at
     arm's length and dismissed with a bluetooth mouse. */
  #liveMap .leaflet-popup-content { font-size: 13px; line-height: 1.45; }

  /* Drawing the box to read. The scanner finds the phone by looking for it,
     which is right almost always and useless when it is not — a reflection, a
     second lit screen, a phone with nothing darker around it. There is no
     aiming your way out of those, so the person looking at the picture can say
     where the card is instead. */
  #viewWrap { position: relative; }
  #viewWrap.drawing img { touch-action: none; cursor: crosshair; }
  #drawn {
    position: absolute;
    border: 2px solid #17c964;          /* the outline the scanner draws, same green */
    border-radius: 4px;
    /* A tint rather than a hole punched in a full-page dim: this page keeps the
       verdict above and the buttons below usable while the box is being drawn. */
    background: rgba(23, 201, 100, .14);
    pointer-events: none;
  }
  #drawn[hidden] { display: none; }
  #drawTools { display: none; gap: 8px; padding: 8px 0 0; }
  #viewWrap.drawing #drawTools { display: flex; }
  /* .linkbtn is only styled inside .bottombar, and these two are not there. */
  #drawTools button {
    flex: 1;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 6px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
  }
  #drawTools #drawUse:not([disabled]) { background: #0d5c31; border-color: #17c964; color: #d7ffe6; }
  #drawTools button[disabled] { opacity: .45; }
  #drawHint { font-size: 12px; color: var(--muted); text-align: center; padding: 6px 0 0; }
  /* A label that does not fit is allowed a second line.
   *
   * This said `white-space: nowrap`, written when this bar had four buttons and
   * a phone's width to put them in. It now has six and sits beside the phone
   * picture, so on the panel the rig is bolted to each button is 78px wide —
   * and nowrap plus the default `overflow: visible` does not clip a long label,
   * it *centres* it and paints the ends outside the button. Measured at 17px,
   * which is what the landscape rule below actually renders:
   *
   *   800x480    "Took $12.45?" wants 91px in 78 → driver sees "ok $12.4"
   *              "▣ Set box"    wants 79px in 78 → driver sees " Set bo"
   *   1024x600   "Took $12.45?" wants 104 in 102 → driver sees "ook $12.45"
   *   1024x768   the same
   *
   * A button whose first letters are missing is worse than a small one: "ok
   * $12.4" is not a word, and the word is the half of this label that says the
   * press records a decision already made rather than making one.
   *
   * Wrapping was the answer the shared stylesheet already gave — "clipping
   * 'Camera' to 'Camer' is a worse answer than letting it wrap" — and this
   * rule was quietly overriding it. Measured with the frame on the glass, in
   * both bar populations, at all six panels: every label now renders whole on
   * every landscape panel, the 3.5" hat goes from five clipped labels to three,
   * and the bar grows 52px → 55px only on the panels where something wraps.
   * The page still fits the glass on all of them, the rate figure is untouched
   * at 124.8px, and the verdict gives up 3px to pay for it.
   *
   * `line-height: 1.1` rather than the default: two lines at 1.2 make the bar
   * 59px and there is no reason to spend the extra four. Held by
   * rpi/test_layout.py, which measures what a screenshot would show. */
  .bottombar button, .bottombar .linkbtn {
    font-size: 13px; padding: 10px 4px; line-height: 1.1;
  }
  #setBox.on {
    background: #0d5c31; border-color: #17c964; color: #d7ffe6;
  }

  /* What the reader actually saw. Folded away by default, because it is only
     ever wanted after a wrong answer — and after a wrong answer it is the only
     thing that explains it. */
  #raw { font-size: 11px; color: var(--muted); }
  #raw summary { cursor: pointer; padding: 4px 0; }
  #raw pre {
    margin: 4px 0 0; padding: 8px; white-space: pre-wrap; word-break: break-word;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    max-height: 28vh; overflow: auto; font-size: 11px; line-height: 1.45;
  }

  /* ---------- Sizes for the driver's seat ----------
   *
   * Last in the file on purpose. Everything above is written for a phone held
   * about 30cm away; the rig's own panel has the same pixel density and sits
   * roughly twice as far off, so the same letter subtends half the angle. The
   * lines below were all literal pixel values — 12.5px of read timings, a 12px
   * connection line, a 13px bar of controls — and the dashboard breakpoint near
   * the top of this file could not touch them, because they are declared after
   * it and win on source order. Written up here, they are simply later.
   *
   * The verdict itself was never the problem. These are the small things around
   * it that a driver still has to read: which figure is which, what the buttons
   * do, and whether anything is still reading offers.
   */
  @media (orientation: landscape) {
    .pending { font-size: 16px; }
    .connbar { font-size: 15px; padding: 4px; }
    .dot { width: 11px; height: 11px; }
    .bottombar button, .bottombar .linkbtn { font-size: 17px; padding: 8px 4px; }
    #drawTools button { font-size: 17px; }
    #drawHint { font-size: 15px; }
  }
</style>
</head>
<body>

<main id="app">
  <div class="live">
    <section id="verdict" class="verdict empty">
      <div class="verdict-label" id="verdictLabel">WAITING FOR AN OFFER</div>
      <div class="rate big">
        <span class="rate-value" id="perHour">--</span>
        <span class="rate-unit" id="rateUnit">/hr</span>
      </div>
      <!-- The arithmetic behind the headline, spelled out, in two steps: what
           the card pays per hour, and what is left after running the car. A
           rate a driver cannot reconstruct at a glance is a rate they cannot
           act on, and both halves are worth seeing — one is checkable against
           the offer, the other is the one that decides. -->
      <div class="working" id="working" hidden></div>
      <!-- As read off the card, so it can be checked against the phone in the
           two seconds before the offer times out. These three are deliberately
           the raw numbers: their whole job is to match what is on the screen. -->
      <div class="submetrics">
        <div class="sub"><span id="vPay">--</span><small id="lPay">pay</small></div>
        <div class="sub"><span id="vMin">--</span><small id="lMin">minutes</small></div>
        <div class="sub"><span id="vMile">--</span><small id="lMile">miles</small></div>
        <div class="sub"><span id="vPerMile">--</span><small id="lPerMile">$/mi</small></div>
      </div>
      <!-- Where the job goes. Sent on every read since the scanner learned to
           read a map, and painted nowhere until now — so the one screen a
           driver is actually looking at while they decide was the only one that
           could not tell them whether they recognise the job. Under the
           figures, because it is what you scan to recognise a job rather than
           what you judge it by. -->
      <div class="places" id="places" hidden></div>
      <!-- Both jobs at once, when there is already one in the car.
           A RANGE, never a single figure: the low end is the two jobs sharing
           nothing and the high end is the new one riding along inside the old,
           and which it turns out to be is a fact about two maps that this rig
           cannot see. Naming one number would be claiming that geography. -->
      <div class="stackline" id="stack" hidden></div>
      <div id="warn" class="notice" hidden></div>
    </section>
    <div class="pending" id="detail" style="text-align:center"></div>
  </div>

  <!-- What the camera is actually looking at. The inset is the exact image
       handed to the reader, so aim and focus are both visible here.

       A child of #app rather than of .live, which is not a detail. On the rig's
       own dashboard panel #app becomes a two-column grid — the verdict beside
       the camera view — and this carries `grid-column: 2`. Nested one level
       deeper that property applied to nothing at all: .live is a flex column,
       so the view stacked underneath the verdict inside the left-hand column,
       and the right-hand column stayed empty. Measured on an 800x480 panel: two
       columns of 431px and 345px, the verdict rendered at 431px, the camera
       view at 431px below it, 43% of the glass black, and the page overflowing
       to 768px so the bottom bar fell off the bottom of the screen.

       Only visible when the camera is working, which is why it survived: with
       no frame the `:has(.gone)` rule collapses the grid to one column and the
       page looks right. -->
  <figure id="viewWrap">
    <img id="view" alt="live camera view">
    <!-- The same pane, showing a map instead of a picture.
         The driver's own words: "it is helpful having the phone screen display
         so I can verify that the numbers were read correctly... but it would
         also be helpful to have the map view so I can visually see the route
         as well as how they may chain together."

         A third mode on the picture rather than a fourth thing beside it, and
         a swap rather than a transparency. Two dense images over each other in
         a 269px-wide pane at 800x480 makes both unreadable, and the phone
         picture's whole job is letting the numbers be checked against what the
         card actually said — degrading that works against the one thing this
         rig exists for.

         Empty until asked for. Leaflet and the tiles come from the network and
         the geocoder is asked about places customers live, so switching here
         is the press that decides it — the same gate as "Place them on a map"
         on the map page. -->
    <div id="liveMap" hidden></div>
    <!-- Where the driver says the card is, when the scanner cannot find it. -->
    <div id="drawn" hidden></div>
    <figcaption id="viewNote">camera view · inset is what the reader sees</figcaption>
    <div id="drawHint" hidden>drag a box around the offer card on the phone</div>
    <div id="drawTools">
      <button type="button" class="linkbtn" id="drawUse" disabled>✓ Read this box</button>
      <button type="button" class="linkbtn" id="drawCancel">✕ Cancel</button>
    </div>
  </figure>

  <details id="raw" hidden>
    <summary>what the reader read</summary>
    <pre id="rawText"></pre>
  </details>

  <!-- The status link lives here rather than in the bottom bar, which has three
       slots and now spends one on something needed mid-shift. This is raw JSON
       for diagnosing a rig, so it belongs next to the connection state anyway. -->
  <!-- The verdict is the content of this page and it changes without a
       navigation, a focus move or anything else assistive tech notices.
       `atomic` because "ACCEPT $25.3" is one statement, not two updates. -->
  <p class="sr-only" id="spoken" role="status" aria-live="polite" aria-atomic="true"></p>

  <!-- What the shift adds up to, on the status row rather than inside the
       verdict card. The card has 20-50px of slack at 800x480 and the rules that
       fire when a notice shows already spend a line's worth of it buying the
       headline room back — on one real shift that was 52 of 121 offers. A
       permanent line in there would take that reserve away, and the overflow
       does not scroll: #verdict centres its children with plain `center`, so
       the excess clips off the TOP and the word ACCEPT goes first.

       This row is `auto` height and already holds one line, so a second item on
       it is nearly free. It also outlives a card, which is the point — the
       address above clears when the offer goes because it belongs to that
       offer, and a shift does not. -->
  <div class="connbar"><span class="dot" id="dot"></span><a id="conn" href="/api/status">connecting…</a><span id="shift" hidden></span></div>

  <nav class="bottombar">
    <!-- The one thing the rig cannot see: whether the driver pressed Accept.
         It must never press it, so this is the only way that fact ever reaches
         the record — and until now it meant opening the offers page afterwards
         and finding the row.

         It names the offer because by the time a driver has accepted on their
         phone the card is gone from this panel: the scanner sees the navigation
         screen, reads no card, and the verdict clears. A button saying only
         "took it" would be marking something they can no longer see. -->
    <button type="button" class="linkbtn" id="took" hidden></button>
    <!-- Put the order down. Shown only while one is being carried, because a
         control for a state you are not in is a control that teaches people to
         ignore the bar. It expires on its own clock too — see holding() in
         server.js — so this is the driver saying "sooner than that", not the
         only way out of it. -->
    <button type="button" class="linkbtn" id="drop" hidden>Drop</button>
    <!-- Read the destination off the phone, once an order is in the car.

         An offer card does not say where a delivery ends: Uber prints
         "Customer dropoff" and the address only appears on the screen after the
         accept. 106 of 604 real cards are like that — 18% of everything the rig
         sees — and it is what leaves the stack line silent on 39% of the pairs
         it is asked about.

         Shown in TWO states, which is the thing to know before touching this
         bar: an order is held, OR a card is on the panel with no destination
         on it and nothing in the car. The second is screening — the driver
         already taps the dropoff on their phone before deciding, and that is
         the moment this is worth pressing. See showDest.

         It matters here and not only at the handler, because the bar overflows
         when two of the three conditional buttons show, and the pair this
         opened up is took + dest with no drop. A reader of this comment used
         to conclude that dest implied drop, and the rule that sheds the parked
         links was written on exactly that assumption.

         Conditional at all, for the reason Drop is: a control for a state you
         are not in teaches people to ignore the bar. It stays available after
         a successful read, because the first thing a driver will want when it
         reads the wrong screen is to press it again. -->
    <button type="button" class="linkbtn" id="dest" hidden>⌖ Dropoff</button>
    <a class="linkbtn parked" href="index.html">⌨ Type</a>
    <!-- NOT `parked`, which it used to be, and that was the whole of why the
         offers page was hard to reach.

         The rule that sheds the parked links fires when the bar is full — and
         the bar is full exactly when an order is in the car or a card is being
         screened, which is to say whenever the driver is working. So the one
         link to the log stood down precisely during the hours it would be
         wanted, and came back when the car was empty. The link was there the
         whole time; it was just never there when anybody looked.

         It is still read parked. That is not the same question as whether it
         can be REACHED while moving: the driver pulls over, and the way to the
         list has to be on the screen in front of them when they do, not
         conditional on them having put the order down first.

         What stands down in its place is the keypad link, and — in the fullest
         state only — ▣ Set box. See styles.css for the arithmetic. -->
    <a class="linkbtn" href="journal.html">▤ Offers</a>
    <button type="button" class="linkbtn" id="setBox">▣ Set box</button>
    <button type="button" class="linkbtn" id="reset">⟳ Re-find</button>
    <!-- Two things this picture gets used for, and they want opposite
         pictures. Aiming the mount wants the whole scene with the outline on
         it; working the phone through this screen — which is what a bluetooth
         mouse on the phone and the rig's display in front of you amounts to —
         wants the phone's screen and nothing else. `aria-pressed` because it
         is a mode, not a navigation.

         Written here in the state the page starts in — the phone — so the
         button does not spend a frame claiming the wrong mode before the
         script gets to it. The script still owns it afterwards, because the
         driver's last choice is remembered. -->
    <button type="button" class="linkbtn" id="viewMode" aria-pressed="true"
            title="Switch between the whole scene and the phone's screen"
            >⛶ Scene</button>
  </nav>
</main>

<script>
(function () {
  'use strict';

  // How long the rig can say nothing at all before this page stops believing
  // it is running.
  //
  // What this is measured against is a *heartbeat*, not a reading. It used to
  // be readings, on the reasoning that the scanner emits several times a second
  // while a card is on screen and keeps emitting between cards — and neither
  // half of that is true. A still picture moves the motion gate not at all, so
  // between offers there can be minutes with no read; and a card sitting
  // unchanged has its verify beat back off to VERIFY_MAX with a read on the end
  // of it, which is 6.0 + 3.7 = 9.7s of silence at the p90 read and 11.9s at
  // the worst one measured. The page would dim the verdict and say the rig had
  // stopped, at the moment the driver is reading it to decide.
  //
  // The loop says "still here" every ALIVE_EVERY = 4s instead, which is what
  // this is comparing against and is the thing actually worth knowing: a wedged
  // loop stops sending it, an idle one does not. Three missed heartbeats.
  //
  // The figures in this paragraph were "ninety seconds", "twelve seconds" and
  // "a 1.4s read", and all three were stale — the window is 12s, the ceiling is
  // 6.0, and a read is 1.85s at the median off the owner's own 272. See
  // READ_SECONDS in scan_pi.py, which is where that cost is written down, and
  // READ_STALE_MS below, which is the other constant derived from it.
  var STALE_MS = 12000;

  // Every POST this page makes, with a deadline on it.
  //
  // A `fetch` has no timeout of its own: a connection that opens and never
  // closes leaves the promise pending for ever, and nothing after it runs. Car
  // wifi produces exactly that — a hotspot the Pi is associated with and cannot
  // reach through. `loadShift` below knew this and guarded itself; the five
  // controls on the bar did not, and every one of them cleared its busy flag
  // only in the `.then()` after the fetch. So Took, Drop, ⌖ Dropoff, ⟳ Re-find
  // and "✓ Read this box" each sat at "…", disabled, for the rest of the shift
  // — after ONE press on a bad connection, with nothing saying why and no way
  // back but reloading the page. The controls a driver uses at a red light are
  // the last place to leave that.
  //
  // A deadline makes the promise settle: `AbortError` lands in the same
  // `.catch` the other failures already use, and each control's existing
  // "failed" state is what appears. That is the honest answer anyway — nothing
  // was written, and the button says so.
  //
  // Twenty seconds, the same figure `loadShift` uses and for the same reason:
  // long enough that a busy rig is not cut off mid-answer, short enough that a
  // driver is not left looking at a dead button.
  var POST_TIMEOUT_MS = 20000;

  function ask(url, opts) {
    opts = opts || {};
    // Feature-detected rather than assumed: this page is opened from phones and
    // laptops as well as the panel, and a browser without AbortController gets
    // the behaviour it had before, which is the old behaviour and not a crash.
    if (typeof AbortController !== 'function') return fetch(url, opts);
    var stop = new AbortController();
    var timer = setTimeout(function () { stop.abort(); }, POST_TIMEOUT_MS);
    var out = {};
    Object.keys(opts).forEach(function (k) { out[k] = opts[k]; });
    out.signal = stop.signal;
    // Cleared on both paths. A timer left running would fire into an aborted
    // controller — harmless — but it also keeps this page's one-second tick
    // company for twenty seconds after every press, for nothing.
    return fetch(url, out).then(function (r) {
      clearTimeout(timer);
      return r;
    }, function (e) {
      clearTimeout(timer);
      throw e;
    });
  }

  var el = {};
  ['verdict', 'verdictLabel', 'perHour', 'vPay', 'vMin', 'vMile', 'warn', 'detail', 'conn', 'dot',
   'lPay', 'lMin', 'lMile', 'raw', 'rawText', 'rateUnit', 'vPerMile', 'lPerMile',
   'working', 'places', 'spoken', 'took', 'shift', 'stack', 'drop', 'dest']
    .forEach(function (id) { el[id] = document.getElementById(id); });

  // Keep the headline number inside the panel whatever it says. The unit comes
  // with it: while aiming, that number is a pixel count, and labelling a pixel
  // count "/hr" made a mount measurement read as a fantastic offer.
  // The headline, at a size that does not move.
  //
  // Sizing to the exact character count meant $9.8 rendered about 25% larger
  // than $25.3, so the number visibly jumped every time the rate crossed ten —
  // on a screen being glanced at from a moving car, where the one thing that
  // should be still is the digit you are trying to read. Five characters is
  // the width of everything from "$9.8" to "$1234", so within any rate this
  // rig can produce the size is now constant.
  var RATE_CHARS = 5;

  function setRate(text, unit, keepLayout) {
    el.rateUnit.textContent = unit || '/hr';
    el.perHour.textContent = text;
    el.perHour.style.setProperty('--chars', Math.max(RATE_CHARS, text.length));
    el.verdict.classList.toggle('novalue', text === '--' && !keepLayout);
  }

  // "-$10.60", not "$-10.6". A minus sign wedged between the dollar and the
  // digits is a dash at a glance, and the two parked screens already write it
  // the other way — so the same offer read as a loss on one screen and,
  // briefly, as a number on the other.
  function rateText(n) {
    if (n === null || n === undefined || !isFinite(n)) return '--';
    var big = Math.abs(n) >= 100;
    return (n < 0 ? '-$' : '$') + (big ? Math.round(Math.abs(n))
                                       : Math.abs(n).toFixed(1));
  }

  // One sentence, only when it changes.
  //
  // The scanner emits several times a second, and a live region that is
  // rewritten on every frame is read continuously and tells you nothing. What
  // matters is the verdict and the rate it was made on, so that is the whole
  // announcement and it is silent until one of them moves.
  var saidLast = '';

  function announce(r) {
    var say = r.state === 'doubt'
      ? ({ pay: 'Check the pay.', time: 'Check the time.',
           speed: 'Check the distance.',
           // Named for what the driver has to do about it, like the rest of
           // these. "Part of the trip did not read" is the cause; looking at
           // the card's time is the action.
           leg: 'Check the time, most of the trip did not read.',
           // Both figures can be sane alone and impossible together, so this
           // one names the pair rather than picking a side.
           rate: 'Check the pay and the time.' }[r.doubt] || 'Read that again.')
      : (({ go: 'Accept', warn: 'Close call', no: 'Pass' }[r.state] || '')
         + ', ' + rateText(r.perHour) + ' an hour'
         + (r.locked && r.whole !== false ? '.' : ', still reading.'));
    if (say === saidLast) return;
    saidLast = say;
    el.spoken.textContent = say;
  }

  function showRaw(text) {
    var body = (text || '').trim();
    el.raw.hidden = !body;
    if (body) el.rawText.textContent = body;
  }

  var last = null;
  var phase = null;      // setup progress, before any offer exists
  // When this page last heard anything at all, by its own clock.
  var seenAt = Date.now();

  // ...and, separately, when a *reading* last arrived.
  //
  // These were one clock and had to become two the moment the loop started
  // sending a heartbeat. A heartbeat proves the loop is turning, which is what
  // the connection dot and the picture are about; it proves nothing whatever
  // about the verdict on screen. Merged, the heartbeat kept the clock fresh
  // while every read was failing — a degenerate quad, a tesseract that died, a
  // full disk — and the page went on showing the last ACCEPT at full opacity,
  // green dot, over a live picture of whatever card was actually in the mount.
  // Measured on a rig with reads raising: 50 heartbeats, 2 verdicts, and
  // nothing on the screen admitting it.
  var readAt = Date.now();

  // Longer than the verdict beat can legitimately be quiet, and no longer.
  //
  // The scanner's ceiling on that beat is VERIFY_MAX and a read lands on the
  // end of it, so the largest healthy gap between verdicts is those two added
  // together. The arithmetic that gave 12000 was "6.0 + 0.75 is 6.75s, and this
  // leaves most of it again as slack" — and the 0.75 was never measured. It was
  // extrapolated from a speed-up seen on a development machine, and the rig is
  // a Pi 4 that is also drawing this page.
  //
  // Measured on 272 real offers out of the owner's own journal: the median read
  // is 1846ms and the p90 is 3657ms, against the 750ms assumed. So the honest
  // healthy gap is 6.0 + 3.7 = 9.7s, not 6.75s, and a 12s window left 2.3s of
  // slack where it was supposed to leave most of the gap again. One read in ten
  // is slower than the p90; at the worst read measured, 5915ms, a perfectly
  // good verdict came within 90 milliseconds of being dimmed as stale — on the
  // hardest card, which is the one the driver most needs to trust.
  //
  // 16s: comfortably over 1.5x the honest gap and well under 2.5x it, so a
  // loaded Pi is not called dead and a genuinely dead one is not called alive
  // for a shift. The scanner's own constants are what set it — see
  // READ_SECONDS_SLOW in scan_pi.py, which is the p90 and is used wherever a
  // WORST case is meant rather than a typical one.
  //
  // The two constants live in two files. test_scan_pi.py reads this one out of
  // this page and asserts the relationship, rather than keeping a copy of it.
  var READ_STALE_MS = 16000;

  // An age off the wire, made safe to subtract from this page's clock.
  //
  // A missing one means "no idea", and the honest answer to that is the oldest
  // thing this page can represent rather than the freshest: a verdict of
  // unknown age is exactly the one not to vouch for. A negative one is a clock
  // that disagrees with itself, and clamping it is what stops an age from
  // reading as the future and never going stale at all.
  function age(ms) {
    if (typeof ms !== 'number' || !isFinite(ms) || ms < 0) return READ_STALE_MS + 1;
    return ms;
  }
  var socketUp = false;
  var scannerState = null;
  // The camera is out of room: the phone is brighter than it can take at any
  // setting that does not make the screen ripple. Not a fault in the rig, and
  // the one thing that fixes it is a slider on the phone in the driver's hand —
  // so it belongs on this screen and nowhere else.
  var tooBright = false;
  // The same complaint from the other end, and the one nothing used to report:
  // gain on its ceiling, already on the longest exposure, and the screen still
  // under target. The picture goes dark and the reads go with it.
  var tooDim = false;
  // The scanner's own sentence for why the last Re-find did nothing, or null
  // if the last one worked. Not a flag: the two reasons — nothing on the
  // screen to find, and tracking switched off — want different things from the
  // driver, and the end that knows which it was is the scanner.
  //
  // Pressing Re-find is a driver saying the outline is wrong, so the rig is
  // reading through corners they have already judged bad. When the press is
  // refused and nothing says so, they go back to driving believing it was
  // fixed, and every read until they next look is warped through the same bad
  // corners. This is the only state on this page where the driver has acted
  // and the rig has not.
  var refindRefused = null;

  // The journal has stopped taking writes, in the scanner's own words, or null.
  //
  // The only failure on this page that costs something which cannot be got
  // back. A washed-out card can be re-read and a refused Re-find can be
  // pressed again; an offer nobody wrote down is simply gone, and so is every
  // one after it for as long as it lasts. A read-only SD card is the classic
  // Pi failure and it is completely silent from up here — the rig goes on
  // reading, pricing, speaking the verdict and painting a green ACCEPT, and
  // the only sign was a line in a log on a headless box.
  //
  // The driver's own tick already reports its failures, because that write
  // goes through a request that can answer 500. The offers do not: they are
  // written from inside the scan loop with nobody to answer, which is why this
  // rides the heartbeat.
  var notSaving = null;

  // A card is under the reader right now. The gap this fills is the one the
  // driver actually notices: a read is about 1.8 seconds on a Pi 4 and this
  // panel spent every one of them saying WAITING FOR AN OFFER over a row of
  // dashes, which is what it says when the phone is blank. The card was there
  // and the rig had already started on it.
  var readingAt = 0;

  // ...and how long that claim is good for. A read that has not come back in
  // this long did not take a while, it failed: the loop reports a broken read
  // to its log rather than as a reading, so nothing would ever clear this.
  // Comfortably longer than a slow read on a loaded Pi and far short of the
  // staleness test above, so a stuck reader shows as stale rather than as
  // permanently busy.
  var READING_MS = 8000;

  // Said in terms of what to do, not what happened. "Clipping at the gain
  // floor" is true and useless; the driver is holding the thing that fixes it.
  var TOO_BRIGHT = 'Phone screen too bright for the camera — turn its '
                 + 'brightness down a notch.';
  var TOO_DIM = 'Phone screen too dim for the camera — turn its brightness up '
              + 'a notch, or move the mount out of the shade.';

  // Where the job goes, as the card wrote it.
  //
  // One line, ellipsised. An address can be sixty characters and this panel is
  // read at arm's length in a moving car: a second line of small grey text
  // costs the headline room it needs more. Two places are joined with an arrow,
  // the same way the offers page writes them, so the two screens read alike —
  // and since both now ask MV.ends for them, that is one rule rather than a
  // resemblance two files have to keep up by hand.
  function showPlaces(list) {
    var where = (list || []).filter(function (p) { return !!p; });
    el.places.textContent = where.join(' \u2192 ');
    el.places.hidden = !where.length;
  }

  // Both jobs at once, when there is already one in the car.
  //
  // A range and not a figure. The low end is the two sharing no road at all and
  // the high end is the new one riding along inside the old; where between them
  // the truth sits is a fact about two maps, and this rig has no map. It says
  // what it knows \u2014 what the pair pays over a time bounded at both ends \u2014 and
  // leaves the geography to the driver, who is looking at the phone anyway.
  //
  // The class follows the verdict's own three states so it reads at a glance
  // from the driving seat, and `go` is only ever set when the WHOLE range
  // clears the target: a range straddling the line is a maybe, and a maybe
  // drawn in green is a wrong answer. See stack() in advice.js.
  // Whole dollars with the sign in front of the dollar, not inside it.
  //
  // The same rule rateText() applies a hundred lines up, and the reason is the
  // same: "$-16" reads as a dash at a glance from the driving seat. This row
  // was the one money formatter on the page that did not follow it, and the
  // range made it worse — "+ $-16\u2013-31/hr" puts an en dash between two minus
  // signs, which is not a range, it is a smear.
  //
  // Whole dollars rather than rateText()'s one decimal because this row is the
  // half of the line that gives way when the panel runs out of width, and it is
  // a RANGE: the spread between the two ends is the information, and a tenth of
  // a dollar inside a fifteen-dollar spread is noise bought at the price of the
  // clause after it.
  function dollars(n) {
    return (n < 0 ? '-$' : '$') + Math.abs(Math.round(n));
  }

  function showStack(s) {
    if (!s) { el.stack.hidden = true; el.stack.className = 'stackline'; return; }
    // Ordered by value, not by which field they came from. `worst` divides the
    // pair's money by the LONGER time and `best` by the shorter, so on money
    // above zero worst is the smaller — and below zero that reverses, because
    // dividing a negative by a smaller number makes it more negative. A losing
    // pair therefore printed its range backwards, low end first and larger.
    var lo = Math.min(s.worst, s.best), hi = Math.max(s.worst, s.best);
    el.stack.className = 'stackline ' + s.state;
    // Built from parts rather than one string, because the parts have different
    // priorities when the row runs out of room. See .stackline in styles.css:
    // this is the half that gives way, and it can because the same figures are
    // on the panel above it.
    while (el.stack.firstChild) el.stack.removeChild(el.stack.firstChild);
    var sum = document.createElement('span');
    sum.className = 'sum';
    // The number first, because the ellipsis eats from the other end.
    //
    // This read "+ the one you have: $26\u201335/hr over 23\u201335 min", putting twenty
    // characters of framing in front of the one figure the row exists for \u2014 and
    // this is the half of the line designed to give way. Measured on the 3.5"
    // hat it showed "+ the one you have: $26": a truncated range that reads as
    // a point estimate, which is a worse thing to show than no range. The words
    // that were lost are the ones the row's own existence already says \u2014 this
    // line only appears when there is an order in the car.
    // "to" rather than an en dash, because the dash cannot survive a minus
    // sign beside it and this is exactly the row where that happens: a pair
    // that loses money is the one a driver most needs to read correctly.
    sum.textContent = '+ '
      + (Math.round(lo) === Math.round(hi)
         ? dollars(lo) : dollars(lo) + ' to ' + dollars(hi))
      + '/hr with the one you have, over '
      + (s.minMinutes === s.maxMinutes
         ? Math.round(s.minMinutes)
         : Math.round(s.minMinutes) + '\u2013' + Math.round(s.maxMinutes))
      + ' min'
      // The one claim that does not depend on the geography: better than just
      // finishing what you have, even sharing nothing. Worth saying out loud
      // because it is the only part of this a driver can act on without
      // checking the map.
      //
      // Kept INSIDE the ellipsised half, which is where it started. Pulling it
      // out into a `flex: none` element of its own was tried and measured
      // worse in the way that matters: the clause then always wins and the
      // range gives way instead, so the 800x480 panel showed "+ the one you
      // have: $26–35/h" and the 3.5" hat showed "+". The number is what this
      // row exists for; a clause that survives by eating it is a bad trade.
      + (s.sure ? ' \u00b7 beats finishing alone' : '')
      // ...and whether that range is the pair or only a ceiling on it. One of
      // the two cards printed no distance the rig could charge, so the money
      // above is gross and the target it is being held to is net \u2014 which is
      // why this line can be amber on a range that appears to clear it.
      //
      // The note above the verdict says the same thing when the OFFER is the
      // uncosted one. It says nothing when the order already in the car is,
      // and then this line was an amber with no reason on the screen.
      + (s.uncosted ? ' \u00b7 a ceiling, no distance to charge' : '')
      // Where the two jobs END, which is the half the arithmetic above cannot
      // reach: the range assumes either nothing is shared or the new job rides
      // along inside the old one, and geography decides which. Said in the
      // card's own words rather than a distance, because a town and a compass
      // quadrant are all these cards print. Nothing is said when they did not
      // print enough - about half the time - because a guess here costs an
      // hour and a late delivery. See Advice.sameArea.
      //
      // 'same-zip' is the strongest of these and only reachable once the
      // destination has been scanned off the screen after the accept - an
      // offer card prints no ZIP. It is worth its own words because "same
      // town" is nearly meaningless where this driver works: 44% of their
      // placed dropoffs are in Atlanta, which is 135 square miles, and a metro
      // ZIP is a few.
      ;
    el.stack.appendChild(sum);
    // ...and the half that does not give way. Its own element, so the ellipsis
    // above can never reach it: these words are the only place this claim is
    // made, and losing them leaves the driver an amber line that also means
    // "the range straddles your target".
    //
    // ...including when it has nothing to say, which is the case that had no
    // shape at all. `null` — about half of real pairs — appended no chip and
    // changed nothing else on the row, so "I looked at where these two jobs
    // end and found nothing to warn you about" and "I have no idea where they
    // end" drew the identical line. The range beside it is still coloured
    // green by the pay arithmetic, so an unchipped green row reads at a glance
    // as a pair that was checked and came back clean — which is precisely the
    // wrong "these end near each other" this rig prices at an hour of driving
    // and a rating.
    //
    // Measured over the corpus's own address fixtures, sameArea refuses on 127
    // of 300 pairs. 37 of those had BOTH ends parse and were still refused —
    // those rows draw a route link and no chip today, which is a row that
    // looks fully answered. The other 90 are the merchant-only cards ("Papa
    // John's Store 3317") that 106 of 604 real cards print instead of an
    // address.
    //
    // `?` because that is already this panel's glyph for the rig declining to
    // answer, and in the doubt colour, which is deliberately none of the three
    // verdict colours for the same reason .verdict.doubt is not: this is not a
    // worse "near" or a softer "elsewhere", it is a refusal.
    var ends = s.ends === 'elsewhere' ? 'ENDS ELSEWHERE'
             : s.ends === 'same-zip' ? 'same ZIP'
             : s.ends === 'same-side' ? 'same side of town'
             : s.ends === 'same-town' ? 'same town' : 'ENDS ?';
    var chip = document.createElement('span');
    chip.className = 'ends' + (s.ends ? '' : ' unknown');
    chip.textContent = ends;
    chip.title = s.ends ? '' :
      'Neither card printed enough for the rig to say whether these two jobs '
      + 'end near each other. It is not saying they do.';
    el.stack.appendChild(chip);
    if (s.ends === 'elsewhere') el.stack.className += ' elsewhere';
    // ...and the same question handed to a map, which answers it in driving
    // minutes with live traffic where the line above can only answer it in the
    // card's own words. Appended as a real link rather than folded into the
    // text, because it is the one thing on this panel a driver is meant to
    // press — and only when both ends were named, which is about half the time.
    //
    // Opened in another tab so the driving screen is still there behind it. It
    // is also the panel's browser, not the phone's: the phone keeps showing the
    // offer and the rig does not lose the card while the map is up.
    if (s.route) {
      var a = document.createElement('a');
      a.className = 'maplink';
      a.href = s.route;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = '\u2933 route';
      a.title = 'Open the drive from where the order you have ends to where '
              + 'this one ends, with current traffic.';
      el.stack.appendChild(a);
    }
    el.stack.hidden = false;
  }

  // The last offer the scanner wrote to the journal, and whether the driver has
  // said they took it.
  //
  // Not the offer on screen: those are the same thing only in the moment before
  // a decision, and the decision is made on the phone, after which the card
  // goes away. This is what the button marks and what it is named after.
  var onRecord = null;
  var tookState = false;
  var tookBusy = false;
  // Whether the last press failed to reach the journal. It used to show
  // nothing: the label flickered to "…" and came straight back to "Took
  // $10.00?", and the driver either assumed it registered or pressed again.
  // The Re-find button on the same bar already says "⟳ failed"; this says
  // "not saved", and says it until the next press.
  var tookFailed = false;

  function showTook() {
    if (!onRecord || !onRecord.id) {
      el.took.hidden = true;
      return;
    }
    el.took.hidden = false;
    // Past tense, and the amount. "Took $8.04" is a note about a decision
    // already made; anything in the imperative could be read, on a screen
    // bolted to a dashboard next to a verdict, as doing something to the offer
    // — and the one thing this rig must never do is press Accept.
    var what = (typeof onRecord.pay === 'number')
      ? '$' + onRecord.pay.toFixed(2) : 'the last one';
    // No "undo" in the label: at this width it overflowed the button by 20px
    // and the word was clipped off, which is worse than not offering it — an
    // affordance nobody can see is not an affordance. It is a toggle, styled
    // when set, exactly as the same control on the offers page behaves.
    el.took.textContent = tookBusy ? '…'
      : tookFailed ? 'Took ' + what + ' · not saved'
      : (tookState ? '\u2713 Took ' + what : 'Took ' + what + '?');
    el.took.title = tookFailed
      ? 'The journal could not be written. Press again to retry.'
      : tookState
      ? 'Recorded as taken. Press again if that was wrong.'
      : 'Record that you accepted this offer. It does not touch your phone.';
    el.took.classList.toggle('failed', tookFailed);
    el.took.classList.toggle('on', tookState);
    el.took.setAttribute('aria-pressed', tookState ? 'true' : 'false');
  }

  el.took.addEventListener('click', function () {
    if (!onRecord || !onRecord.id || tookBusy) return;
    var want = !tookState;
    tookBusy = true;
    showTook();
    ask('/api/offers/mark', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // By id, never by pay-and-minutes. Marking by the figures is a *rule*
      // that catches every offer paying that to the cent, and two genuinely
      // different cards doing exactly that inside one window is a case this
      // project has already met — see rpi/test_repeats.py.
      //
      // And the offer itself. The server keeps the offer on record in
      // memory, so after a restart mid-shift it has none — while this page
      // still shows "Took $10.00?" for it. Sent along, the server can put
      // the order in the car from what this page knows.
      body: JSON.stringify({ id: onRecord.id, accepted: want, offer: onRecord })
    }).then(function (r) {
      if (!r.ok) { tookFailed = true; return null; }
      tookFailed = false;
      tookState = want;
      return r.json().catch(function () { return null; });
    }).then(function (body) {
      // The order in the car, learned HERE and not from the next reading.
      //
      // This is the moment the destination is on the phone: the driver has
      // just accepted, the card is gone from the mount, and they pressed the
      // button that says so. But `holdingNow` was only ever set from a reading
      // — and there is no reading, because there is no card. So Drop and
      // ⌖ Dropoff stayed hidden until the NEXT offer arrived, by which point
      // the phone is showing that offer and pressing ⌖ Dropoff photographs the
      // wrong screen. The one feature that exists for the 18% of cards naming
      // no address could not be reached on the path it was built for.
      //
      // Believing the server rather than the press, like Drop below: the mark
      // may have been refused, or the hold may already have expired on the
      // server's own clock, and a button for an order that is not there is
      // worse than no button.
      if (body && typeof body.holding === 'boolean') {
        if (holdingNow && !body.holding) destSaid = '';
        holdingNow = body.holding;
        // The mark reply says only whether an order is held, not where it
        // ends. Cleared rather than kept: a stale end belonging to the last
        // order would tint the button for a job that is finished.
        heldEnds = undefined;
        showDrop();
        showDest();
      }
    }).catch(function () {
      /* The record is the point; a failed write must not look like a success. */
      tookFailed = true;
    }).then(function () {
      tookBusy = false;
      showTook();
      // The count on the status row is about to be wrong by one. Marking is the
      // only thing on this screen that changes it, so it is also the only time
      // it is worth asking again off the timer — and leaving it until the next
      // slow poll would mean pressing "took it" and watching the number beside
      // it not move.
      loadShift();
    });
  });

  // --- the order in the car ------------------------------------------------
  //
  // Held by the server, not here. Several panels may be open — the dashboard,
  // a phone, a laptop indoors — and an order tracked per page would have each
  // of them measuring the next offer against a different job, or against none.
  //
  // The button only appears while there is one to put down. A control for a
  // state you are not in is a control that teaches people to ignore the bar,
  // and this bar is the one a driver reaches for without looking.
  var holdingNow = false;
  // ...and whether the rig knows where it ENDS, which is a different question
  // and the one that decides whether the dropoff button is worth pressing.
  //
  // An offer card names where a delivery ends on only some cards — 106 of this
  // driver's 604 print a merchant and no address — so the order in the car
  // often has no end the geography check can use, and half of all pairs get no
  // verdict on where they finish. The button that fixes that is in the bar
  // already, and it looked identical whether pressing it would change the
  // answer or not.
  //
  // `undefined` while nothing is held; a string or null once something is.
  var heldEnds;
  var dropBusy = false;
  var dropFailed = false;
  // What the failed press was about, so the failure can be forgotten when the
  // car is carrying something else. A refused Drop leaves the order where it
  // was, so "the hold went away" is not the signal — the order that failed to
  // go down is still there, and the next thing to happen is a DIFFERENT order
  // being picked up. The card has no id for a hold, so the figures it does
  // print stand in for one.
  var dropFailedFor = null;
