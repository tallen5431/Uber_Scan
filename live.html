      // branch to those and leaves every other heartbeat, a not-ready reading
      // and an offer line exactly where they were: none of them says anything
      // about the order in the car, so none of them may change it.
      if (msg.ready || (msg.holding !== undefined && msg.ready === undefined)) {
        // An order ending is what clears the destination read for it. Without
        // this, `destSaid` outlived its order: press Drop, or let the server's
        // own clock expire the hold, accept the next job, and the button came
        // back reading the PREVIOUS order's address with "press again to read
        // it afresh" — for an order whose destination has never been scanned,
        // so the driver has no reason to press it.
        if (holdingNow && !msg.holding) forgetDest();
        // A different order in the car is a different write. `dropFailed` is
        // about the press that failed, not about this job, and left standing
        // it painted the NEXT order's button "Drop · failed" the moment that
        // order appeared — a failure reported for something nobody had tried
        // yet. See tookFailed above, which was the same fault on the same bar.
        if (dropFailed && holdSignature(msg.holding) !== dropFailedFor) {
          dropFailed = false;
          dropFailedFor = null;
        }
        setHeldFrom(msg.holding || null, msg);
        showDrop();
        showDest();
        // ...and Took, whose "in car" face is about the hold (heldAgain).
        showTook();
      }
      // The destination, arriving seconds after the button was pressed. Its own
      // message, carrying no verdict: there is no offer on the screen it was
      // read from, there is a navigation app, so it must not be able to stand
      // in for a reading. `line` is what the driver reads to tell whether the
      // scan caught the right screen.
      if (msg.dropoff && msg.dropoff.line) {
        // ...except one filed onto the CARD being screened with an order in
        // the car (server.js pressBetween), which comes with that card: the
        // card's own chip says where it went ("END · from ⌖"), and the button
        // stays the order's. Green here says the order in the car has its
        // end; taken from a press the card was given, it would go green over
        // an order with none and stop asking for one — `wants` is gated on
        // !destSaid — until the next card cleared it.
        var ontoCard = holdingNow && msg.offer && msg.offer.dropoff === msg.dropoff.line;
        if (!ontoCard) destSaid = msg.dropoff.line;
        destFailed = false;
        destStore = null;
        destBusy = false;
        showDest();
      } else if (msg.dropoff && msg.dropoff.refused && msg.dropoff.asked) {
        // A press the order in the car refused: the phone showed the store
        // (see destStore). Answered, so not "reading…"; not green, because
        // nothing was read for the order; not "not read", because something
        // was, and it was the restaurant's.
        destStore = { why: msg.dropoff.refused, kept: msg.dropoff.kept || null };
        destFailed = false;
        destBusy = false;
        showDest();
      } else if (msg.dropoff && msg.dropoff.found === false
                 && msg.dropoff.asked) {
        // The window closed with nothing on it, which is an ANSWER.
        //
        // This was the only control on the bar that could not report its own
        // failure. The rig emitted only when it found an address, so a press
        // that found none produced no message at all, and the page's own timer
        // put the button back exactly as it was — the driver tapped the
        // address open on their phone, pressed, waited, and got the same grey
        // button whether it had worked or not. Took says "not saved", Drop
        // says "Drop · failed".
        //
        // It is answered from the RIG and not from a timer here, and that is
        // the whole reason this branch exists rather than a setTimeout. A read
        // that started inside the window still counts, and a read has been
        // measured at 5.9s, so an address can land six seconds after the
        // window shut. A page that gave up on its own clock would print "not
        // read" and then be corrected by a green address a moment later, which
        // is a worse fault than the silence it was curing.
        //
        // `asked` only: an unprompted sighting finding nothing is not the
        // answer to a question anybody asked.
        destFailed = true;
        destBusy = false;
        showDest();
      }
      // ...and a press that read Uber's Trip Planner, which is an answer of
      // its own: the stops, in order, whether or not one of them could be
      // given to the order in the car. When one could, a `dropoff` line comes
      // after it and the branch above turns the button green exactly as for
      // any address; when none could, the line carries the scanner's reason,
      // and the rig says no "not read" over the stops either. Either way the
      // press is answered, so the button stops saying "reading…".
      if (msg.planner && Array.isArray(msg.planner.stops)) {
        plannerSaid = { stops: msg.planner.stops, unfiled: msg.planner.unfiled || null };
        if (holdingNow) heldPlan = { of: heldOwner(), stops: msg.planner.stops };
        destFailed = false;
        destBusy = false;
        showDest();
      }
      /* ...and the map, if that is what the pane is showing.
       *
       * ONE call, after every branch above has had its say. It was two — one
       * where the card lands, one where the held order does — and both halves
       * of the picture are set by different branches: the card's ends up
       * there, the order in the car down here. A message carrying both ran the
       * first call while `holdingNow` and `heldEnds` still held the LAST
       * order's, so the map was drawn against a hold that had already ended,
       * and the second call then hit the busy guard and did nothing. It
       * corrected itself a beat later through the catch-up in showMap's
       * finally, which is a bug fixing itself by accident.
       *
       * It also made the second call unreachable in every message shape the
       * server actually sends, so deleting it changed nothing that any test
       * could see — which is how a rule ends up with no check on it at all.
       *
       * A no-op unless the places actually changed, so a card re-read forty
       * times over is one drawing and no new lookups. */
      if (viewMode === 'map') showMap();
      // ...and the dot, which moves with every beat while the pins do not.
      // The map goes after it only at its edges: see drawHere.
      if (msg.gps !== undefined) drawHere();
      render();
      showConnection();
    };
    src.onerror = function () {
      socketUp = false;
      showConnection();
    };
  }

  // Seed from the current state so a fresh tab is not blank until the next read.
  //
  // Aged, not adopted. `readAt` and `seenAt` start at "now" because loading the
  // page is hearing something — but what this seeds is a reading that may be
  // hours old, and starting its clock at zero paints a dead rig's last ACCEPT
  // at full confidence for twelve seconds and leaves it unlabelled for twenty.
  // On the one screen whose whole job is a verdict, that is the confidently
  // wrong number this project exists to avoid, and it happens on every load.
  //
  // The server sends how old it is rather than when it happened, because a Pi
  // has no real-time clock and subtracting its idea of now from this browser's
  // is exactly the arithmetic the message handler below already refuses to do.
  fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
    if (s.last) {
      last = s.last;
      readAt = Date.now() - age(s.lastAgeMs);
      if (s.last.ready) cardReadAt = readAt;
    }
    // ...and the same for having heard from the scanner at all. Without this a
    // page loaded against a stopped scanner showed a live connection dot over
    // a frozen picture, because the fetch that proved the *web server* was up
    // was taken as proof the camera was.
    if (s.heardAgeMs !== undefined && s.heardAgeMs !== null) {
      seenAt = Date.now() - age(s.heardAgeMs);
    } else if (s.last) {
      seenAt = readAt;
    }
    if (s.status) phase = s.status;
    // The offer on record survives a reload and a dropped socket, which is the
    // normal case rather than the odd one: the driver accepts on the phone, the
    // card goes, and only then do they look at this screen.
    if (s.offer && s.offer.id) {
      onRecord = s.offer;
      // ...and whether it has already been marked. Without this the button was
      // page-local: mark an offer, reload the panel, and it offered to mark it
      // again while the count on the status row had already counted it — two
      // figures forty pixels apart disagreeing about the same act.
      tookState = !!s.offer.accepted;
      // ...and how old it is, as a duration: see tookAge.
      recordAt = typeof s.offerAgeMs === 'number' && s.offerAgeMs >= 0
        ? Date.now() - s.offerAgeMs : null;
      showTook();
    }
    // ...and so does the order in the car. A panel opened mid-delivery — which
    // is exactly when a second app's offer arrives — would otherwise show no
    // way to put it down, and no sign that anything was being carried.
    setHeldFrom(s.holding || null, s);
    // ...and a chooser the server has open, so a reload mid-question asks it.
    if (s.chooser) openChooser(s.chooser);
    showDrop();
    showTook();
    // ...and what it was read as, so a panel opened or reloaded mid-delivery
    // shows the destination already scanned rather than offering to scan one
    // that is on the record. Only a SCANNED one: a dropoff that came off the
    // offer card is a cross-street the card printed, not an answer to this
    // button, and showing it here would say the question had been asked.
    if (s.holding && s.holding.dropoffScanned && s.holding.dropoff) {
      destSaid = s.holding.dropoff;
    } else if (!s.holding) {
      forgetDest();
    }
    // ...and the Trip Planner's stops, with the scanner's reason for filing
    // none of them: the server keeps the ones a press read while this order
    // was in the car, and drops them at the moments this page forgets them
    // (forgetPlanner in server.js). A planner read with nothing held was
    // shown and not kept, like an address read with nothing held, so a reload
    // does not bring it back.
    var heldPlanner = s.holding && s.holding.planner;
    if (heldPlanner && Array.isArray(heldPlanner.stops)) {
      plannerSaid = { stops: heldPlanner.stops, unfiled: heldPlanner.unfiled || null };
      heldPlan = { of: heldOwner(), stops: heldPlanner.stops };
    }
    showDest();
    scannerState = s.scanner || null;
    render();
    showConnection();
  }).catch(function () {});

  /* The camera view, streamed where that works and polled where it does not.
   *
   * This used to fetch a still, wait for it, wait a further 60ms and fetch
   * again — measured at 13.7 distinct frames a second against a scanner
   * producing 30, with a request, a file read, a response and a decode for
   * every one of them whether or not the picture had changed. The driver
   * watches this panel to decide whether to press Accept, so the lag between
   * the phone changing and the screen showing it is the whole quality of it.
   *
   * A multipart stream holds one connection open and the server writes a part
   * only when the frame is actually new: measured at 29.0 distinct frames a
   * second on the same rig, which is the writer's own rate. Polling is kept as
   * the fallback because a stream is one more thing that can fail — a proxy
   * that buffers it, a browser that will not render it — and a still that
   * arrives slowly beats a picture that never appears. */
  var view = document.getElementById('view');
  var viewNote = document.getElementById('viewNote');
  var viewWrap = document.getElementById('viewWrap');
  /* Which picture to ask the rig for. The scanner reads this off the same
     file that tells it somebody is watching, so it travels on the request for
     a frame rather than in a call of its own — see touchWatchFile in
     server.js. It is a query parameter and not a header because the <img> tag
     is what makes these requests, and an <img> cannot set a header. */
  var VIEW_KEY = 'uberscan.liveView';
  /* Three things this pane can be, cycled by one button.
   *
   *   screen — the phone's own display, flattened. What the driver reads the
   *            card off, and what lets them check the rig's figures against
   *            what the card actually said.
   *   scene  — the whole cabin with the calibrated corners on it, which
   *            answers "is the mount aimed right?". A question you ask once,
   *            while setting the rig up.
   *   map    — where this offer's ends are, against where the car is and where
   *            the order already in it is going.
   *
   * A mode on the existing control rather than another button: the bottom bar
   * holds six, and the fullest state already has six in it. A third mode costs
   * no columns at all.
   *
   * The phone, unless the driver has said otherwise. During a shift the screen
   * is being used to read and work the phone through, and in the scene view
   * the phone is about a third of a 640px-wide thumbnail of a car interior.
   */
  var viewMode = 'screen';
  try {
    var stored = localStorage.getItem(VIEW_KEY);
    if (stored === 'screen' || stored === 'scene') viewMode = stored;
  } catch (e) { viewMode = 'screen'; }

  /* Which picture to ask the rig for. In map mode there is no picture: the
     frame requests stop, which is also what tells the scanner nobody is
     watching. Asked for `screen` anyway when the value is wanted, because the
     map is not a third thing the rig can photograph. */
  function streamUrl() {
    return '/api/frame.mjpeg?view=' + (viewMode === 'scene' ? 'scene' : 'screen');
  }
  var FRAME_GAP = 30;          // a floor for the fallback, so it cannot spin
  var streaming = false;
  var streamTried = 0;
  var framePending = false;
  var watchdog = null;
  // Whether the stream was running when the map took the pane, so it can be
  // put back rather than silently demoted to stills.
  var wasStreaming = false;
  // One transparent pixel, which is how the <img> is made to let go of an open
  // multipart connection without raising an error the page would read as a
  // camera that has died.
  var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  // The phone view's layout — the picture height-first beside a narrow
  // verdict — is for a portrait picture of a phone. The rig writes a
  // landscape scene while it is aiming, which is what a rig on its first boot
  // does for as long as it takes, and laid out as a phone that picture
  // squeezed the verdict to 153px and the bar's buttons to 24px at 800x480.
  // The class follows the picture, not the button.
  function layoutForFrame() {
    var portrait = view.naturalHeight > view.naturalWidth;
    document.body.classList.toggle('phoneview', viewMode === 'screen' && portrait);
    return portrait;
  }

  function pictureCaption() {
    viewWrap.classList.remove('gone');
    var portrait = layoutForFrame();
    plainNote(viewMode === 'screen'
      ? (portrait ? "the phone's screen, flattened"
                  : 'camera view while the rig finds the phone')
      : 'camera view · inset is what the reader sees');
  }

  function sawAFrame() {
    pictureCaption();
    clearTimeout(watchdog);
    watchdog = null;
  }

  function noFrameYet() {
    // Not while the map is up. `gone` collapses the view column and hands the
    // whole panel to the verdict, and a frame that never arrives — the rig
    // restarting, a camera unplugged — would otherwise take the map down with
    // it and leave the driver looking at a button that says ⛶ Phone over an
    // empty half of screen.
    if (viewMode === 'map') return;
    viewWrap.classList.add('gone');
    plainNote('no camera view yet — the scanner writes one every few seconds');
  }

  function startStream() {
    streaming = true;
    streamTried++;
    view.src = streamUrl();
    // If nothing renders at all, the stream is not working here — whatever the
    // reason — and a still every 30ms is a great deal better than a blank box.
    clearTimeout(watchdog);
    watchdog = setTimeout(function () {
      if (streaming && !view.naturalWidth) fallBackToStills();
    }, 4000);
  }

  function fallBackToStills() {
    streaming = false;
    clearTimeout(watchdog);
    watchdog = null;
    framePending = false;
    refreshView();
  }

  // Chained, not on a timer. A fixed interval asks for the next frame whether
  // or not the last one has arrived, so on a weak signal the requests stack up
  // and the picture gets further behind the longer you watch. Asking again only
  // once the previous frame has landed makes the rate whatever the link can
  // actually carry.
  function refreshView() {
    if (streaming || document.hidden || framePending) return;
    // Nothing is fetched while the map is up. Thirty frames a second down a
    // phone hotspot for a picture nobody can see is the kind of cost that only
    // shows up as a bill, and the same requests are what tell the scanner
    // somebody is watching — see touchWatchFile in server.js.
    if (viewMode === 'map') return;
    framePending = true;
    view.src = '/api/frame.jpg?view=' + (viewMode === 'scene' ? 'scene' : 'screen')
             + '&t=' + Date.now();
  }

  function frameDone() {
    framePending = false;
    if (!streaming && !document.hidden) setTimeout(refreshView, FRAME_GAP);
  }

  view.addEventListener('load', function () {
    // The blank pixel that closed the stream is a load like any other, and
    // taken as a frame it would rewrite the caption — over a map — to say the
    // phone's screen was on the glass. So the caption is skipped.
    //
    // The CHAIN is deliberately not stopped here. Returning outright was the
    // obvious thing and it made the rule live in two places: frameDone was
    // never reached, so refreshView's own guard could not fire, and a check
    // that cannot fire is not a check — it survived every mutation because
    // nothing could reach it. Falling through means the guard in refreshView
    // is the single place "no frames while the map is up" is decided, and it
    // is exercised on every frame that lands after the switch.
    if (viewMode !== 'map') sawAFrame();
    if (!streaming) frameDone();
  });
  view.addEventListener('error', function () {
    // No guard on the map here, deliberately. noFrameYet is what adds `gone`
    // and so what would take the map down, and it refuses to on its own — a
    // second test for the same thing in front of it meant neither could be
    // checked: delete either one and the other still caught it, so nothing in
    // the suite could tell whether the rule was there at all.
    if (streaming) {
      // The connection dropped, or this browser will not render the stream.
      // One retry, because a scanner restarting underneath it is the ordinary
      // cause and it comes straight back; after that, stills.
      if (streamTried < 2) return startStream();
      noFrameYet();
      return fallBackToStills();
    }
    noFrameYet();
    frameDone();
  });

  startStream();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      // A stream to a hidden tab is bytes and CPU spent on nobody.
      if (streaming) { streaming = false; view.src = ''; }
      return;
    }
    // ...and a tab that comes back to a map must not start a stream behind it.
    // The picture is restored by the button, which is the thing that put the
    // map there.
    if (viewMode === 'map') return;
    streamTried = 0;
    startStream();
  });

  // There was a ⟳ Re-find here: a press asked the scanner to forget where it
  // thought the phone was and find it again — and, with a box drawn, to throw
  // the drawn boxes away and go back to finding the screen by itself. On the
  // owner's mount that finds the map, not the card, and they reported that it
  // "tends to get stuck and not let me set it". It was taken off the bar at
  // their request: ▣ Set box is the way to fix the boxes, and the scanner
  // never second-guesses a box a person drew. See AUDITS.md's Settled list.

  // --- 📷 Snap ------------------------------------------------------------
  //
  // A picture of this screen, the camera's last picture and what /api/status
  // says, kept on the rig in a folder to be shared — see takeSnap in server.js.
  // The screenshot is taken by the rig's desktop, not by this page, so it is
  // the panel as it was painted: including this control saying "📷 …", which
  // is the honest picture of the moment it was pressed.
  //
  // The answer is said on the control, and it is the server's own line, not a
  // second wording of it: "saved", or "saved — no screenshot: grim is not
  // installed". A press that keeps less than it was asked to and says only
  // "saved" is the second fault class, met on the one control whose whole job
  // is to keep evidence.
  //
  // Through ask(), so a request that hangs comes back. Every control on the bar
  // learned that the hard way (see POST_TIMEOUT_MS); this one starts with it.
  var snapBtn = document.getElementById('snap');
  // The label as the markup writes it — the word in a span of its own, which
  // the stylesheet does not paint and a screen reader still reads. See #snap.
  function snapLabel() {
    var word = document.createElement('span');
    word.className = 'word';
    word.textContent = ' Snap';
    snapBtn.textContent = '📷';
    snapBtn.appendChild(word);
  }
  // How long the answer stays before the label comes back. This can be a
  // sentence, read from the driving seat. The
  // last answer stays on the title after the words go, so a mouse resting on
  // the control can still ask what the last press kept.
  var SNAP_SAID_MS = 8000;
  var snapBack = null;
  // No "already pressed" guard: the control is disabled while a press is out,
  // and a disabled button is sent no click — by the mouse, Enter, Space or
  // .click() — so a guard here could never be reached. rpi/test_dashboard.py
  // presses it again while the first is out and counts the POSTs.
  snapBtn.addEventListener('click', function () {
    clearTimeout(snapBack);
    snapBtn.disabled = true;
    snapBtn.classList.remove('said', 'failed');
    snapBtn.textContent = '📷 …';
    ask('/api/snap', { method: 'POST' })
      .then(function (r) {
        return r.json().then(function (body) { return { ok: r.ok, body: body || {} }; },
                             function () { return { ok: false, body: {} }; });
      })
      .then(function (got) {
        if (got.ok && got.body.ok && typeof got.body.said === 'string') {
          return { text: '📷 ' + got.body.said, failed: false };
        }
        return { text: '📷 not saved: ' + (got.body.error || 'the rig refused it'),
                 failed: true };
      }, function () {
        // The deadline, or no network at all. Whether the rig kept anything is
        // exactly what this page cannot know, so it says the one thing it can:
        // nothing answered. "Not saved" would be a guess, and a wrong one
        // whenever the rig was merely slow to reply.
        return { text: '📷 no answer from the rig', failed: true };
      })
      .then(function (said) {
        snapBtn.textContent = said.text;
        snapBtn.title = said.text;
        snapBtn.classList.add('said');
        snapBtn.classList.toggle('failed', said.failed);
        snapBtn.disabled = false;
        snapBack = setTimeout(function () {
          snapLabel();
          snapBtn.classList.remove('said', 'failed');
          snapBtn.title = '📷 Snap: keep a picture of the rig\'s own screen, on the rig. Last time: '
                        + said.text.replace(/^📷 /, '');
        }, SNAP_SAID_MS);
      });
  });

  // --- which picture ------------------------------------------------------
  //
  // Remembered, because it is a property of how this rig is used rather than
  // of this page load. A driver reading the phone off this display through a
  // bluetooth mouse is doing that for the whole shift, and having to press a
  // button again every time the page reloads is the kind of small tax that
  // ends with the feature unused.
  var viewModeBtn = document.getElementById('viewMode');
  var liveMap = document.getElementById('liveMap');

  // screen → scene → map → screen. The label says what pressing it gets you,
  // not what you are looking at, which is the rule the two-way version already
  // kept.
  var NEXT = { screen: 'scene', scene: 'map', map: 'screen' };
  var LABEL = { screen: '⛶ Scene', scene: '⛶ Map', map: '⛶ Phone' };

  function applyViewMode() {
    var onMap = viewMode === 'map';
    liveMap.hidden = !onMap;
    view.hidden = onMap;
    layoutForFrame();
    // Still a mode rather than a navigation, and still pressed when it is not
    // showing the ordinary picture: the phone's screen is this panel's resting
    // state and both of the others are a departure from it.
    viewModeBtn.setAttribute('aria-pressed', viewMode === 'screen' ? 'true' : 'false');
    viewModeBtn.textContent = LABEL[viewMode];
    if (onMap) {
      // `gone` hands the whole panel to the verdict, which is right when there
      // is no picture and wrong when the pane has a map in it.
      viewWrap.classList.remove('gone');
      // A fresh Map view frames where the dot is NOW, once. See hereAnchor.
      hereAnchor = null;
      hereWanted = true;
      // ...and the pins, whatever card they are (fitWanted), and asks for
      // a Leaflet that would not load again now (leafletFailedAt).
      fitWanted = true;
      leafletFailedAt = 0;
      // ...and follows it again, whatever a hand on the map did last time.
      following = true;
      showMap();
    } else if (!viewWrap.classList.contains('gone')) {
      // The picture's caption, and not sawAFrame: that is a frame's own news,
      // and it stands the stream's watchdog down. Called here at boot, before
      // the stream had sent anything, it cleared the four-second fallback
      // startStream() had just set, so a stream that never delivered — a
      // proxy that buffers it — never fell back to stills and the pane stayed
      // empty. Measured with the stream left unanswered: one stream request
      // in eight seconds and no still.
      pictureCaption();
    }
    drawHere();
  }

  viewModeBtn.addEventListener('click', function () {
    viewMode = NEXT[viewMode] || 'screen';
    // The map is deliberately NOT remembered. Switching to it is what asks a
    // public geocoder about places customers live, and a remembered map mode
    // would make the next page load ask without anybody pressing anything —
    // which moves that decision away from the person whose decision it is.
    // The two pictures are remembered exactly as before.
    try {
      if (viewMode !== 'map') localStorage.setItem(VIEW_KEY, viewMode);
    } catch (e) { /* private mode */ }
    applyViewMode();
    // The mode rides on the request for a frame, so the rig does not hear
    // about it until the next one is asked for. A stream is one request that
    // never ends — it would go on delivering the old picture until something
    // else restarted it — so it is restarted here.
    if (viewMode === 'map') {
      // A multipart stream is one request that never ends, and left open
      // behind a hidden <img> it goes on pulling thirty frames a second down a
      // phone hotspot for a picture nobody is looking at. Pointing the element
      // at a blank pixel is what actually closes the connection; dropping the
      // src attribute does it too and fires an error, which this page reads as
      // a rig that has stopped.
      wasStreaming = streaming;
      streaming = false;
      framePending = false;
      view.src = BLANK;
    } else if (wasStreaming) {
      // Back to a picture, and back to the stream if that is what it was —
      // otherwise one trip through the map would leave the panel on stills for
      // the rest of the shift, at 30ms a frame instead of the writer's rate.
      wasStreaming = false;
      startStream();
    } else if (streaming) startStream();
    else refreshView();
  });

  /* --- the map mode --------------------------------------------------------
   *
   * WHAT THIS IS FOR, in the driver's own words: "it would also be helpful to
   * have the map view so I can visually see the route as well as how they may
   * chain together and if it makes sense to pickup the second offer since it
   * would be mostly along the route I am going anyways."
   *
   * So the picture is: where the car is, where the order already in it is
   * going, and where this new one starts and ends. Four points and the lines
   * between them answer a question the card's own words cannot — ENDS ? is the
   * chip on about half of real pairs, because most cards name no destination
   * until you accept.
   *
   * WHAT IT IS NOT ALLOWED TO DO. Read the header of map-view.js. Nothing
   * computed from a geocoded point may become a rate, a verdict or a billed
   * distance on this panel; the whole project refuses a number that is
   * confidently wrong and silent. The one figure that leaves this function is
   * the detour, and it is stated under the pins it was computed from, on a map
   * the driver pressed a button to open, in straight-line miles that are named
   * as straight-line miles — or, with the NucBox's router set, road miles named
   * as road miles, over the same three points. It never touches #perHour, the
   * verdict, or the stack line. The card says the same answer in one line of
   * its own beside them (showWay, "the answer on the card"), and that is the
   * only other place it goes.
   *
   * AND THE PUBLIC MAP IS ASKED NOTHING UNTIL THE BUTTON IS PRESSED. Some of
   * these places are where customers live, and switching to this mode is the
   * press that decides they go to a geocoder the driver does not own — the
   * same gate as "Place them on a map" on the map page. It is deliberately not
   * remembered, so a reload cannot ask on nobody's behalf. The NucBox at home
   * is the driver's own box and is asked without it, for the figure's own
   * places only: by server.js for the held order's end and pickups
   * (searchHeldEnd), and by the card's line for the screened card (wayWalk). */
  var MV = window.MapView;
  var mapGeo = null;
  // The NucBox's search and router, through this rig's server; made the
  // first time a walk finds either set (MV.NbxSearch, and showMap below).
  var mapNbx = null;
  var theMap = null, mapLayer = null;
  // Which set of places is drawn, so a card re-read forty times a second does
  // not re-draw forty times, and so an answer that arrives after the driver
  // has moved on is thrown away rather than pinned under the new card's
  // heading.
  var mapFor = null;
  var mapBusy = false;

  /* WHEN the view is fitted to the pins: for a new card, and on ⛶ Map, and
     not otherwise. Every walk fitted, and a walk follows every change of
     the key — a pickup visited, a Trip Planner read, a second order taken —
     so between offers, following the car, a visit pulled the view back to
     the last card's pins and the follow pulled it back to the car: measured
     at zoom 14 on the car, then at zoom 12 about 1.4 mi off on the beat
     after the visit. `fitFor` is the card the view was last fitted to;
     `fitWanted` is the press, until a walk or the same-key path below has
     answered it. */
  var fitFor = null;
  var fitWanted = false;

  /* Leaflet that would not load, and when to ask for it again: on ⛶ Map, or
     once LEAFLET_AGAIN_MS has passed. Every message used to ask — a beat
     every four seconds, a reading three times a second — and with the CDN
     unreachable 60 beats made 120 requests (MV.needLeaflet now takes its
     tags out of <head> again). A minute is chosen, not measured: a dead
     spot at a red light is over by then, and the press is always there. */
  var LEAFLET_AGAIN_MS = 60000;
  var leafletFailedAt = 0;
  var NO_LEAFLET = 'no signal — the map needs it for both its code and its '
                   + 'tiles. ⛶ Phone puts the picture back.';

  /* Whether the card on the record is still Map view's to draw: while its
     reading is fresh by the verdict's own rule, READ_STALE_MS since the last
     reading that carried it (`cardReadAt`). Between offers the full-width
     map went on showing the last card's pins and its figure for as long as
     nothing replaced it, with no age on either — a detour measured from
     where the car WAS when that card came up, read at a glance as one about
     now. Dropped rather than aged: the caption's two rows are spent on the
     figure and its hedges, and an age on them would be a third thing for a
     glance to read; the card's age is on the Took button already. What
     stays is the order in the car, whose run is the map's job between
     offers, and the caption says the card has gone. */
  var cardReadAt = 0;
  // Where the held order's run was last started with no card's fix
  // (MV.routeFrom, mapWants): { at, leg } or null.
  var routeKept = null;
  function cardOnMap() {
    return !!onRecord && Date.now() - cardReadAt <= READ_STALE_MS;
  }
  var NO_CARD_UP = 'no card up — nothing to put on a map';
  var NO_CARD_HELD = 'no card up — only the order in your car';

  /* The words under the map, and the last of them that described what is
     drawn. `lastLine` is not simply the last thing said: "looking up 3
     places…" describes a map that is not there yet, and re-stating it on a
     drawn map would be a second way of saying nothing. Only mapDrew writes it. */
  var lastLine = '';
  var lastBounds = null;

  /* YOU ARE HERE. The heartbeat's newest fix, as a dot with a circle the size
     of the GPS's own error estimate, and the label in the map's corner. What
     to draw is MV.hereDot's decision, shared with map.html; the gate behind it
     is rpi/gps.py's, and nothing here asks it again.

     THE MAP FOLLOWS THE DOT AT ITS EDGES, NOT ON EVERY BEAT. The driver
     asked for it ("visually it would be best for me to know it is working
     right"), over the earlier rule that it never followed because nobody
     had measured the tiles. Entering Map view fits the view to the pins
     and where the dot was then (`hereAnchor`); after that a fresh dot that
     leaves the middle FOLLOW_MIDDLE of the map in either direction is
     panned back to the centre, at the zoom the map is at. Inside the middle
     nothing moves, so the Pi redraws the map every half mile or so and not
     on every beat. Measured with Leaflet 1.9.4 in the 1024x600 panel's map
     (500x472), a beat every 0.05 mi (four seconds at 45 mph) along three
     straight 10 mi lines out of Marietta Square: 5 to 7 pans at zoom 13, 10
     to 14 at 14, 20 to 28 at 15, against 200 for a pan on every beat. The
     TILES are nearly the same either way — 0.8 to 1.4 new tiles a mile at
     zoom 13, 2.1 to 3.2 at 14, 3.0 to 6.0 at 15, plus 6 to 9 for the view
     on the way in, where a pan on every beat is the same or at most 0.4 a
     mile more — because a strip of map along the road is the same tiles
     however it is panned through. What a tile weighs was not measured: this
     machine's proxy refuses tile.openstreetmap.org. A grey dot is where the
     car WAS and a refused fix is no position, so neither moves the map.

     A hand on the map pauses it. Leaflet says `dragstart` only for a drag,
     and `zoomstart` for every zoom, the page's own fits included, so the
     page's moves go through moveMap and a zoom inside one is not the
     driver's. Paused, the corner says FOLLOW_PAUSED after the age, and
     nothing but ⛶ Map round again — the press that already re-frames the
     view — starts it again. No control for it on the bar: there are six,
     and a seventh is settled against. */
  var hereLayer = null;
  var hereAnchor = null;
  var hereWanted = false;
  var hereNote = document.getElementById('hereNote');
  // The key to how each place was found; see drawHow.
  var mapKey = document.getElementById('mapKey');
  // ...and what one of those marks says, while it is pointed at; see tipOn.
  var mapTip = document.getElementById('mapTip');
  // What is drawn now — position, error and grey — so the once-a-second tick
  // that ages the label does not take the dot down and put it back each time,
  // closing its popup under the driver's pointer.
  var hereKey = '';
  // The share of the map's width and of its height, centred, a fresh dot may
  // wander in before the view goes after it.
  var FOLLOW_MIDDLE = 0.6;
  var FOLLOW_PAUSED = ' · not following';
  var following = true;
  // Where the dot was when the follow last looked at it, or a fit last
  // framed it. The follow asks only of a dot that has MOVED since: a fit
  // that left the car near the edge of the pins is the frame the driver
  // pressed for, and the once-a-second tick that ages the label is not the
  // car going anywhere.
  var herePos = '', judgedPos = '';
  // Until when a zoomstart is the page's own: a second past its last fit or
  // pan. Leaflet fires a fit's zoomstart a frame AFTER the call, inside a
  // 250ms animation, so a flag cleared on moveend was not enough: entering
  // Map view fits twice back to back, the first fit's moveend cleared the
  // flag, and the second fit's zoomstart paused the follow before it had
  // moved once. A deadline cannot be left standing by a move that never
  // ends; the cost is that a hand zooming within a second of the page's
  // own fit leaves the follow on.
  var OWN_MOVE_MS = 1000;
  var ownUntil = 0;

  function moveMap(how) {
    ownUntil = Date.now() + OWN_MOVE_MS;
    how();
  }

  /* Once, when the map is made: what tells a hand on the map from the page. */
  function watchHands(map) {
    map.on('dragstart', function () { following = false; drawHere(); });
    map.on('zoomstart', function () {
      if (Date.now() > ownUntil) { following = false; drawHere(); }
    });
  }

  /* The pins, and the dot's position when this Map view was entered (or
     last followed), if it had one: the fit every new card's map makes, and
     the one ⛶ Map makes on the way in. */
  function fitView(pins) {
    var b = hereAnchor ? pins.concat([hereAnchor]) : pins;
    judgedPos = herePos;
    if (b.length > 1) moveMap(function () { theMap.fitBounds(b, { padding: [34, 34] }); });
    else if (b.length) moveMap(function () { theMap.setView(b[0], 13); });
  }

  /* A fresh dot that moved outside the middle of the map, while nobody has
     taken it: the view goes to the dot at the zoom it is at. */
  function followDot(d) {
    if (herePos === judgedPos) return;
    judgedPos = herePos;
    if (!following || d.grey) return;
    var size = theMap.getSize();
    var at = theMap.latLngToContainerPoint([d.lat, d.lon]);
    var edge = (1 - FOLLOW_MIDDLE) / 2;
    if (at.x >= size.x * edge && at.x <= size.x * (1 - edge)
        && at.y >= size.y * edge && at.y <= size.y * (1 - edge)) return;
    hereAnchor = [d.lat, d.lon];
    moveMap(function () { theMap.panTo([d.lat, d.lon]); });
  }

  function drawHere() {
    var onMap = viewMode === 'map' && !!theMap;
    var d = onMap && MV && gpsNow ? MV.hereDot(gpsNow.fix, Date.now() - gpsAt) : null;
    setHidden(hereNote, !d);
    setText(hereNote, d ? (d.line || d.label + (following ? '' : FOLLOW_PAUSED)) : '');
    hereNote.classList.toggle('grey', !!(d && d.grey));
    if (!theMap) return;
    var key = d && !d.line ? [d.lat, d.lon, d.err, d.grey].join('|') : '';
    herePos = key ? d.lat + ',' + d.lon : '';
    if (key !== hereKey) {
      hereKey = key;
      if (hereLayer) { theMap.removeLayer(hereLayer); hereLayer = null; }
    }
    if (key && !hereLayer) {
      hereLayer = L.layerGroup().addTo(theMap);
      var colour = d.grey ? '#8a8f98' : '#38bdf8';
      // The circle is the GPS's own estimate in metres, not a promise: gpsd
      // calls its certainty unknown. It is what the receiver claimed, drawn.
      L.circle([d.lat, d.lon], {
        radius: d.err, weight: 1, color: colour, opacity: .8,
        fillColor: colour, fillOpacity: .12, dashArray: d.grey ? '4 5' : null
      }).addTo(hereLayer);
      // The age is the corner's to say; a popup is opened once and read later.
      L.circleMarker([d.lat, d.lon], {
        radius: 7, weight: 3, color: '#ffffff', fillColor: colour, fillOpacity: 1
      }).bindPopup('<b>you are here</b><br>±' + Math.round(d.err) + ' m')
        .addTo(hereLayer);
    }
    /* The one fit, and only on the first draw of this Map view whatever it
       found. Waiting for a dot instead left hereWanted standing when the view
       was entered with no fix, so the first fix to come in — minutes later,
       after the driver had panned to look at something — pulled the view
       back to it: a fit on a beat, the pins and the zoom thrown away for the
       car. With no dot at entry there is nothing to include, and ⛶ Map round
       again is the press that frames it. Every draw after the first follows
       the dot instead, at the edges and the zoom it finds — and not at all
       once the driver has panned. */
    if (hereWanted) {
      hereWanted = false;
      if (key) {
        hereAnchor = [d.lat, d.lon];
        fitView(lastBounds || []);
      }
    } else if (key && onMap) {
      followDot(d);
    }
  }

  /* The caption's words. A refusal under the map is a CHIP, the way the
     notices are (showNotes): MV.captionChip makes it off the sentence, and a
     tap on the caption swaps it for the sentence and back — back on its own
     after WARN_OPEN_MS, or when the line changes, so a sentence opened for one
     card is not left on the glass for the next. The figure and the lines that
     say one is coming are written as they are. Without map-view.js there is
     no chip to make and the sentence is the line, as before. */
  var captionSaid = '';
  var captionOpenAt = 0;
  var captionBack = null;

  function mapSay(text) {
    if (text !== captionSaid) { captionSaid = text; captionOpenAt = 0; }
    var open = !!captionOpenAt && Date.now() - captionOpenAt < WARN_OPEN_MS;
    if (!open) captionOpenAt = 0;
    clearTimeout(captionBack);
    if (!MV || !MV.sayCaption) { plainNote(text); return; }
    // Drawn again only when the words or their state move: every message in
    // Map view comes through here with the line it already shows.
    if (drawnAs(viewNote, 'chip\n' + open + '\n' + text)) MV.sayCaption(viewNote, text, open);
    if (open) {
      captionBack = setTimeout(function () {
        if (captionSaid === text) { captionOpenAt = 0; mapSay(text); }
      }, WARN_OPEN_MS - (Date.now() - captionOpenAt));
    }
  }

  // ...and the caption's other writers, the picture's labels: plain words,
  // and nothing left of a chip that was on the row before them.
  function plainNote(text) {
    captionSaid = '';
    captionOpenAt = 0;
    clearTimeout(captionBack);
    // ...and these on every frame of the stills the pane falls back to.
    if (!drawnAs(viewNote, 'plain\n' + text)) return;
    viewNote.textContent = text;
    viewNote.title = '';
    viewNote.classList.remove('chipped', 'open');
    viewNote.removeAttribute('role');
    viewNote.removeAttribute('aria-expanded');
  }

  function toggleCaption() {
    if (!viewNote.classList.contains('chipped') || !captionSaid) return;
    captionOpenAt = captionOpenAt ? 0 : Date.now();
    mapSay(captionSaid);
  }
  viewNote.tabIndex = 0;
  viewNote.addEventListener('click', toggleCaption);
  viewNote.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCaption(); }
  });

  function mapDrew(text) { lastLine = text; mapSay(text); }

  /* The places this offer and the order in the car are about. Kept in one
     place because the KEY is built from it too, and a key that disagreed with
     what was drawn is how a map ends up showing the last card under this
     card's numbers. */
  function mapWants() {
    var card = cardOnMap() ? onRecord : null;
    var o = card || {};
    var held = holdingNow ? (heldEnds || null) : null;
    // ...and the place the phone printed for that end's stop, as the server
    // described the order (heldForPanel `place`): asked by name when the
    // NucBox has the street and not the door (MV.pickPlace, the rule the
    // server pins by). Only for the end the description is of.
    var heldPlace = held && heldSaid && heldSaid.dropoff === held
      && typeof heldSaid.place === 'string' && heldSaid.place ? heldSaid.place : null;
    /* ...and the held order's pickups off its Trip Planner, while it is held:
       the restaurant the driver read with ⌖ was never on this map, so the
       order and the place it is collected from were never seen together
       (the driver: "even after scanning the restaurant it failed to
       associate it"). Guarded for a map-view.js from before them, which
       sw.js can serve this page (see drawHow). Never the order's end: that
       is `held`, off holding.dropoff, and nothing here writes it. */
    var plan = heldPlan && heldPlan.of === heldOwner() ? heldPlan.stops : null;
    // ...and with two orders in the car (carrying two on), the second one's
    // end beside the first's, pinned D2 to the first's D1, in its own card's
    // disc.
    var second = twoHeld() ? heldList[1] : null;
    var held2 = second && second.dropoff && second.dropoff !== held ? second.dropoff : null;
    // ...and only from a map-view.js that measures the figure through them
    // (MV.detourThrough): an older one, which sw.js can serve this page, has
    // a road detour that would take them and measure to the end alone, under
    // a caption saying the restaurant was in it.
    var listed = (holdingNow && plan && MV && MV.heldPickups && MV.detourThrough)
      ? MV.heldPickups(plan).filter(function (p) { return p.q !== held && p.q !== held2; })
      : [];
    // ...less the ones the car has stopped at and left (visitPickups in
    // server.js): off the run and out of the figure, which is then measured
    // from the car to the end, and drawn apart as a faded ✓ (`donePicks`).
    var done = visitedNow();
    var heldPicks = listed.filter(function (p) { return done.indexOf(p.q) === -1; });
    var donePicks = listed.filter(function (p) { return done.indexOf(p.q) !== -1; });
    // ...and the run the two commit the car to (Stage 6, MV.heldRuns): every
    // pickup not yet visited and both ends, in the Trip Planner's own order
    // when one planner places both ends (`planAt` on each order, server.js
    // ordersForPanel), otherwise both ways round. Null with one order, and
    // from a map-view.js from before it (sw.js may serve one): with two in
    // the car that is no figure at all, never a figure through one of them.
    // ...and never with THREE in the car — an original and two Uber add-ons,
    // one trip (server.js placeTook): the run is through two ends, and a
    // figure "incl. both orders" through ① and ② would leave ③ out of the car
    // it is about. No run is "order of stops unknown — no figure" (mapRefusal).
    var runs = held && held2 && heldList.length <= 2 && MV && MV.heldRuns && MV.detourOrders
      ? MV.heldRuns(plan, [{ n: 1, holdId: heldId, end: held,
                             planAt: (heldList[0] || {}).planAt },
                           { n: second.n, holdId: second.holdId, end: held2,
                             planAt: second.planAt }], done)
      : null;
    // ...and the second order with no end on record: no run through both
    // can be drawn, and one through the first alone ignores an order in the
    // car (mapRefusal says so).
    var noEnd2 = !!second && !second.dropoff;
    /* ...and where the held order's run starts when no card's fix starts it
       (between offers, or a card that came up with none): the live fix,
       kept per leg and per ROUTE_MOVE_M (MV.routeFrom), so the run goes car
       -> pickup -> end along the roads, re-asked only when the car has
       moved on or the leg changed — never the straight pickup -> end the
       owner saw on 19 Oct, which was this run with no car in it. Drawing
       only: no figure is measured from it. In the key, so a far move or a
       new leg walks again. */
    var dot = held && MV && MV.routeFrom && gpsNow
      ? MV.hereDot(gpsNow.fix, Date.now() - gpsAt) : null;
    routeKept = dot && !dot.line && !dot.grey
      ? MV.routeFrom(routeKept, dot, [held, held2].concat(heldPicks.map(function (p) {
          return p.q; })).join('|'))
      : null;
    var carNow = routeKept ? routeKept.at : null;
    /* The store's door, when DoorDash's place popup gave this card one while
       it was being screened (server.js popupArrived): searched IN PLACE OF the
       card's name for it, which is a store's name with its street cut off
       ("Fable Pizza ; 1200 Fable Parkway Nort"), so the pin and the figure are
       the door's. A customer's popup needs nothing here: it is the card's
       `dropoff`, filed there as a screening ⌖ press files one, and
       `dropoffFrom` says so. Either one is said as "addr from tap". */
    var tapped = o.pickupAddr && o.pickupAddr.from === 'popup'
      && typeof o.pickupAddr.value === 'string' && o.pickupAddr.value
      ? o.pickupAddr.value : null;
    /* ...and, with no tap, the store's door DoorDash's stops card printed
       under the store's name (the parser's `pickupLine`, "<n> <street>,
       <town>"): searched in place of the name for the same reason. A chain's
       name in the card's disc is every branch — the owner's 17 Oct shift,
       "too many to be sure", no pickup pin and no figure — where the door is
       one place (MV.searchPlan: the house number is the door rule, the town
       is cut at the comma). `o.pickup` stays the name; a string only, so an
       older reading's field of another shape is never searched. */
    var cardDoor = typeof o.pickupLine === 'string' && o.pickupLine ? o.pickupLine : null;
    var pickQ = tapped || cardDoor || o.pickup || null;
    var names = [pickQ, o.dropoff, held, held2]
      .concat(listed.map(function (p) { return p.q; })).filter(Boolean)
      .filter(function (v, i, all) { return all.indexOf(v) === i; });
    return { pickup: pickQ, dropoff: o.dropoff || null,
             // Which of this card's two ends came off a tap, for the pins'
             // words and the figure's.
             tapped: { pickup: !!tapped, dropoff: !!o.dropoff && o.dropoffFrom === 'popup' },
             held: held, heldPlace: heldPlace,
             heldPicks: heldPicks, donePicks: donePicks, names: names,
             // The two cards the line is measured with: this one, whose fix
             // is where the car was when it came up, and the one the order in
             // the car came from, whose own fix and distance its end is
             // checked against. See MV.againstCard.
             card: card, heldCard: held ? heldCard : null,
             heldId: held ? heldId : null,
             held2: held2, heldCard2: held2 ? (second.card || null) : null,
             heldId2: held2 ? (second.holdId || null) : null,
             runs: runs, noEnd2: noEnd2, carNow: carNow,
             // The number each order goes by on the pins: ① and ② by holdId.
             heldNs: heldList.reduce(function (m, x) { m[x.holdId] = x.n; return m; }, {}),
             // The card is part of the key: two cards naming the same places
             // came up in two places, and the figure is measured from each
             // one's own fix.
             //
             // ...and so is which of them is the order in the car. `names` is
             // deduplicated, so a card whose dropoff becomes the held end at
             // ✓ Took names the same places before and after, and the key
             // did not move: the map kept the pin as the CARD's "and drop it
             // here", which the next card took away with it. Measured in
             // rpi/test_dashboard.py, 'held end: the ✓ Took reply's end...'.
             key: names.join('|') + '#' + (o.id || '') + '@' + (held || '')
               // ...and its place, learnt for the same end text.
               + (heldPlace ? '[' + heldPlace : '')
               // ...and the server's pin for it, learnt on a beat (serverEnd).
               + (held && serverEnd(held) ? '!' + heldSaid.endBy : '')
               + (held2 ? '+' + held2 : '')
               // ...and the order of the run through both: a planner read
               // that places both ends moves the run under the same places.
               + (runs ? '>' + runs.runs.map(function (r) {
                   return r.map(function (e) { return e.q; }).join('>');
                 }).join('/') : '')
               // ...and which of its pickups are behind the car: a visit
               // moves the run and the figure under the same places.
               + (donePicks.length ? '~' + donePicks.map(function (p) { return p.q; }).join('|')
                                   : '')
               // ...and where the run starts with no card's fix: it moves
               // only per leg and per ROUTE_MOVE_M (MV.routeFrom).
               + (carNow && !(card && MV.cardFix(card).at)
                 ? '^' + carNow.lat + ',' + carNow.lon : ''),
             // What the NucBox said about these places on this walk: a
             // refusal per place, with the disc it was made in, and why the
             // NucBox could not be asked at all (and the public map was) —
             // and how many it answered before that, so "public map used"
             // is never said of a pin the NucBox gave.
             nbxWhy: {}, nbxDown: null, nbxAnswered: 0,
             // ...and every answer it gave, pinned or not, with its disc:
             // what drawHow draws of how each place was found. The same
             // objects the walk chose from, so drawing asks nothing.
             nbxSeen: {} };
  }

  /* A place name, cut to what fits the caption's cap.
     Every other line under the map is a fixed string this file can be read
     for; this is the one that carries a value, and its bound is the parser's
     MAX_PLACE of 60. At 60 it took four of the two rows the caption has.
     20 is measured, and measured on WIDTH rather than on characters, which
     is the trap: 32 characters of this driver's own real names came out two
     rows, and 32 of the widest characters the font has came out three and was
     clipped — and this branch fires precisely when a name is OCR sludge, so
     the pathological string is the expected input, not the corner. At 20 the
     misread-name line is two rows at 800x480 and three on the 3.5" hat, which
     is the cap on each, for every real place in the owner's week AND for a
     name of twenty W's. Cut on a space where there is one near the end, so
     the driver reads whole words; the ellipsis says the rest was cut, and the
     pin it names is marked on the map beside it either way. */
  var PLACE_SHOWN = 20;

  /* ...and shorter again in the line for a pin a card contradicts, which
     carries two figures and the rig's repair besides the name. At twenty of
     the widest letter both of those lines ran past two rows at 800x480; at
     12 they fit, and the `, past` clause the hat may eat holds the card's
     figure with its hedge, behind "wrong pin for". "McDonald's (Marietta Sq)" is cut on its
     space, to "McDonald's…". Measured by rpi/test_layout.py. */
  var DISC_PLACE_SHOWN = 12;

  function shortPlace(name, cap) {
    var most = cap || PLACE_SHOWN;
    // A held pickup's planner line ends in a comma when its town did not read
    // (MV.heldPickups' mark for "a street"); it is not part of the name.
    var s = String(name == null ? '' : name).replace(/[\s,]+$/, '').trim();
    if (s.length <= most) return s;
    var cut = s.slice(0, most);
    var space = cut.lastIndexOf(' ');
    if (space >= most - 8) cut = cut.slice(0, space);
    return cut.replace(/[\s,]+$/, '') + '…';
  }

  /* Each of `names` asked of the NucBox at home, inside ITS card's disc:
     this card's for its own pickup and dropoff, the held card's for where
     the order in the car is going and where it is collected. A refusal is
     kept with the disc it was made in, so the line under the map can say
     what was searched and what was found.

     Map view's walk and the card's (wayWalk) both ask through here, in the
     same words through the one NbxSearch, so whichever asks second is
     answered from the first one's cache or from its question still in
     flight (MV.NbxSearch.get): a card costs the NucBox what Map view alone
     cost it. Answers land in `found` and on `want` — nbxSeen, nbxWhy,
     nbxAnswered, and nbxDown from the first place the NucBox did not
     answer. Resolves the places it could not ask, that one and every one
     after it, or null once `gone()` says the walk was left. `landed` is told
     after each answer; `post` hands the held order's pins to the server,
     which only Map view's walk does (the server searches them itself,
     searchHeldEnd). */
  async function askNucBox(want, names, here, nbx, found, gone, landed, post) {
    var discs = { card: MV.discFor(want.card), held: MV.discFor(want.heldCard),
                  held2: MV.discFor(want.heldCard2) };
    var left = [];
    for (var n = 0; n < names.length; n++) {
      var q = names[n];
      if (want.nbxDown) { left.push(q); continue; }
      // The held order's pickups are its card's places too, and are
      // searched in its disc as its end is.
      var heldsOwn = q === want.held
        || want.heldPicks.concat(want.donePicks).some(function (p) { return p.q === q; });
      var whose = (heldsOwn && q !== want.pickup && q !== want.dropoff)
        ? 'held' : (q === want.held2 && q !== want.pickup && q !== want.dropoff)
        ? 'held2' : 'new';
      var disc = whose === 'held' ? discs.held : whose === 'held2' ? discs.held2
        : discs.card;
      // `here` for a numberless street's pin: the point of its stretch
      // nearest the car (MV.stretchInDisc), when the street index is set.
      // ...and the held end's place, for its door's search to fall back to
      // (MV.NbxSearch.place). Never posted as the held end: pinHeldEnd sends
      // a door and nothing else, and the server pins a place itself.
      var got = await mapNbx.place(q, disc,            // eslint-disable-line no-await-in-loop
                                   { streets: nbx.streets, car: here,
                                     place: whose === 'held' && q === want.held
                                       ? want.heldPlace : null });
      if (gone()) return null;
      if (got.why === 'unreachable') {
        // Today's path for this place and every one after it, under the
        // same press: one dead NucBox is not three timeouts in a row.
        // Only this: a question the relay REFUSED ('refused') is a bug
        // here, kept below and said as one, never handed to the public
        // map to answer instead.
        want.nbxDown = got.error;
        left.push(q);
        continue;
      }
      // ...and the held end the SERVER pinned (by door, place or short
      // street) where this search found no door: drawn as D, never posted
      // back. The owner, 19 Oct: Map view said "NO PIN" and drew no D over
      // an end the server had armed.
      var theirs = !got.at && whose === 'held' && q === want.held ? serverEnd(q) : null;
      if (theirs) got = theirs;
      found[q] = got.at || null;
      want.nbxAnswered++;
      want.nbxSeen[q] = { res: got, disc: disc, whose: whose };
      if (post) {
        // The END only: a pickup's pin is never sent as the held end.
        if (whose === 'held' && q === want.held && disc) { if (!theirs) pinHeldEnd(want, q, got); }
        // ...the second order's end, under its own name.
        else if (whose === 'held2' && disc) pinHeldEnd({ heldId: want.heldId2 }, q, got);
        // ...and a pickup's pin goes as a pickup, for the restaurant guard.
        else if (whose === 'held' && disc) pinHeldPickup(want, q, got);
      }
      if (!got.at) want.nbxWhy[q] = { res: got, disc: disc, whose: whose };
      if (landed) landed();
    }
    return left;
  }

  /* The detour by road, when the router is set and only when the line would
     state a figure at all: every refusal mapRefusal makes — a pin farFrom or
     a card's disc refuses, no fix, no yardstick, nothing held — stands
     exactly as it does for the straight line, and no point the panel will
     not measure from is sent anywhere. Resolves the router's answer, or
     { why: 'street' }, or undefined where nothing was asked, or WALK_LEFT
     once `gone()` says the walk was left. `measuring` is told just before
     the router is asked. Map view's walk and the card's both ask here. */
  var WALK_LEFT = { left: true };
  async function askRoad(want, found, here, gone, measuring) {
    var j = mapJudge(want, found, here);
    if (mapRefusal(want, found, here, j) !== null) return undefined;
    var road;
    // ...and never to a numberless street's pin: the router measures one
    // point, and the card says the street, not where on it. Its figure is
    // MV.stretchSpan's, over the whole stretch, in straight lines, and the
    // line says why there is no road figure.
    // With the held order's pickups still ahead, through them: the run car
    // -> restaurant -> held end, the new pickup in its best gap
    // (MV.NbxSearch.detour) — two questions a gap, each three points at
    // most, through the same relay and cache.
    if (j.runs) {
      // Two orders in the car: through the run that commits the car to
      // both, each ordering of it when the planner gave none
      // (NbxSearch.detourOrders) — two or three points a question, as ever.
      // mapRefusal has refused a street anywhere in it.
      if (measuring) measuring();
      road = await mapNbx.detourOrders(here, j.pick, j.runs.runs);
    } else if (MV.stretchSpan(here, j.pick, j.held, heldStops(j))) {
      return { why: 'street' };
    } else {
      if (measuring) measuring();
      road = await mapNbx.detour(here, j.pick, j.held, heldStops(j));
    }
    return gone() ? WALK_LEFT : road;
  }

  async function showMap() {
    if (!MV) {
      // map-view.js is same-origin and in the service worker's shell, so this
      // should not happen. A control that does nothing at all, silently, is
      // this project's second named fault, and "should not happen" has never
      // been a reason to leave one in.
      mapSay('map-view.js did not load, so there is no map here.');
      return;
    }
    var want = mapWants();
    var key = want.key;
    if (mapBusy) return;
    if (mapFor === key && theMap) {
      /* Nothing to redraw — but something to SAY. Leaving the map is three
         presses round the cycle, and on the way out sawAFrame rewrites this
         row to "camera view · inset is what the reader sees". Coming back on
         the same card used to return here before any mapSay, so the pins were
         still on the glass under a caption for a picture: the one figure this
         mode exists to produce, gone, with nothing saying so, in the 15px row
         the panel spends on it.

         The view is re-fitted for the same reason. A driver who nudged the
         map with the mouse and lost the pins had no control anywhere that
         brought them back — this button is now that control. */
      mapSay(lastLine);
      theMap.invalidateSize();
      // On the press only. Every message the scanner sends comes through
      // here — a beat every four seconds — and a fit on each pulled the view
      // back over the driver's drag and over the follow's last pan, so the
      // map went to the pins and back to the car on every beat.
      if (lastBounds && hereWanted) fitView(lastBounds);
      // ...which answers the press: a key that moves later is not a press.
      fitWanted = false;
      drawHere();
      return;
    }
    mapFor = key;
    // Fitted on this walk: a new card, or the press (fitFor, above).
    var cardId = want.card ? want.card.id || null : null;
    want.refit = fitWanted || (!!cardId && cardId !== fitFor);

    if (!want.names.length) {
      // The last card's pins must not stay on the glass under this card's
      // numbers. This is the COMMONEST card there is — 129 of the driver's own
      // 272 name no dropoff — so the path that draws nothing is the path that
      // was leaving a green "pick this one up" dot and a drawn route from an
      // offer that is no longer on screen.
      clearMap();
      // Short on purpose, and the budget is now stated where it can be
      // enforced rather than here: `#viewNote` is clamped to two rendered
      // rows on a dashboard panel and three on the 3.5" hat — see the rule in
      // this page's own <style> for why those two numbers and not one. What
      // the clamp cuts is the tail, so every line under it is written with
      // the part a driver acts on first.
      // mapDrew, not mapSay: "there is nothing to draw" describes what is on
      // the glass as truly as a detour does, and it is what coming back to
      // this same card has to be told again. Left as mapSay, re-entry would
      // restate the LAST card's detour over an empty map.
      mapDrew(want.card
        ? 'this card names nowhere yet — ⌖ Scan reads it off your phone'
        : onRecord ? NO_CARD_UP : 'no card read yet — nothing to put on a map');
      return;
    }

    mapBusy = true;
    try {
      if (!theMap && leafletFailedAt && Date.now() - leafletFailedAt < LEAFLET_AGAIN_MS) {
        mapSay(NO_LEAFLET);
        return;
      }
      mapSay('loading the map…');
      var ready = await MV.needLeaflet(document, {
        css: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
        js: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
      });
      // Said plainly rather than left as a grey rectangle. A rig on a phone
      // hotspot in a car has no signal several times a shift and that is the
      // ordinary case, not an error — and ⛶ Phone puts the picture back.
      if (!ready) {
        // Shortened to the cap, not to taste: at its old length this was four
        // rows on the 3.5" hat and lost "the picture back" to the clamp, which
        // is the half that says what to press.
        leafletFailedAt = Date.now();
        mapSay(NO_LEAFLET);
        return;
      }
      leafletFailedAt = 0;
      if (viewMode !== 'map' || mapFor !== key) return;

      if (!theMap) {
        theMap = L.map(liveMap, { zoomControl: true }).setView([33.94, -84.58], 11);
        watchHands(theMap);
        // A tapped mark's words go when the map itself is tapped: on a touch
        // panel there is no pointer to leave the mark. drawHow's marks do not
        // pass their own taps on to the map (bubblingMouseEvents), so this is
        // never the same tap that showed them.
        theMap.on('click', function () { mapTip.hidden = true; });
        // A card's disc is shown only while it is no bigger than the view;
        // every zoom and pan, the page's own fits included, ends here.
        theMap.on('moveend', sizeDiscs);
        // The attribution stays. These tiles are given away on the condition
        // that it does, and a panel being small is not an exemption.
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(theMap);
        mapGeo = new MV.Geocoder({
          // No "near" box on this panel and nothing to type one into at the
          // wheel. The box around the car's own position is the better answer
          // anyway and is what this page uses — see boxFor below.
          hint: function () { return ''; },
          store: {
            get: function () { return localStorage.getItem('uberscan.geocode.v1'); },
            set: function (s) { localStorage.setItem('uberscan.geocode.v1', s); },
            clear: function () { localStorage.removeItem('uberscan.geocode.v1'); }
          }
        });
      }
      // The pane was display:none when the map was made, so Leaflet measured a
      // box of zero and drew one tile in the corner. Asked again now it is on
      // screen, and again after the next frame, because the grid row it lives
      // in is sized from the viewport and is not final within this tick.
      theMap.invalidateSize();
      requestAnimationFrame(function () { if (theMap) theMap.invalidateSize(); });

      /* Where the car was when THIS card came up: the fix the scanner took
         once when the card landed and put on the offer line, which is also
         where the platform measured the card's own distance from. Only a fix
         rpi/gps.py's gate passed — MV.fixOf reads `gpsOk` and nothing else.
         It used to be the newest journal row that carried a position, up to
         twenty minutes old and cached two more, which is another card's car;
         that fetch, its cache and its age hedges are gone with it. */
      var here = MV.cardFix(want.card).at;

      var found = {};
      // A box around where the car actually is, which is the whole of what
      // makes a street name answerable: handed "Cobb Pkwy" a geocoder returns
      // a real Cobb Pkwy somewhere, and this driver works one metro.
      var box = here ? MV.boxAround(here) : null;

      /* The car, before a single question goes out — and the last card's pins
         down in the same call.
         Until now nothing reached the glass until every lookup had finished.
         Measured against the real map-view.js at a 500ms round trip, press to
         first mark: 1.6s for a card that names no dropoff, 3.8s for three
         fresh places, 6.0s when the box refuses all three. That is a decision
         the driver makes in tens of seconds, spent looking at a rectangle.
         And it was not an EMPTY rectangle, which is worse: the only teardown
         is inside drawMap, so the previous card's four pins and its route sat
         there the whole time, under this card's numbers. The branch above
         refuses exactly that for a card that names nowhere — "the last card's
         pins must not stay on the glass under this card's numbers" — and this
         is the other branch of the same rule.
         The car is the one mark here that was measured rather than looked up,
         so it is the one that can be drawn at once. */
      drawMap(want, found, here, false);
      function landed() {
        // Same guard as the settled draw below, and for the same reason: the
        // driver may have been shown a different card while this was in
        // flight, and half-drawn pins belonging to the old one are still the
        // old one's.
        if (viewMode !== 'map' || mapFor !== key) return;
        drawMap(want, found, here, false);
      }

      /* The NucBox at home, when this rig's server has it set (see server.js
         nbxRoute and MV.NbxSearch). Asked AFTER the car is down, so the one
         local question never delays the first mark. With neither setting,
         `nbx` is both false and everything below this is exactly the walk
         this page always made — the public geocoder, the box, the wide
         retry. Asked at every walk rather than kept: it is one question to
         this rig's own server, and a kept answer is a second copy of a
         setting that lives there. */
      var nbx = await MV.nbxSettings();
      if (viewMode !== 'map' || mapFor !== key) return;
      if ((nbx.search || nbx.route) && !mapNbx) mapNbx = new MV.NbxSearch();
      var gone = function () { return viewMode !== 'map' || mapFor !== key; };
      var askPublic = want.names;
      if (nbx.search) {
        // What the NucBox could not be asked goes to the public map, under
        // this press (askNucBox).
        askPublic = await askNucBox(want, want.names, here, nbx, found, gone, landed, true);
        if (askPublic === null) return;
      }
      if (askPublic.length) {
        await mapGeo.walk(askPublic, function () { return box; }, found, landed);
        // Asked again without the box, exactly as the other two pages do it: a
        // box is a claim that the answer is within sixty miles of the car, and a
        // genuinely distant dropoff must not be lost to a feature meant to find
        // things. Never for a place the NucBox answered: its disc IS the
        // claim, and asking wide is how a wrong branch gets a pin.
        var refused = askPublic.filter(function (q) { return box && !found[q]; });
        if (refused.length) {
          await mapGeo.walk(refused, function () { return null; }, found, landed);
        }
      }

      // The driver has been shown a different card since these went out. The
      // pins about to be drawn would be the old one's, under the new one's
      // numbers — a confidently wrong answer, which is the one thing this
      // panel may never produce.
      if (viewMode !== 'map' || mapFor !== key) return;

      /* The detour by road (askRoad: only where the line would state a
         figure at all). Asked here, inside the walk and under the busy
         guard, so a driver who leaves Map view while it is in flight cannot
         come back to the previous card's line. */
      var road;
      if (nbx.route) {
        road = await askRoad(want, found, here, gone, function () {
          mapSay('measuring the detour by road…');
        });
        if (road === WALK_LEFT) return;
      }
      /* The held order's run along the roads, to draw: the car, its pickups
         with a pin, its end — the points heldRun draws straight. Drawing
         only; no figure comes of it. Not when any of them is a pin the map
         calls wrong (red) or a numberless street's point (its card names the
         street, not where on it): a road to a point nobody vouches for is a
         road drawn with more confidence than the pin under it. With no
         held pickups this is car -> held end, the question detour already
         asked, answered from the page's cache. Router down: null, and the
         straight run as before. */
      var heldRoad = null;
      if (nbx.route && mapNbx && want.runs) {
        // Two orders: a road per line drawMap draws — the run through both,
        // or each order's own — and only where the line would state a
        // figure, so no road is drawn to a pin the map calls wrong.
        var tj = mapJudge(want, found, here);
        if (here && tj.runs && mapRefusal(want, found, here, tj) === null) {
          var draws = tj.runs.known ? [tj.runs.runs[0]] : tj.runs.own;
          heldRoad = { lines: [] };
          for (var di = 0; di < draws.length; di++) {
            heldRoad.lines.push(await mapNbx.runLine(   // eslint-disable-line no-await-in-loop
              [here].concat(draws[di].filter(Boolean))));
            if (viewMode !== 'map' || mapFor !== key) return;
          }
        }
      } else if (nbx.route && mapNbx) {
        // From the card's fix, or with none the live one (want.carNow); with
        // neither, its pickups -> its end, along the roads all the same.
        var hj = mapJudge(want, found, here);
        var runPts = [here || want.carNow].concat(hj.heldPicks.filter(function (p) { return p.at; })
          .map(function (p) { return p.at; }), [hj.held]).filter(Boolean);
        var trusted = hj.held && !hj.off.held && !hj.wrong[want.held]
          && hj.heldPicks.every(function (p) { return !p.at || (!p.off && !hj.wrong[p.q]); })
          && runPts.every(function (p) { return !p.stretch; });
        if (trusted && runPts.length >= 2) {
          heldRoad = await mapNbx.runLine(runPts);
          if (viewMode !== 'map' || mapFor !== key) return;
        }
      }
      /* ...and this card's own job, pickup -> its dropoff, along the road:
         one question of two points, drawing only. No figure comes of it, and
         none could: the detour stops at where the order in the car ends
         (Settled: never a route through where the new job ends), and this
         line is the job, which the card's own miles already price. Under the
         same trust as the held run — neither pin red or a card's refusal,
         neither a numberless street's point — and straight otherwise. */
      var jobRoad = null;
      if (nbx.route && mapNbx) {
        var jj = mapJudge(want, found, here);
        if (jj.pick && jj.drop && !jj.off.pick && !jj.wrong[want.pickup]
            && !jj.wrong[want.dropoff] && !jj.pick.stretch && !jj.drop.stretch) {
          jobRoad = await mapNbx.runLine([jj.pick, jj.drop]);
          if (viewMode !== 'map' || mapFor !== key) return;
        }
      }
      drawMap(want, found, here, true, road, heldRoad, jobRoad);
      if (want.refit) { fitFor = cardId; fitWanted = false; }
    } finally {
      mapBusy = false;
      /* A walk the driver walked away from leaves this card marked as drawn
         when nothing of it reached the glass. Every early return above happens
         before the settled draw and so never reaches mapDrew, so coming back
         takes the "nothing to redraw" branch and re-states `lastLine` over
         `lastBounds` — and both of those belong to the card BEFORE this one.
         The driver gets the last offer's detour over the last offer's pins,
         under this offer's figures, and it never corrects itself, because the
         key says this card is already drawn. Forgetting the key instead makes
         the next press redraw from the start, and that costs nothing: every
         answer that did arrive is in the geocoder's cache, so the re-run asks
         nobody anything.

         ON THE MODE, and only on the mode. A `partial` flag set after the car
         was drawn used to stand in front of this, on the reasoning that
         `mapFor` is frozen for the whole walk so `partial` already implied the
         mode had changed. The implication runs ONE WAY only: the mode can
         change while nothing of this card is drawn and `partial` is false —
         a journal fetch for the car's position used to sit between taking
         the key and the first mark, and rpi/test_dashboard.py watched the
         previous card's pins stay up while this card's places were never
         asked about. That fetch is gone (the car is now this card's own fix,
         on the offer line), but `await MV.needLeaflet` still sits there on
         the first entry of a page, so the rule is the mode and not what was
         drawn.

         What must NOT be nulled is a key under a live map, and that is what
         the mode clause is for: a drawMap that THROWS would otherwise null it
         and the line below re-enters showMap at once, which on a panel read
         while driving is an unbounded retry. Measured with a deliberate throw
         in Leaflet's fitBounds: 1 draw with this clause, 5 in 6 seconds and
         climbing under `if (partial)` alone, and the panel hangs outright if
