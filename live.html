<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uber Scan — Live</title>
<meta name="theme-color" content="#0b0f14">
<link rel="stylesheet" href="styles.css">
<style>
  /* Read at arm's length, in a car, at a glance. Nothing subtle here. */
  #app { justify-content: center; }
  .live { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--pad); }

  /* The number is sized to the panel and to how many characters it has to
     hold. A fixed 180px fits "$25" and runs "$41.6" off the edge — which is
     what a real offer did on a wide screen, pushing the "/hr" past the border.
     Sized against the panel rather than the viewport because the panel is what
     it has to fit inside. */
  .verdict { container-type: inline-size; }
  .big .rate-value {
    --chars: 4;
    font-size: min(28vw, 180px, calc((100cqw - 70px) / (var(--chars) * 0.62)));
  }
  /* Nothing to report: a 180px "--" is a pair of grey slabs, not information. */
  .verdict.novalue .rate { display: none; }
  .stale { opacity: .35; }
  .pending { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .connbar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; color: var(--muted); padding: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--no); }
  .dot.on { background: var(--go); }
  #viewWrap { margin: 0; }
  #viewWrap img {
    width: 100%; display: block; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel);
  }
  #viewWrap img.stalefeed { opacity: .4; }
  #viewNote { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 0 0; }
  #viewWrap.gone img { display: none; }

  /* What the reader actually saw. Folded away by default, because it is only
     ever wanted after a wrong answer — and after a wrong answer it is the only
     thing that explains it. */
  #raw { font-size: 11px; color: var(--muted); }
  #raw summary { cursor: pointer; padding: 4px 0; }
  #raw pre {
    margin: 4px 0 0; padding: 8px; white-space: pre-wrap; word-break: break-word;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    max-height: 28vh; overflow: auto; font-size: 11px; line-height: 1.45;
  }
</style>
</head>
<body>

<main id="app">
  <div class="live">
    <section id="verdict" class="verdict empty">
      <div class="verdict-label" id="verdictLabel">WAITING FOR AN OFFER</div>
      <div class="rate big">
        <span class="rate-value" id="perHour">--</span>
        <span class="rate-unit" id="rateUnit">/hr</span>
      </div>
      <div class="submetrics">
        <div class="sub"><span id="vPay">--</span><small id="lPay">pay</small></div>
        <div class="sub"><span id="vMin">--</span><small id="lMin">minutes</small></div>
        <div class="sub"><span id="vMile">--</span><small id="lMile">miles</small></div>
        <div class="sub"><span id="vPerMile">--</span><small id="lPerMile">$/mi</small></div>
      </div>
      <div id="warn" class="notice" hidden></div>
    </section>
    <div class="pending" id="detail" style="text-align:center"></div>

    <!-- What the camera is actually looking at. The inset is the exact image
         handed to the reader, so aim and focus are both visible here. -->
    <figure id="viewWrap">
      <img id="view" alt="live camera view">
      <figcaption id="viewNote">camera view · inset is what the reader sees</figcaption>
    </figure>

    <details id="raw" hidden>
      <summary>what the reader read</summary>
      <pre id="rawText"></pre>
    </details>
  </div>

  <div class="connbar"><span class="dot" id="dot"></span><span id="conn">connecting…</span></div>

  <nav class="bottombar">
    <a class="linkbtn" href="index.html">⌨ Type</a>
    <a class="linkbtn" href="/api/status">⚙︎ Status</a>
  </nav>
</main>

<script>
(function () {
  'use strict';

  // An offer the scanner stopped seeing this long ago is history, not news.
  var STALE_MS = 90000;

  var el = {};
  ['verdict', 'verdictLabel', 'perHour', 'vPay', 'vMin', 'vMile', 'warn', 'detail', 'conn', 'dot',
   'lPay', 'lMin', 'lMile', 'raw', 'rawText', 'rateUnit', 'vPerMile', 'lPerMile']
    .forEach(function (id) { el[id] = document.getElementById(id); });

  // Keep the headline number inside the panel whatever it says. The unit comes
  // with it: while aiming, that number is a pixel count, and labelling a pixel
  // count "/hr" made a mount measurement read as a fantastic offer.
  function setRate(text, unit) {
    el.rateUnit.textContent = unit || '/hr';
    el.perHour.textContent = text;
    el.perHour.style.setProperty('--chars', Math.max(3, text.length));
    el.verdict.classList.toggle('novalue', text === '--');
  }

  function showRaw(text) {
    var body = (text || '').trim();
    el.raw.hidden = !body;
    if (body) el.rawText.textContent = body;
  }

  var last = null;
  var phase = null;      // setup progress, before any offer exists

  var PHASE_LABEL = {
    check: 'CHECKING',
    aim: 'AIM THE CAMERA',
    calibrated: 'CALIBRATED',
    scanning: 'WAITING FOR AN OFFER',
    error: 'SCANNER PROBLEM'
  };

  function money(n, d) { return (n === null || n === undefined) ? '--' : '$' + Number(n).toFixed(d); }

  function render() {
    var r = last;
    if (!r || !r.ready) {
      // Before the first offer the useful thing to show is setup progress, so
      // the page doubles as the aiming instructions.
      var p = phase || {};
      el.verdict.className = 'verdict ' + (p.phase === 'error' ? 'no' : 'empty');
      el.verdictLabel.textContent = PHASE_LABEL[p.phase] || 'WAITING FOR AN OFFER';
      setRate(p.cardPixels ? String(p.cardPixels) : '--',
              p.phase === 'aim' ? 'px' : '/hr');
      el.vPay.textContent = el.vMin.textContent = el.vMile.textContent = '--';

      var aiming = p.phase === 'aim';
      el.lPay.textContent = aiming ? 'card px' : 'pay';
      el.lMin.textContent = aiming ? 'sharpness' : 'minutes';
      el.lMile.textContent = aiming ? 'steady' : 'miles';
      if (aiming) {
        el.vPay.textContent = p.cardPixels ? p.cardPixels + 'px' : '--';
        el.vMin.textContent = p.sharpness !== null && p.sharpness !== undefined ? p.sharpness : '--';
        el.vMile.textContent = (p.stable || 0) + '/' + (p.need || 6);
      }
      el.warn.textContent = p.message || '';
      el.warn.hidden = !p.message;
      el.detail.textContent = aiming
        ? 'the view below is live — move the mount until this says good'
        : (r ? 'scanner running, no offer on screen' + trackNote(r) : '');
      showRaw(r && r.text);
      return;
    }

    var stale = Date.now() - r.at > STALE_MS;
    el.verdict.className = 'verdict ' + r.state + (stale ? ' stale' : '');
    el.verdictLabel.textContent =
      ({ go: 'ACCEPT', warn: 'CLOSE CALL', no: 'PASS' }[r.state] || '') + (r.locked ? '' : ' ?');
    // The headline is net of running costs when a cost per mile is set, and
    // saying so is not optional: a driver who checks 7.09 over 34 minutes gets
    // $12.51/hr, the screen said $10.61, and nothing here explained the gap.
    var deducted = r.cost > 0;
    setRate('$' + (Math.abs(r.perHour) >= 100
      ? Math.round(r.perHour) : Number(r.perHour).toFixed(1)),
      deducted ? '/hr net' : '/hr');
    el.lPay.textContent = deducted ? 'net pay' : 'pay';
    el.vPay.textContent = money(deducted ? r.pay - r.cost : r.pay, 2);
    el.vMin.textContent = r.minutes === null ? '--' : Math.round(r.minutes);
    el.vMile.textContent = r.miles === null ? '--' : Number(r.miles).toFixed(1);
    // Secondary on purpose: $/hr is what decides an offer, because an hour is
    // the thing actually being spent. $/mi is the number most drivers carry a
    // rule of thumb for, so it is worth showing beside it.
    el.vPerMile.textContent = (r.perMile === null || r.perMile === undefined)
      ? '--' : money(r.perMile, 2);
    el.lPerMile.textContent = deducted ? 'net $/mi' : '$/mi';

    var notes = [];
    if (r.milesUncertain) notes.push('Distance unreadable — pay shown before mileage cost.');
    else if (r.milesCorrected) notes.push('Recovered a decimal in the distance — check the miles.');
    el.warn.textContent = notes.join(' ');
    el.warn.hidden = !notes.length;

    el.detail.textContent = (stale ? 'last seen ' + Math.round((Date.now() - r.at) / 1000) + 's ago · ' : '')
      + (deducted ? '$' + Number(r.pay).toFixed(2) + ' less ' + Number(r.miles).toFixed(1)
                    + ' mi × $' + Number(r.costPerMile).toFixed(2) + ' = $'
                    + Number(r.cost).toFixed(2) + ' · ' : '')
      + r.ms + 'ms'
      + (r.legs > 1 ? ' · ' + r.legs + ' legs' : '')
      + (r.mergedFrom > 1 ? ' · ' + r.mergedFrom + ' reads' : '')
      + (r.items ? ' · ' + r.items + ' items' : '')
      + trackNote(r);
    showRaw(r.text);
  }

  // Only worth saying when it is not the quiet default: corners that are being
  // followed, or a screen that went missing.
  function trackNote(r) {
    var bits = [];
    var t = r.track;
    if (t && t.lost) bits.push('screen not visible');
    else if (t && t.jumps) bits.push('re-locked on the phone');
    else if (t && t.drift >= 25) bits.push('tracking ' + Math.round(t.drift) + 'px');
    return bits.length ? ' · ' + bits.join(' · ') : '';
  }

  function connect() {
    var src = new EventSource('/api/events');
    src.onopen = function () {
      el.conn.textContent = 'scanner connected';
      el.dot.classList.add('on');
    };
    src.onmessage = function (e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      if (msg.phase) phase = msg;
      if (msg.ready !== undefined) last = msg;
      render();
    };
    src.onerror = function () {
      el.conn.textContent = 'reconnecting…';
      el.dot.classList.remove('on');
    };
  }

  // Seed from the current state so a fresh tab is not blank until the next read.
  fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
    if (s.last) last = s.last;
    if (s.status) phase = s.status;
    render();
    if (!s.scanner.enabled) {
      el.conn.textContent = 'Pi scanner not present on this machine';
    } else if (!s.scanner.running) {
      el.conn.textContent = 'scanner not running' + (s.scanner.error ? ': ' + s.scanner.error : '');
    }
  }).catch(function () {});

  // Poll the still rather than streaming: the scanner writes it every couple of
  // seconds, so a stream would mostly be duplicate frames, and a plain <img>
  // survives the scanner restarting underneath it.
  var view = document.getElementById('view');
  var viewNote = document.getElementById('viewNote');
  var viewWrap = document.getElementById('viewWrap');
  view.addEventListener('error', function () {
    viewWrap.classList.add('gone');
    viewNote.textContent = 'no camera view yet — the scanner writes one every few seconds';
  });
  view.addEventListener('load', function () {
    viewWrap.classList.remove('gone');
    viewNote.textContent = 'camera view · inset is what the reader sees';
  });
  function refreshView() {
    if (document.hidden) return;
    view.src = '/api/frame.jpg?t=' + Date.now();
  }
  refreshView();
  // The scanner speeds up while this is being fetched, so a quick poll is what
  // makes the view feel live. It stops entirely on a hidden tab, which is also
  // what lets the scanner fall back to its idle rate.
  setInterval(refreshView, 500);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refreshView();
  });

  connect();
  setInterval(render, 1000);   // keeps the "last seen" counter honest
})();
</script>
</body>
</html>
