      // whose answer did not arrive. No old figures reprinted with it — an
      // hour on, they would still read like the truth.
      bits = ['today: figures could not be fetched'];
    } else {
      // Money first. This is one line, cut with an ellipsis where it does
      // not fit, and on the 480px hat and a phone it does not: measured
      // against a fortnight of offers, 392px of text in 223px on the hat and
      // 314px in 172px on the phone. What the ellipsis took was the tail, and
      // the tail was "took 2 for $27 net · median $20/hr" — the two figures
      // a driver glances down for. They lead now; the count of offers and
      // the set-aside figure are what a small screen loses.
      bits = [];
      // "✓ 3 for $48" — the same words the offers page puts on a day
      // header, so the two screens say the same thing about the same rows.
      //
      // A TICK, not "took". `s.took` is `counted.filter(o => o.accepted)`:
      // the offers the driver MARKED, not the jobs they did, and the two are
      // known to differ. Per day over the real week (4am boundary), ticks
      // against cards the panel called ACCEPT ran 7 of 8, 1 of 2, 10 of 41,
      // 12 of 54 and 1 of 1 — the two busiest days are the two where a
      // quarter as many ticks as greens were recorded. "took 10 for $140"
      // reads as the evening's takings; the glyph is the one the Took button
      // wears once pressed and the offers page puts on a marked row, so this
      // reads as what it is, the ticks and what they came to. Two characters
      // where "took " spent five, on a line whose tail is cut on the hat —
      // shorter is the one change here that cannot push a figure off.
      //
      // Whole dollars, like the median beside it: this is read at arm's
      // length. Net, and only claimed as net when a running cost was really
      // taken off — with costs at zero the two are one number and "after
      // costs" would describe a subtraction that never happened. `earned` is
      // absent from a server one release behind, and then the count stands
      // alone as it did.
      bits.push('\u2713 ' + s.took
                + (s.took > 0 && typeof s.earned === 'number'
                   // Signed the way every other figure on these pages is:
                   // "-$1", not "$-1". A job whose mileage cost more than it
                   // paid is rare and real.
                   ? ' for ' + (s.earned < 0 ? '-$' : '$')
                     + Math.abs(Math.round(s.earned))
                     + (s.earnedCost > 0 ? ' net' : '')
                   : ''));
      // Only when there is one. A median of nothing is not zero.
      if (typeof s.median === 'number') {
        // Signed the way the `earned` figure three lines up already is, and
        // rounded the way this line always has been: whole dollars, because a
        // shift median read at a glance does not want a decimal. It wrote
        // "$-12/hr" before, which is the shape this page spends a comment at
        // line 615 refusing — and a median can go negative as soon as a
        // running cost is set.
        // ...and it now says WHAT it is the median OF, which it did not.
        //
        // `shiftSummary` builds it from `counted.map(o => o.perHour)` — every
        // offer the window read, and 935 of this driver's 1,166 were a PASS.
        // The words immediately before it were "took 10 for $140 net", so a bare
        // "median $15/hr" read as the rate of the jobs just named. It is not.
        // Replayed day by day over the real week on the 4am boundary, against
        // the median of what was actually ticked on the same day:
        //
        //   13 Sep  took 7 for $98 net · median $14/hr    took ran $25.50
        //   15 Sep  took 1 for $14 net · median $11/hr    took ran $21.70
        //   18 Sep  took 10 for $140 net · median $15/hr  took ran $34.40
        //   19 Sep  took 12 for $206 net · median $17/hr  took ran $31.00
        //   20 Sep  took 1 for $12 net · median $17/hr    took ran $25.70
        //
        // Pessimistic on all five days, by 1.88x, 1.96x, 2.28x, 1.82x and
        // 1.51x, beside a $25 target it looks measured against. The offers page
        // had this exact fault and its cure was to name the population: its big
        // figure reads `typical offer`.
        //
        // THE FIGURE GOES FIRST, and that is the whole of why this reads the
        // way it does. Copying the offers page's words was tried and measured
        // and is wrong here: this line is ellipsised from the tail, and on the
        // 480px hat "typical offer -$17/hr" put the digits at 507px against a
        // box ending at 468px — the label ate the number it was labelling,
        // which trades this project's first fault class for its second. So did
        // "typical" alone, by 5px. The budget is exactly the seven characters
        // "median " already spent.
        //
        // Putting the number in front of its noun spends nothing: the row's
        // stated rule is that the figures lead and the count and set-aside are
        // what a small screen loses, and the noun is now part of that tail. It
        // is the one arrangement where the cure cannot cost the figure.
        // `rpi/test_dashboard.py` ranges over the digits at 480px and asks
        // where they land, rather than asking `textContent` — which holds the
        // whole string whether it is painted or not.
        bits.push((s.median < 0 ? '-$' : '$')
                  + Math.abs(Math.round(s.median)) + '/hr an offer');
      }
      // The short form: "✓7 $86 · $13/hr an offer". The tick and its count
      // run together and the "for" and "net" go behind "…" with the count of
      // offers and the set-aside. The median keeps "an offer": a bare figure
      // one dot after the takings reads as the rate of the jobs just named,
      // which is the fault the noun was put there to end (AUDITS, "The shift
      // row's median was the typical OFFER"), and on the owner's week it was
      // pessimistic by 1.5x to 2.3x that way.
      short = ['\u2713' + s.took
               + (s.took > 0 && typeof s.earned === 'number'
                  ? ' ' + (s.earned < 0 ? '-$' : '$') + Math.abs(Math.round(s.earned))
                  : '')].concat(bits.slice(1));
      bits.push(s.offers + (s.offers === 1 ? ' offer' : ' offers'));
      if (s.setAside) bits.push(s.setAside + ' set aside');
      // `beforeClock` is deliberately NOT printed here. Offers the rig recorded
      // before its clock was right are stamped 1970 on disk and cannot fall
      // inside any day window — but that is true of every day, forever, so on a
      // line about today it is a suffix that never clears and attributes rows
      // from some past boot to this shift. The offers page drops them silently
      // for the same reason. It stays in the response because it is a true fact
      // about the journal and a diagnostic may want it; it is not a figure for
      // this row.
    }
    // The separator in front is the stylesheet's (#shift::before), because
    // whether anything stands before this line is the connection's to say.
    el.shift.textContent = (short || bits).join(' · ');
    shiftFull = bits.join(' · ');
    el.shift.title = shiftFull;
    el.shift.hidden = false;
    fillMore();
  }

  // --- the rest of the status row, behind "…" ------------------------------
  //
  // The row was "● scanner reading · ✓ 7 for $86 net · $13/hr an offer · 70
  // offers · 13 set aside", 15px grey across the panel's foot, read at a
  // glance for one thing: is it reading, and what has tonight come to. The
  // dot answers the first in colour, so "scanner reading" — the steady state
  // — is not written on the row (`steady`, showConnection); anything else the
  // connection has to say still is, in words, beside the dot it turned red.
  // The takings and the median stay; the rest is one press away on "…", a
  // sheet over the foot of the card with the whole of what the row knows:
  // the connection in words with the status link, the rig's own note, and
  // the shift line in full. Not on the bar (it holds six): on the row, like
  // 📷, at no height.
  var shiftFull = '';
  var MORE_MS = 10000;
  var moreBack = null;
  var moreBtn = document.getElementById('more');
  var moreSheet = document.getElementById('moreSheet');

  // The connection's line, with its link to /api/status, made once and kept
  // first on the sheet: fillMore runs on every message and every tick, and a
  // link made new each time was gone between a press and its release — the
  // same fault as the pair line's route link (showRoute). Its words change in
  // place; the lines after it are drawn again when what they say moves.
  var moreConn = null, moreLink = null;
  function fillMore() {
    if (!moreSheet || moreSheet.hidden) return;
    if (!moreConn) {
      moreConn = document.createElement('div');
      moreConn.className = 'm-conn';
      moreLink = document.createElement('a');
      moreLink.href = '/api/status';
      moreConn.appendChild(moreLink);
    }
    if (moreSheet.firstChild !== moreConn) moreSheet.insertBefore(moreConn, moreSheet.firstChild);
    setText(moreLink, el.conn.textContent);
    // The note's own lines: the heat chip's sentence, which the row has no
    // room for, and the words beside it (showHealth).
    var lines = (!el.health.hidden ? healthLines : []).map(function (h) { return [h, 'm-health']; })
      .concat(shiftFull ? [[shiftFull, 'm-shift']] : []);
    if (!drawnAs(moreSheet, JSON.stringify(lines))) return;
    while (moreConn.nextSibling) moreSheet.removeChild(moreConn.nextSibling);
    lines.forEach(function (l) {
      var d = document.createElement('div');
      d.className = l[1];
      d.textContent = l[0];
      moreSheet.appendChild(d);
    });
  }

  function showMore(on) {
    clearTimeout(moreBack);
    moreSheet.hidden = !on;
    moreBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
    if (on) {
      fillMore();
      moreBack = setTimeout(function () { showMore(false); }, MORE_MS);
    }
  }
  moreBtn.addEventListener('click', function () { showMore(moreSheet.hidden); });
  // A press on the sheet itself puts it away, except on the status link.
  moreSheet.addEventListener('click', function (e) {
    if (e.target && e.target.tagName === 'A') return;
    showMore(false);
  });

  // 1 Jan 2025, the same floor server.js applies. Below this a clock is not a
  // clock: the Pi has no RTC, boots in 1970 and jumps when NTP arrives.
  var CLOCK_BELIEVABLE_AFTER = 1735689600000;

  function loadShift() {
    // Whoever asked, the answer is worked out after every offer line that has
    // arrived so far — sent now, or queued behind the request in flight by
    // `shiftAgain` below — so an ask an offer left pending is already answered.
    if (shiftSoonTimer) {
      clearTimeout(shiftSoonTimer);
      shiftSoonTimer = null;
    }
    // The page's OWN clock first. On the panel bolted to the dashboard this
    // browser is running on the Pi, so an unset clock makes dayStart() a 1970
    // moment — which the server refuses, correctly, and the line would simply
    // vanish with nothing said. The server's own answer covers the other case,
    // a phone with a good clock looking at a rig without one.
    var since = dayStart();
    if (since < CLOCK_BELIEVABLE_AFTER) {
      shiftAt = Date.now();
      showShift({ clockSet: false });
      return;
    }
    if (shiftBusy) {
      // Asked while one is already in the air. Dropping it silently is what
      // made marking an offer during the three-minute poll repaint the count
      // from BEFORE the mark: the answer already in flight was computed
      // without it. Remember to go again instead.
      shiftAgain = true;
      return;
    }
    shiftBusy = true;
    shiftAt = Date.now();
    // A fetch that never settles would leave shiftBusy set for the rest of the
    // shift, and the figures on the panel would stop moving with nothing saying
    // they had. This used to build its own AbortController here, which is where
    // `ask` came from: the same guard was needed by five controls that did not
    // have it, and one deadline written twice is one that drifts.
    ask('/api/today?since=' + since).then(function (r) {
      // An older build has no such route, and an unknown /api path on this
      // server falls past every handler to a text/plain 404 — so `.json()`
      // would reject with a SyntaxError rather than returning a status to
      // branch on. The status is read here instead and carried on the error,
      // because the catch below treats a 404 differently from a failure.
      if (!r.ok) {
        var e = new Error('http ' + r.status);
        e.status = r.status;
        throw e;
      }
      return r.json();
    }).then(function (s) {
      showShift(s);
    }).catch(function (e) {
      // Not a silent swallow. Leaving the last good figures up with nothing
      // saying they are old is the failure this file keeps warning about — an
      // hour into a shift they would still read like the truth.
      //
      // Hidden only for a 404, which is a server with no such route at all:
      // there are no figures to fail to fetch, and a sentence complaining
      // about them every three minutes would be a light that never clears.
      // Every other failure says so. See `s.failed` in showShift.
      showShift(e && e.status === 404 ? null : { failed: true });
    }).then(function () {
      shiftBusy = false;
      if (shiftAgain) { shiftAgain = false; loadShift(); }
    });
  }

  var PHASE_LABEL = {
    check: 'CHECKING',
    aim: 'AIM THE CAMERA',
    calibrated: 'CALIBRATED',
    scanning: 'WAITING FOR AN OFFER',
    error: 'SCANNER PROBLEM'
  };

  function money(n, d) {
    if (n === null || n === undefined || !isFinite(n)) return '--';
    return (n < 0 ? '-$' : '$') + Math.abs(Number(n)).toFixed(d);
  }

  /* body.between: no offer, and the card has nothing to say but that. In
     Map view the stylesheet then gives the map the verdict's column too
     (the driver's photograph: half the panel an empty WAITING FOR AN OFFER
     card beside a half-width map). The class flips inside render, so the
     card is back in the same frame as the offer that brings it; the map is
     told its new size there and then, or Leaflet goes on drawing tiles for
     the width it had. */
  // The verdict box's class: its state, and stale when it is. `novalue` is
  // setRate's to say and is carried over as it stands, so a render that
  // changes nothing writes nothing.
  function verdictClass(c) {
    setClass(el.verdict, c + (el.verdict.classList.contains('novalue') ? ' novalue' : ''));
  }

  function setBetween(on) {
    if (document.body.classList.contains('between') === on) return;
    document.body.classList.toggle('between', on);
    if (theMap && viewMode === 'map') {
      theMap.invalidateSize();
      requestAnimationFrame(function () { if (theMap) theMap.invalidateSize(); });
    }
  }

  function render() {
    var r = last;
    // The card's form before anything is drawn in it: the notices are
    // counted differently while it is driving (showNotes).
    showDriving();
    // Took first: whether the card it names is still up is decided by this
    // same reading, and its age changes with nothing arriving. See tookAge.
    showTook();
    // A rig that cannot see takes this branch with a reading on hand too. Its
    // newest reading is from before it went blind — a dark box has made none
    // for a minute — or, from a camera frozen on a card, is that card read
    // again and again, as fresh-looking as a real one. Either way there is no
    // verdict on this rig to show, and the word for why goes where it would.
    if (!r || !r.ready || blind) {
      // Before the first offer the useful thing to show is setup progress, so
      // the page doubles as the aiming instructions.
      var p = phase || {};
      // Not `no`. A fault is not a verdict, and painting the panel in the PASS
      // red means a glance at a dead scanner reads as "decline this offer" —
      // the driver acts on a decision nothing made.
      //
      // `blind` IS red, and is still not `no`: no fill, a dashed border — no
      // solid border on this screen means anything but a verdict — a warning
      // sign where the verdict's mark goes, and words that are not PASS. It is
      // the one state here where the rig is not working at all, and the muted
      // grey of a fault is how a whole shift went past unread.
      verdictClass('verdict ' + (blind ? 'blind'
        : p.phase === 'error' ? 'fault' : 'empty')
        + (Date.now() - seenAt > STALE_MS ? ' stale' : ''));
      // A card under the reader is not "waiting for an offer", and saying so
      // was the panel's least honest second and a half. Not while aiming or
      // faulted: both of those are about the rig rather than about a card, and
      // both are what the driver is there to fix.
      var busy = readingAt && (Date.now() - readingAt) < READING_MS
                 && p.phase !== 'error' && p.phase !== 'aim';
      // ...but "the card" only while there may be one. The motion gate fires
      // on any picture that moves and settles, so a navigation map, DoorDash's
      // "Finding offers" and a "Switch to dash in this busier zone" prompt are
      // each read again and again — and every one of those reads put READING
      // THE CARD, "working out the pay, the time and the distance", over a
      // phone with no card on it, with the "no offer on screen" each one came
      // to on the glass for the few milliseconds before the next read began.
      // So when the last reading came to nothing offer-like, what is said is
      // what it found and that the rig is looking again. A card that has just
      // arrived over that screen gets the same true cue — the rig is reading
      // the screen — and its verdict in the second and a half after. After a
      // reading that had something of an offer on it, or before any reading
      // at all, it is still READING THE CARD.
      var again = busy && r && noVerdictSaid(r) === NO_OFFER_SAID;
      setText(el.verdictLabel, blind ? BLIND_LABEL[blind] || 'CANNOT SEE'
        : again ? 'READING THE SCREEN'
        : busy ? 'READING THE CARD'
        : (PHASE_LABEL[p.phase] || 'WAITING FOR AN OFFER'));
      // ...and with an order in the car, where it goes next in that label's
      // place when the label would be WAITING FOR AN OFFER — the card has
      // nothing else to say — and its one line under anything else. Nothing
      // held, nothing changes. See showHeld.
      showHeld(!blind && !busy && (!p.phase || p.phase === 'scanning')
               ? 'between' : 'line');
      // Only while aiming, where the number means pixels and says so. On any
      // other phase this put a four-digit camera measurement in the position
      // and size of the headline rate, under the label "/hr" — the single most
      // prominent number on a screen read while driving, saying $1847 an hour.
      var aimingNow = p.phase === 'aim';
      setRate(aimingNow && p.cardPixels ? String(p.cardPixels) : '--',
              aimingNow ? 'px' : '/hr');
      setText(el.vPay, '--'); setText(el.vMin, '--'); setText(el.vMile, '--');

      var aiming = p.phase === 'aim';
      setText(el.lPay, aiming ? 'card px' : 'pay');
      setText(el.lMin, aiming ? 'sharpness' : 'minutes');
      setText(el.lMile, aiming ? 'steady' : 'miles');
      if (aiming) {
        setText(el.vPay, p.cardPixels ? p.cardPixels + 'px' : '--');
        setText(el.vMin, p.sharpness !== null && p.sharpness !== undefined ? p.sharpness : '--');
        setText(el.vMile, (p.stable || 0) + '/' + (p.need || 6));
      }
      // Ahead of the phase message, because it is the one the driver can act
      // on: a washed-out card between offers is exactly the state where there
      // is no reading to hang it off, which is why it is here as well as below.
      // `notSaving` leads here as it does below, and it has to be here at all
      // for a reason the others only half share: between offers there is no
      // reading to hang it off, and the journal is just as dead between offers
      // as during one.
      // The camera's line before all of them: every other note here is about
      // a reading, and while it holds there is none coming.
      // The phase message is the autopilot's own words, with no shorter form
      // to give it: it is its own chip.
      var setup = [blind && BLIND_NOTE[blind]
                     ? note(BLIND_CHIP[blind], BLIND_NOTE[blind]) : null,
                   notSaving ? note(notSavingChip(notSaving), notSaving) : null,
                   tooBright ? note(TOO_BRIGHT_CHIP, TOO_BRIGHT) : null,
                   tooDim ? note(TOO_DIM_CHIP, TOO_DIM) : null,
                   p.message ? note(p.message) : null].filter(Boolean);
      showNotes(setup);
      // No card, no address. Leaving the last one up would have it read as
      // belonging to whatever comes next.
      showPlaces(null);
      showStack(null);
      showWay(null);
      // ...and this is where the Trip Planner's stops go, if a press read one:
      // no card is being judged. Not while aiming, when the card is showing
      // the mount's own measurements.
      showStops(p.phase !== 'aim');
      var quiet = Date.now() - seenAt;
      var detailSaid = aiming
        ? 'the view below is live — move the mount until this says good'
        : (quiet > STALE_MS
            ? 'nothing from the scanner for ' + Math.round(quiet / 1000)
              + 's — it may have stopped'
            // Nothing while blind: the word above and the connection line
            // below already say it. Every sentence noVerdictSaid() has is
            // about a picture the rig has just said it cannot trust: "no
            // offer on screen" is a claim about a screen it cannot see, and
            // "box may cut it off" would send the driver to ▣ Set box over a
            // camera that is stalled or a box too dark to read. The reading
            // it would be said of is the last one before the word, too: the
            // word clears at the next read.
            : (blind ? ''
               : again ? 'no offer on screen · reading again'
               : busy ? 'working out the pay, the time and the distance'
               : (r ? noVerdictSaid(r) + trackNote(r) : '')));
      if (drawnAs(el.detail, '\n' + detailSaid)) el.detail.textContent = detailSaid;
      el.verdict.classList.toggle('stale', quiet > STALE_MS);
      setHidden(el.working, true);
      showRaw(r && r.text);
      /* Between offers, and nothing on the card but WAITING FOR AN OFFER:
         Map view takes the whole width (see body.between in the stylesheet).
         Only then — not while aiming, faulted, blind, reading a card, stale,
         or with a notice or the Trip Planner's stops on the card, each of
         which is the card saying something. */
      // No phase is the ordinary shift (a `scanning` phase is cleared when
      // the scanner first speaks), and its label is the same.
      //
      // A READ IN PROGRESS DOES NOT LEAVE BETWEEN-OFFERS BY ITSELF (`again`).
      // The owner, 17 Oct afternoon: in Map view the map "flapped between
      // full and half for offers that were not there". `busy` is true for
      // READING_MS after any read starts, and the motion gate re-reads the
      // Uber navigation screen, DoorDash's "Finding offers" and the zone
      // prompts every few seconds — so on each read the map dropped to half
      // width under READING THE SCREEN and came back when the read found no
      // offer. A read over a screen whose last reading came to nothing
      // offer-like (`again`, the same notion the label above uses) is the rig
      // looking again, and the map stays whole. What gives the column back is
      // what always did: a reading with something of an offer on it (render's
      // offer branch, setBetween(false) in the same render, so a real card's
      // verdict is on the glass the moment its reading lands), and blind,
      // aiming, a fault, a stale scanner, a notice or the Trip Planner's
      // stops.
      //
      // THE FIRST READ, with no reading yet (`r` null), still gives the
      // column back: nothing says the screen under it is not a card, and its
      // label is READING THE CARD — a cue the driver should see. It is one
      // read a shift (or after a reconnect with no replay), so it cannot
      // flap; and after a reading with part of an offer on it the next read
      // is very likely that card's, which is the cue the half-width card is
      // for.
      setBetween(!blind && (!p.phase || p.phase === 'scanning') && (!busy || !!again)
                 && quiet <= STALE_MS && el.warn.hidden && el.stops.hidden);
      return;
    }
    // An offer: the verdict back on the glass, in this same render.
    setBetween(false);

    var stale = Date.now() - readAt > READ_STALE_MS;
    verdictClass('verdict ' + r.state + (stale ? ' stale' : ''));
    // `whole` and `locked` are two different claims and only one of them is the
    // one to act on. `locked` means two consecutive frames parsed the same —
    // and two frames that both lose the pickup leg to the same glare agree
    // perfectly with each other, so a fragment can be locked. `whole` means the
    // reading is finished: a total, or both legs of a two-leg card.
    //
    // Which way it errs matters. A card missing a leg always reads *better*
    // than it is — the same pay over less time — so an unqualified ACCEPT on
    // half a card is the one mistake this screen must not make. The scanner has
    // known the difference all along and used it to decide whether to keep
    // reading and whether to speak; it just never told the page.
    var settled = r.locked && r.whole !== false;
    announce(r);
    // A reading that cannot be true gets no verdict at all, and says which
    // figure to go and look at. The alternative is what this screen used to do
    // with a lost decimal point: a green ACCEPT on $1184 for a twenty-minute
    // ride, which is the most confident this display has ever been and the most
    // wrong. The numbers stay on screen underneath — the driver is holding the
    // same card and is the one who can see which of them is off.
    if (r.state === 'doubt') {
      setText(el.verdictLabel, { pay: 'CHECK THE PAY', time: 'CHECK THE TIME',
          speed: 'CHECK THE DISTANCE',
          // The time, because that is what is wrong with it: the reading is
          // over one leg of a journey the card printed two of, so the minutes
          // are the drive to the rider and the rate is the job's several times
          // over. The long version is in the notes below, where there is room
          // for it; this label has to be read at a glance from the seat.
          leg: 'CHECK THE TIME',
          rate: 'CHECK PAY AND TIME',
          // Not a figure to check — there is no offer to check it against.
          // Uber's route planner and DoorDash's idle screen both reached the
          // rig with a payout on them, at $68.18/hr and $376.50/hr. The Pi's
          // own panel has named this since the reason was added; this screen,
          // which is the same decision shown larger, fell through to READ
          // AGAIN and sent the driver looking for a card that is not there.
          screen: 'NOT AN OFFER' }[r.doubt] || 'READ AGAIN');
    } else {
      setText(el.verdictLabel, ({ go: 'ACCEPT', warn: 'CLOSE CALL', no: 'PASS' }[r.state] || '')
        + (settled ? '' : ' ?'));
    }
    // The headline is net of running costs when a cost per mile is set, and
    // saying so is not optional: a driver who checks 7.09 over 34 minutes gets
    // $12.51/hr, the screen said $10.61, and nothing here explained the gap.
    var deducted = r.cost > 0;
    // A reading that cannot be true gets no rate, but it keeps the rate's
    // space. Collapsing it moved everything below by about 140px, so the
    // submetrics a driver is being asked to check jumped up the screen at the
    // exact moment they were told to look at them.
    setRate(r.state === 'doubt' ? '--' : rateText(r.perHour), '/hr',
            r.state === 'doubt');

    // Raw, always. This row is checked against the phone, so it has to be what
    // the card says — a "net pay" here would never match and the check would
    // be worse than useless.
    //
    // ...and labelled PAY ? when the payout was read off a card the rig went
    // looking for above the drawn card box rather than off the box
    // (pipeline.Scanner._look, rpi/cardfind.py): `cropFrom` on the line, which
    // the scanner says per card, not per read, so it stays while the panel
    // shows that card's payout (payout_from in rpi/scan_pi.py). The live view's
    // amber outline says the same and shows which card, but the live view is
    // not always up, and this row is the one a driver checks against the
    // phone — a payout the box did not hold is the one most worth checking.
    // The "?" is the panel's own word for "not settled, look again", as on
    // "ACCEPT ?" above. "FOUND PAY" was tried first and measured off: it
    // wrapped to two lines under the figure at 800x480 and lifted the verdict
    // label 9px, and on the 3.5" hat it ran letters out of its cell. "PAY?"
    // ran its "?" out of the cell on the hat's phone picture; "PAY ?" breaks
    // there, as "MIN LEFT" does beside it. rpi/test_layout.py holds it inside
    // its cell and on the glass, moving nothing but the figure a few pixels
    // sideways, at 1024x600, 800x480 and 480x320 in both pictures.
    setText(el.lPay, r.cropFrom === 'found' ? 'pay ?' : 'pay');
    setText(el.vPay, money(r.pay, 2));
    // The card's own minutes where it states them, the time left to a delivery
    // deadline where it does not. Not the billed minutes: this row is what a
    // driver checks against the phone in front of them, and a figure with
    // their own pad added to it would never match.
    var shown = (typeof r.cardMinutes === 'number') ? r.cardMinutes : r.minutes;
    setText(el.vMin, (shown === null || shown === undefined)
      ? '--' : Math.round(shown));
    setText(el.lMin, r.fromDeadline ? 'min left' : 'minutes');
    setText(el.vMile, r.miles === null ? '--' : Number(r.miles).toFixed(1));
    // Secondary on purpose: $/hr is what decides an offer, because an hour is
    // the thing actually being spent. $/mi is the cross-check, for the case
    // the driver named — "some apps have very bad time estimates but the $/mi
    // could be used to judge it as well". Nothing else here covers it: an
    // optimistic time raises no doubt at all (SANE_MINUTES runs 2 to 240, and
    // an app twenty minutes hopeful sails through), so on exactly those offers
    // $/hr is quietly wrong and this is quietly right. A cross-check, not a
    // decision rule — AUDITS has the measurement that ranking on $/mile earns
    // less, and that stands.
    //
    // RAW, which is the whole of what makes it checkable, and what the row's
    // own rule already demanded: `perMile` off the reading is
    // (pay − miles × costPerMile) ÷ miles, the raw figure minus a constant
    // thirty cents, so $14.00 over 7.0 mi printed $1.70 between two boxes that
    // divide to $2.00. Nothing is lost — the working directly below spells the
    // deduction out, and the offers page and keypad still carry the net rate.
    //
    // It survives ONE of the six doubts, because `doubt` names which figure
    // the reader cannot believe and only one leaves this one standing:
    //
    //   pay    the payout is outside SANE_PAY: the same impossible number,
    //          divided.
    //   rate   pay over time is impossible and either half could be the liar.
    //   speed  miles over time is impossible; the miles could be the liar.
    //   leg    part of the journey was never timed, so the distance is partial.
    //   screen not an offer at all.
    //   time   the MINUTES are outside SANE_MINUTES — the one case where the
    //          pay and the distance have each passed their own test. This is
    //          built from those two and nothing else, so it is the last figure
    //          on the card still worth reading.
    //
    // `milesUncertain` refuses it whatever the verdict, for the same reason
    // `perMile` is null there: a rate off a distance the reader itself doubts
    // is a confident number with nothing behind it.
    // One clause, because only one of them can change an answer. A guard on
    // the denominator was written first — `r.miles > 0 &&`, mirroring
    // offer_parser's `miles and not miles_uncertain` — and no input could make
    // it matter: a delivery card states a deadline and no route, `miles`
    // arrives null, and the division comes out Infinity, which `money` already
    // answers '--' to along with a zero and a NaN. The mutation that weakens
    // it to `!== 0` survives every check in the suite. So the missing-distance
    // case is `money`'s refusal, and the check below pins it there.
    //
    // Nothing tests the types either: this runs only on a ready reading, and a
    // reading is not ready until `net = pay - cost` has been worked out, so a
    // pay that is not a number cannot arrive here.
    var rawPerMile = r.milesUncertain ? null : r.pay / r.miles;
    var mileStands = r.state !== 'doubt' || r.doubt === 'time';
    setText(el.vPerMile, (rawPerMile === null || !mileStands)
      ? '--' : money(rawPerMile, 2));
    setText(el.lPerMile, '$/mi');

    // The working, in the panel rather than in the small print, and in two
    // steps so both rates are on screen at once: what the offer itself pays
    // per hour — checkable against the card, and the number most drivers
    // already have a feel for — and what is left after running the car, which
    // is the one the verdict is made on.
    //
    // Each line is a pair of unbreakable halves, so a narrow screen splits
    // between them rather than stranding "min" on a line of its own.
    // The card's own minutes where it states them, the time left to the
    // deadline where it does not — the same fallback the submetric above uses.
    // Without it a delivery card, which states a deadline and no duration,
    // printed its raw rate over a dash: "$12.00 in -- min = $21.2/hr raw", a
    // sum with nothing under the line. That is the whole DoorDash half of a
    // shift, showing the one figure this panel had to be argued into showing
    // at all and then failing to say what it was divided by.
    var over = (typeof r.cardMinutes === 'number') ? r.cardMinutes : r.minutes;
    var mins = (over === null || over === undefined) ? '--' : Math.round(over);
    // Both rates come off the scanner, divided by the same minutes, so this
    // sum is the scanner's arithmetic rather than a second version of it.
    // Older payloads carried only the net rate; there, the card's own time is
    // the denominator, which is what those versions meant by it.
    var gross = (typeof r.grossPerHour === 'number') ? r.grossPerHour
      : (over > 0 ? r.pay / (over / 60) : null);
    // And the time it was divided by. Usually the card's own minutes, longer
    // once a shopping allowance or a pad is configured — shown as an extra so
    // the figure in the stat row below and the one these rates divide by are
    // both accounted for, instead of silently disagreeing.
    var billed = (typeof r.billedMinutes === 'number') ? r.billedMinutes : over;
    var extra = (over === null || over === undefined)
      ? 0 : Math.round(billed) - Math.round(over);
    var time = extra > 0 ? mins + ' <i>+</i> ' + extra + ' min'
             : extra < 0 ? Math.round(billed) + ' min'
             : mins + ' min';
    // Formatted exactly as the headline is, so the net figure here and the
    // big one above are visibly the same number rather than $10.60 sitting
    // under $10.6 and reading as a second, slightly different answer.
    // rateText, not a second copy of it. This one wrote "$-12.4" — the minus
    // wedged between the dollar and the digits, which line 615 explains is a
    // dash at a glance and which rateText has always got right. So the headline
    // read "-$13.2" and the working line directly under it read "$-13.2": the
    // same loss, on the same screen, one of them looking like a gain.
    //
    // Reachable on an ordinary card at the IRS rate the README recommends:
    // $2.50 over 12.4 miles at $0.70/mile is -$13.24/hr.
    var rate = rateText;
    // Named, not just ordered. The landscape rules reclaim height when a
    // notice appears and they have to take it from the net line — which is
    // the headline repeated — rather than from the raw one, which is on this
    // page exactly once. See the rule under #verdict:has(#warn...).
    var rows = [['raw', '<span>' + money(r.pay, 2) + ' <i>in</i> ' + time + '</span>'
                 + ' <span><i>=</i> <b>' + rate(gross) + '/hr</b> <i>raw</i></span>']];
    if (deducted) {
      rows.push(['net',
                 '<span><i>less</i> ' + money(r.cost, 2) + ' <i>car costs</i></span>'
                 + ' <span><i>=</i> <b>' + rate(r.perHour) + '/hr</b> <i>net</i></span>']);
    }
    // The two ends, not the union: `places` is in the order the frames
    // arrived. See MV.ends, which the offers page asks too. Without MV this
    // page still draws the list, which is what it always drew.
    showPlaces(MV ? MV.ends(r) : r.places, sameNote(r));
    // A card being judged takes the stops' room back. See showStops.
    showStops(false);
    // Sent by the server, which is where the order in the car is known. A page
    // works it out for nobody: several may be open and each would answer
    // slightly differently as its own clock drifted.
    //
    // ...but against the hold as it is NOW, not as it was when this reading
    // arrived, which is the same rule `withStack` applies in server.js: no
    // hold, no pair line.
    //
    // `r` is `last`, the stored reading, and its `stack` was computed while an
    // order was still held. render() runs on the one-second tick, so it UNDID
    // all three of this page's own `showStack(null)` calls — press Drop and a
    // second later "+ $26 to $35/hr with the one you have" was back under the
    // verdict with the Drop button beside it already gone, until the next
    // reading arrived two and a half to six seconds later. The un-tick path
    // never even flickered, because that handler calls showDrop and showDest
    // and not showStack.
    //
    // server.js fixed exactly this for the reload path and its comment
    // describes the same screen: "press Drop and reload, and the panel showed
    // '+ $25-50/hr with the one you have' under the verdict while the Drop
    // button beside it was hidden because nothing was held". The live path was
    // left holding the reading's own copy.
    //
    // `holdingNow`, not `r.holding`: the page is told the hold has ended by the
    // mark reply, the Drop reply, the event stream and the status poll, and the
    // whole fault is that the READING is the one thing that has not heard.
    showStack(holdingNow ? r.stack : null);
    // ...and under it whether this offer is on the way, by the same rule.
    showWay(r);
    var working = rows.map(function (row) {
      return '<div class="' + row[0] + '">' + row[1] + '</div>';
    }).join('');
    if (drawnAs(el.working, working)) el.working.innerHTML = working;
    setHidden(el.working, false);

    var notes = [];
    // Before the brightness notes, which used to be first. Those are about the
    // reading underneath them being poor; this is about the reading underneath
    // it not being kept at all, and it is the only note here whose cost cannot
    // be undone by looking again. A washed-out card can be re-read; an offer
    // nobody wrote down is gone.
    if (notSaving) notes.push(note(notSavingChip(notSaving), notSaving));
    // The order in the car, read again under either id: no pair is weighed
    // (server.js sends no stack for it), and this says why.
    if (holdingNow && r.heldCard) {
      notes.push(note('YOUR ORDER · not a new offer',
                      'The order you took, on the phone again \u2014 not a new offer.'));
    }
    // Then, because it is the note with a remedy in the driver's own hand, and
    // because the reading it is sitting on top of was taken through a
    // washed-out card.
    if (tooBright) notes.push(note(TOO_BRIGHT_CHIP, TOO_BRIGHT));
    if (tooDim) notes.push(note(TOO_DIM_CHIP, TOO_DIM));
    // The label above has room for three words. This is where the reason goes,
    // and it has to be here rather than only in the label, because "CHECK THE
    // TIME" on its own reads as "one number looks odd" — when what happened is
    // that the rig is holding a fraction of the journey and knows it.
    // Before the leg note, because it is about the screen rather than about a
    // figure on it: when this fires there is no offer for any of the other
    // sentences to be about.
    if (r.doubt === 'screen') {
      // The refusal and its reason: no rate, because these are not a job.
      notes.push(note('NO RATE · the app, not a job',
                      'This looks like the app itself rather than an offer — a '
                      + 'route being planned, or a dash waiting for one. No rate is '
                      + 'shown, because the figures are not a job.'));
    }
    if (r.doubt === 'leg') {
      // ...and here the reason is the leg nobody timed, with its miles when
      // the card printed them: that figure is what the driver looks for.
      var untimed = typeof r.untimedMiles === 'number'
        ? r.untimedMiles.toFixed(1) + ' mi' : 'a leg';
      notes.push(note('NO RATE · ' + untimed + ' untimed',
                      'The card shows a leg this reading could not time'
                      + (typeof r.untimedMiles === 'number'
                         ? ' — ' + r.untimedMiles.toFixed(1) + ' mi of it'
                         : '')
                      + ', so these minutes are part of the trip, not all of it. '
                      + 'No rate is shown rather than one several times too high.'));
    }
    // A rate with no running cost taken off it is a CEILING, not the offer,
    // and the old wording — "pay shown before mileage cost" — described the
    // arithmetic without saying what it meant. On the owner's own shift 108 of
    // 202 offers were rated this way and the overstatement ran to a median of
    // 30% and a maximum of 334%. `uncosted` rather than `milesUncertain`
    // because a card that states no distance at all lands in the same place,
    // and because with no cost per mile configured there is nothing missing.
    if (r.uncosted) {
      // Short because it has to fit: the first wording of this ran twenty
      // characters longer and pushed the headline rate off the 480x320 panel,
      // which the layout checks caught. "Ceiling" is the word that matters —
      // it says the number may be anywhere below itself.
      notes.push(r.milesUncertain
        ? note('CEILING · miles unreadable', 'Distance unreadable — rate is a ceiling.')
        : note('CEILING · no distance', 'No distance on the card — rate is a ceiling.'));
    } else if (r.milesUncertain) {
      notes.push(note('CHECK MILES · unreadable', 'Distance unreadable — check the miles.'));
    } else if (r.milesCorrected) {
      notes.push(note('CHECK MILES · decimal recovered',
                      'Recovered a decimal in the distance — check the miles.'));
    }
    // Said out loud, because a fragment is not a small error in a safe
    // direction: the same pay divided by less time always looks better. The
    // scanner is still resampling when this is showing, so it is a "wait" and
    // not a "no".
    if (r.whole === false) {
      // The direction is the half that matters, so it is on the chip.
      notes.push(note('STILL READING · may look better than it is',
                      'Still reading this card — the journey may not be all there yet, '
                      + 'which makes it look better than it is.'));
    }
    // ...and where this card ENDS, when that came off the phone under a ⌖
    // press — the card's own place popup read with it, or the row the driver
    // picked from the chooser (server.js pressBetween, the card's
    // `dropoffFrom`) — and not off the card. The end the map pins and the
    // pair line weighs is then one the driver asked for, and with an order
    // in the car it went onto this card and left that order's alone. Last:
    // it is about where the job goes, not about a figure on it.
    var endFrom = onRecord && onRecord.dropoffScanned && onRecord.dropoff
      ? onRecord.dropoffFrom : null;
    if (endFrom === 'press' || endFrom === 'chooser') {
      notes.push(note('END · from ⌖', endFrom === 'chooser'
        ? 'Where this job ends was read off your phone with ⌖, and you gave it to this card.'
        : 'Where this job ends was read off your phone with ⌖.'));
    }
    showNotes(notes);

    // How old this offer is, always and first.
    //
    // It used to appear only once the reading had gone stale, which is the one
    // moment it is least useful: by then the card is dimmed and the driver has
    // already stopped trusting it. What they actually need to know, on a screen
    // beside a phone they are working with a mouse, is whether the figures
    // belong to the card in front of them or to the one before it — and that is
    // a question about seconds, asked continuously.
    //
    // Rounded to whole seconds and put first so it reads at a glance from the
    // driving seat. `readAt` is set by every reading that carries a verdict, so
    // in this branch it is always a real moment.
    // Given its own element, because the rest of this line is diagnostics —
    // how many frames it was merged from, whether the corners are being
    // tracked, and once how long the read took. Set in the same grey at the
    // same weight, the age was one `·`-separated fragment among five,
    // indistinguishable at a glance from "1517ms". The age is the only part of
    // it a driver acts on.
    var age = Math.max(0, Math.round((Date.now() - readAt) / 1000));
    var ageSaid = age < 1 ? 'just now' : age + 's ago';
    // The diagnostics get an element of their own so the 3.5" hat can drop them
    // and keep the age. They used to be bare text nodes, which CSS cannot
    // address, so the hat's only way to reclaim the line was to hide all of
    // #detail — and that took the age with it, on the one screen where the
    // driver is furthest from being able to work it out for themselves. See the
    // `max-height: 380px` block.
    // No read time. "· 1800ms" sat here on every reading: how long the Pi
    // took over the card, which is the rig's telemetry and nothing a driver
    // can act on. It is on the reading /api/status serves and in the CSV's
    // `ms` column, which is where anyone tuning the reader looks. On this
    // line it was a four-digit number set beside the age, the one figure in
    // the line that is for the driver.
    var diagSaid = (deducted ? ' · after $' + Number(r.costPerMile).toFixed(2) + '/mi costs' : '')
      + (r.legs > 1 ? ' · ' + r.legs + ' legs' : '')
      + (r.mergedFrom > 1 ? ' · ' + r.mergedFrom + ' reads' : '')
      + (r.items ? ' · ' + r.items + ' items' : '')
      + trackNote(r);
    // Nodes rather than innerHTML: every fragment here is built from the
    // scanner's own JSON, and `trackNote` in particular quotes what the
    // tracker reported.
    if (drawnAs(el.detail, ageSaid + '\n' + diagSaid)) {
      el.detail.textContent = '';
      var when = document.createElement('b');
      when.className = 'age';
      when.textContent = ageSaid;
      el.detail.appendChild(when);
      var diag = document.createElement('span');
      diag.className = 'diag';
      diag.appendChild(document.createTextNode(diagSaid));
      el.detail.appendChild(diag);
    }
    // ...and the order in the car, in one line after the age, once the line
    // is built: see showHeld.
    showHeld('offer');
    showRaw(r.text);
  }

  // Only worth saying when it is not the quiet default: corners that are being
  // followed, or a screen that went missing.
  function trackNote(r) {
    var bits = [];
    var t = r.track;
    if (t && t.lost) bits.push('screen not visible');
    // `t.jumps` used to sit here, printing 're-locked on the phone'. It is a
    // LIFETIME count — QuadTracker.jumps is incremented on every re-lock and
    // reset nowhere — so one
    // re-lock at any point in a shift put that note on every reading after it,
    // and between offers too. The rig's own health log already carries the
    // same number correctly labelled, 're-locked %dx since start'.
    //
    // Worse, it sat in the middle of an else-if chain between two LIVE states,
    // so after the first re-lock the drift note below could never appear
    // again. Saying a true thing in the present tense about the past cost the
    // one note here that is about now.
    //
    // Not replaced with a recent-re-lock note, because nothing measures one:
    // status() publishes jumps, moves, misses and rebaselines, and every one
    // of them counts since start.
    else if (t && t.drift >= 25) bits.push('tracking ' + Math.round(t.drift) + 'px');
    return bits.length ? ' · ' + bits.join(' · ') : '';
  }

  // What a reading with no verdict in it DID read, in words and no figures.
  //
  // Every one of them used to get "scanner running, no offer on screen", which
  // is a claim about the phone this page has no way to know. On 8 Oct an Uber
  // Est. delivery card sat square in front of the camera: the card box cut
  // its $14.48 in half, the reader got "Includes expected tip", the deadline,
  // "8.6 mi" and both addresses, and the panel told the driver there was no
  // offer. A reading carries what it got — `pay`, `minutes`, `deliverBy`,
  // `miles`, `places` and `clipped` are all on every message emit() sends —
  // so this says what was got, and the one thing the driver can do about it.
  //
  // `clipped` first, because it is the one case where the rig KNOWS the box
  // cut a card: the reader found a payout flush against the box's top edge
  // and threw the whole parse away for it (pipeline.money_is_clipped), so the
  // reading arrives as empty as one of a blank screen, and before `clipped`
  // was on the wire it got the old sentence. The 8 Oct card missed that path
  // only because its cut digits read as "gg Pit.", which is no payout to be
  // flush against anything; a box edge a little lower would have left them
  // readable, flush, and dropped. A payout is the rig's own test for a card
  // (`card_on_screen` in rpi/scan_pi.py), so "pay" is said outright here.
  //
  // NOT "a card is in view" for the rest, which is the obvious sentence and
  // is not true either. Of the corpus's 19 texts that read no payout, 18 read
  // a time, a distance or a place, and 12 of those are not cards at all: the
  // app's zone prompt (5) and Uber's map screen — "a map screen is not an
  // offer" and its six variants (7), every one of which reads as 39 minutes
  // and 1.0 mi. That map is the navigation screen, and a navigation screen
  // sits in front of the camera for a whole delivery (AUDITS.md, the `screen`
  // rows), so expect "no pay read" for long stretches of every delivery. The
  // panel cannot tell a card missing its pay from a screen that never had
  // one, so it says the half it knows, with the remedy hedged on the half it
  // does not, and the hedge is what keeps it true over the map.
  //
  // A pay with no verdict has no time to divide it by: `> 0` as is_complete
  // has it. Every reading that reaches this with a pay read no time at all,
  // but for a deadline rate() could not count down — one due this very
  // minute (minutes_until wraps anything earlier to tomorrow), or read before
  // the Pi's clock was set (clock_minutes) — or a `pad` in config.json
  // negative enough to cancel the card's own minutes; and "no time" is the
  // truth about those as well.
  //
  // No figure, in any: no verdict was reached, and a number on this line is
  // one the driver would read as the reading's. The box, not the card box: a
  // driver who pressed No card box reads the whole screen box, and the
  // control that fixes either is ▣ Set box.
  //
  // Each sentence is no wider than the one it replaced, in the page's own
  // font on every panel (rpi/test_layout.py), because trackNote() appends to
  // this line and the old sentence was already sized to what it appends:
  // with " · tracking 30px" it was 226px of the 3.5" hat's 228px scene line.
  // The first wordings here, 46 and 45 characters, wrapped beside that note at
  // 480x320 and at 800x480 and lifted the verdict label 5px and 12px where
  // the old line had left it alone. No wider means whatever fitted beside the
  // old sentence fits beside these.
  //
  // Measured on the real week's 5,491 stored frames: 135, on 59 of the 1,166
  // cards, read a pay and no time — each one a card until a frame of it with a
  // time merges in. 19 read a time and no pay, and all 19 are the app's zone
  // prompt, five prompts and not one card: a frame with no payout passes the
  // accumulator untouched (accumulate.add's first guard), so over those this
  // line now says "no pay read", where "no offer on screen" was true as well.
  // Those are the frames kept on offer rows; the navigation screens between
  // offers are not among them. The card it was written for, a pay the box
  // cut off, is not in that week's frames at all; it is the 8 Oct one.
  // What a reading with nothing offer-like on it is said as. Named, because
  // render() asks whether that is what the last reading came to: a read
  // starting over a screen that has just read as no offer is the rig
  // looking again, not a card being priced.
  var NO_OFFER_SAID = 'scanner running, no offer on screen';

  function noVerdictSaid(r) {
    if (r.clipped) return 'pay at the box edge — not trusted';
    // The app's own idle screen, by its own words (OP.NOT_AN_OFFER, sent as
    // `notAnOffer`). Whatever else the read picked off the map is not part of
    // a card: the corpus's Uber online frame reads the day's takings, $142.60,
    // as a payout and said "pay, no time", and 3 of the journal's 54 "Finding
    // trips" screens read a time or a place off the map and said "no pay
    // read" — each a READING THE CARD on the next read, over a phone saying
    // it has no offers. Before the pay test, which is what it overrules.
    if (r.notAnOffer) return NO_OFFER_SAID;
    if (typeof r.pay === 'number' && r.pay > 0) {
      return 'pay, no time — box may cut it off';
    }
    // The places asked of MV.ends, as showPlaces asks: the one rule for what
    // a reading named (rpi/test_lint.py holds the page to it).
    var named = MV ? MV.ends(r) : (r.places || []);
    if ((typeof r.minutes === 'number' && r.minutes > 0)
        || (r.deliverBy !== null && r.deliverBy !== undefined)
        || typeof r.miles === 'number'
        || named.length) {
      return 'no pay read — box may cut it off';
    }
    return NO_OFFER_SAID;
  }

  // What the dot means.
  //
  // It used to mean "this page has a socket to the web server", which is true
  // whenever the page is loaded at all — so it sat green and said "scanner
  // connected" over a camera that had crashed twenty minutes earlier. The one
  // fact a driver needs from it is whether anything is still reading offers.
  // The socket only decides whether that answer is current.
  function showConnection() {
    var quiet = Date.now() - seenAt;
    var alive = socketUp && quiet <= STALE_MS;
    // The camera view is the most convincing thing on this page and the last
    // to look wrong: a frozen JPEG of a phone showing an offer is
    // indistinguishable from a live one. The rule to dim it had been written
    // and never wired to anything, so the picture was served at full strength
    // however long the scanner had been dead. Dimming is not decoration here —
    // it is the only cue that what is on screen is a photograph of the past.
    var img = document.getElementById('view');
    if (img) img.classList.toggle('stalefeed', quiet > STALE_MS);
    // Set in one branch only, below. Every other branch is the scanner not
    // being heard from, and a GPS word off a heartbeat that has stopped is a
    // word about a minute that has passed — and so is the heat guard's.
    var heat = null;
    var bits = [];
    if (!socketUp) {
      setText(el.conn, 'reconnecting to the server…');
    } else if (scannerState && !scannerState.enabled) {
      setText(el.conn, 'no Pi scanner on this machine');
    } else if (scannerState && !scannerState.running) {
      setText(el.conn, 'scanner not running'
        + (scannerState.error ? ': ' + scannerState.error : ''));
    } else if (quiet > STALE_MS) {
      setText(el.conn, 'nothing from the scanner for '
        + Math.round(quiet / 1000) + 's');
    } else {
      // There was a branch above this: "the loop is running but nothing has
      // been read for Ns", whenever the last READING was more than
      // READ_STALE_MS old. That is not a fault, it is the rig between offers:
      // a still screen moves the motion gate not at all, so no read is
      // submitted until the next card — which is why STALE_MS was moved off
      // readings and onto the heartbeat. Over the real week, 774 of the 1,155
      // gaps between one offer and the next inside a shift ran past 16s, 18.9
      // of their 23.3 hours, so this line read like a reader fault for most
      // of the time the driver was waiting for work, while #detail said
      // "scanner running, no offer on screen" over the same second.
      //
      // Deleted rather than gated. The case it was written for — a verdict
      // nothing has refreshed — is already said where the verdict is: the
      // pane dims on the same READ_STALE_MS and #detail prints its age. A
      // reader that has gone for good stops the heartbeat at READ_STUCK_S in
      // scan_pi.py, and the branch above says "nothing from the scanner".
      //
      // ...and "reading" is not what a rig that cannot see is doing. This line
      // said it for the whole of the owner's blind 9.4 days, over a loop that
      // was turning and reading nothing; with the camera's word on the beat it
      // says what is true, beside the red word where the verdict goes.
      setText(el.conn, blind ? 'scanner running, cannot see' : 'scanner reading');
      heat = heatNote();
      bits = healthNote();
    }
    showHealth(heat, bits);
    // "scanner reading" is the steady state and the green dot says it; the
    // words are behind "…". Every other state keeps its words on the row.
    el.conn.classList.toggle('steady', el.conn.textContent === 'scanner reading');
    fillMore();
    // ...and the dot with it. A rig that cannot see is not reading offers,
    // which is the one thing the dot is for; left green it said "reading"
    // beside the words saying it could not.
    el.dot.classList.toggle('on', alive && !blind
      && !(scannerState && (!scannerState.enabled || !scannerState.running)));
  }

  // What the rig has to say about itself, on the connection line rather than
  // on a control or in the verdict: none of it changes what the offer in front
  // of the driver is worth, and every one of it has a remedy that can wait for
  // the next stop. Said only when something is wrong, the way trackNote is.
  //
  // NOTHING for a rig run without --gps. That is a choice the driver made, and
  // a line about it would stand for the whole of every shift and become
  // furniture — the same reason `notSaving` says nothing for --no-journal.
  // The scanner's start row in the journal is where that choice is recorded.
  // Nothing for a working GPS either: "GPS ok" on every glance is a word the
  // driver learns to skip, and then skips the one that is not ok.
  //
  // The Pi first, because it is about the readings and the GPS is about the
  // rows: heatNote, the heat guard's chip, and then these words.
  function healthNote() {
    var bits = [];
    var g = gpsNow;
    if (g && g.state === 'stale') {
      // Whole minutes, rounded DOWN: "no fix for 1 min" at 119 seconds is true
      // and "2 min" would not be. The scanner settles on stale only once
      // gps.py's twenty seconds and its own GPS_HOLD minute have both passed,
      // so the age on a beat that says stale is 80 seconds or more in every
      // ordinary run, and always a number: gps.py ages a fix on the
      // monotonic clock, which cannot run backwards past it. There was a
      // clamp up to one minute, which would have said "1 min" of a fix 30
      // seconds old, and a branch for a stale fix with no age; no beat the
      // scanner sends could reach either, and floor is the honest answer for
      // any age that does arrive.
      bits.push('GPS: no fix for ' + Math.floor(g.ageSeconds / 60) + ' min');
    } else if (g && g.state === 'lost') {
      bits.push('GPS: no fix since start');
    }
    // Not a fault, and on this row anyway: it is about the order in the car,
    // not the offer, and the bar beside Drop has no room (it holds six).
    if (atDropoff && holdingNow) bits.push('at dropoff');
    else if (Date.now() < gpsDropSaidUntil) bits.push('dropped \u00b7 left the dropoff');
    // ...and a Took that put the previous order down (server.js writes its
    // drop row `by: 'replaced'`). One order word on this row at a time.
    else if (Date.now() < replacedSaidUntil) {
      bits.push(replacedPay !== null ? 'put down ' + money(replacedPay, 2)
                                     : 'previous order put down');
    }
    return bits;
  }

  // The Pi, on this row: the heat guard's chip (scan_pi.HeatGuard), or
  // nothing.
  //
  // The guard is the scanner's. It is on at 75°C or at any throttle word the
  // firmware says is happening NOW, and off below 70 with none; while it is on
  // the whole-screen reads the rig makes by itself while an order is held —
  // the planner, the navigation screen, a labelled dropoff — are at most one
  // every 30 s instead of every 10, and nothing else is slowed: an offer, a ⌖ press and a 📷 Snap are
  // read as they always were. The beat says `heatGuard`, judged off its own
  // `cpuC` and `throttled`, so this page holds no threshold of its own and does
  // not work the state out again from the figures.
  //
  // There was a line here for the firmware's words alone, "Pi temp limit
  // 85°C". A word now always turns the guard on, at the same sample, so no
  // beat the scanner sends could reach that line any more; the chip says what
  // it said, and what the rig is doing about it.
  //
  // A CHIP, the notices' kind (`note` in this file): the state in capitals,
  // and what it means after the dot, the sentence on its title and in the
  // "…" sheet. The state is the CAUSE, the one with a remedy, out of the
  // first word the scanner lists (THROTTLE_BITS lists cause first): HOT for
  // the temperature limit, or for no word at all, which is the guard on for
  // the temperature alone; LOW POWER for under-voltage, whose remedy is the
  // power lead; SLOWED for a throttled or capped clock with neither cause
  // beside it. Not "HOT" for all of them: under-voltage at 61°C is not hot.
  // The temperature beside every one but LOW POWER, the rule this row has
  // kept since a number beside a weak supply told the driver nothing to act
  // on.
  //
  // Short, because this is the row's widest note. Measured at 800x480 and
  // 480x320 (the row at 15px), with a GPS sixteen hours stale beside it:
  // "HOT 85°C · GPS: no fix for 1000 min" is 260px where "Pi temp limit 85°C
  // · …" was 296, the widest the row held before; "LOW POWER · GPS: no fix
  // for 123 min" 278, as "Pi under-voltage · …" was; "SLOWED 82°C · …" 294.
  // "TEMP LIMIT 85°C" in its place was 313, "UNDER-VOLTAGE" 311 and
  // "THROTTLED 82°C" 319, each wider than anything the row held before. And
  // "· fewer auto reads" only when the chip is alone on the row: "HOT 76°C ·
  // fewer auto reads" is 216px and leaves a 170px shift line whole, where
  // "· fewer screen reads" (233) cut 10px off it — and beside the GPS note
  // the tail left that shift line 10px of its 170. Not "reading slower",
  // which was the first wording asked for: the offers are not read slower,
  // and a driver told they are would be told something the rig does not do.
  var heatGuardNow = false;
  var HEAT_WORDS = { 'under-voltage': 'LOW POWER', throttled: 'SLOWED', capped: 'SLOWED' };
  var HEAT_ALONE = ' \u00b7 fewer auto reads';

  function heatNote() {
    if (!heatGuardNow) return null;
    var t = throttledNow;
    var word = t && t.now && t.now.length ? t.now[0] : null;
    var temp = cpuNow !== null ? Math.round(cpuNow) + '\u00b0C' : null;
    var hot = temp && word !== 'under-voltage' ? ' ' + temp : '';
    var why = word === 'under-voltage' ? 'The Pi\'s supply is under-voltage \u2014 check '
                                         + 'the power lead'
      : word === 'temp limit' ? 'The Pi is at its temperature limit'
                                + (temp ? ' (' + temp + ')' : '')
      : word ? 'The Pi has ' + word + ' its own clock' + (temp ? ' (' + temp + ')' : '')
      : 'The Pi is hot' + (temp ? ' (' + temp + ')' : '');
    return { chip: (HEAT_WORDS[word] || 'HOT') + hot,
             full: why + ', so the rig reads the planner and navigation screens on '
                   + 'its own less often until it recovers. Offers, \u2316 and \ud83d\udcf7 '
                   + 'Snap are read as fast as ever.' };
  }

  // The row's note: the chip, then the words, one line. What "…" shows is
  // the chip's sentence and the words, a line each (`healthLines`).
  var healthLines = [];
  function showHealth(heat, bits) {
    var rest = bits.join(' \u00b7 ');
    healthLines = (heat ? [heat.full] : []).concat(rest ? [rest] : []);
    setHidden(el.health, !healthLines.length);
    if (!drawnAs(el.health, JSON.stringify([heat, rest]))) return;
    el.health.textContent = '';
    if (heat) {
      var c = document.createElement('span');
      c.className = 'chip';
      c.textContent = heat.chip + (rest ? '' : HEAT_ALONE);
      c.title = heat.full;
      el.health.appendChild(c);
    }
    if (rest) el.health.appendChild(document.createTextNode((heat ? ' \u00b7 ' : '') + rest));
    el.health.title = healthLines.join(' ');
  }

  function connect() {
    var src = new EventSource('/api/events');
    src.onopen = function () {
      socketUp = true;
      showConnection();
    };
    src.onmessage = function (e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      // Stamped here, on the clock this page is going to compare it against.
      // `at` comes off the Pi, and a Pi 4 has no real-time clock: it boots in
      // 1970 and jumps when the network arrives. Subtracting one machine's
      // clock from another's is how "12 seconds old" became "fifty-six years
      // old" — or, worse, a negative age that never trips the stale test at
      // all, leaving a frozen verdict on screen looking live.
      //
      // A replay does not move this clock at all. It carries the last
      // READING's age, not the last heartbeat's, and taking the older of the
      // two put a page opened between offers — minutes since a read, a
      // heartbeat four seconds ago — on "nothing from the scanner for 300s"
      // with the dot off and the picture dimmed, until the next heartbeat.
      // The seed from /api/status already knows when the scanner last spoke.
      if (!msg.replay) seenAt = Date.now();
      // ...and a live message from the scanner is the scanner running,
      // whatever the snapshot said. `scannerState` was taken once, from
      // /api/status at load, and a page opened in the seconds the server
      // was restarting the scanner read "scanner not running" for the rest
      // of the shift, verdicts flowing beside it.
      if (!msg.replay && scannerState && scannerState.enabled && !scannerState.running) {
        scannerState.running = true;
        scannerState.error = null;
      }
      // The camera saying it has run out of room. It rides the heartbeat rather
      // than a reading precisely because the state it describes is the one
      // where there may be no reading — the phone is brighter than the camera
      // can take, the card is washing out, and everything below keys on
      // `ready`, so a message that carries no verdict is dropped whole. This
      // has to be read off the message before that happens.
      if (msg.tooBright !== undefined) tooBright = !!msg.tooBright;
      if (msg.tooDim !== undefined) tooDim = !!msg.tooDim;
      // Same channel again, and the one that most needs it: while the journal
      // is refusing writes every reading still arrives looking perfect, so a
      // channel that rode a reading would be carried by messages that
      // contradict it.
      if (msg.notSaving !== undefined) notSaving = msg.notSaving || null;
      // ...and the camera, which has nothing else to ride: a rig that cannot
      // see sends no readings at all.
      if (msg.blind !== undefined) blind = msg.blind || null;
      // A phase is the autopilot speaking, and the autopilot only speaks for a
      // process that has just started — rpi/scan_pi.py sends no phase at all.
      // So the camera's word, which belonged to the process before it, goes:
      // a stalled camera is the one thing here that ends in a restart, and
      // held over it would stand in the verdict's place through CHECKING, and
      // over a SCANNER PROBLEM if the restart fails, until a beat cleared it.
      if (msg.phase) blind = null;
      // ...and the GPS and the Pi, which only ever ride the beat.
      if (msg.gps !== undefined) {
        gpsNow = msg.gps || null;
        gpsAt = Date.now();
        rememberFix(gpsNow);
        showNight();
      }
      // The GPS drop (gpsArrival in server.js): at the held order's door, on
      // this beat — and the order put down because the car left it, which is
      // Drop's reply arriving with nobody having pressed it.
      if (msg.atDropoff !== undefined) atDropoff = !!msg.atDropoff;
      // ...and the rest of its state on the same beat: pinned, arrived, why
      // not armed (heldEndState in server.js). Onto the order already
      // described, never a hold of its own — whether there IS an order is
      // said by `holding`, which a beat carries only when it changed.
      if (msg.heldEnd && heldSaid && holdingNow) {
        heldSaid.endPinned = !!msg.heldEnd.endPinned;
        heldSaid.arrived = !!msg.heldEnd.arrived;
        heldSaid.endWhy = msg.heldEnd.endWhy || null;
        // ...who pinned it: 'place' is said on the line (gpsSaidOf).
        heldSaid.endBy = msg.heldEnd.endBy || null;
        // ...and where (serverEnd): Map view draws it as D.
        heldSaid.endAt = msg.heldEnd.endAt || null;
        // ...and its pickups behind the car (visitPickups), which move the
        // next stop on and take the restaurant out of Map view's run.
        heldSaid.visited = Array.isArray(msg.heldEnd.visited) ? msg.heldEnd.visited : [];
      }
      // ...and every order's, with two in the car.
      if (msg.alive && Array.isArray(msg.orders) && holdingNow) heldList = msg.orders;
      if (msg.gpsDrop) {
        // One of two put down: what is left comes on the same message, and
        // the branch below takes it up.
        if (!msg.holding) orderDown();
        gpsDropSaidUntil = Date.now() + (msg.gpsDrop.saidForMs || 60000);
        showDrop();
      }
      if (msg.heldReplaced) {
        replacedSaidUntil = Date.now() + (msg.heldReplaced.saidForMs || 60000);
        replacedPay = typeof msg.heldReplaced.pay === 'number' ? msg.heldReplaced.pay : null;
      }
      if (msg.chooser !== undefined) {
        // The chooser IS the press's answer: the button stops saying
        // "reading…", and says what was read when a row files it.
        if (msg.chooser) {
          openChooser(msg.chooser);
          destBusy = false;
          showDest();
        } else if (choosing && choosing.kind !== 'drop') {
          closeChooser();
        }
      }
      if (typeof msg.unowned === 'number' && holdingNow) {
        unownedNow = msg.unowned;
        showHeld(heldMode);
      }
      if (msg.cpuC !== undefined) cpuNow = typeof msg.cpuC === 'number' ? msg.cpuC : null;
      if (msg.throttled !== undefined) throttledNow = msg.throttled || null;
      // ...and the heat guard the same beat's figures put the scanner in
      // (heatNote), which only the beat carries, like the two above.
      if (msg.heatGuard !== undefined) heatGuardNow = !!msg.heatGuard;
      // A new offer on the record. `tookState` resets with it — the mark
      // belongs to the offer, not to the button.
      //
      // ...and so does `tookFailed`, for the same reason and a worse one. It
      // says a write FAILED, which is a statement about one press on one card.
      // Left standing it was re-rendered against every later card: one dropped
      // POST — the link to the copy at home, the server restarting mid-shift —
      // and the button read "Took $8.20 · not saved" for the rest of the
      // shift, on cards the driver had never touched. Worse than a stale
      // label, because the title invites a retry, and pressing it on the wrong
      // card writes a real mark and a real pairing row into a journal whose
      // history cannot be regenerated.
      if (msg.offer && msg.offer.id) {
        var newCard = !onRecord || onRecord.id !== msg.offer.id;
        if (newCard) {
          tookState = false;
          tookFailed = false;
          // ...and its age starts here: server.js stamps offerAt at the same
          // moment, a new id (see tookAge).
          recordAt = Date.now();
          // ...and the destination read off the last card, which belongs to
          // that card and not to this one.
          //
          // `destSaid` was cleared by a press, by a held order ending, and by
          // a page load — and by nothing at all on the screening path, which
          // is the path the passive capture made ordinary. Screen a card that
          // prints "Customer dropoff", tap the pin on the phone, decline, and
          // the next card arrived with the button already green: "Dropoff read
          // as 123 Oak St. Press again to read it afresh", naming a job the
          // driver had just turned down.
          //
          // The worse half is the silence. `wants` — the amber "this one needs
          // a press" state — is gated on `!destSaid`, so a card that genuinely
          // refuses a destination stopped asking for one. Accept it and every
          // stack verdict for the rest of that delivery reads ENDS ?, with the
          // one control that would fix it sitting there claiming the answer
          // was already in.
          //
          // /api/status is fetched once, at load — it is not a poll — so
          // nothing downstream was ever going to catch this up.
          forgetDest();
          // ...and so does a failed one. "Nothing on that screen read as an
          // address" is an answer about the card the driver was looking at
          // when they pressed; carried onto the next card it is a complaint
          // about a press that was never made, on a button that would then be
          // refusing to ask for the press the new card actually needs — see
          // `wants`, which this suppresses.
          destFailed = false;
        }
        onRecord = msg.offer;
        showTook();
        // ...and the chooser, whose "This card" is about the card on the
        // record when it opened: with another one there, drawn without it.
        if (newCard && choosing) drawChooser();
        // ...and the dropoff button, whose whole screening condition is a
        // property of THIS offer: whether it named a destination and whether
        // the card refused one. The tick below would get there within a
        // second; a second is a long time on a screen the driver is reading
        // to decide, and the card may be gone by then.
        showDest();
        // ...and the status row, whose figures a row on disk has just
        // changed. See SHIFT_SOON_MS.
        shiftSoon();
      }
      // A read started, and — on the next message carrying a verdict — ended.
      // Same shape as the two above: no `ready`, so it cannot stand in for one.
      if (msg.reading) readingAt = Date.now();
      if (msg.ready !== undefined) readingAt = 0;
      // Only a reading moves the verdict's own clock. The guard is the same one
      // the next line uses to decide whether this message replaces the verdict
      // at all — a heartbeat carries no `ready`, and must not vouch for one.
      // A replay is not a read. The server sends the last reading to every
      // socket that connects, so a dropped connection coming back re-stamped a
      // dead rig's verdict as freshly read — once per reconnect, indefinitely.
      // Its age comes with it, for the same reason the seed above takes one.
      if (msg.ready !== undefined) {
        readAt = msg.replay ? Date.now() - age(msg.ageMs) : Date.now();
      }
      // ...and the card's: the last reading that carried one (cardOnMap).
      if (msg.ready) cardReadAt = readAt;
      if (msg.phase) phase = msg;
      // ...and a phase is a MOMENT, not a state. `scanning` is autopilot
      // saying it is about to exec into the scanner, and it is the last phase
      // anything ever emits — rpi/scan_pi.py sends none at all. So `phase`
      // stayed on that message for the whole shift, and the between-offers
      // branch appends `p.message` to the notice strip unconditionally: the
      // strip read "starting scanner" between every pair of offers, which is
      // where this rig spends most of its time.
      //
      // Cleared when the scanner itself speaks, because that is the thing the
      // message was narrating and it has now happened. Only for `scanning`:
      // `error` and `aim` are states a driver has to act on and outlive any
      // heartbeat. The headline does not move — PHASE_LABEL.scanning is
      // 'WAITING FOR AN OFFER' and so is the fallback when there is no phase.
      else if (phase && phase.phase === 'scanning') phase = null;
      if (msg.ready !== undefined) last = msg;
      // Every reading carries whether an order is being held, because the
      // server's own clock can end one — see holding() — with nothing pressed
      // here to say so. Without this the button outlives the order it puts
      // down, and a driver presses it on nothing.
      // ...and a ⌖ read the server filed onto the order in the car carries
      // that order too, with no `ready` (see heldForPanel in server.js): it is
      // where the held end reaches Map view between readings. Nothing else
      // that lacks `ready` carries `holding` — but the one beat after what is
      // held changed, which says it like a reading — so this widens the
