   * about 30cm away; the rig's own panel has the same pixel density and sits
   * roughly twice as far off, so the same letter subtends half the angle. The
   * lines below were all literal pixel values — 12.5px of read timings, a 12px
   * connection line, a 13px bar of controls — and the dashboard breakpoint near
   * the top of this file could not touch them, because they are declared after
   * it and win on source order. Written up here, they are simply later.
   *
   * The verdict itself was never the problem. These are the small things around
   * it that a driver still has to read: which figure is which, what the buttons
   * do, and whether anything is still reading offers.
   */
  @media (orientation: landscape) {
    .pending { font-size: 16px; }
    .connbar { font-size: 15px; padding: 4px; }
    .dot { width: 11px; height: 11px; }
    /* Two lines and this padding: 55.4px at 17px, on every landscape panel.
       On the 3.5" hat too, where the four fixed controls alone were 44:
       55.4 is what its bar already was whenever an offer was on record,
       which is most of a shift. Held at 44 there, the phone picture beside
       the card grew 6px wider and the card's four figures wrapped to two
       rows, running the pair offer 4px over the card's top and 2px over its
       foot (measured, held in rpi/test_layout.py). */
    .bottombar button, .bottombar .linkbtn { font-size: 17px; padding: 8px 4px;
                                             height: calc(2.2em + 18px); }
    #drawTools button { font-size: 17px; }
    #drawHint { font-size: 15px; }
  }
  /* ...and a fifth larger again on the rig's own 1024x600 display and
   * anything bigger. The sizes above were set on the 800x480 panel, and the
   * 1024x600 one took them unchanged: measured there, the address line was
   * 15px, the labels under the figures 16px over 20px figures and the line
   * under the card 16px, in a card with 60px of black above its label. The
   * address goes to 18 and the small type round it with it, by the same
   * fifth, so the figures stay larger than their labels (24 over 19).
   * Height-gated as well as width-gated: a wide panel only 480 tall is the
   * 800x480's budget, not this one's. rpi/test_layout.py measures each size
   * here and that the card, the bar and the row still fit.
   *
   * Not the notice. Its chips at 19px took 131px of the card on the
   * four-notice card beside the phone, where the sentences they stand for
   * took 110 — chips taller than the prose they shorten. At 16 they are the
   * shorter of the two, which is what they are for. */
  @media (orientation: landscape) and (min-width: 1000px) and (min-height: 560px) {
    .places, .stops { font-size: 18px; }
    .sub { font-size: 24px; }
    .sub small { font-size: 19px; }
    .pending { font-size: 19px; }
    /* ...and the status row, now that it is short (fillMore): 15 to 18. */
    .connbar { font-size: 18px; }
    /* The headline keeps its 26dvh under a pair with the answer on the card:
       this panel has the room (the line takes 24px of the 80 to 105 the
       1024x600 pair's card had spare, measured), so the 18dvh above is not
       taken. */
    .live:not(.driving) #verdict:has(#way:not([hidden])):not(:has(#warn:not([hidden]))) #perHour {
      font-size: min(16vw, 26dvh, 240px, calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
  }

  /* ---------- Driving: the card at a glance ----------
   *
   * While the car is being driven (showDriving: gps.py's `driving` on the
   * beat's fix) the card side takes one of two forms, and which is decided
   * by whether an offer is on the card.
   *
   * With an offer, the whole card (`.live.moving`). The owner's decision of
   * 17 Oct 2026, from a snap at 16 m/s (showDriving has it): the minutes, the
   * miles, $/mi, the working, both ends, the Trip Planner's stops if a press
   * read them, the pair line, the card line, every notice and the in-car
   * line are what an offer is decided on, and this form put them away until
   * the car stopped. They are drawn as the parked card draws them and at its
   * sizes — on the 1024x600 and larger, the fifth larger that was set for
   * the seat (above) — because that is the card rpi/test_layout.py has held
   * whole on every panel all along. The larger pay, rate, pair line and
   * in-car line this form used to give an offer were paid for with the rows
   * it put away, and with every row back there is no room to pay with: put
   * back over the whole card, they ran the card past its own edges (the
   * Done entry in AUDITS.md has the measurement).
   *
   * Two things wait for a stop on every panel, and neither is something an
   * offer is decided on:
   *  - the read diagnostics on the line under the card (#detail .diag: the
   *    read time, the leg count, the tracker's drift). Questions about the
   *    rig, not the offer, and the 3.5" hat never shows them at all. The
   *    reading's age beside them stays: it says whether the card is fresh.
   *  - the ⤳ route link at the end of the pair line. A control, not a fact:
   *    it opens a map in another tab over this panel, and the pair line in
   *    front of it says in words what the pair pays, for how long, and where
   *    the two jobs end.
   * And the two ends get a line each: parked they share one, ellipsised,
   * and a long pickup ran the dropoff off its end (showPlaces). Each still
   * ellipsises, inside its own line, so neither can take the other's.
   * Below the rig's own 1024x600 the card is smaller than the whole of it,
   * and what gives is said where it gives (the working, below; on the 3.5"
   * hat $/mi, the rate's size and the notice's room).
   *
   * Between offers, the driving form (`.live.driving`, never with `moving`):
   * the label and the order in the car larger, and the Trip Planner's stops
   * (and, while aiming, the mount's figures but the first) out of sight
   * until the car stops, or a tap brings them back for ten seconds. Sized on the card (`cqw`; the
   * verdict is a container, and so is the card side here) so a narrow card
   * is not handed a wide card's type.
   *
   * Only `.live`, in both: the picture, the map and its caption, the status
   * row and the bar are where they were, which rpi/test_layout.py holds, at
   * 1024x600, 800x480 and 480x320 in both pictures — whole, nothing cut, and
   * the driving form larger than the same card parked. Where a size below
   * stops short of what the room seems to allow, it is because the
   * measurement said so. */
  .live.moving #detail .diag,
  .live.moving #stack .maplink { display: none; }
  /* ...and, below the rig's own 1024x600, the working: the sum that joins
     the figures to the headline (the pay in the minutes, the raw $/hr, less
     the car costs, the net $/hr), whose every term but the raw rate and
     the cost is on the card already, as a figure or as the headline. A check on the headline,
     not a figure an offer is decided on, and the hat's own block above
     already calls it a sum "checked on a bigger screen when parked". On
     1024x600 and larger the card has the room and it stays. Below, the
     card did not: with a pair line and the notices up at 800x480 the first
     notice ran out of the card with it, and on the 3.5" hat the pair's
     verdict word did (measured; the Done entry has the figures). */
  @media (max-width: 999px), (max-height: 559px) {
    .live.moving #working { display: none; }
  }
  /* On the 3.5" hat a notice puts the figures away parked (the rule under
     `#verdict:has(#warn...)` there): the notice is the reason to doubt them
     and the card has no room for both. Moving, they are back — the pay, the
     minutes and the miles are the decision — and the notice is the item
     that gives way, as it is everywhere else (`.live #verdict > #warn`,
     which scrolls). A card the reader refused too: its notice says which
     figure to check, and the figures are what it is checked against. */
  @media (orientation: landscape) and (max-height: 380px) {
    .live.moving #verdict:has(#warn:not([hidden])) .submetrics { display: grid; }
    /* ...and the card is 191px tall, so the rest is paid for here, and only
       here. $/mi is put away: it is the pay over the miles, both figures
       drawn beside it, and without it the other three go across in one row
       (three columns, each value over its label: beside the scene picture
       the grid's own 74px columns took two, and four figures in two rows of
       value-beside-label were 46px; these are 34). Under a notice the rate
       takes 6.5vw, 31px — the parked hat's own is 12vw there, and 8vw under
       a pair, which it keeps — and is still the largest type on the card.
       With the figures back and none of this, the four-notice card beside
       the scene picture had 9px for its notice (39 parked, with no
       figures), now 51; and the trip of three ran the verdict word
       over the card's top there, as the parked pair, two orders and three
       all do already (AUDITS Open). Measured, rpi/test_layout.py. One form
       still does not have a row for its notice: the pair under the notices
       beside the scene picture, 11px of a 21px row (9 parked); it
       scrolls, and AUDITS has it under Open. */
    .live.moving .submetrics .sub:has(#vPerMile) { display: none; }
    .live.moving .submetrics { grid-template-columns: repeat(3, minmax(0, 1fr));
                               padding-top: 1px; row-gap: 0; }
    .live.moving #verdict .sub { flex-direction: column; align-items: center; gap: 0; }
    /* ...and the notice's 10px over it is 4: it is the item that gives way,
       and this is room it gets back. The chips are their own boxes, so
       nothing runs into them. */
    .live.moving #verdict > #warn { margin-top: 4px; }
    .live.moving #verdict:has(#warn:not([hidden])) #perHour {
      font-size: min(6.5vw, calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
  }
  /* Not on the 3.5" hat, whose card has no row to give the second end: its
     pair with the card line up puts the whole address line away parked as
     well (`#verdict:has(#way...) .places` above), and an offer there is
     the parked card's one line. `:not([hidden])` because `.places[hidden]`
     is weaker than this and an offer with no ends must draw none. */
  @media (orientation: portrait), (min-height: 381px) {
    .live.moving #places.two:not([hidden]) { display: flex; flex-direction: column; }
    .live.moving #places .end { overflow: hidden; text-overflow: ellipsis; }
    /* ...the first end with the same-store note before it, on one line: the
       note whole, the end giving way. */
    .live.moving #places.two > .withsame { display: flex; justify-content: center;
                                           min-width: 0; gap: .3em; }
    .live.moving #places .withsame > .same { flex: none; }
    .live.moving #places .withsame > .end { min-width: 0; }
  }
  .live.driving { container-type: inline-size; }
  .live.driving .submetrics .sub:not(:first-child),
  .live.driving #stops { display: none; }
  /* The pay's cell alone, across the card, its label beside it rather than
     under it, and no rule over it: the figures the rule divided it from are
     gone. Between offers it is drawn only while aiming (`novalue` puts a
     '--' away), and the size is the one measured when this form carried an
     offer's pay too. */
  .live.driving .submetrics { grid-template-columns: minmax(0, 1fr); border-top: 0;
                              padding-top: 0; }
  .live.driving .sub { flex-direction: row; align-items: baseline;
                       justify-content: center; gap: .3em;
                       font-size: clamp(22px, 8cqw, 44px); }
  /* 20px at the floor, two over the hat's parked 18: measured on the widest
     word this form ever carried, "≈ CLOSE CALL ?" (201px at 20 and 221 at
     22, against the 208 inside the hat's scene card). The words between
     offers are held whole at it by the "waiting" form in test_layout. */
  .live.driving .verdict-label { font-size: clamp(20px, 7.5cqw, 40px); }
  .live.driving .heldline { font-size: clamp(14px, 4cqw, 20px); }
  /* 16px at the floor, not 18: the 3.5" hat's scene card is 228px, and at 18
     each order's line took three rows there and pushed "2 dropoffs read ·
     whose?" out of the card. */
  .live.driving .heldline.between { font-size: clamp(16px, 5.5cqw, 27px); }
  @media (orientation: landscape) {
    /* The rate's box ('--' between offers) takes back what a notice cost it,
       and on the panels some of the room the hidden rows leave: its height
       term 34% of the screen where the parked card's is 26. */
    .live.driving #perHour,
    .live.driving #verdict:has(#warn:not([hidden])) #perHour {
      font-size: min(20vw, 34dvh, 240px, calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
  }
  @media (orientation: landscape) and (max-height: 380px) {
    /* The hat's card is 191px tall, and the rate there is the parked hat's
       own (12vw) without what a notice cost it. At the panels' size the
       first notice was squeezed out of the card. */
    .live.driving #perHour,
    .live.driving #verdict:has(#warn:not([hidden])) #perHour {
      font-size: min(12vw, calc((100cqw - 40px) / (var(--chars) * 0.62)));
    }
    /* On the hat a notice hides the figures (the rule under
       `#verdict:has(#warn...)` above); in this form the other three are
       gone and the pay's cell stays. */
    .live.driving #verdict:not(.novalue):has(#warn:not([hidden])) .submetrics { display: grid; }
  }

</style>
</head>
<body>

<main id="app">
  <div class="live">
    <section id="verdict" class="verdict empty">
      <div class="verdict-label" id="verdictLabel">WAITING FOR AN OFFER</div>
      <!-- The order in the car, between offers: where it goes next and by
           when, large, in the place WAITING FOR AN OFFER had to itself. See
           showHeld. -->
      <div class="heldnext" id="heldNext" hidden><div class="when"></div><div class="where"></div></div>
      <div class="rate big">
        <span class="rate-value" id="perHour">--</span>
        <span class="rate-unit" id="rateUnit">/hr</span>
      </div>
      <!-- The arithmetic behind the headline, spelled out, in two steps: what
           the card pays per hour, and what is left after running the car. A
           rate a driver cannot reconstruct at a glance is a rate they cannot
           act on, and both halves are worth seeing — one is checkable against
           the offer, the other is the one that decides. -->
      <div class="working" id="working" hidden></div>
      <!-- Both jobs at once, when there is already one in the car.
           A RANGE, never a single figure: the low end is the two jobs sharing
           nothing and the high end is the new one riding along inside the old,
           and which it turns out to be is a fact about two maps that this rig
           cannot see. Naming one number would be claiming that geography.
           Above the figures, number first: at the bottom of the card it was
           the row that ran past the border on the 1024x600 panel. -->
      <div class="stackline" id="stack" hidden></div>
      <!-- ...and whether this offer is along the way the order in the car is
           already going: Map view's caption figure, the same one, in one
           line and no verdict colour — ON THE WAY, OUT OF THE WAY or CAN'T
           TELL and why, its whole sentence one tap away. See showWay. -->
      <div class="wayline" id="way" hidden></div>
      <!-- As read off the card, so it can be checked against the phone in the
           two seconds before the offer times out. All four are deliberately
           the raw numbers: their whole job is to match what is on the screen.
           $/mi belongs to that rule and not beside it — the pay and the miles
           are the two boxes to its left, so the division has to come out. -->
      <div class="submetrics">
        <div class="sub"><span id="vPay">--</span><small id="lPay">pay</small></div>
        <div class="sub"><span id="vMin">--</span><small id="lMin">minutes</small></div>
        <div class="sub"><span id="vMile">--</span><small id="lMile">miles</small></div>
        <div class="sub"><span id="vPerMile">--</span><small id="lPerMile">$/mi</small></div>
      </div>
      <!-- Where the job goes. Sent on every read since the scanner learned to
           read a map, and painted nowhere until now — so the one screen a
           driver is actually looking at while they decide was the only one that
           could not tell them whether they recognise the job. Under the
           figures, because it is what you scan to recognise a job rather than
           what you judge it by. -->
      <div class="places" id="places" hidden></div>
      <!-- The order in the car, in one line: its pay, its next stop and the
           GPS drop's state. Under an offer it is the card's last line; between
           offers it sits under the next stop above, the rest of the card being
           hidden. See showHeld. -->
      <div class="heldline" id="heldLine" hidden><span class="pay"></span><span class="stop"></span><span class="gps"></span></div>
      <!-- ...and the second order, with carrying two on, in the same shape,
           and how many addresses are waiting for an owner. See showHeld. -->
      <div class="heldline" id="heldLine2" hidden><span class="pay"></span><span class="stop"></span><span class="gps"></span></div>
      <div class="heldline whose" id="whose" hidden></div>
      <!-- Uber's Trip Planner, as ⌖ Dropoff read it: every stop in order, one
           line each. Between offers only — when the card holds nothing but the
           phase and the notice, which it gives way to — and forgotten when the
           destination the same press read is. See showStops. -->
      <div class="stops" id="stops" hidden></div>
      <div id="warn" class="notice" hidden></div>
    </section>
    <div class="pending" id="detail" style="text-align:center"></div>
  </div>

  <!-- What the camera is actually looking at. The inset is the exact image
       handed to the reader, so aim and focus are both visible here.

       A child of #app rather than of .live, which is not a detail. On the rig's
       own dashboard panel #app becomes a two-column grid — the verdict beside
       the camera view — and this carries `grid-column: 2`. Nested one level
       deeper that property applied to nothing at all: .live is a flex column,
       so the view stacked underneath the verdict inside the left-hand column,
       and the right-hand column stayed empty. Measured on an 800x480 panel: two
       columns of 431px and 345px, the verdict rendered at 431px, the camera
       view at 431px below it, 43% of the glass black, and the page overflowing
       to 768px so the bottom bar fell off the bottom of the screen.

       Only visible when the camera is working, which is why it survived: with
       no frame the `:has(.gone)` rule collapses the grid to one column and the
       page looks right. -->
  <figure id="viewWrap">
    <img id="view" alt="live camera view">
    <!-- The same pane, showing a map instead of a picture.
         The driver's own words: "it is helpful having the phone screen display
         so I can verify that the numbers were read correctly... but it would
         also be helpful to have the map view so I can visually see the route
         as well as how they may chain together."

         A third mode on the picture rather than a fourth thing beside it, and
         a swap rather than a transparency. Two dense images over each other in
         a 269px-wide pane at 800x480 makes both unreadable, and the phone
         picture's whole job is letting the numbers be checked against what the
         card actually said — degrading that works against the one thing this
         rig exists for.

         Empty until asked for. Leaflet and the tiles come from the network and
         the public geocoder is asked about places customers live, so switching
         here is the press that decides it — the same gate as "Place them on a
         map" on the map page. (The NucBox, the driver's own, is asked without
         it for the card's line: see showWay.) -->
    <!-- The key to how each place was found (drawHow): one line over the
         map's bottom edge, inside the map so it is drawn only where the map
         is. Shown only when there is something of that drawn. -->
    <div id="liveMap" hidden><div id="mapKey" hidden><span class="k-all"><span class="k-item" data-k="disc"><span class="k-disc">◯</span> <span class="k-long">card's </span>reach</span><span
      class="k-item" data-k="pin"><span class="k-sep"> · </span><span class="k-pin">P</span><span class="k-drop">D</span><span class="k-pinword"> pin</span></span><span
      class="k-item" data-k="cand"><span class="k-sep"> · </span><span class="k-cand">●</span> <span class="k-long">also </span>found</span><span
      class="k-item" data-k="out"><span class="k-sep"> · </span><span class="k-out">○</span> outside</span><span
      class="k-item" data-k="hpick"><span class="k-sep"> · </span><span class="k-hpick">P</span> held pickup</span><span
      class="k-item" data-k="run" hidden><span class="k-sep"> · </span><span class="k-run">━</span> run</span><span
      class="k-item" data-k="job" hidden><span class="k-sep"> · </span><span class="k-job">━</span><span class="k-pinword"> offer</span></span><span
      class="k-item" data-k="extra" hidden><span class="k-sep"> · </span><span class="k-extra">┅</span> extra</span><span
      class="k-item" data-k="order" hidden><span class="k-sep"> · </span><span class="k-num">1</span><span class="k-num">2</span><span class="k-pinword"> order</span></span></span><span class="k-fail" hidden>how each was found: not drawn</span></div><div id="mapTip" hidden></div></div>
    <!-- What the "you are here" dot says about itself — "±12 m · 2 s old" —
         or why there is no dot: "GPS too rough here (±130 m)". Over the map's
         corner rather than in the caption below it, which is the detour's row
         and is clamped to what that line needs. Shown only in Map view, and
         only with a map under it. See drawHere. -->
    <div id="hereNote" hidden></div>
    <!-- Where the driver says the card is, when the scanner cannot find it. -->
    <div id="drawnScreen" hidden></div>
    <div id="drawn" hidden></div>
    <figcaption id="viewNote">camera view · inset is what the reader sees</figcaption>
    <div id="drawHint" hidden>drag a box around the whole phone screen</div>
    <div id="drawTools">
      <button type="button" class="linkbtn" id="drawUse" disabled>Next: card box</button>
      <button type="button" class="linkbtn" id="drawSkip" hidden>No card box</button>
      <button type="button" class="linkbtn" id="drawCancel">✕ Cancel</button>
    </div>
  </figure>

  <details id="raw" hidden>
    <summary>what the reader read</summary>
    <pre id="rawText"></pre>
  </details>

  <!-- The status link lives here rather than in the bottom bar, which has three
       slots and now spends one on something needed mid-shift. This is raw JSON
       for diagnosing a rig, so it belongs next to the connection state anyway. -->
  <!-- The verdict is the content of this page and it changes without a
       navigation, a focus move or anything else assistive tech notices.
       `atomic` because "ACCEPT $25.3" is one statement, not two updates. -->
  <p class="sr-only" id="spoken" role="status" aria-live="polite" aria-atomic="true"></p>

  <!-- What the shift adds up to, on the status row rather than inside the
       verdict card. The card has 20-50px of slack at 800x480 and the rules that
       fire when a notice shows already spend a line's worth of it buying the
       headline room back — on one real shift that was 52 of 121 offers. A
       permanent line in there would take that reserve away, and the overflow
       does not scroll: #verdict centres its children with plain `center`, so
       the excess clips off the TOP and the word ACCEPT goes first.

       This row is `auto` height and already holds one line, so a second item on
       it is nearly free. It also outlives a card, which is the point — the
       address above clears when the offer goes because it belongs to that
       offer, and a shift does not. -->
  <!-- 📷 Snap: a picture of this screen, kept on the rig to be shown to
       someone. See takeSnap in server.js for what one holds.

       HERE, and not on the bar. The bar holds six and a seventh sheds one —
       AUDITS.md's Settled has that, and styles.css does the arithmetic — so a
       control there would cost the driver ⌨ Type, or in the fullest state a
       control they press at a red light. The two other places with room were measured and
       are worse. The caption under the picture (#viewNote) is `display: none`
       on every landscape panel unless the map is up, when it is the map's own
       two-row line with a budget already measured to the word; and the whole
       pane, caption and all, is gone on a machine with no camera picture. A
       control in it would be on the rig's own glass only while the map is.
       The diagnostics line (#detail) is emptied and rebuilt by render(),
       which runs on every message from the scanner and on this page's
       one-second tick, so a control inside it would be thrown away and made
       again every second — mid-press, as like as not — and the diagnostics
       half of it is hidden on the 3.5" hat.

       This row is on the glass on every panel, in every view and with or
       without a camera picture, nothing rewrites it but its own text, and it
       already holds the one other thing on this page that is about the rig
       rather than the offer: the status link. It costs the row no height — see #snap in the stylesheet — so
       nothing on the bar moves and nothing is shed, which rpi/test_layout.py
       holds at all six panels by measuring the bar with this control and
       without it. What it does cost is width, out of the shift line beside
       it, and where the row has none to give — the 3.5" hat, a phone held
       upright — it is not drawn, by the row's own width as the stylesheet
       measures it, and snaps.html carries the same press. From any screen it
       photographs the rig's display, which is what its title says.

       Not 52px, which every control on the bar is held to. Those are pressed
       at a red light; this is pressed parked, with the mouse, to keep a
       picture, and the status link beside it is the same kind of target. -->
  <div class="connbar"><span class="dot" id="dot"></span><a id="conn" href="/api/status">connecting…</a><span id="health" hidden></span><span id="shift" hidden></span><button type="button" id="snap" title="📷 Snap: keep a picture of the rig's own screen, on the rig, to share. They are listed on the offers page under 📷 Snaps.">📷<span class="word"> Snap</span></button><button type="button" id="more" aria-expanded="false" aria-controls="moreSheet" aria-label="Everything the status row has to say" title="Everything the status row has to say">…</button></div>
  <!-- ...and what "…" opens: the status row in full, over the foot of the
       verdict pane. See fillMore. -->
  <div class="moresheet" id="moreSheet" hidden></div>

  <!-- The chooser and the Undo, over the verdict pane: see .chooser. -->
  <div class="chooser" id="chooser" role="dialog" aria-label="Choose" hidden></div>
  <button type="button" class="undo" id="undo" hidden></button>

  <nav class="bottombar">
    <!-- The one thing the rig cannot see: whether the driver pressed Accept.
         It must never press it, so this is the only way that fact ever reaches
         the record — and until now it meant opening the offers page afterwards
         and finding the row.

         It names the offer because by the time a driver has accepted on their
         phone the card is gone from this panel: the scanner sees the navigation
         screen, reads no card, and the verdict clears. A button saying only
         "took it" would be marking something they can no longer see. -->
    <button type="button" class="linkbtn" id="took" hidden></button>
    <!-- Put the order down. Shown only while one is being carried, because a
         control for a state you are not in is a control that teaches people to
         ignore the bar. It expires on its own clock too — see holding() in
         server.js — so this is the driver saying "sooner than that", not the
         only way out of it. -->
    <button type="button" class="linkbtn" id="drop" hidden>Drop</button>
    <!-- Read the destination off the phone, once an order is in the car.

         An offer card does not say where a delivery ends: Uber prints
         "Customer dropoff" and the address only appears on the screen after the
         accept. 106 of 604 real cards are like that — 18% of everything the rig
         sees — and it is what leaves the stack line silent on 39% of the pairs
         it is asked about.

         Shown in TWO states, which is the thing to know before touching this
         bar: an order is held, OR a card is on the panel with no destination
         on it and nothing in the car. The second is screening — the driver
         already taps the dropoff on their phone before deciding, and that is
         the moment this is worth pressing. See showDest.

         It matters here and not only at the handler, because the bar overflows
         when two of the three conditional buttons show, and the pair this
         opened up is took + dest with no drop. A reader of this comment used
         to conclude that dest implied drop, and the rule that sheds the parked
         links was written on exactly that assumption.

         Conditional at all, for the reason Drop is: a control for a state you
         are not in teaches people to ignore the bar. It stays available after
         a successful read, because the first thing a driver will want when it
         reads the wrong screen is to press it again. -->
    <button type="button" class="linkbtn" id="dest" hidden>⌖ Scan</button>
    <a class="linkbtn parked" href="index.html">⌨ Type</a>
    <!-- NOT `parked`, which it used to be, and that was the whole of why the
         offers page was hard to reach.

         The rule that sheds the parked links fires when the bar is full — and
         the bar is full exactly when an order is in the car or a card is being
         screened, which is to say whenever the driver is working. So the one
         link to the log stood down precisely during the hours it would be
         wanted, and came back when the car was empty. The link was there the
         whole time; it was just never there when anybody looked.

         It is still read parked. That is not the same question as whether it
         can be REACHED while moving: the driver pulls over, and the way to the
         list has to be on the screen in front of them when they do, not
         conditional on them having put the order down first.

         What stands down in its place is the keypad link, in the fullest state
         only. ▣ Set box never does. See styles.css for the arithmetic. -->
    <a class="linkbtn" href="journal.html">▤ Offers</a>
    <button type="button" class="linkbtn" id="setBox">▣ Set box</button>
    <!-- Two things this picture gets used for, and they want opposite
         pictures. Aiming the mount wants the whole scene with the outline on
         it; working the phone through this screen — which is what a bluetooth
         mouse on the phone and the rig's display in front of you amounts to —
         wants the phone's screen and nothing else. `aria-pressed` because it
         is a mode, not a navigation.

         Written here in the state the page starts in — the phone — so the
         button does not spend a frame claiming the wrong mode before the
         script gets to it. The script still owns it afterwards, because the
         driver's last choice is remembered. -->
    <button type="button" class="linkbtn" id="viewMode" aria-pressed="true"
            title="Switch between the whole scene and the phone's screen"
            >⛶ Scene</button>
  </nav>
</main>

<script>
(function () {
  'use strict';

  // How long the rig can say nothing at all before this page stops believing
  // it is running.
  //
  // What this is measured against is a *heartbeat*, not a reading. It used to
  // be readings, on the reasoning that the scanner emits several times a second
  // while a card is on screen and keeps emitting between cards — and neither
  // half of that is true. A still picture moves the motion gate not at all, so
  // between offers there can be minutes with no read; and a card sitting
  // unchanged has its verify beat back off to VERIFY_MAX with a read on the end
  // of it, which is 6.0 + 3.7 = 9.7s of silence at the p90 read and 11.9s at
  // the worst one measured. The page would dim the verdict and say the rig had
  // stopped, at the moment the driver is reading it to decide.
  //
  // The loop says "still here" every ALIVE_EVERY = 4s instead, which is what
  // this is comparing against and is the thing actually worth knowing: a wedged
  // loop stops sending it, an idle one does not. Three missed heartbeats.
  //
  // The figures in this paragraph were "ninety seconds", "twelve seconds" and
  // "a 1.4s read", and all three were stale — the window is 12s, the ceiling is
  // 6.0, and a read is 1.85s at the median off the owner's own 272. See
  // READ_SECONDS in scan_pi.py, which is where that cost is written down, and
  // READ_STALE_MS below, which is the other constant derived from it.
  var STALE_MS = 12000;

  // Every POST this page makes, with a deadline on it.
  //
  // A `fetch` has no timeout of its own: a connection that opens and never
  // closes leaves the promise pending for ever, and nothing after it runs. Car
  // wifi produces exactly that — a hotspot the Pi is associated with and cannot
  // reach through. `loadShift` below knew this and guarded itself; the five
  // controls on the bar did not, and every one of them cleared its busy flag
  // only in the `.then()` after the fetch. So Took, Drop, ⌖ Dropoff, ⟳ Re-find
  // (since removed) and "✓ Read this box" each sat at "…", disabled, for the rest of the shift
  // — after ONE press on a bad connection, with nothing saying why and no way
  // back but reloading the page. The controls a driver uses at a red light are
  // the last place to leave that.
  //
  // A deadline makes the promise settle: `AbortError` lands in the same
  // `.catch` the other failures already use, and each control's existing
  // "failed" state is what appears. That is the honest answer anyway — nothing
  // was written, and the button says so.
  //
  // Twenty seconds, the same figure `loadShift` uses and for the same reason:
  // long enough that a busy rig is not cut off mid-answer, short enough that a
  // driver is not left looking at a dead button.
  var POST_TIMEOUT_MS = 20000;

  function ask(url, opts) {
    opts = opts || {};
    // Feature-detected rather than assumed: this page is opened from phones and
    // laptops as well as the panel, and a browser without AbortController gets
    // the behaviour it had before, which is the old behaviour and not a crash.
    if (typeof AbortController !== 'function') return fetch(url, opts);
    var stop = new AbortController();
    var timer = setTimeout(function () { stop.abort(); }, POST_TIMEOUT_MS);
    var out = {};
    Object.keys(opts).forEach(function (k) { out[k] = opts[k]; });
    out.signal = stop.signal;
    // Cleared on both paths. A timer left running would fire into an aborted
    // controller — harmless — but it also keeps this page's one-second tick
    // company for twenty seconds after every press, for nothing.
    return fetch(url, out).then(function (r) {
      clearTimeout(timer);
      return r;
    }, function (e) {
      clearTimeout(timer);
      throw e;
    });
  }

  var el = {};
  ['verdict', 'verdictLabel', 'perHour', 'vPay', 'vMin', 'vMile', 'warn', 'detail', 'conn', 'dot',
   'lPay', 'lMin', 'lMile', 'raw', 'rawText', 'rateUnit', 'vPerMile', 'lPerMile',
   'working', 'places', 'spoken', 'took', 'shift', 'stack', 'way', 'drop', 'dest',
   'health', 'stops', 'heldNext', 'heldLine', 'heldLine2', 'whose', 'chooser', 'undo']
    .forEach(function (id) { el[id] = document.getElementById(id); });

  /* Every write to the card lands only when what it says has changed.
   *
   * render() runs on every message — a reading every third of a second while
   * a card is read, a beat every four — and on the one-second tick, and it
   * wrote every element of the card each time: the same words over the same
   * words, the working rebuilt from its HTML, the pair line, the notices, the
   * detail line and the status row taken down and put back. A text or a
   * class written with its own value is still a change to the page, and the
   * next frame lays the card out again for it. Measured at 6x CPU throttle in
   * the 1024x600 panel, Map view up and an order in the car: 20 readings of
   * one unchanged card cost 47 layouts and 758 ms of main thread, 2.35
   * layouts and 38 ms a reading, for a card that looked the same after as
   * before. rpi/test_dashboard.py counts the layouts.
   *
   * The plain ones compare with what is there. A part built of elements is
   * drawn again only when the key of what it says moves (`drawnAs`), and
   * every writer of such a part goes through its key: one that wrote round
   * it would leave the key saying something the glass does not. */
  // A number reads back as a string, so it is compared as one.
  function setText(node, s) { s = String(s); if (node.textContent !== s) node.textContent = s; }
  function setHidden(node, on) { if (node.hidden !== on) node.hidden = on; }
  function setClass(node, c) { if (node.className !== c) node.className = c; }
  function setTitle(node, t) { if (node.title !== t) node.title = t; }
  function setAttr(node, k, v) { if (node.getAttribute(k) !== v) node.setAttribute(k, v); }
  function drawnAs(node, key) {
    if (node.drawnKey === key) return false;
    node.drawnKey = key;
    return true;
  }

  // Keep the headline number inside the panel whatever it says. The unit comes
  // with it: while aiming, that number is a pixel count, and labelling a pixel
  // count "/hr" made a mount measurement read as a fantastic offer.
  // The headline, at a size that does not move.
  //
  // Sizing to the exact character count meant $9.8 rendered about 25% larger
  // than $25.3, so the number visibly jumped every time the rate crossed ten —
  // on a screen being glanced at from a moving car, where the one thing that
  // should be still is the digit you are trying to read. Five characters is
  // the width of everything from "$9.8" to "$1234", so within any rate this
  // rig can produce the size is now constant.
  var RATE_CHARS = 5;

  function setRate(text, unit, keepLayout) {
    setText(el.rateUnit, unit || '/hr');
    setText(el.perHour, text);
    var chars = String(Math.max(RATE_CHARS, text.length));
    if (el.perHour.style.getPropertyValue('--chars') !== chars) {
      el.perHour.style.setProperty('--chars', chars);
    }
    el.verdict.classList.toggle('novalue', text === '--' && !keepLayout);
  }

  // "-$10.60", not "$-10.6". A minus sign wedged between the dollar and the
  // digits is a dash at a glance, and the two parked screens already write it
  // the other way — so the same offer read as a loss on one screen and,
  // briefly, as a number on the other.
  function rateText(n) {
    if (n === null || n === undefined || !isFinite(n)) return '--';
    var big = Math.abs(n) >= 100;
    return (n < 0 ? '-$' : '$') + (big ? Math.round(Math.abs(n))
                                       : Math.abs(n).toFixed(1));
  }

  // One sentence, only when it changes.
  //
  // The scanner emits several times a second, and a live region that is
  // rewritten on every frame is read continuously and tells you nothing. What
  // matters is the verdict and the rate it was made on, so that is the whole
  // announcement and it is silent until one of them moves.
  var saidLast = '';

  function announce(r) {
    var say = r.state === 'doubt'
      ? ({ pay: 'Check the pay.', time: 'Check the time.',
           speed: 'Check the distance.',
           // Named for what the driver has to do about it, like the rest of
           // these. "Part of the trip did not read" is the cause; looking at
           // the card's time is the action.
           leg: 'Check the time, most of the trip did not read.',
           // Both figures can be sane alone and impossible together, so this
           // one names the pair rather than picking a side.
           rate: 'Check the pay and the time.',
           // There is no card, so there is nothing to check. Spoken because
           // the alternative is "read that again" about a screen that will
           // never become an offer however long it is pointed at.
           screen: 'Not an offer.' }[r.doubt] || 'Read that again.')
      : (({ go: 'Accept', warn: 'Close call', no: 'Pass' }[r.state] || '')
         + ', ' + rateText(r.perHour) + ' an hour'
         + (r.locked && r.whole !== false ? '.' : ', still reading.'));
    if (say === saidLast) return;
    saidLast = say;
    el.spoken.textContent = say;
  }

  function showRaw(text) {
    var body = (text || '').trim();
    setHidden(el.raw, !body);
    if (body) setText(el.rawText, body);
  }

  var last = null;
  var phase = null;      // setup progress, before any offer exists
  // When this page last heard anything at all, by its own clock.
  var seenAt = Date.now();

  // ...and, separately, when a *reading* last arrived.
  //
  // These were one clock and had to become two the moment the loop started
  // sending a heartbeat. A heartbeat proves the loop is turning, which is what
  // the connection dot and the picture are about; it proves nothing whatever
  // about the verdict on screen. Merged, the heartbeat kept the clock fresh
  // while every read was failing — a degenerate quad, a tesseract that died, a
  // full disk — and the page went on showing the last ACCEPT at full opacity,
  // green dot, over a live picture of whatever card was actually in the mount.
  // Measured on a rig with reads raising: 50 heartbeats, 2 verdicts, and
  // nothing on the screen admitting it.
  var readAt = Date.now();

  // Longer than the verdict beat can legitimately be quiet, and no longer.
  //
  // The scanner's ceiling on that beat is VERIFY_MAX and a read lands on the
  // end of it, so the largest healthy gap between verdicts is those two added
  // together. The arithmetic that gave 12000 was "6.0 + 0.75 is 6.75s, and this
  // leaves most of it again as slack" — and the 0.75 was never measured. It was
  // extrapolated from a speed-up seen on a development machine, and the rig is
  // a Pi 4 that is also drawing this page.
  //
  // Measured on 272 real offers out of the owner's own journal: the median read
  // is 1846ms and the p90 is 3657ms, against the 750ms assumed. So the honest
  // healthy gap is 6.0 + 3.7 = 9.7s, not 6.75s, and a 12s window left 2.3s of
  // slack where it was supposed to leave most of the gap again. One read in ten
  // is slower than the p90; at the worst read measured, 5915ms, a perfectly
  // good verdict came within 90 milliseconds of being dimmed as stale — on the
  // hardest card, which is the one the driver most needs to trust.
  //
  // 16s: comfortably over 1.5x the honest gap and well under 2.5x it, so a
  // loaded Pi is not called dead and a genuinely dead one is not called alive
  // for a shift. The scanner's own constants are what set it — see
  // READ_SECONDS_SLOW in scan_pi.py, which is the p90 and is used wherever a
  // WORST case is meant rather than a typical one.
  //
  // The two constants live in two files. test_scan_pi.py reads this one out of
  // this page and asserts the relationship, rather than keeping a copy of it.
  var READ_STALE_MS = 16000;

  // An age off the wire, made safe to subtract from this page's clock.
  //
  // A missing one means "no idea", and the honest answer to that is the oldest
  // thing this page can represent rather than the freshest: a verdict of
  // unknown age is exactly the one not to vouch for. A negative one is a clock
  // that disagrees with itself, and clamping it is what stops an age from
  // reading as the future and never going stale at all.
  function age(ms) {
    if (typeof ms !== 'number' || !isFinite(ms) || ms < 0) return READ_STALE_MS + 1;
    return ms;
  }
  var socketUp = false;
  var scannerState = null;
  // The camera is out of room: the phone is brighter than it can take at any
  // setting that does not make the screen ripple. Not a fault in the rig, and
  // the one thing that fixes it is a slider on the phone in the driver's hand —
  // so it belongs on this screen and nowhere else.
  var tooBright = false;
  // The same complaint from the other end, and the one nothing used to report:
  // gain on its ceiling, already on the longest exposure, and the screen still
  // under target. The picture goes dark and the reads go with it.
  var tooDim = false;
  // The journal has stopped taking writes, in the scanner's own words, or null.
  //
  // The only failure on this page that costs something which cannot be got
  // back. A washed-out card can be re-read and a box drawn wrong can be
  // drawn again; an offer nobody wrote down is simply gone, and so is every
  // one after it for as long as it lasts. A read-only SD card is the classic
  // Pi failure and it is completely silent from up here — the rig goes on
  // reading, pricing, speaking the verdict and painting a green ACCEPT, and
  // the only sign was a line in a log on a headless box.
  //
  // The driver's own tick already reports its failures, because that write
  // goes through a request that can answer 500. The offers do not: they are
  // written from inside the scan loop with nobody to answer, which is why this
  // rides the heartbeat.
  var notSaving = null;

  // What the camera cannot see, in the scanner's word — 'stalled' or 'dark' —
  // or null while it can.
  //
  // The one state on this page that means the rig is not working at all, and
  // the one it had no channel for. The owner's rig read once in 9.4 days: the
  // heartbeat came every four seconds, the connection line said "scanner
  // reading" throughout, and a full shift of offers went past a box that was
  // dark, or a camera handing over one picture for ever — the log cannot say
  // which. So it is not a note on the connection line, which is muted on
  // purpose and for things that can wait for the next stop. It takes the
  // verdict's place — see render() — because a stalled camera frozen on an
  // offer card goes on re-reading that card, and the verdict it paints looks
  // as live as any other while it is about a card long gone.
  var blind = null;

  // What the verdict's place says while that lasts: the word where the verdict
  // goes, the line under it saying what to do. Short, because on the 3.5" hat
  // the line shares a narrow column with the phone's picture, and red, in this
  // page's own style. rpi/test_dashboard.py holds both whole inside the card
  // at 800x480, 1024x600 and 480x320, with the bar where it was.
  //
  // `dark` says what the rig knows and no more. It is nothing in the box the
  // gain counts as a lit screen, and a phone in the mount turned down low
  // reads exactly like an empty mount — this repo has lit screens on record
  // at 4 and 6, and the owner's box read 1-2 in the reads either side of the
  // blind week. It was NOTHING IN VIEW, "put the phone in the mount", which
  // told a driver whose phone was in the mount and lit that it was not, and
  // never offered the remedy that would have worked. Then it was TOO DARK TO
  // SEE, "no lit screen the rig can see", which is still more than is known:
  // a lit dark-mode screen reading 15 to 19 is under the bar, and the motion
  // gate notices a card arriving on it — 6.27 at 15 and 7.90 at 19 against
  // the 6.0 it needs, on all eight draws of the sensor noise at each — where
  // a light-mode one reading 18 scores 2.23 and is missed on all eight. The
  // box's reading cannot tell the two apart, so what is known is that the rig
  // cannot be SURE of seeing an offer arrive. The word says that, and the
  // line asks for both remedies. See the note under STALL_SAY in
  // rpi/scan_pi.py, which has the rest of the measurements.
  //
  // `stalled` says how often the rig restarts it, and "stays" as well as
  // "keeps coming back": a stall within ten minutes of the last restart over
  // one is sat out with the word left on the glass, not restarted
  // (STALL_AGAIN in scan_pi.py). "The rig restarts it" said otherwise for
  // those ten minutes.
  var BLIND_LABEL = { stalled: 'CAMERA STALLED', dark: 'TOO DARK TO BE SURE' };
  var BLIND_NOTE = {
    stalled: 'The camera is sending the same picture over and over. The rig '
           + 'restarts it at most once in ten minutes; if this stays or keeps '
           + 'coming back, reseat its cable.',
    dark: 'The rig may miss an offer arriving in a box this dark — check the '
        + 'phone is in the mount with its screen on, and turn its brightness up.'
  };
  // ...and the same two as the chip the glass shows (see showNotes), with the
  // sentence above one tap away. Each keeps what is wrong and what the driver
  // does about it. Not "RESTARTING": a stall within ten minutes of the last
  // restart is sat out, and the sentence's "at most once in ten minutes" is
  // the wording that stays true of both; it is one tap away. For the dark
  // box, that an offer may be missed and BOTH remedies, because a phone
  // turned down low reads the same as one out of the mount.
  var BLIND_CHIP = {
    stalled: 'SAME PICTURE · reseat its cable if this stays',
    dark: 'MAY MISS OFFERS · phone in the mount, screen on, brightness up'
  };

  // The GPS, as the scanner has settled it, and the Pi's own report on itself.
  // Off the heartbeat like the five above, for the same reason: every reading
  // goes on arriving perfect while either is wrong. A phone whose GPS app has
  // timed out costs every offer row from then on its position, and on the
  // owner's week 0 of 1,166 rows carried one with nothing anywhere saying
  // whether that was a choice or a fault. A throttling Pi reads slower and
  // said so nowhere. See heatNote() and healthNote() for what reaches the
  // glass.
  var gpsNow = null;
  // ...and when the beat that carried it arrived, on THIS page's clock. The
  // beat's `gps.fix` is the newest position with gps.py's judgement on it;
  // the "you are here" dot ages it from here, so a beat that stops coming
  // does not leave "2 s old" on the glass. See MV.hereDot.
  var gpsAt = 0;
  var cpuNow = null;

  // --- driving: the card at a glance ------------------------------------------
  //
  // While the car is being driven the card side takes one of two forms.
  //
  // With an offer on the card, the whole card (the stylesheet's
  // `.live.moving`): the owner's decision of 17 Oct 2026, from a snap taken at
  // 16 m/s of an Uber offer, $9.31 for 34 min and 8.7 mi from a KFC to a
  // corner in Marietta, on which this panel showed PASS, $11.8/hr, the pay and
  // one notice and nothing else: "it sometimes leaves info off the card ...
  // this can make it hard to decide to take the offer or not, it is better to
  // have the full info presented." The minutes, the miles, $/mi, both ends,
  // the stops, the pair line and every notice are what the offer is decided
  // on, and a decision is the one thing this card is up for while it is
  // moving. Two things only wait for a stop, the read diagnostics and the
  // route link, and on the smaller panels what does not fit; the stylesheet
  // says why each is not decision information.
  //
  // Between offers, the driving form (`.live.driving`): the order in the car
  // and the label larger, the stops and the '--' figures out of sight until
  // the car stops or a tap (PEEK_MS). Nothing in it is an offer, so nothing
  // it puts away is something an offer is decided on.
  //
  // So `.live` carries `moving` (being driven, an offer up) or `driving`
  // (being driven, no offer, not peeking) or neither, never both. "An offer
  // is up" is render()'s own test for its offer branch (a reading that is
  // ready, and a rig that can see), asked here before render draws anything
  // so the form and the card arrive in the same frame; rpi/test_dashboard.py
  // holds the two to the same answer from both sides of the change.
  //
  // Whether it is being driven is rpi/gps.py's answer, put on
  // the beat's fix as `driving` (DRIVING_SPEED there, with the 12 Oct shift's
  // measurements): this page asks nothing again but how long it may go on
  // believing it. gps.py holds a driving state for DRIVING_HOLD (10 s) past
  // its last usable fix and then ends it, and the beat carries what is left
  // of that as `drivingFor`. A beat that stops coming leaves the last one
  // standing, and once its `drivingFor` has run out on this page's own clock
  // the state is one gps.py has already ended. No fix, a beat that does not
  // say (a scanner from before it did), or the hold run out: the whole card,
  // which is what a driver sees when nothing is known.
  //
  // This asked the fix's `freshFor` instead — the staleness rule, 20 s on the
  // rig — so a rig that went quiet mid-drive kept the driving form for up to
  // twice the hold. `drivingFor` is never more than `freshFor` (the hold is
  // the shorter, and runs from the last usable fix, no later than the last
  // fix), so it is the one clock asked. A fix the gate refused is gps.py's
  // to judge: mid-drive it holds the state, so the page does not ask `gpsOk`
  // again.
  //
  // No control for it (AUDITS Settled: the bar holds six). Between offers a
  // tap on the card side shows the whole card for PEEK_MS — the Trip
  // Planner's stops, which the driving form puts away — and the driving form
  // comes back on its own. With an offer up there is no peek, because there
  // is nothing put away that a peek would be for: the tap goes to what it
  // landed on, a notice's sentence or the card line's, as it does parked.
  var PEEK_MS = 10000;
  var peekUntil = 0;
  var drivingShown = false;
  var liveSide = document.querySelector('.live');

  function drivingNow() {
    var f = gpsNow && gpsNow.fix;
    if (!f || f.driving !== true) return false;
    var held = typeof f.drivingFor === 'number' ? f.drivingFor : 0;
    return Date.now() - gpsAt <= held * 1000;
  }

  // render()'s branch test, `!r || !r.ready || blind`, the other way up.
  function offerUp() { return !!(last && last.ready && !blind); }

  function showDriving() {
    var moving = drivingNow(), offer = offerUp();
    drivingShown = moving && !offer && Date.now() >= peekUntil;
    liveSide.classList.toggle('driving', drivingShown);
    liveSide.classList.toggle('moving', moving && offer);
  }

  // Captured on the way down, so while the driving form is up the tap is
  // the peek and nothing under it takes it too. Parked, peeking, or with an
  // offer up (no driving form), it passes straight through.
  liveSide.addEventListener('click', function (e) {
    if (!drivingShown) return;
    e.preventDefault();
    e.stopPropagation();
    peekUntil = Date.now() + PEEK_MS;
    render();
  }, true);

  // A tap on the in-car line opens the offers page at its In car list, where
  // each order has its own Drop (journal.html#incar) — the page ▤ Offers
  // opens, so no new control on the bar. While the driving form is up the
  // tap above is the peek and never reaches here; a second tap, on the
  // peeked card, does. Under an offer the line is the card's last (.held).
  function openInCar(e) {
    if (e.target.closest('#heldLine, #heldLine2, #detail .held')) {
      location.href = 'journal.html#incar';
    }
  }
  liveSide.addEventListener('click', openInCar);

  // --- the panel at night ------------------------------------------------------
  //
  // After civil dusk at the car's position the panel goes to its night
  // palette (`html.night` in the stylesheet): darker greys, less between
  // them, and the map's tiles darker under their filter. A panel set for the
  // day is a lamp in a dark car, and the driver's eyes are on the road
  // between glances. Worked out here, on the Pi's own clock, from the fix on
  // the beat: MV.nightFor, a few lines of solar arithmetic with no network.
  //
  // With no fix on the beat, the last one this page saw, kept in this
  // browser so a reload after dark still knows where the car is — to two
  // decimals, about a kilometre, which moves dusk by seconds and is all the
  // position this needs. With neither, or a clock still in 1970, day: a
  // panel too bright at night is glare; one dimmed in sunshine cannot be
  // read. Nothing on the bar: the stylesheet and the sun decide it.
  var FIX_KEY = 'uberscan.lastFix';
  var lastFix = null;
  try {
    var keptFix = JSON.parse(localStorage.getItem(FIX_KEY) || 'null');
    if (keptFix && typeof keptFix.lat === 'number' && typeof keptFix.lon === 'number') {
      lastFix = { lat: keptFix.lat, lon: keptFix.lon };
    }
  } catch (e) { /* private mode, or nothing kept */ }

  function rememberFix(g) {
    var f = g && g.fix;
    if (!f || typeof f.lat !== 'number' || typeof f.lon !== 'number'
        || !isFinite(f.lat) || !isFinite(f.lon)) return;
    var kept = { lat: Math.round(f.lat * 100) / 100, lon: Math.round(f.lon * 100) / 100 };
    if (lastFix && lastFix.lat === kept.lat && lastFix.lon === kept.lon) return;
    lastFix = kept;
    try { localStorage.setItem(FIX_KEY, JSON.stringify(kept)); } catch (e) { /* as above */ }
  }

  // ...and only from a map-view.js that has the arithmetic. sw.js can hand
  // this page the one from before it, as it can for the other MV functions
  // this file guards one by one (drawHow, mapWants), and called bare there
  // it threw: at boot, before the one-second tick, loadShift and the service
  // worker were set going, and then on every beat, before render(). The card
  // never went stale and the dot stayed green over a rig that had stopped —
  // measured on the panel with nightFor deleted from MV: no interval set,
  // "just now" and "scanner reading" eighteen seconds after the last word.
  // Without it, day, which is what this says with no fix.
  function showNight() {
    var now = gpsNow && gpsNow.fix;
    var night = !!MV && typeof MV.nightFor === 'function'
      && MV.nightFor([now, lastFix], Date.now(), CLOCK_BELIEVABLE_AFTER);
    document.documentElement.classList.toggle('night', night);
  }
  var throttledNow = null;

  // A card is under the reader right now. The gap this fills is the one the
  // driver actually notices: a read is about 1.8 seconds on a Pi 4 and this
  // panel spent every one of them saying WAITING FOR AN OFFER over a row of
  // dashes, which is what it says when the phone is blank. The card was there
  // and the rig had already started on it.
  var readingAt = 0;

  // ...and how long that claim is good for. A read that has not come back in
  // this long did not take a while, it failed: the loop reports a broken read
  // to its log rather than as a reading, so nothing would ever clear this.
  // Comfortably longer than a slow read on a loaded Pi and far short of the
  // staleness test above, so a stuck reader shows as stale rather than as
  // permanently busy.
  var READING_MS = 8000;

  // Said in terms of what to do, not what happened. "Clipping at the gain
  // floor" is true and useless; the driver is holding the thing that fixes it.
  var TOO_BRIGHT = 'Phone screen too bright for the camera — turn its '
                 + 'brightness down a notch.';
  var TOO_DIM = 'Phone screen too dim for the camera — turn its brightness up '
              + 'a notch, or move the mount out of the shade.';

  // A notice, as the card shows it: a CHIP — a few words, the state in
  // capitals and what it means or what to do after the dot — with the whole
  // sentence one tap away (showNotes). The sentences were written to be read
  // parked; at a glance from the seat a line of 14px prose is not read at
  // all, and three of them were a block the eye skips. Every chip keeps the
  // part a driver acts on: a refusal keeps its reason ("NO RATE · 7.8 mi
  // untimed"), a hedge keeps its direction ("may look better"), a remedy
  // keeps the remedy. Nothing is deleted — the sentence is on the chip's
  // title for a mouse resting on it, and tapping the notice swaps every chip
  // for its sentence.
  function note(chip, full) { return { chip: chip, full: full || chip }; }
  var TOO_BRIGHT_CHIP = 'PHONE TOO BRIGHT · turn it down a notch';
  var TOO_DIM_CHIP = 'PHONE TOO DIM · turn it up, or out of the shade';
  // The scanner's own sentence is "Offers are NOT being saved: <why>", and
  // the why is the system's — "[Errno 30] Read-only file system". The chip
  // keeps the why without the errno, which is a number for a log.
  function notSavingChip(said) {
    var why = String(said).replace(/^Offers are NOT being saved:?\s*/, '')
      .replace(/^\[Errno \d+\]\s*/, '');
    return 'OFFERS NOT SAVED' + (why && why !== said ? ' · ' + why : '');
  }

  // Where the job goes, as the card wrote it.
  //
  // One line, ellipsised. An address can be sixty characters and this panel is
  // read at arm's length in a moving car: a second line of small grey text
  // costs the headline room it needs more. Two places are joined with an arrow,
  // the same way the offers page writes them, so the two screens read alike —
  // and since both now ask MV.ends for them, that is one rule rather than a
  // resemblance two files have to keep up by hand.
  // Each end its own element, so that moving each can have a line of its own
  // (`.live.moving #places` in the stylesheet): one line ellipsised is what
  // parked draws, and a long pickup \u2014 the owner's 17 Oct snap, a KFC with
  // its street in brackets \u2014 ran the dropoff off its end. The words are the
  // same either way: "A \u2192 B", the arrow at the head of the second end, so
  // the text is what it was and parked draws exactly what it drew. Only a
  // pickup and a dropoff (`two`) get their lines: a list of three or more is
  // MV.ends handing back the frames' union, not two ends, and stays one line.
  function showPlaces(list, same) {
    var where = (list || []).filter(function (p) { return !!p; });
    if (drawnAs(el.places, JSON.stringify([where, same || null]))) {
      el.places.classList.toggle('two', where.length === 2);
      el.places.textContent = '';
      where.forEach(function (p, i) {
        if (i) el.places.appendChild(document.createTextNode(' '));
        var end = document.createElement('span');
        end.className = 'end';
        end.textContent = (i ? '\u2192 ' : '') + p;
        // ...and, at the head of the line, whether this card's pickup is the
        // store of an order in the car (sameNote): with the first end in a
        // span of its own (`.withsame`), so moving, where the ends are a line
        // each, the note rides the first end's line and is not one more.
        if (!i && same) {
          var row = document.createElement('span');
          row.className = 'withsame';
          var tag = document.createElement('span');
          tag.className = 'same';
          tag.textContent = same;
          tag.title = 'This offer is picked up at the same restaurant as an order '
            + 'already in the car: the same door, or the same distinctive name close by.';
          var sp = document.createElement('span');
          sp.className = 'sp';
          sp.textContent = ' ';
          row.appendChild(tag);
          row.appendChild(sp);
          row.appendChild(end);
          el.places.appendChild(row);
          return;
        }
        el.places.appendChild(end);
      });
    }
    setHidden(el.places, !where.length);
  }

  /* "same store as ①" — or "same store as in car" with one order, which
   * has no number on this panel to be named by — when the server says this
   * card's pickup is the store of an order in the car (server.js
   * sameStoreOf; the owner's decision of 18 Oct 2026). Off the stack, so it
   * goes when the pair line goes; null otherwise.
   *
   * A FACT, not a verdict: the card's verdict, rate, figures and pair line
   * are drawn as they would be without it. WHERE: at the head of the address
   * line, under the pair line, beside the pickup it is about. Not ON the pair
   * line, which was tried and measured (rpi/test_layout.py): that row is full
   * at 800x480 beside the phone and 1024x600 beside the scene picture — a
   * range, the ENDS chip and the route link leave it 75px — so "same store as
   * in car" (154px) wrapped it and put PASS outside the card, and on the 3.5"
   * hat beside the scene picture it cut the range. The address line is one
   * ellipsised line whose words are the ones that give way, and the head of
   * it is the one place the ellipsis never reaches. */
  function sameNote(r, short) {
    var s = r && r.stack;
    if (!s || !s.sameStore) return null;
    var n = (s.heldCount > 1 || s.vsFirst) && s.sameStoreN ? circled(s.sameStoreN) : null;
    // The short form, for the pair line on the 3.5" hat (showStack): the
    // line only appears with an order in the car, so "same store" alone
    // says "as the one in the car".
    if (short) return 'same store' + (n ? ' ' + n : '');
    return 'same store as ' + (n || 'in car');
  }

  // Both jobs at once, when there is already one in the car.
  //
  // A range and not a figure. The low end is the two sharing no road at all and
  // the high end is the new one riding along inside the old; where between them
  // the truth sits is a fact about two maps, and this rig has no map. It says
  // what it knows \u2014 what the pair pays over a time bounded at both ends \u2014 and
  // leaves the geography to the driver, who is looking at the phone anyway.
  //
  // NO VERDICT COLOUR. This row used to take the verdict's three states from
  // `s.state`, green only when the whole range cleared the target, and that
  // was a verdict on the wrong thing. `worst` is the pair's money over the
  // pair's time, which is the time-weighted mean of the held job's rate and
  // the offer's — so money already being earned on the job in the car carried
  // the colour, and a cheap card drawn in against a rich hold came out green.
  // Replayed over the real week on the driver's own 31 marks: 267 pair lines,
  // 71 of them green, and 45 of those 71 were offers whose own net rate was
  // under the $25 line — 30 drawn under a PASS headline and 15 under CLOSE
  // CALL. A green "take both" beneath a red PASS is a confidently wrong
  // answer on the one screen read at a glance.
  //
  // Deleted, not redefined. The fix every proposal reached for — green only
  // where the offer's OWN rate clears target — is the headline restated:
  // `withStack` hands stack() the same billed minutes, cost and target rate()
  // used, so the offer's own marginal rate IS the headline's perHour. Over the
  // same 267 lines "own rate clears target" and the headline's ACCEPT
  // disagree 0 times. The accept decision is the headline's; this row says
  // what only it can — how much clock the pair adds, and where the two jobs
  // end. `s.state` stays on the payload, because server.js writes it into
  // the journal's pair rows and the offers page buckets on it.
  // Whole dollars with the sign in front of the dollar, not inside it.
  //
  // The same rule rateText() applies a hundred lines up, and the reason is the
  // same: "$-16" reads as a dash at a glance from the driving seat. This row
  // was the one money formatter on the page that did not follow it, and the
  // range made it worse — "+ $-16\u2013-31/hr" puts an en dash between two minus
  // signs, which is not a range, it is a smear.
  //
  // Whole dollars rather than rateText()'s one decimal because this row is the
  // half of the line that gives way when the panel runs out of width, and it is
  // a RANGE: the spread between the two ends is the information, and a tenth of
  // a dollar inside a fifteen-dollar spread is noise bought at the price of the
  // clause after it.
  function dollars(n) {
    return (n < 0 ? '-$' : '$') + Math.abs(Math.round(n));
  }

  function showStack(s) {
    if (!s) { setHidden(el.stack, true); setClass(el.stack, 'stackline'); return; }
    // Ordered by value, not by which field they came from. `worst` divides the
    // pair's money by the LONGER time and `best` by the shorter, so on money
    // above zero worst is the smaller — and below zero that reverses, because
    // dividing a negative by a smaller number makes it more negative. A losing
    // pair therefore printed its range backwards, low end first and larger.
    var lo = Math.min(s.worst, s.best), hi = Math.max(s.worst, s.best);
    // The base colour, whatever the state. See NO VERDICT COLOUR above.
    setClass(el.stack, 'stackline' + (s.ends === 'elsewhere' ? ' elsewhere' : ''));
    showRoute(s.route);
    setHidden(el.stack, false);
    // The rest only when what it says has moved, and never the route link
    // with it (showRoute).
    if (!drawnAs(el.stack, JSON.stringify([lo, hi, s.heldCount, s.minMinutes, s.maxMinutes,
                                           s.sure, s.uncosted, s.ends, s.vsFirst,
                                           s.sameStore, s.sameStoreN, s.onTime, s.lateMin,
                                           s.offWayMi, waySearch]))) return;
    // Built from parts rather than one string, because the parts have different
    // priorities when the row runs out of room. See .stackline in styles.css:
    // this is the half that gives way, and it can because the same figures are
    // on the panel above it.
    [].slice.call(el.stack.childNodes).forEach(function (n) {
      if (n !== routeLink) el.stack.removeChild(n);
    });
    var put = function (part) {
      el.stack.insertBefore(part, routeLink && routeLink.parentNode === el.stack ? routeLink : null);
    };
    var sum = document.createElement('span');
    sum.className = 'sum';
    // The range, first and larger, in an element of its own that never
    // shrinks: the words after it are what the ellipsis eats (`.more`). Under
    // the figures it was 16px of muted text at the foot of the card, and on
    // the 1024x600 panel in a browser window the row ran out past the card's
    // border (the driver's snap of 12 Oct, 17:19); above the figures and
    // whole is where it is now, held by rpi/test_layout.py at 1024x600,
    // 800x480 and 480x320.
    var range = document.createElement('b');
    range.className = 'range';
    range.textContent = (Math.round(lo) === Math.round(hi)
         ? dollars(lo) : dollars(lo) + ' to ' + dollars(hi)) + '/hr';
    var more = document.createElement('span');
    more.className = 'more';
    // The number first, because the ellipsis eats from the other end.
    //
    // This read "+ the one you have: $26\u201335/hr over 23\u201335 min", putting twenty
    // characters of framing in front of the one figure the row exists for \u2014 and
    // this is the half of the line designed to give way. Measured on the 3.5"
    // hat it showed "+ the one you have: $26": a truncated range that reads as
    // a point estimate, which is a worse thing to show than no range. The words
    // that were lost are the ones the row's own existence already says \u2014 this
    // line only appears when there is an order in the car.
    // "to" rather than an en dash, because the dash cannot survive a minus
    // sign beside it and this is exactly the row where that happens: a pair
    // that loses money is the one a driver most needs to read correctly.
    // ...and with two in the car (carrying two on) not "the one you have":
    // which ones is said whole, beside the chip (`.both`, below).
    // The on-time hint first (server.js onTimeHint, the owner's decision of
    // 20 Oct 2026): whether some order of the stops, by the NucBox router's
    // drive times and a fixed allowance at each pickup, reaches both drops by
    // their deadlines. In the words that give way, not a chip of its own:
    // measured in rpi/test_layout.py, a chip or a column of its own wrapped
    // the row at 800x480 and cut the range on the 3.5" hat, and the range
    // is what this row exists for. First in the words, so it is the last of
    // them the ellipsis reaches. No verdict colour: it decides nothing. With
    // no deadline it falls back to the road miles the new pickup adds, said
    // only where the card's own way line, which says that figure, will not
    // be up (no NucBox search).
    var hint = onTimeSaid(s);
    if (hint) {
      var ot = document.createElement('span');
      ot.className = 'ontime';
      ot.textContent = ' ' + hint + ' \u00b7';
      more.appendChild(ot);
    }
    more.appendChild(document.createTextNode((s.heldCount > 1 ? ' over ' : ' with the one you have, over ')
      + (s.minMinutes === s.maxMinutes
         ? Math.round(s.minMinutes)
         : Math.round(s.minMinutes) + '\u2013' + Math.round(s.maxMinutes))
      + ' min'
      // The one claim that does not depend on the geography: better than just
      // finishing what you have, even sharing nothing. Worth saying out loud
      // because it is the only part of this a driver can act on without
      // checking the map.
      //
      // Kept INSIDE the ellipsised half, which is where it started. Pulling it
      // out into a `flex: none` element of its own was tried and measured
      // worse in the way that matters: the clause then always wins and the
      // range gives way instead, so the 800x480 panel showed "+ the one you
      // have: $26–35/h" and the 3.5" hat showed "+". The number is what this
      // row exists for; a clause that survives by eating it is a bad trade.
      + (s.sure ? ' \u00b7 beats finishing alone' : '')
      // ...and whether that range is the pair or only a ceiling on it. One of
      // the two cards printed no distance the rig could charge, so the money
      // above is gross and the target it is being held to is net.
      //
      // The note above the verdict says the same thing when the OFFER is the
      // uncosted one. It says nothing when the order already in the car is,
      // and then this line was a range with no reason on the screen to read
      // it as a ceiling.
      + (s.uncosted ? ' \u00b7 a ceiling, no distance to charge' : '')
      // Where the two jobs END, which is the half the arithmetic above cannot
      // reach: the range assumes either nothing is shared or the new job rides
      // along inside the old one, and geography decides which. Said in the
      // card's own words rather than a distance, because a town and a compass
      // quadrant are all these cards print. Nothing is said when they did not
      // print enough - about half the time - because a guess here costs an
      // hour and a late delivery. See Advice.sameArea.
      //
      // 'same-zip' is the strongest of these and only reachable once the
      // destination has been scanned off the screen after the accept - an
      // offer card prints no ZIP. It is worth its own words because "same
      // town" is nearly meaningless where this driver works: 44% of their
      // placed dropoffs are in Atlanta, which is 135 square miles, and a metro
      // ZIP is a few.
      ));
    sum.appendChild(range);
    sum.appendChild(more);
    // ...and the same-store note's short form, drawn on the 3.5" hat alone,
    // where the address line it rides everywhere else is put away (see
    // sameNote and the rule under the hat's media query).
    var same = sameNote({ stack: s }, true);
    if (same) {
      var tag = document.createElement('span');
      tag.className = 'same';
      tag.textContent = same;
      tag.title = 'This offer is picked up at the same restaurant as an order already '
        + 'in the car: the same door, or the same distinctive name close by.';
      sum.className = 'sum withsame';
      sum.appendChild(tag);
    }
    put(sum);
    // ...and the half that does not give way. Its own element, so the ellipsis
    // above can never reach it: these words are the only place this claim is
    // made, and losing them leaves the driver a range with nothing to say
    // that its optimistic end has been ruled out.
    //
    // ...including when it has nothing to say, which is the case that had no
    // shape at all. `null` — about half of real pairs — appended no chip and
    // changed nothing else on the row, so "I looked at where these two jobs
    // end and found nothing to warn you about" and "I have no idea where they
    // end" drew the identical line, and an unchipped row reads at a glance as
    // a pair that was checked and came back clean — which is precisely the
    // wrong "these end near each other" this rig prices at an hour of driving
    // and a rating.
    //
    // Measured over the corpus's own address fixtures, sameArea refuses on 127
    // of 300 pairs. 37 of those had BOTH ends parse and were still refused —
    // those rows draw a route link and no chip today, which is a row that
    // looks fully answered. The other 90 are the merchant-only cards ("Papa
    // John's Store 3317") that 106 of 604 real cards print instead of an
    // address.
    //
    // `?` because that is already this panel's glyph for the rig declining to
    // answer, and in the doubt colour, which is deliberately none of the three
    // verdict colours for the same reason .verdict.doubt is not: this is not a
    // worse "near" or a softer "elsewhere", it is a refusal.
    var ends = s.ends === 'elsewhere' ? 'ENDS ELSEWHERE'
             : s.ends === 'same-zip' ? 'same ZIP'
             : s.ends === 'same-side' ? 'same side of town'
             : s.ends === 'same-town' ? 'same town' : 'ENDS ?';
    var chip = document.createElement('span');
    chip.className = 'ends' + (s.ends ? '' : ' unknown');
    chip.textContent = ends;
    chip.title = s.ends ? '' :
      'Neither card printed enough for the rig to say whether these two jobs '
      + 'end near each other. It is not saying they do.';
    // With two orders in the car and carrying two OFF — a hold file written
    // while it was on, read back at boot — the range is the pair with ①
    // alone (see withStack in server.js): said beside the chip, whole. With
    // it on the range is against both, and the words above say so.
    if (s.vsFirst) {
      var vs = document.createElement('span');
      vs.className = 'vs';
      vs.textContent = 'vs \u2460 only';
      vs.title = 'Two orders are in the car. This weighs the new one against the '
        + 'first you took, not against both.';
      put(vs);
    }
    // With two in the car and carrying two on, the range is the card against
    // BOTH (Advice.stackMany), and which two is said in the numbers the
    // in-car lines go by: "with ① + ②". Whole, in the slot "vs ① only" had,
    // and not in the words that give way: measured in rpi/test_layout.py at
