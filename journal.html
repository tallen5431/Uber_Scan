<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uber Scan — Offers</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="advice.js"></script>
<style>
  /* live.html is a screen glanced at while driving and is sized to fill the
     viewport exactly. This one is read while parked, it scrolls, and it is the
     one page here worth being able to select text on — the shared rules turn
     selection off everywhere so a mistimed long-press cannot highlight the
     verdict mid-shift, which is not a risk when the car is stopped. */
  #app { height: auto; min-height: 100dvh; }
  body { user-select: text; -webkit-user-select: text; overscroll-behavior: auto; }

  /* The bar is a background, not a box, so a long row cannot push the layout
     sideways on a narrow phone — which is the only screen this is read on. */
  .block { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .block .label { flex: none; width: 62px; font-size: 12px; color: var(--muted);
                  font-variant-numeric: tabular-nums; }
  .block .bar { flex: 1; height: 20px; border-radius: 4px; background: var(--panel);
                background-image: linear-gradient(to right, var(--go) 0 0);
                background-repeat: no-repeat; position: relative; }
  .block .bar.warn { background-image: linear-gradient(to right, var(--warn) 0 0); }
  .block .bar.no   { background-image: linear-gradient(to right, var(--no) 0 0); }
  .block .amount { flex: none; width: 58px; text-align: right; font-size: 13px;
                   font-weight: 700; font-variant-numeric: tabular-nums; }
  .block .n { flex: none; width: 30px; text-align: right; font-size: 11px; color: var(--muted); }
  /* Two lines inside the same 62px the other rows use, rather than a fifth
     column that would narrow these bars and stop them being comparable. */
  .runlabel { line-height: 1.25; }
  .runlabel em { display: block; font-style: normal; font-size: 10px; opacity: .8; }
  /* The target line, drawn where the eye needs it rather than described. */
  /* Exactly the bar's own box: label 62 + gap 8 on the left; gap 8 + amount 58
     + gap 8 + count 30 on the right. It was 92px, so the target tick — the
     line every bar on the page is read against — sat 6px off the middle of
     the bars it was labelling. */
  .scale { position: relative; height: 12px; margin-left: 70px; margin-right: 104px; }
  .scale span { position: absolute; top: 0; transform: translateX(-50%);
                font-size: 10px; color: var(--muted); letter-spacing: .04em; }
  /* Set apart from the figures above it, because it is a different kind of
     claim. Everything else on this page is a measurement; this is a
     recommendation, and it should be obvious which is which. */
  .advice { border: 1px solid var(--line); border-radius: 12px;
            background: var(--panel); padding: 12px 14px; margin: 18px 0 4px; }
  .advice[hidden] { display: none; }
  .advice h2 { margin: 0 0 6px; }
  .advice p { margin: 0; font-size: 14px; line-height: 1.5; }
  .advice b { font-variant-numeric: tabular-nums; }
  .advice .note { margin-top: 8px; }
  /* One caveat per line, marked, rather than four facts run together in a grey
     block the eye skips whole. */
  ul.note { list-style: none; margin: 18px 0 0; padding: 0; }
  ul.note li { position: relative; padding-left: 14px; margin-bottom: 5px; }
  ul.note li::before { content: '·'; position: absolute; left: 3px; }
  /* Sits above the bottom bar rather than over the content, so it never covers
     the row that was just acted on — which is the row the driver is deciding
     about. */
  #nothing { border: 1px solid var(--line); border-radius: 12px;
             background: var(--panel); padding: 18px 16px; margin: 4px 0 8px;
             font-size: 14px; line-height: 1.55; }
  #nothing[hidden] { display: none; }
  #nothing b { display: block; font-size: 16px; margin-bottom: 6px; }
  #nothing code { font-size: 13px; color: var(--text); background: var(--panel-2);
                  padding: 1px 5px; border-radius: 4px; }
  .find { display: block; margin: 0 0 10px; }
  .find input { width: 100%; min-height: 44px; padding: 10px 12px; font: inherit;
                font-size: 15px; color: var(--text); background: var(--panel);
                border: 1px solid var(--line); border-radius: 10px;
                -webkit-appearance: none; appearance: none; }
  .find input::placeholder { color: var(--muted); }
  #showHidden { font: inherit; font-size: 12px; font-weight: 700;
                min-height: 44px; padding: 6px 12px; color: var(--muted);
                background: transparent; border: 1px solid var(--line);
                border-radius: 8px; cursor: pointer; }
  #showHidden[aria-pressed="true"] { color: var(--text); border-color: var(--muted); }
  .offer.hiddenrow > summary { opacity: .5; }
  /* The way back, always in reach.
     This page is one continuous list — a week of offers is fourteen thousand
     pixels of it — and the only link back to the scanner sat at the very
     bottom. Getting to it meant scrolling past every offer of the week, on a
     touchscreen, having opened the page to check one figure. A bar that stays
     put costs 56px of a screen that scrolls anyway. */
  .bottombar { position: sticky; bottom: 0; z-index: 6;
               background: var(--bg); padding: 8px 0 calc(env(safe-area-inset-bottom) + 4px);
               margin-top: 4px; }
  /* ...and the list needs room to scroll clear of it, or its last row is
     permanently behind the bar. */
  #log { padding-bottom: 8px; }
  #undo { position: sticky; bottom: 64px; z-index: 5;
          display: flex; align-items: center; gap: 12px;
          margin: 12px 0 4px; padding: 10px 12px;
          background: var(--panel-2); border: 1px solid var(--line);
          border-radius: 12px; font-size: 13px; }
  #undo[hidden] { display: none; }
  #undoWhat { flex: 1; min-width: 0; }
  #undoGo { flex: none; min-height: 44px; padding: 8px 16px; font: inherit;
            font-size: 13px; font-weight: 800; color: var(--text);
            background: var(--panel); border: 1px solid var(--muted);
            border-radius: 8px; cursor: pointer; }
  .rangebtns { display: flex; gap: 6px; justify-content: center; margin: 0 0 14px; }
  /* 44px, like everything else meant to be hit one-handed after parking. */
  .rangebtns button { flex: 1; min-height: 44px; padding: 8px 0; font: inherit;
                      font-size: 13px; font-weight: 700; color: var(--muted);
                      background: var(--panel); border: 1px solid transparent;
                      border-radius: 8px; }
  .rangebtns button[aria-pressed="true"] { color: var(--text); border-color: var(--muted); }
  h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
       color: var(--muted); margin: 22px 0 8px; font-weight: 700; }
  /* Every figure on this page is a rate, and not one of them said so. "$21
     TYPICAL" reads perfectly naturally as "the typical offer pays $21" — the
     total on the card, which is the one number here that is never meant. The
     unit is now attached to the figure rather than left to be inferred. */
  h2 em { font-style: normal; text-transform: none; letter-spacing: .02em;
          opacity: .75; font-weight: 600; }
  .unit { font-style: normal; font-size: 11px; font-weight: 700;
          color: var(--muted); letter-spacing: 0; }
  .stats .unit { font-size: 12px; }
  /* Three numbers, one of which is the answer and two of which are the shape
     around it. They were the same size, the same weight and the same colour,
     so the eye had to read all three labels to find out which was which. */
  .stats > div { opacity: .68; }
  .stats > div.answer { opacity: 1; }
  .stats > div.answer span { font-size: 1.35em; }
  .stats > div.answer small { color: var(--text); }
  /* At 320px "QUARTER BELOW" wrapped to two lines while "TYPICAL" did not,
     leaving the middle cell floating against two taller neighbours. */
  @media (max-width: 430px) {
    .stats small { font-size: 9.5px; letter-spacing: .02em; }
  }

  /* The log. Grouped by day because that is how a shift is remembered, and how
     it is checked against a statement. */
  /* Sticky, because it used to scroll away — and halfway down three hundred
     rows every one of them was an offer on an unknown day. */
  .day { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
         position: sticky; top: 0; z-index: 2; background: var(--bg);
         margin: 18px 0 2px; padding: 10px 0 4px;
         border-top: 1px solid var(--line); }
  .day b { font-size: 13px; letter-spacing: .02em; }
  .day span { font-size: 11px; color: var(--muted); }

  .offer { border-bottom: 1px solid var(--line); }
  .offer > summary {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    cursor: pointer; list-style: none; font-variant-numeric: tabular-nums;
  }
  .offer > summary::-webkit-details-marker { display: none; }
  /* The marker was removed for a tidier row and nothing replaced it, so three
     hundred rows gave no sign that any of them opened — and what is inside is
     the whole reason to keep the log: what the card said, what the scanner
     made of it, and the buttons to tick or hide it. */
  .offer > summary::after {
    content: '\203A';
    flex: none;
    margin-left: 2px;
    font-size: 17px;
    line-height: 1;
    color: var(--muted);
    transform: rotate(90deg);
    transition: transform .12s ease;
  }
  .offer[open] > summary::after { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) {
    .offer > summary::after { transition: none; }
  }
  .offer .big { font-size: 19px; font-weight: 800; min-width: 84px; }
  .offer .big em { display: block; font-style: normal; font-size: 11px;
                   font-weight: 600; color: var(--muted); line-height: 1.3; }
  .offer .meta { font-size: 12px; color: var(--muted); min-width: 0;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The place on its own line under the figures, dimmer than them: it is what
     you scan down to recognise a job, not what you judge it by. */
  .offer .meta em { display: block; font-style: normal; font-size: 11px;
                    opacity: .8; overflow: hidden; text-overflow: ellipsis; }
  .offer .when { margin-left: auto; padding-left: 6px; font-size: 11px;
                 color: var(--muted); flex: none; }
  /* Set aside: still listed, because an offer missing from the record is the
     thing that makes a record impossible to check against. */
  /* Dim, not hidden, and still legible — these are exactly the rows a driver
     goes looking for when a job they remember is not in the figures. */
  .offer.aside > summary { opacity: .62; }
  .offer .tag { flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
                text-transform: uppercase; color: var(--warn);
                border: 1px solid currentColor; border-radius: 4px; padding: 1px 4px; }
  .offer .why { font-size: 11px; color: var(--warn); padding: 0 0 8px 20px; }

  /* Taken. A tick in the summary so the list can be read for what was actually
     worked, without opening anything. */
  /* The dot was styled only under `.hist`, which is the settings sheet's history
     list on the other page. On an offer row it matched nothing: no width, no
     height, no colour — an empty inline span. Every row on this page has been
     carrying an invisible verdict since it was written. */
  .offer .dot { flex: none; width: 10px; height: 10px; border-radius: 50%;
                background: var(--line); }
  .offer .dot.go   { background: var(--go); }
  .offer .dot.warn { background: var(--warn); }
  .offer .dot.no   { background: var(--no); }
  .offer .took { flex: none; font-size: 13px; color: var(--go); font-weight: 800; }
  .offer.mine > summary .big { color: var(--go); }

  .acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 12px 20px; }
  /* These are the destructive ones — 'I took this', 'hide every offer like
     this' — so they are the last place a mis-tap should be easy. */
  .acts button {
    font: inherit; font-size: 13px; font-weight: 700;
    min-height: 44px; padding: 8px 14px;
    color: var(--muted); background: var(--panel); border: 1px solid transparent;
    border-radius: 8px; cursor: pointer;
  }
  .acts button.on { color: var(--go); border-color: var(--go); }
  .acts button.danger { color: var(--no); }
  .acts button:disabled { opacity: .5; }

  /* One row per fact, so a figure can be found by running a finger down it. */
  .facts { margin: 0 0 12px; padding: 0 0 0 20px; font-size: 12.5px; }
  .facts h3 { font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
              color: var(--muted); margin: 10px 0 4px; font-weight: 700; }
  .facts div { display: flex; justify-content: space-between; gap: 12px;
               padding: 2px 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums;
              text-align: right; }
  .facts .quiet dd { font-weight: 500; color: var(--muted); }

  /* ---------- A screen bolted to a dashboard ---------- */
  /* The same breakpoint styles.css uses, and it has to be here rather than
     there: nearly every class on this page is declared in this block, and this
     block is loaded after the stylesheet, so anything set out there for these
     rules loses to whatever is written above.
   *
   * What that left is a page rendering at 9.5, 10, 11 and 12 pixels — the day
   * headers, the time each offer came in, the rate before costs, the counts
   * beside every bar, the axis labels, and the sentence explaining why a row
   * was set aside. Those sizes were chosen for a phone about 30cm away. This
   * screen is at arm's length, so the same letter subtends half the angle, and
   * they are exactly the figures the page exists to be read for. Nothing here
   * changes a colour or a layout — only how big the small print is. */
  @media (orientation: landscape) {
    /* This is the one page that is *read* rather than glanced at, and the
       across-the-screen layout lifts the shared `max-width: 480px` so the
       charts and the log rows can use the panel. On a 1280 screen that gave
       running text a 1252px measure — around 130 characters a line — and on a
       1920 one, 1892px and 200 characters. The eye loses its place returning
       to the start of a line long before that.
       Two caps, because the two want different widths: the page as a whole so
       a desktop window does not stretch a week of offers across a monitor, and
       the prose inside it to something a line of text is meant to be. The bars
       and the rows keep the full width — a bar is read by length, not by
       reading along it. */
    #app { padding-left: 14px; padding-right: 14px;
           max-width: 1180px; margin-left: auto; margin-right: auto; }
    #headline, .hint, .note, .advice p, #nothing, .empty-msg, .offer .why {
      max-width: 72ch; margin-left: auto; margin-right: auto;
    }
    h2 { font-size: 15px; }
    .hint, .note, #headline { font-size: 15px; line-height: 1.5; }
    .advice p { font-size: 16px; }
    .stats .unit { font-size: 14px; }
    .unit { font-size: 13px; }

    .block { padding: 6px 0; }
    .block .label { width: 78px; font-size: 14px; }
    .block .amount { width: 66px; font-size: 16px; }
    .block .n { width: 34px; font-size: 13px; }
    .runlabel em { font-size: 12px; }
    .scale { margin-left: 86px; margin-right: 118px; }
    .scale span { font-size: 13px; }

    .day b { font-size: 16px; }
    .day span { font-size: 14px; }
    .offer .big { font-size: 22px; min-width: 96px; }
    .offer .big em { font-size: 13px; }
    .offer .meta { font-size: 15px; }
    .offer .meta em { font-size: 13px; }
    .offer .when { font-size: 14px; }
    .offer .tag { font-size: 12px; }
    .offer .why { font-size: 14px; }
    .offer .took { font-size: 16px; }
    .facts { font-size: 15px; }
    .facts h3 { font-size: 12px; }

    .rangebtns button, #showHidden, .acts button, #undo, #undoGo { font-size: 15px; }
    #nothing { font-size: 16px; }
    #nothing b { font-size: 18px; }
    #nothing code { font-size: 15px; }
    .find input { font-size: 16px; }
  }
</style>
</head>
<body>
<main id="app">

  <!-- A group, named, with the pressed one announced. It was four unlabelled
       buttons whose selected state existed only as a border colour. -->
  <div class="rangebtns" id="ranges" role="group" aria-label="How far back to look">
    <button type="button" data-days="1" aria-pressed="false">Today</button>
    <button type="button" data-days="7" aria-pressed="true">7 days</button>
    <button type="button" data-days="30" aria-pressed="false">30 days</button>
    <button type="button" data-days="0" aria-pressed="false">All</button>
  </div>
  <!-- What changed, said once, for a reader who cannot see the page redraw. -->
  <p class="sr-only" id="live" role="status" aria-live="polite"></p>

  <!-- Hiding is the one action here that can be set once and keep acting for
       weeks — a rule hides every future offer matching a card. Being able to
       do that and never see the result is how a driver ends up with a quiet
       hole in their record and no idea it is there. Hidden offers stay out of
       every figure either way; this only decides whether they are listed. -->
  <p class="hint"><button type="button" id="showHidden" aria-pressed="false">
    show hidden offers</button></p>

  <!-- Percentiles, not an average. $/hour is a ratio with a small noisy
       denominator, and the characteristic failure here — a leg lost to glare —
       manufactures exactly the fat right tail that destroys a mean. The middle
       of the distribution is also the honest answer to "what does a shift round
       here actually pay". -->
  <div class="stats" id="ladder">
    <div><span id="p25">--</span><i class="unit">/hr</i><small>quarter below</small></div>
    <div class="answer"><span id="p50">--</span><i class="unit">/hr</i><small>typical</small></div>
    <div><span id="p75">--</span><i class="unit">/hr</i><small>quarter above</small></div>
  </div>

  <p class="hint" id="headline">Reading the journal…</p>
  <!-- Shown instead of the charts when there is nothing to chart, or nothing
       to chart *with*. Three labelled empty axes and an 11px sentence is a
       page that looks broken; so is a stale one with a grey line under it. -->
  <div id="nothing" hidden></div>

  <!-- The target is the one number here that was never checked against
       anything. It was picked once, and every verdict since has been measured
       against it. Setting it too high fails silently: the car sits still, the
       screen fills with PASS, and that looks like discipline. -->
  <section class="advice" id="advice" hidden>
    <h2>Where to draw the line</h2>
    <p id="adviceLead"></p>
    <p class="note" id="adviceWorking"></p>
  </section>

  <!-- A recording is not a shift. It is stretches of scanning separated by
       gaps, and a gap can be a break, a trip, or the rig left switched on in a
       driveway. Every figure above pools them, which is right for a median and
       wrong to imply. So they are named. -->
  <h2 id="runsHead">Runs of scanning</h2>
  <div id="runs"></div>

  <h2 id="blocksHead">By time of day <em>· median $/hr</em></h2>
  <div id="blocks"></div>
  <div class="scale" id="blockScale"></div>

  <h2 id="kindsHead">Rides and shop orders <em>· median $/hr</em></h2>
  <div id="kinds"></div>

  <h2>Every offer <em id="recentNote">· tap one to see everything that was read</em></h2>
  <!-- The reason to open this list is to find one particular offer and check it
       against what the shift actually paid. At three hundred rows that is
       scrolling and remembering, which is the opposite of checking. Anything
       written here is matched against the figures on the row — a payout, a
       duration, a distance, a rate — because those are what a driver remembers
       about a job, not its id or its address. -->
  <label class="find"><span class="sr-only">Find an offer</span>
    <input type="search" id="find" inputmode="decimal" autocomplete="off"
           placeholder="find an offer — 12.50, 34 min, 8.4 mi, 25/hr">
  </label>
  <p class="hint" id="findNote" hidden></p>
  <div id="log"></div>
  <p class="hint" id="more"></p>

  <ul class="note" id="caveats"></ul>

  <!-- Every action on this page is one tap and none of them could be taken
       back. "Hide every $12.50 · 34 min" is the worst of them: permanent,
       retroactive, and prospective — it keeps hiding offers that have not
       happened yet — and it sits next to "I took this" on a phone held in a
       parked car. The journal is append-only, so undoing is not a deletion,
       it is the opposite note appended after it. -->
  <div id="undo" hidden>
    <span id="undoWhat"></span>
    <button type="button" id="undoGo">Undo</button>
  </div>

  <nav class="bottombar">
    <a class="linkbtn" id="toLive" href="live.html">◂ Live</a>
    <a class="linkbtn" href="index.html">⌨ Type</a>
    <a class="linkbtn" id="csv" href="/api/journal.csv?days=7">⤓ CSV</a>
  </nav>
</main>

<script>
(function () {
  'use strict';

  var el = {};
  ['p25', 'p50', 'p75', 'headline', 'blocks', 'blockScale', 'kinds',
   'caveats', 'ranges', 'csv', 'recentNote', 'log', 'more',
   'advice', 'adviceLead', 'adviceWorking', 'runs', 'runsHead',
   'blocksHead', 'kindsHead', 'undo', 'undoWhat', 'undoGo', 'showHidden',
   'find', 'findNote', 'live', 'nothing', 'ladder'].forEach(function (id) {
    el[id] = document.getElementById(id);
  });

  var days = 7;

  // When a driver's day starts, which is not when the calendar's does.
  //
  // This one's own record runs 16:47 to 03:18 — one shift, and midnight falls
  // in the middle of it. Grouping by calendar date split it into two rows,
  // neither of which describes an evening's work, and "Today" cut it in half
  // from the other side: the fix for folding last night into this morning
  // created the mirror image of the same problem.
  //
  // 4am is the conventional boundary for shift work, and it is the right shape
  // of answer here: nobody is driving then, so no shift can straddle it. It is
  // deliberately not configurable yet — one number that is right for almost
  // everybody beats a setting nobody finds.
  var DAY_STARTS_AT = 4;

  // The day a moment belongs to, as a Date at that day's start.
  function dayOf(at) {
    var d = new Date(at);
    d.setHours(d.getHours() - DAY_STARTS_AT);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function dayKey(at) { return dayOf(at).toDateString(); }

  // Everything else this page prints is a number it worked out. A place is
  // text an OCR engine read off a photograph of a phone, which is the first
  // free-form string to reach innerHTML here — and a card that happens to
  // contain a '<' should change the colour of nothing.
  function esc(text) {
    return String(text === null || text === undefined ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function money(n, dp) {
    if (n === null || n === undefined || !isFinite(n)) return '--';
    var neg = n < 0;
    return (neg ? '-$' : '$') + Math.abs(n).toFixed(dp === undefined ? 0 : dp);
  }

  // The value below which a given share of offers fall. Linear interpolation
  // between the two straddling samples, so a handful of offers still gives a
  // sensible middle rather than jumping between whole readings.
  function percentile(sorted, share) {
    if (!sorted.length) return null;
    if (sorted.length === 1) return sorted[0];
    var pos = share * (sorted.length - 1);
    var low = Math.floor(pos), high = Math.ceil(pos);
    return sorted[low] + (sorted[high] - sorted[low]) * (pos - low);
  }

  // Three-hour blocks. Eight rows fit a phone without scrolling and each one
  // holds enough offers to mean something; twenty-four hourly rows would be
  // mostly empty and mostly noise.
  var BLOCK_NAMES = ['12–3am', '3–6am', '6–9am', '9am–12', '12–3pm',
                     '3–6pm', '6–9pm', '9pm–12'];

  var unitTags = document.querySelectorAll('.stats .unit');

  function showUnits(on) {
    Array.prototype.forEach.call(unitTags, function (u) { u.hidden = !on; });
  }

  // Enough to find one shift in, without building a DOM nobody scrolls to the
  // bottom of. Past this the CSV is the right tool and the note says so.
  var LOG_MAX = 300;

  // A reading good enough to shift a percentile. Kept as one function because
  // the summary above and the day totals below have to agree about it, and two
  // copies of a rule like this drift.
  // One definition of a row worth counting, in advice.js, plus the one extra
  // thing this page needs to draw a bar: a rate to draw.
  //
  // This used to be a second copy of the test, under a comment saying it was
  // the same one. It was not — it never excluded hidden rows, and only the
  // server filtering them out kept them from every median on the page. That
  // held exactly as long as nobody asked the server for them.
  function counted(r) {
    return Advice.trustworthy(r) && typeof r.perHour === 'number';
  }

  function whyAside(r) {
    // First, because it is the driver's own doing rather than anything the
    // scanner decided, and because a hidden row falls through every test
    // below it: a rate was worked out, it is printed two lines above, and the
    // page was telling them "No rate could be worked out from this reading."
    // The one row on this page whose absence from the figures is explained by
    // an act they remember taking, and it was the one given no explanation.
    if (r.hidden) {
      return 'You hid this one, so it is listed but left out of every figure '
           + 'on this page. "Put this back" below returns it to the count.';
    }
    if (r.whole === false) {
      return 'The scanner never saw the whole card — only part of the journey '
           + 'was in the crop, so this reads better than the offer was.';
    }
    // The row says which figure was impossible, so say that rather than the
    // one generic cause. "A fare summary left on the screen looks like this"
    // is a true sentence about some of these rows and a wrong explanation for
    // the rest — and it is the sentence a driver reads when deciding whether
    // the scanner made a mistake or they did.
    if (r.doubt === 'pay') {
      return 'The payout read as ' + money(r.pay, 2) + ', which is outside '
           + 'anything a real offer pays — almost always a decimal point lost '
           + 'in the reading. No verdict was given.';
    }
    if (r.doubt === 'time') {
      return 'The time read as ' + num(r.minutes, 0) + ' min, which is outside '
           + 'anything a real offer runs to. No verdict was given.';
    }
    if (r.doubt === 'speed') {
      return 'The distance and the time together work out at '
           + num(r.miles / (r.minutes / 60), 0) + ' mph, which no offer does — '
           + 'one of the two was misread. No verdict was given.';
    }
    if (r.suspect) {
      return 'Outside the range a real offer falls in, so it is kept but not '
           + 'counted. A fare summary left on the screen looks like this.';
    }
    // Only reachable on rows already in the journal. Until 19 August the
    // threshold for distrusting a distance and the one for calling a reading
    // suspect were different numbers, so a journey computing between the two
    // was written distrusted, not suspect, and whole — and no branch above
    // catches any of that.
    if (Advice.grossRate(r)) {
      return 'The distance was not trusted, so no running cost was taken off '
           + 'this one — which makes its ' + money(r.perHour, 0) + '/hr a '
           + 'before-costs figure among after-costs ones. Kept, but left out '
           + 'of the totals rather than counted a few dollars high.';
    }
    return 'No rate could be worked out from this reading.';
  }

  function row(label, value, quiet) {
    if (value === null || value === undefined || value === '') return '';
    return '<div' + (quiet ? ' class="quiet"' : '') + '><dt>' + label
         + '</dt><dd>' + value + '</dd></div>';
  }

  // Distances come off the card with one decimal and are *summed* across legs,
  // and binary floating point does not add them the way the card wrote them:
  // a 1.1 mi pickup plus a 2.2 mi trip stores as 3.3000000000000003. Printed
  // raw that is what the driver reads. Rounding it at the parser was the other
  // option and was not taken — the two parsers are held to a shared corpus
  // precisely so they cannot drift, and this is a display problem.
  function num(n, dp) {
    return (typeof n === 'number' && isFinite(n)) ? n.toFixed(dp === undefined ? 1 : dp) : null;
  }

  // What "this card" means for a hide-every rule. Taken from the row's own data
  // attributes rather than parsed back out of the text, which would break the
  // moment the wording changed.
  function cardOf(offer) {
    var pay = parseFloat(offer.getAttribute('data-pay'));
    var minutes = parseFloat(offer.getAttribute('data-minutes'));
    var miles = parseFloat(offer.getAttribute('data-miles'));
    if (!isFinite(pay) || !isFinite(minutes)) return null;
    return { pay: pay, minutes: minutes, miles: isFinite(miles) ? miles : null };
  }

  function offerRow(r, when, target, band) {
    var aside = !counted(r);
    var mins = r.minutes === null ? '--' : Math.round(r.minutes);
    var gross = (typeof r.grossPerHour === 'number'
                 && Math.round(r.grossPerHour) !== Math.round(r.perHour))
      ? '<em>' + money(r.grossPerHour, 0) + ' raw</em>' : '';

    // The billed time is the one number a driver cannot reconstruct from the
    // card, and the one that explains a rate that looks wrong: it is the card's
    // minutes plus a pad plus a shopping allowance, and it is what the rate was
    // actually divided by.
    var billed = (typeof r.billedMinutes === 'number') ? r.billedMinutes : null;
    var padded = (billed !== null && r.minutes !== null
                  && Math.abs(billed - r.minutes) >= 0.5);

    var read = [];
    if (r.legs) read.push(r.legs + (r.legs === 1 ? ' leg' : ' legs'));
    if (r.hasTotal) read.push('a total line');
    if (r.mergedFrom) read.push(r.mergedFrom + (r.mergedFrom === 1 ? ' frame' : ' frames'));

    var flags = [];
    if (r.milesCorrected) flags.push('a decimal was put back in the distance');
    if (r.milesUncertain) flags.push('the distance was not trusted, so no running cost was charged');
    if (r.settled === false) flags.push('the reading was still changing when it was stored');
    if (r.whole === false) flags.push('only part of the card was in view');
    if (r.suspect) flags.push('outside the range a real offer falls in');

    return '<details class="offer' + (aside ? ' aside' : '')
      + (r.hidden ? ' hiddenrow' : '')
      + (r.accepted ? ' mine' : '') + '" data-id="' + (r.id || '') + '"'
      + ' data-pay="' + (r.pay === null ? '' : r.pay) + '"'
      + ' data-minutes="' + (r.minutes === null ? '' : r.minutes) + '"'
      + ' data-miles="' + (r.miles === null ? '' : r.miles) + '">'
      + '<summary>'
      + '<span class="dot ' + (aside ? '' : verdictFor(r.perHour, target, band)) + '"></span>'
      + '<span class="big">' + money(r.perHour, 0) + '<i class="unit">/hr</i>' + gross + '</span>'
      + '<span class="meta">' + money(r.pay, 2) + ' · ' + mins + ' min'
      + (r.miles === null ? '' : ' · ' + num(r.miles) + ' mi')
      + (r.items ? ' · ' + r.items + ' items' : '')
      // Where it went, on the row rather than only inside it. This is what
      // turns the log from a list of figures into something a driver can read
      // down and recognise.
      + ((r.places && r.places.length)
         ? '<em>' + esc(r.places.join(' → ')) + '</em>' : '')
      + '</span>'
      + (r.accepted ? '<span class="took" title="you took this">\u2713</span>' : '')
      + (r.hidden ? '<span class="tag">hidden</span>' : '')
      + (aside && !r.hidden
         ? '<span class="tag">' + (r.whole === false ? 'partial' : 'odd') + '</span>' : '')
      + '<span class="when">' + when.toLocaleTimeString(undefined,
          { hour: 'numeric', minute: '2-digit' }) + '</span>'
      + '</summary>'
      + (aside ? '<p class="why">' + whyAside(r) + '</p>' : '')
      // One list per heading. `<h3>` inside a `<dl>` is not valid, and a screen
      // reader walking the list loses the headings that say what each group of
      // rows is — which on this panel is the difference between "what the card
      // said" and "what the scanner made of it".
      + '<h3>Off the card</h3>'
      + '<dl class="facts">'
      + row('Payout', money(r.pay, 2))
      + row('Time on the card', r.minutes === null ? null : num(r.minutes, 0) + ' min')
      + row('Distance', r.miles === null ? null : num(r.miles) + ' mi')
      + row('Items', r.items || null)
      + '</dl><h3>How the rate was worked out</h3>'
      + '<dl class="facts">'
      + row('Billed time', billed === null ? null
            : num(billed, 0) + ' min' + (padded ? ' — incl. your pad and shopping' : ''))
      + row('Running cost taken off', typeof r.cost === 'number' && r.cost > 0
            ? money(r.cost, 2) + ' at ' + money(r.costPerMile, 2) + '/mi' : null)
      + row('Before running costs', typeof r.grossPerHour === 'number'
            ? money(r.grossPerHour, 2) + '/hr' : null)
      + row('After running costs', typeof r.perHour === 'number'
            ? money(r.perHour, 2) + '/hr' : null)
      + row('Per mile', typeof r.perMile === 'number' ? money(r.perMile, 2) + '/mi' : null)
      + '</dl><h3>The verdict, and what it was judged against</h3>'
      + '<dl class="facts">'
      // A row the scanner refused to judge says so, rather than showing a dash
      // that reads as "this was not recorded". Not judging it was the decision.
      + row('Called it', r.state === 'doubt'
            ? ('no verdict — '
               + ({ pay: 'the pay', time: 'the time', speed: 'the distance' }[r.doubt]
                  || 'the reading')
               + ' is outside anything a real offer does')
            : (({ go: 'ACCEPT', warn: 'CLOSE CALL', no: 'PASS' })[r.state] || '--'))
      + row('Your target', typeof r.target === 'number'
            ? money(r.target, 0) + '/hr' + (typeof r.band === 'number'
              ? ', amber within ' + r.band + '%' : '') : null)
      + ((r.places && r.places.length)
         ? row('Where', esc(r.places.join(' → '))) : '')
      + (r.fromDeadline
         ? row('Time from', 'the delivery deadline, not a stated duration')
         : '')
      + '</dl><h3>How it was read</h3>'
      + '<dl class="facts">'
      + row('Seen as', read.join(', ') || null, true)
      + row('Read at', when.toLocaleString(), true)
      + row('Time to read', typeof r.ms === 'number' ? r.ms + ' ms' : null, true)
      + (flags.length ? row('Worth knowing', flags.join('; '), true) : '')
      + '</dl>'
      + '<div class="acts">'
      + '<button type="button" data-act="took"' + (r.accepted ? ' class="on"' : '')
        + '>' + (r.accepted ? '\u2713 you took this' : 'I took this') + '</button>'
      + (r.hidden
         ? '<button type="button" data-act="unhide">Put this back</button>'
         : '<button type="button" class="danger" data-act="hide">Hide this one</button>')
      + (r.pay !== null && r.minutes !== null
         ? '<button type="button" class="danger" data-act="hideCard">Hide every '
           + money(r.pay, 2) + ' \u00b7 ' + Math.round(r.minutes) + ' min'
           + (r.miles === null ? '' : ' \u00b7 ' + num(r.miles) + ' mi') + '</button>'
         : '')
      + '</div></details>';
  }

  // What the driver typed, against the figures on the row.
  //
  // A driver remembers a job as "the twelve-fifty one" or "that 34-minute
  // run" — not as an id, and not as an address, which this file deliberately
  // never stores. So every number on the row is searchable and nothing else
  // is. Bare numbers match any field, because somebody typing 8.4 knows what
  // they mean and should not have to say which column it is in; a unit
  // narrows it when two fields could both match.
  function matching(rows) {
    var q = (el.find.value || '').trim().toLowerCase();
    if (!q) return rows;
    var terms = q.split(/\s*,\s*|\s+and\s+/).filter(Boolean);
    return rows.filter(function (r) {
      return terms.every(function (t) { return termMatches(r, t); });
    });
  }

  function termMatches(r, term) {
    var m = term.match(/^([$]?)\s*(-?[\d.]+)\s*(\/hr|hr|min|mins|mi|miles|m)?$/);
    // Anything that is not a figure is a place. "papa john", "chattanooga",
    // "camp jordan" — the way a driver actually remembers a job, and the
    // reason the addresses are stored at all.
    if (!m) {
      var where = (r.places || []).join(' ').toLowerCase();
      return where.indexOf(term) !== -1;
    }
    var n = parseFloat(m[2]);
    if (!isFinite(n)) return false;
    var unit = m[3] || '';
    // Close enough to be the same figure. A driver typing 12.5 means the
    // $12.50 offer, and typing 34 min means the 34-minute one however the
    // rounding fell.
    var near = function (v, tol) {
      return typeof v === 'number' && isFinite(v) && Math.abs(v - n) <= tol;
    };
    if (unit === 'min' || unit === 'mins') return near(r.minutes, 0.5);
    if (unit === 'mi' || unit === 'miles' || unit === 'm') return near(r.miles, 0.05);
    if (unit === '/hr' || unit === 'hr') {
      return near(r.perHour, 0.5) || near(r.grossPerHour, 0.5);
    }
    if (m[1] === '$') return near(r.pay, 0.005);
    // No unit: any of them.
    return near(r.pay, 0.005) || near(r.minutes, 0.5) || near(r.miles, 0.05)
        || near(r.perHour, 0.5);
  }

  function verdictFor(rate, target, band) {
    if (rate === null) return '';
    var floor = target * (1 - band / 100);
    return rate >= target ? 'go' : (rate >= floor ? 'warn' : 'no');
  }

  // The only thing on this page that says what to do rather than what happened.
  //
  // It stays hidden until there is enough to say — a recommendation from one
  // afternoon would be acted on exactly as confidently as one from a season —
  // and when it does appear it shows its working, because a driver who cannot
  // see where a number came from is right not to change their target for it.
  function showAdvice(kept, target) {
    var a;
    try { a = Advice.advise(kept, { target: target }); } catch (e) { a = null; }
    if (!a) { el.advice.hidden = true; return; }

    // Not ready is not nothing. advise() says what it is short of, and hiding
    // that leaves a driver wondering whether the feature is broken, whether
    // they have not driven enough, or whether the question has no answer here —
    // three different situations with three different things to do about them.
    if (!a.ready) {
      el.advice.hidden = false;
      el.adviceWorking.textContent = '';
      if (a.reason === 'unsettled') {
        // What settles this is not always more driving. The swing comes from
        // not knowing which silences were breaks and which were trips, and the
        // driver is the only one who knows — so when there are silences here
        // that nothing accounts for, say that, because tagging a handful of
        // them is worth more than another whole shift of scanning.
        el.adviceLead.innerHTML =
          'Not enough here to name a line yet. '
          + (a.spread > 0
             ? 'Depending on how this recording is split into runs, the line to '
               + 'draw comes out anywhere between <b>' + money(a.low)
               + '</b> and <b>' + money(a.high) + '/hr</b> — a '
               + money(a.spread) + ' swing.'
             // The recommended line held and the plateau around it did not,
             // which is a real reason to wait and reads as nonsense if it is
             // squeezed into the sentence above: "anywhere between $43 and $43
             // — a $0 swing" is a refusal that looks like a bug.
             : 'The line itself comes out at <b>' + money(a.low) + '/hr</b> '
               + 'however the recording is split, but the range of lines that '
               + 'earn about the same moves by ' + money(a.bandSpread || 0)
               + ' as it does — so which line is really best here is not '
               + 'settled, even though one number keeps coming up.')
          + (a.silences > 0
             ? ' There ' + (a.silences === 1 ? 'is <b>1</b> quiet stretch'
                                             : 'are <b>' + a.silences + '</b> quiet stretches')
               + ' here that nothing accounts for'
               + (a.tagged ? ', beyond the ' + a.tagged + ' you have marked as taken' : '')
               + '. A quiet stretch is either a break or a trip you were driving, '
               + 'and only you know which — mark the ones you took, below, and '
               + 'that swing should close.'
             : ' That is the recording being short rather than the market being '
               + 'strange. A few more shifts will settle it.');
      } else if (a.reason === 'nolinehelps') {
        el.adviceLead.innerHTML =
          'Over this stretch, being picky made no measurable difference: taking '
          + 'everything earned about as much as any line would have. That is '
          + 'worth knowing on its own — it usually means the offers were all '
          + 'much of a muchness, or the scanner saw too few of the good ones.';
      } else if (a.reason === 'trips') {
        el.adviceLead.innerHTML =
          'Only <b>' + (a.runs || 0) + '</b> run' + (a.runs === 1 ? '' : 's')
          + ' of scanning here, and too few trips in them to argue from. '
          + 'The line this would recommend would rest on a handful of '
          + 'coincidences.';
      } else {
        el.adviceLead.innerHTML =
          '<b>' + a.offers + '</b> offer' + (a.offers === 1 ? '' : 's') + ' over <b>'
          + (a.hours || 0).toFixed(1) + '</b> hours so far. This needs about <b>'
          + a.needOffers + '</b> across <b>' + a.needHours + '</b> hours before '
          + 'it will suggest a target — a line drawn from one afternoon gets '
          + 'acted on exactly as confidently as one drawn from a season.';
      }
      return;
    }
    el.advice.hidden = false;

    var band = a.low === a.high ? money(a.low) : money(a.low) + '–' + money(a.high);
    var inRange = target >= a.low && target <= a.high;

    var lead;
    if (a.currentTakesNothing) {
      // The strongest thing this can ever say, and it must not be softened. A
      // line nothing clears is not a strict standard, it is a parked car.
      lead = '<b>Nothing in this stretch cleared ' + money(target) + '/hr.</b> '
           + 'A line nothing reaches is not a high standard, it is a shift spent '
           + 'waiting. These offers point at <b>' + band + '/hr</b>.';
    } else if (inRange) {
      lead = 'Your target of <b>' + money(target) + '/hr</b> sits inside the best '
           + 'range these offers point at — <b>' + band + '/hr</b>. Nothing to change.';
    } else {
      lead = 'These offers point at <b>' + band + '/hr</b> rather than <b>'
           + money(target) + '/hr</b>.';
      // Claimed only when it is worth acting on. Under 5% is arithmetic noise
      // dressed as advice, and telling somebody to change how they work for it
      // would be worse than saying nothing.
      if (a.gain !== null && a.gain >= 0.05) {
        lead += ' Replayed against these offers that is about <b>+'
              + Math.round(a.gain * 100) + '%</b> an hour.';
      }
      lead += target > a.high
        ? ' The offers above your line really are better — there are not enough '
          + 'of them to fill the time, and the waiting is not free.'
        : ' You are taking work that is holding you up: a cheap job occupies the '
          + 'slot a better one would have arrived in.';
    }
    el.adviceLead.innerHTML = lead;

    // The working, and the two things it is careful not to claim: an hourly
    // figure, and that this was one continuous shift.
    var runs = a.runs === 1 ? '1 run of scanning'
                            : a.runs + ' separate runs of scanning';
    // `a.offers` is what the replay actually walked, which is fewer than the
    // page's own count whenever a row fell outside every run of scanning — an
    // offer on its own with nothing either side of it has no span to divide by
    // and is dropped. Saying so reconciles two numbers that otherwise sit on
    // one screen disagreeing about how many offers there are.
    var dropped = (typeof a.setAside === 'number' && a.setAside > 0)
      ? ' (' + a.setAside + ' more fell outside any run of scanning)' : '';
    var working =
      'From <b>' + a.offers + '</b> offers across <b>' + runs + '</b>'
      + dropped + ', <b>'
      + a.hours.toFixed(1) + '</b> hours in total — not one continuous shift, and '
      + 'not all of it driving. Replaying those offers in the order they arrived '
      + 'and taking the first one at or above ' + money(a.suggested)
      + ' whenever free gives <b>' + a.trips + '</b> trips.';

    // Only ever reached when the answer held at every threshold — an unsettled
    // one is refused above rather than printed with a retraction underneath.
    working += ' The same line comes out however the recording is split into '
             + 'runs (checked from ' + A_MIN(a) + ' to ' + A_MAX(a)
             + ' minutes), which is why it is worth acting on.';

    // Deliberately no dollars-per-hour. It depends entirely on how much of the
    // recorded time was really driving, which nothing here knows: on the data
    // this was built from that figure ranged from $26 to $78 while the line it
    // recommends never moved off $20.
    working += ' The <em>line</em> is what this can tell you; what you would '
             + 'actually earn an hour depends on how much of that time was '
             + 'driving rather than parked, which the scanner cannot see.';

    el.adviceWorking.innerHTML = working;
  }

  function full0(target) { return target * 2; }

  // What the recording is actually made of.
  //
  // "6.5 hours" on its own reads as a shift, and this one was four separate
  // stretches with holes of 35 minutes, 39 minutes and nearly three hours in
  // between — some of which was driving and some of which was a rig left
  // switched on. Every figure above pools them, which is right for a median and
  // misleading to leave unsaid. Naming them also makes an odd one findable: a
  // run of nine offers in eight minutes is a rig pointed at a screenshot, and
  // it is dragging the medians without anything else on this page showing it.
  function showRuns(kept, target, band, full) {
    var rows;
    try { rows = Advice.usable(kept); } catch (e) { rows = []; }
    var groups = rows.length ? Advice.runs(rows, Advice.SHOWN_AT) : [];
    if (groups.length < 2) {
      // One run is not a finding, it is the ordinary case, and a section
      // announcing it would be noise on every short window.
      el.runs.innerHTML = '';
      el.runsHead.hidden = true;
      return;
    }
    el.runsHead.hidden = false;
    var hours = groups.reduce(function (t, g) {
      return t + (g[g.length - 1].at - g[0].at) / 3600000;
    }, 0);
    el.runsHead.innerHTML = 'Runs of scanning <em>· ' + groups.length + ' of them, '
      + hours.toFixed(1) + ' hours in total, not one shift</em>';

    el.runs.innerHTML = groups.map(function (g) {
      var from = new Date(g[0].at);
      var mins = (g[g.length - 1].at - g[0].at) / 60000;
      var mid = percentile(g.map(function (r) { return r.perHour; })
                            .sort(function (a, b) { return a - b; }), 0.5);
      var length = mins >= 60
        ? (mins / 60).toFixed(1) + 'h'
        : Math.round(mins) + 'm';
      // Date, time and length in the one label column, so these bars are the
      // same width as every other bar on the page and can be read against them.
      return '<div class="block"><span class="label runlabel">'
           + from.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
           + '<em>' + from.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })
           + ' · ' + length + '</em></span>'
           + '<span class="bar ' + verdictFor(mid, target, band) + '" style="background-size:'
           + Math.max(1, Math.min(100, mid / full * 100)).toFixed(1) + '% 100%"></span>'
           + '<span class="amount">' + money(mid, 0) + '</span>'
           + '<span class="n">' + g.length + '</span></div>';
    }).join('');
  }

  function A_MIN(a) {
    return Math.min.apply(null, a.checkedAt.map(function (c) { return c.minutes; }));
  }
  function A_MAX(a) {
    return Math.max.apply(null, a.checkedAt.map(function (c) { return c.minutes; }));
  }

  var lastData = null;

  function render(data) {
    lastData = data;
    // Rows the scanner was not sure of are kept in the file on purpose, and
    // must not shift a percentile. `whole` is the one that matters most: a
    // reading missing a leg is not merely noisy, it is biased upwards — the
    // first leg of a two-leg card on its own is a shorter, better-paying job
    // than the card describes — so including them would quietly raise every
    // figure on this page. `whole` is absent from rows written before it
    // existed, and those were only ever written when whole, so undefined counts
    // as true.
    // Two different lists on purpose. `kept` is everything recorded, and it is
    // what the log below shows, because the reason to open that log is to find
    // one offer and check it against what the shift paid — and an offer missing
    // from it, with nothing saying why, is what makes a record uncheckable.
    // `offers` is the subset good enough to move a statistic.
    var kept = data.offers || [];
    var offers = kept.filter(counted);
    var setAside = kept.length - offers.length;

    if (!offers.length) {
      el.headline.innerHTML = kept.length
        ? 'Nothing usable in this stretch — <b>' + setAside + '</b> set aside as doubtful.'
        : 'No offers recorded yet. The scanner keeps one line per offer it is sure of.';
      el.blocks.innerHTML = el.kinds.innerHTML = '';
      // ...and the headings over them. A blanked chart under "By time of day"
      // reads as a chart that failed to draw rather than as one there is
      // nothing to draw.
      el.blocksHead.hidden = el.kindsHead.hidden = true;
      el.more.textContent = '';
      el.nothing.hidden = false;
      el.nothing.innerHTML = kept.length
        ? '<b>Nothing here can be counted.</b>Every offer in this stretch was '
          + 'set aside — a partial read, or a figure outside anything a real '
          + 'offer does. They are listed below with the reason on each.'
        : '<b>No offers recorded yet.</b>The scanner writes one line per offer '
          + 'it is sure of, so this fills up as you drive. If you have been '
          + 'driving and it is still empty, the rig is reading nothing — '
          + '<a href="live.html">the live view</a> will say why.';
      el.ladder.hidden = true;
      el.p25.textContent = el.p50.textContent = el.p75.textContent = '--';
      // "--/hr" is not a rate, it is a dash wearing a unit.
      showUnits(false);
      el.caveats.innerHTML = '';
      el.advice.hidden = true;
      el.runs.innerHTML = '';
      el.runsHead.hidden = true;
      // The set-aside rows stay listed. The page has just said "3 set aside as
      // doubtful", and the next thing it did was delete them — so the one
      // screen that could show a driver *which* three, and why, showed nothing
      // at all. These are the rows somebody opens this page to find: the job
      // they remember working that is missing from the figures.
      // The target these were judged against still comes off the rows
      // themselves rather than a literal, so a row's own recorded verdict and
      // what this page says about it cannot disagree.
      var lastKept = kept.length ? kept[kept.length - 1] : null;
      var t0 = lastKept && typeof lastKept.target === 'number' ? lastKept.target : 25;
      var b0 = lastKept && typeof lastKept.band === 'number' ? lastKept.band : 15;
      el.log.innerHTML = kept.slice(-LOG_MAX).reverse().map(function (r) {
        return offerRow(r, new Date(r.at), t0, b0);
      }).join('');
      return;
    }
    showUnits(true);
    el.nothing.hidden = true;
    el.ladder.hidden = false;

    // The target is whatever the scanner was actually using, taken from the
    // most recent row rather than assumed — it lives in the Pi's config and
    // this page has no other way to know it.
    // The most recent row that is not in the future.
    //
    // A Pi with no real-time clock comes up in 1970 and jumps forward when the
    // network arrives, and a handful of rows can land the other way too. `at`
    // is sorted, so one row stamped next March sat permanently at the end of
    // the list and handed its target to every figure on the page — including
    // days recorded long before that target existed. A clock that is wrong
    // should cost the row it is on, not the page.
    var now = Date.now();
    var newest = null;
    for (var n = offers.length - 1; n >= 0; n--) {
      if ((offers[n].at || 0) <= now) { newest = offers[n]; break; }
    }
    if (!newest) newest = offers[offers.length - 1];
    var target = typeof newest.target === 'number' ? newest.target : 25;
    var band = typeof newest.band === 'number' ? newest.band : 15;

    var rates = offers.map(function (r) { return r.perHour; })
                      .sort(function (a, b) { return a - b; });
    el.p25.textContent = money(percentile(rates, 0.25), 0);
    el.p50.textContent = money(percentile(rates, 0.50), 0);
    el.p75.textContent = money(percentile(rates, 0.75), 0);

    // What cleared the line, and — separately — what could actually have been
    // taken. Those are not the same number and this used to print the first
    // under the second's name: an offer arriving while you are already carrying
    // somebody is not an offer you can take, and on one real recording 26% of
    // offers cleared $25/hr while the replay, which knows that, could only ever
    // have taken 6%. Four times over, on the sentence at the top of the page.
    var cleared = offers.filter(function (r) { return r.perHour >= target; }).length;
    var mine = offers.filter(function (r) { return r.accepted; });
    // The replay's own count of what it walked, and its own count of what it
    // could have taken. Both come back from the same call over the same set.
    var sim = null;
    try {
      sim = Advice.replay(Advice.runs(Advice.usable(kept)), target);
    } catch (e) { sim = null; }

    /* Two figures that are not fractions of the same thing, and this sentence
       used to print them as bare percentages side by side — "52% of 48 offers
       cleared the line, though only about 38% were yours to take". A reader
       subtracts them and gets a number that means nothing: the 52% is over
       every usable offer in the range, and the 38% is over only the offers
       inside a run of scanning, because `runs()` drops the rest. On the
       recording that prompted the second half of this sentence the two
       denominators differed by a fifth.

       Counts, then, each with the total it is out of written next to it, and
       the replay's figure given its own sentence rather than hung off the
       first with a "though" — which is what made it read as a correction to
       the number before it. */
    var lines = ['At ' + money(target) + '/hr, <b>' + cleared + '</b> of <b>'
      + offers.length + '</b> offer' + (offers.length === 1 ? '' : 's')
      + ' cleared the line.'];
    if (sim && sim.seen > 0) {
      lines.push('Replaying the shift, where an offer arriving while you were '
        + 'already driving is not one you could take: <b>' + sim.trips
        + '</b> of the <b>' + sim.seen + '</b> offers inside a run of scanning.');
    }
    // Once anything is ticked, the comparison the whole page is for: what the
    // offers said against what was actually worked. Nothing is shown until then,
    // because a "0 taken" on an untagged log reads as a claim rather than an
    // absence of one.
    if (mine.length) {
      var mineRates = mine.map(function (r) { return r.perHour; })
                          .sort(function (a, b) { return a - b; });
      // Net, like every other figure on this page — the note at the bottom
      // says so out loud ("Rates are after $0.35/mi of running costs"), and
      // this was the one number that ignored it. Worse, it sat in the same
      // sentence as a net $/hr, so the two halves were measured differently
      // and nothing said which was which. `cost` is absent on rows whose
      // distance was not trusted, and there the payout is the honest total
      // anyway: no running cost was charged against that offer either.
      var mineCost = 0;
      var minePay = mine.reduce(function (t, r) {
        var c = (typeof r.cost === 'number' && isFinite(r.cost)) ? r.cost : 0;
        mineCost += c;
        return t + (r.pay || 0) - c;
      }, 0);
      lines.push('You marked <b>' + mine.length + '</b> as taken, worth <b>'
        + money(minePay, 2) + '</b>'
        // Only claimed when something was actually taken off. With costs set
        // to zero the two totals are the same number, and calling it "after
        // running costs" would be describing a subtraction that never
        // happened.
        + (mineCost > 0 ? ' after running costs' : '')
        + ', at a typical <b>' + money(percentile(mineRates, 0.5), 0) + '/hr</b>.');
    }
    el.headline.innerHTML = lines.join('<br>');

    // --- where to draw the line ---
    // Fed `kept`, not `offers`: Advice does its own filtering, and doing it
    // twice would be two places to keep in step about what counts.
    showAdvice(kept, target);

    // --- runs of scanning ---
    showRuns(kept, target, band, full0(target));

    // --- by time of day ---
    var blocks = BLOCK_NAMES.map(function (name) {
      return { name: name, rates: [] };
    });
    var daysSeen = {};
    offers.forEach(function (r) {
      var hour = new Date(r.at).getHours();
      blocks[Math.floor(hour / 3)].rates.push(r.perHour);
      daysSeen[dayKey(r.at)] = true;
    });
    // How many days are behind each bar. "Evenings pay $22" is a different
    // claim depending on whether it rests on eleven evenings or on one, and
    // the chart said the same thing either way.
    var dayCount = Object.keys(daysSeen).length;
    el.blocksHead.hidden = false;
    el.blocksHead.innerHTML = 'By time of day <em>· median $/hr, across '
      + dayCount + ' day' + (dayCount === 1 ? '' : 's') + '</em>';
    // A fixed scale at twice the target puts the target itself at the halfway
    // point of every bar, so the line being judged against is the same line in
    // every row instead of moving with whatever the best block happened to be.
    var full = target * 2;
    el.blocks.innerHTML = blocks.map(function (b) {
      if (!b.rates.length) {
        return '<div class="block"><span class="label">' + b.name + '</span>'
             + '<span class="bar" style="background-size:0 100%"></span>'
             + '<span class="amount">--</span><span class="n"></span></div>';
      }
      var sorted = b.rates.slice().sort(function (x, y) { return x - y; });
      var mid = percentile(sorted, 0.5);
      var pct = Math.max(1, Math.min(100, mid / full * 100));
      return '<div class="block"><span class="label">' + b.name + '</span>'
           + '<span class="bar ' + verdictFor(mid, target, band) + '" style="background-size:'
           + pct.toFixed(1) + '% 100%"></span>'
           + '<span class="amount">' + money(mid, 0) + '</span>'
           + '<span class="n">' + b.rates.length + '</span></div>';
    }).join('');
    el.blockScale.innerHTML =
      '<span style="left:50%">' + money(target) + ' target</span>'
      + '<span style="left:100%">' + money(full) + '</span>';

    // --- rides against shop orders ---
    // Split on what the card called itself, not on whether an item count was
    // read. An item count is a fact about the OCR: 22 offers in one real
    // recording ran at shopping speeds with no count on them, and every one was
    // filed under Rides, so both medians were wrong and neither said so. A card
    // whose top chip never made it into the crop is genuinely unclassified, and
    // gets its own bar rather than being folded into whichever bucket is
    // nearest — the whole point of a split is that each side is what it says.
    var kinds = [
      { name: 'Rides', rates: [] },
      { name: 'Shop', rates: [] },
      { name: 'Not stated', rates: [] }
    ];
    offers.forEach(function (r) {
      var which = r.shop ? 1
        : (r.legs >= 2 ? 0                 // two legs is a ride card's shape
           : (typeof r.shop === 'boolean' || r.items ? 1 : 2));
      kinds[which].rates.push(r.perHour);
    });
    kinds = kinds.filter(function (k) { return k.rates.length; });
    /* A chart of one bar is not a comparison, and this one is headed with the
       comparison it is failing to make. Every offer in the log unclassified
       gives "Rides and shop orders" over a single row labelled "Not stated" —
       a section that tells the reader nothing, twice. It goes until there are
       two kinds to hold against each other. */
    el.kindsHead.hidden = kinds.length < 2;
    el.kinds.innerHTML = kinds.map(function (k) {
      if (!k.rates.length) return '';
      var sorted = k.rates.slice().sort(function (x, y) { return x - y; });
      var mid = percentile(sorted, 0.5);
      return '<div class="block"><span class="label">' + k.name + '</span>'
           + '<span class="bar ' + verdictFor(mid, target, band) + '" style="background-size:'
           + Math.max(1, Math.min(100, mid / full * 100)).toFixed(1) + '% 100%"></span>'
           + '<span class="amount">' + money(mid, 0) + '</span>'
           + '<span class="n">' + k.rates.length + '</span></div>';
    }).join('');

    // --- the log ---
    // Everything in the window, not a sample of it, because the reason to look
    // at this list is to find one particular offer and check it against what
    // the shift actually paid. A list that stops at twelve cannot do that.
    //
    // The ones set aside are here too, greyed and with the reason attached. An
    // offer missing from the record with nothing to say why is precisely what
    // makes a record impossible to reconcile — the driver would be left
    // wondering whether they mis-remembered the job or the scanner lost it.
    var shown = matching(kept).slice(-LOG_MAX).reverse();
    // Two truncations, and the driver has to be told about both. This page cuts
    // the *list* to LOG_MAX so a phone can render it, and the server cuts the
    // *window* to its own limit before the page ever sees it — and the second
    // one used to be invisible. The figures at the top said "All" over whatever
    // survived, so a year's worth of offers was summarised over the last fifty
    // shifts with nothing saying so.
    var windowTotal = (data && data.total) || kept.length;
    el.more.textContent = kept.length > shown.length || (data && data.truncated)
      ? 'Showing the most recent ' + shown.length + ' of ' + kept.length
        + (data && data.truncated
            ? ', and this window holds ' + windowTotal
              + ' — the figures above cover the ' + kept.length + ' shown'
            : '')
        + '. Use the CSV for the rest.' : '';

    var out = [];
    var currentDay = null;
    shown.forEach(function (r) {
      var when = new Date(r.at);
      var day = dayKey(r.at);
      if (day !== currentDay) {
        currentDay = day;
        var ofDay = kept.filter(function (o) { return dayKey(o.at) === day; });
        // One set for the whole line. The median already excluded the rows set
        // aside; the money beside it did not, so a day carrying two misreads —
        // $1,184 and $1,251 are both real, from one recording — announced two
        // and a half thousand dollars offered next to a median of thirteen.
        // Figures on one line that disagree about what they are counting are
        // worse than one figure.
        var day_counted = ofDay.filter(counted);
        var usable = day_counted.map(function (o) { return o.perHour; })
                                .sort(function (a, b) { return a - b; });
        var offered = day_counted.reduce(function (t, o) { return t + (o.pay || 0); }, 0);
        var tookToday = day_counted.filter(function (o) { return o.accepted; });
        var tookPay = tookToday.reduce(function (t, o) { return t + (o.pay || 0); }, 0);
        var setAside = ofDay.length - day_counted.length;
        out.push('<div class="day"><b>' + dayOf(r.at).toLocaleDateString(undefined,
                   { weekday: 'short', month: 'short', day: 'numeric' }) + '</b>'
               + '<span>' + ofDay.length + ' offer' + (ofDay.length === 1 ? '' : 's')
               + (setAside ? ' (' + setAside + ' set aside)' : '')
               + (usable.length ? ' · median ' + money(percentile(usable, 0.5), 0) + '/hr' : '')
               + ' · ' + money(offered, 2) + ' offered'
               + (tookToday.length ? ' · took ' + tookToday.length + ' for '
                  + money(tookPay, 2) : '')
               + '</span></div>');
      }
      out.push(offerRow(r, when, target, band));
    });
    el.log.innerHTML = out.join('');

    // Say what the filter did, because an empty list and a list with nothing
    // matching look identical, and one of them means "you have no offers".
    var q = (el.find.value || '').trim();
    if (q) {
      var found = matching(kept).length;
      el.findNote.hidden = false;
      el.findNote.textContent = found
        ? found + ' of ' + kept.length + ' offer'
          + (kept.length === 1 ? '' : 's') + ' match "' + q + '"'
        : 'Nothing in this stretch matches "' + q
          + '". Try a wider range, or just the number.';
    } else {
      el.findNote.hidden = true;
    }

    var notes = ['These are offers the scanner read, not trips taken — it cannot '
                 + 'see the Accept button and never touches it, so tick the ones '
                 + 'you took and it will keep the tally.'];
    if (setAside) {
      notes.push(setAside + ' reading' + (setAside === 1 ? '' : 's')
                 + ' left out of the figures above — they are still in the list '
                 + 'below, greyed, with the reason on each.');
    }
    // Only when something was actually deducted. "Rates are after $0.00/mi of
    // running costs" is a sentence about nothing, and it invites the reader to
    // hunt for a subtraction that never happened.
    if (data.hidden) {
      notes.push(data.hidden + ' offer' + (data.hidden === 1 ? ' is' : 's are')
                 + ' hidden and left out of every figure here.');
    }
    // What went past unrecorded, from the scanner's own tally.
    //
    // The one thing a journal can never contain is what is not in it, so this
    // is the nearest honest thing: a read that found a payout proves a card was
    // in front of the camera, and an episode that ended with no row written is
    // one the rig watched go past. It is a floor and is said to be one — an
    // offer the reader never saw at all is invisible to this too.
    // A journal that is there and cannot be read looks exactly like a quiet
    // week, and only one of those is worth doing something about. The server
    // used to answer both with an empty list — see readJournal — which on this
    // page is a blank history and on the sync endpoints was sixty duplicate
    // rows reported as a success.
    if (data.unreadable) {
      notes.push('<b>The journal could not be read (' + data.unreadable
                 + ').</b> Everything above is empty because nothing could be '
                 + 'loaded, not because nothing was recorded — the file is '
                 + 'still there. Check its permissions before trusting a gap '
                 + 'here, and know that the backup cannot merge into it either.');
    }
    var w = data.watched;
    if (w && w.saw) {
      // Counted in sightings, not in offers: one card watched, lost and picked
      // up again is two sightings of one offer, and the wording must not invite
      // anyone to compare this figure with the number of rows below it. What it
      // is for is the ratio.
      var lost = w.saw - w.kept;
      notes.push(lost
        ? '<b>' + lost + '</b> time' + (lost === 1 ? '' : 's')
          + ' the scanner picked a payout off the screen and never managed to '
          + 'record it — ' + Math.round(lost / w.saw * 100) + '% of the <b>'
          + w.saw + '</b> it saw. Usually two reads that never agreed before the '
          + 'card was gone. So at least that many offers are missing from '
          + 'everything above, and probably more: one the camera never read at '
          + 'all cannot be counted by anything.'
        : 'Every one of the <b>' + w.saw + '</b> payout'
          + (w.saw === 1 ? '' : 's') + ' the scanner picked off the screen was '
          + 'recorded. An offer it never read at all cannot be counted, so that '
          + 'is a floor rather than a guarantee.');
    }
    notes.push(newest.costPerMile > 0
      ? 'Rates are after ' + money(newest.costPerMile, 2) + '/mi of running costs.'
      : 'No running cost is set, so these are what the offers paid before the car.');
    // A list, not a paragraph. These are four unrelated facts — what the rows
    // are, what was set aside, what is hidden, what came off for the car — and
    // run together in one grey block the eye skips all four.
    el.caveats.innerHTML = notes.map(function (n) {
      return '<li>' + n + '</li>';
    }).join('');

    // Said rather than only drawn. Everything above this point is a redraw
    // with no event a screen reader can notice.
    el.live.textContent = offers.length + ' offer'
      + (offers.length === 1 ? '' : 's') + ' counted, typical '
      + money(percentile(rates, 0.5), 0) + ' an hour.';
  }

  // "Today" has to mean today where the driver is. A trailing 24 hours folds
  // last night's shift into this morning's percentiles and puts its offers in
  // the wrong time-of-day block — and the Pi cannot work out when the day began
  // for them, so the browser says.
  var showingHidden = false;

  function windowQuery() {
    return baseWindow() + (showingHidden ? '&hidden=1' : '');
  }

  function baseWindow() {
    if (days !== 1) return 'days=' + days;
    // The start of the day currently being driven — 4am today, or 4am
    // yesterday if it is currently the small hours and the shift is still
    // running. Midnight put the two halves of one night either side of the
    // filter, so at 2am "Today" showed two hours of work and called it a day.
    var start = dayOf(Date.now());
    start.setHours(start.getHours() + DAY_STARTS_AT);
    return 'days=2&since=' + start.getTime();
  }

  function load() {
    // The server's own ceiling, not its default. The JSON cap protects the
    // DOM — a phone will not render 60000 rows — but the CSV is streamed
    // straight to a file, and it is the thing this page points at for the rows
    // the cap drops. Sending the same limit made the escape hatch stop exactly
    // where the problem started.
    el.csv.href = '/api/journal.csv?limit=20000&' + windowQuery();
    fetch('/api/journal?' + windowQuery())
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {
        // Clear the figures. Leaving the previous window's numbers on screen
        // under a grey apology is worse than showing nothing: they are real
        // numbers about a different question, and nothing marks them stale.
        el.headline.textContent = '';
        el.blocks.innerHTML = el.kinds.innerHTML = el.log.innerHTML = '';
        el.blocksHead.hidden = el.kindsHead.hidden = true;
        el.runs.innerHTML = '';
        el.runsHead.hidden = true;
        el.advice.hidden = true;
        el.ladder.hidden = true;
        el.caveats.innerHTML = '';
        el.more.textContent = '';
        el.nothing.hidden = false;
        el.nothing.innerHTML =
          '<b>Cannot reach the scanner.</b>This page reads the journal over the '
          + 'network, so it needs the machine keeping it to be running and '
          + 'reachable. If that is the Pi, check it is powered and on the same '
          + 'network; if it is the machine at home, check the server is up. '
          + 'Nothing has been lost either way — the journal is a file on disk '
          + 'and this page only reads it.';
      });
  }

  // One handler for the whole log, because the rows are rebuilt on every load
  // and per-row listeners would be re-attached each time for nothing.
  el.log.addEventListener('click', function (e) {
    var button = e.target.closest('button[data-act]');
    if (!button) return;
    var offer = button.closest('.offer');
    var id = offer && offer.getAttribute('data-id');
    var act = button.getAttribute('data-act');
    var body;

    // Each action carries its own opposite. The journal is append-only, so
    // undoing is not a deletion — it is the note that says the other thing,
    // added after it. Both stay on the record, which is the point: a driver
    // who un-hides something a week later can still see that they hid it.
    var was, undo, what;
    if (act === 'took') {
      was = button.classList.contains('on');
      body = { id: id, accepted: !was };
      undo = { id: id, accepted: was };
      what = was ? 'Unmarked as taken.' : 'Marked as taken.';
    } else if (act === 'hide') {
      body = { id: id, hidden: true };
      undo = { id: id, hidden: false };
      what = 'Hidden from the figures.';
    } else if (act === 'unhide') {
      // An id beats a rule, so this puts back one offer even when a rule is
      // still hiding the rest of its kind.
      body = { id: id, hidden: false };
      undo = { id: id, hidden: true };
      what = 'Back in the figures.';
    } else if (act === 'hideCard') {
      // Every reading of one card, now and in future. The test offer a driver
      // presents to check the rig still works comes back every time they check
      // it, so hiding them one at a time is a chore that never ends.
      var card = cardOf(offer);
      if (!card) return;
      body = { match: card, hidden: true };
      undo = { match: card, hidden: false };
      what = 'Hiding every ' + money(card.pay, 2) + ' · '
           + Math.round(card.minutes) + ' min offer, including future ones.';
    } else {
      return;
    }

    Array.prototype.forEach.call(offer.querySelectorAll('button'), function (b) {
      b.disabled = true;
    });
    mark(body).then(function () {
      offerUndo(what, undo);
      load();
    }).catch(function () {
      button.textContent = 'could not save';
      Array.prototype.forEach.call(offer.querySelectorAll('button'), function (b) {
        b.disabled = false;
      });
    });
  });

  function mark(body) {
    return fetch('/api/offers/mark', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.ok ? r.json() : Promise.reject(); });
  }

  // The offer to put it back, and how long it stays offered.
  //
  // Not a few seconds. This page is read in a parked car, often one-handed,
  // and the action worth taking back is the one whose effect is not visible
  // yet — a rule that will hide offers next week. A minute is long enough to
  // notice the list changed and work out why.
  var UNDO_MS = 60000;
  var undoTimer = null;
  var undoBody = null;

  function offerUndo(what, body) {
    undoBody = body;
    el.undoWhat.textContent = what;
    el.undo.hidden = false;
    el.undoGo.disabled = false;
    el.undoGo.textContent = 'Undo';
    clearTimeout(undoTimer);
    undoTimer = setTimeout(hideUndo, UNDO_MS);
  }

  function hideUndo() {
    clearTimeout(undoTimer);
    el.undo.hidden = true;
    undoBody = null;
  }

  // Re-filters what is already loaded rather than re-fetching: the rows are in
  // hand, and a request per keystroke over a car's connection would make the
  // box useless exactly where it is most wanted.
  var findTimer = null;
  el.find.addEventListener('input', function () {
    clearTimeout(findTimer);
    findTimer = setTimeout(function () { if (lastData) render(lastData); }, 120);
  });

  el.showHidden.addEventListener('click', function () {
    showingHidden = !showingHidden;
    el.showHidden.setAttribute('aria-pressed', showingHidden ? 'true' : 'false');
    el.showHidden.textContent = showingHidden
      ? 'hide them again' : 'show hidden offers';
    load();
  });

  el.undoGo.addEventListener('click', function () {
    if (!undoBody) return;
    var body = undoBody;
    el.undoGo.disabled = true;
    el.undoGo.textContent = 'undoing…';
    mark(body).then(function () {
      hideUndo();
      load();
    }).catch(function () {
      el.undoGo.disabled = false;
      el.undoGo.textContent = 'could not undo';
    });
  });

  el.ranges.addEventListener('click', function (e) {
    var button = e.target.closest('button');
    if (!button) return;
    days = parseInt(button.getAttribute('data-days'), 10);
    Array.prototype.forEach.call(el.ranges.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b === button ? 'true' : 'false');
    });
    load();
  });

  // On the machine that only keeps a copy of the offers there is no camera, so
  // the live view is a page that can never show anything. Ask once and drop the
  // link rather than leave a button that leads somewhere permanently blank.
  // Failing to ask leaves it in place, which is right for the rig itself and no
  // worse than before anywhere else.
  fetch('/api/status')
    .then(function (r) { return r.json(); })
    .then(function (s) {
      if (s && s.scanner && s.scanner.enabled === false) {
        document.getElementById('toLive').hidden = true;
      }
    })
    .catch(function () {});

  load();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
